<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>POS Restaurante</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%BD%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f2f4f7; --panel:#ffffff; --panel2:#f8fafc; --ink:#111827; --ink2:#374151;
  --muted:#6b7280; --line:#e3e7ee; --line2:#eef1f6;
  --brand:#e2542c; --brand-ink:#fff; --brand-soft:#fdeee9;
  --ok:#118d57; --ok-soft:#e6f4ee; --warn:#b7791f; --warn-soft:#fdf3e3;
  --bad:#c92a2a; --bad-soft:#fdecec; --info:#1c6fd4; --info-soft:#e9f1fd;
  --sb:#161b26; --sb-ink:#c9d1de; --sb-active:#242c3d;
  --r:10px; --r2:14px;
  --sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
  --sh2:0 10px 30px rgba(16,24,40,.14);
}
[data-theme="dark"]{
  --bg:#0e1117; --panel:#161a22; --panel2:#1c212b; --ink:#e7eaf0; --ink2:#c2c9d6;
  --muted:#8b94a5; --line:#252b36; --line2:#1e232d;
  --brand:#f2683c; --brand-soft:#33201a;
  --ok:#3fbf85; --ok-soft:#14291f; --warn:#e0a944; --warn-soft:#2b2415;
  --bad:#ef5f5f; --bad-soft:#2c1818; --info:#5b9bf0; --info-soft:#152234;
  --sb:#0a0d13; --sb-ink:#98a2b3; --sb-active:#1b2130;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh2:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
input[type=checkbox]{width:auto}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:content-box}
.hide{display:none!important}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:214px 1fr;height:100vh}
#sidebar{background:var(--sb);color:var(--sb-ink);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:16px 16px 12px;display:flex;gap:10px;align-items:center;color:#fff}
.brand .logo{width:32px;height:32px;border-radius:9px;background:var(--brand);display:grid;place-items:center;font-size:17px;flex:0 0 auto}
.brand b{font-size:14px;letter-spacing:.2px;display:block;line-height:1.2}
.brand small{color:var(--sb-ink);font-size:11px}
.nav{flex:1;overflow-y:auto;padding:6px 8px 12px}
.nav .sec{font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:#5c6679;padding:14px 10px 6px;font-weight:700}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--sb-ink);text-decoration:none;font-size:13.5px;margin-bottom:1px}
.nav a:hover{background:var(--sb-active);color:#fff}
.nav a.on{background:var(--brand);color:#fff;font-weight:600}
.nav a .ic{width:18px;text-align:center;font-size:15px}
.nav a .badge{margin-left:auto;background:rgba(255,255,255,.14);border-radius:20px;font-size:10.5px;padding:1px 7px;font-weight:700}
.nav a.on .badge{background:rgba(0,0,0,.22)}
#sbfoot{border-top:1px solid rgba(255,255,255,.07);padding:10px}
.userchip{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;width:100%;text-align:left}
.userchip:hover{background:var(--sb-active)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:0 0 auto}
.userchip .nm{font-size:12.5px;color:#fff;font-weight:600;line-height:1.2}
.userchip .rl{font-size:10.5px;color:var(--sb-ink);text-transform:capitalize}

#main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
#topbar{height:54px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px;flex:0 0 auto}
#topbar h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.2px}
#topbar .sub{color:var(--muted);font-size:12px}
.spacer{flex:1}
#view{flex:1;overflow-y:auto;padding:16px;min-height:0}
#view.nopad{padding:0}

/* ---------- atoms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:9px;
  background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--ink2);white-space:nowrap;transition:.12s}
.btn:hover{background:var(--panel2);border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--line2);border-color:transparent}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn.lg{padding:13px 20px;font-size:15px;border-radius:11px}
.btn.blk{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--sh)}
.card>.hd{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card>.hd h3{margin:0;font-size:14px;font-weight:650}
.card>.bd{padding:16px}
.card>.bd.p0{padding:0}
.grid{display:grid;gap:14px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.f{display:flex;flex-direction:column;gap:5px}
.f>label{font-size:11.5px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.hintx{font-size:11.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:650;background:var(--line2);color:var(--ink2)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.brand{background:var(--brand-soft);color:var(--brand)}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.tiny{font-size:11.5px}
.b{font-weight:650}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty .ico{font-size:38px;opacity:.5;display:block;margin-bottom:8px}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
  padding:9px 12px;border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0;z-index:1;font-weight:700}
table.tbl td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.tbl tbody tr:hover{background:var(--panel2)}
.estchip{display:flex;align-items:center;gap:6px;padding:5px 11px;border-radius:20px;
  background:var(--ok-soft,var(--panel2));border:1px solid var(--ok);font-size:12px;font-weight:650;color:var(--ok)}
.estchip.pend{background:var(--bad-soft);border-color:var(--bad);color:var(--bad);animation:latir 1.4s infinite}
.estchip.hide{display:none}
@keyframes latir{0%,100%{opacity:1}50%{opacity:.55}}
#pruebabar{display:flex;align-items:center;gap:10px;padding:9px 16px;background:repeating-linear-gradient(
  45deg,var(--warn-soft),var(--warn-soft) 12px,transparent 12px,transparent 24px);
  border-bottom:2px solid var(--warn);color:var(--warn);font-size:13px;flex:0 0 auto}
#pruebabar.hide{display:none}
#pruebabar .ic{font-size:18px}
#pruebabar b{letter-spacing:.6px}
@media (max-width:860px){ #pruebabar{font-size:12px;padding:8px 12px} }
table.tbl tr.rcierre td{background:var(--warn-soft);font-weight:700;border-bottom:1px solid var(--warn)}
table.tbl tr.rfuera td{background:var(--bad-soft)}
table.tbl td.sal{font-variant-numeric:tabular-nums;font-weight:700}
table.tbl td.num,table.tbl th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tblwrap{overflow:auto;max-height:100%}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:14px 15px;box-shadow:var(--sh)}
.kpi .lb{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
.kpi .vl{font-size:23px;font-weight:700;margin-top:5px;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.kpi .df{font-size:11.5px;color:var(--muted);margin-top:2px}
.kpi.acc-ok .vl{color:var(--ok)} .kpi.acc-bad .vl{color:var(--bad)} .kpi.acc-brand .vl{color:var(--brand)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{padding:9px 13px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}

/* ---------- POS ---------- */
#pos{display:grid;grid-template-columns:1fr 372px;height:100%;min-height:0}
#posleft{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
#poscats{display:flex;gap:7px;padding:12px 14px;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto}
#poscats button{padding:7px 14px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
#poscats button.on{background:var(--brand);border-color:var(--brand);color:#fff}
#possearch{padding:10px 14px 0;flex:0 0 auto}
#posgrid{flex:1;overflow-y:auto;padding:12px 14px;display:grid;gap:11px;
  grid-template-columns:repeat(auto-fill,minmax(132px,1fr));align-content:start}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:11px;cursor:pointer;
  display:flex;flex-direction:column;gap:6px;transition:.11s;box-shadow:var(--sh);position:relative;text-align:left;min-height:118px}
.pcard:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--sh2)}
.pcard:active{transform:scale(.975)}
.pcard .em{font-size:27px;line-height:1}
.pcard .nm{font-size:13px;font-weight:650;line-height:1.25;flex:1}
.pcard .pr{font-size:14.5px;font-weight:750;color:var(--brand);font-variant-numeric:tabular-nums}
.pcard .st{position:absolute;top:8px;right:8px;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px}
.pcard.out{opacity:.5}
.pcard .st.no{background:var(--bad-soft);color:var(--bad)}
.pcard .st.low{background:var(--warn-soft);color:var(--warn)}

#poscart{display:flex;flex-direction:column;background:var(--panel);min-width:0}
#carthd{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex:0 0 auto}
#cartitems{flex:1;overflow-y:auto;padding:8px 10px}
.citem{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:9px 8px;border-radius:9px;border:1px solid transparent}
.citem:hover{background:var(--panel2);border-color:var(--line)}
.citem+.citem{border-top:1px solid var(--line2)}
.citem .nm{font-size:13px;font-weight:600;line-height:1.25}
.citem .un{font-size:11.5px;color:var(--muted)}
.citem .tt{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.qty{justify-self:start;display:inline-flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.qty button{width:26px;height:26px;display:grid;place-items:center;font-size:15px;font-weight:700;color:var(--ink2)}
.qty button:hover{background:var(--line2)}
.qty span{min-width:26px;text-align:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
#carttot{border-top:1px solid var(--line);padding:12px 14px;flex:0 0 auto;background:var(--panel2)}
.tline{display:flex;justify-content:space-between;font-size:13px;padding:2.5px 0;color:var(--ink2)}
.tline.big{font-size:20px;font-weight:750;color:var(--ink);padding-top:8px;margin-top:6px;border-top:1px dashed var(--line)}
.tline .v{font-variant-numeric:tabular-nums;font-weight:650}

/* ---------- mesas ---------- */
.mesas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mesa{background:var(--panel);border:2px solid var(--line);border-radius:var(--r2);padding:14px;text-align:left;box-shadow:var(--sh);transition:.12s;min-height:104px;display:flex;flex-direction:column;gap:3px}
.mesa:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.mesa .n{font-size:15px;font-weight:700}
.mesa .z{font-size:11.5px;color:var(--muted)}
.mesa .t{margin-top:auto;font-size:15px;font-weight:750;font-variant-numeric:tabular-nums}
.mesa.libre{border-style:dashed}
.mesa.libre .t{color:var(--muted);font-size:12px;font-weight:600}
.mesa.ocupada{border-color:var(--brand);background:var(--brand-soft)}
.mesa.ocupada .t{color:var(--brand)}
[data-theme="dark"] .mesa.ocupada{background:var(--panel)}

/* ---------- modal ---------- */
#modals{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(15,20,30,.55);backdrop-filter:blur(3px)}
#modals.on{display:flex}
.modal{background:var(--panel);border-radius:16px;box-shadow:var(--sh2);width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;animation:pop .16s ease-out}
.modal.wide{max-width:900px}.modal.xl{max-width:1120px}.modal.slim{max-width:400px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
.modal>.hd{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex:0 0 auto}
.modal>.hd h3{margin:0;font-size:16px;font-weight:650}
.modal>.bd{padding:18px;overflow-y:auto;flex:1}
.modal>.ft{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex:0 0 auto;background:var(--panel2)}

/* ---------- toast ---------- */
#toasts{position:fixed;bottom:18px;right:18px;z-index:130;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--sb);color:#fff;padding:11px 15px;border-radius:10px;box-shadow:var(--sh2);font-size:13px;font-weight:550;
  display:flex;gap:9px;align-items:center;max-width:380px;animation:sl .18s ease-out}
@keyframes sl{from{opacity:0;transform:translateX(24px)}}
.toast.ok{background:var(--ok)}.toast.bad{background:var(--bad)}.toast.warn{background:var(--warn)}

/* ---------- sync chip ---------- */
#sync{display:flex;align-items:center;gap:7px;padding:5px 11px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);font-size:12px;font-weight:650;color:var(--ink2)}
#sync .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
#sync.busy .dot{background:var(--info);animation:pulse 1s infinite}
#sync.pend .dot{background:var(--warn)}
#sync.off .dot{background:var(--muted)}
#sync.err .dot{background:var(--bad)}
@keyframes pulse{50%{opacity:.25}}

/* ---------- login ---------- */
#login{position:fixed;inset:0;z-index:80;background:var(--sb);display:flex;align-items:center;justify-content:center;padding:20px}
#login .box{width:100%;max-width:340px;text-align:center;color:#fff}
#login .logo{width:60px;height:60px;border-radius:17px;background:var(--brand);display:grid;place-items:center;font-size:30px;margin:0 auto 14px}
#login h2{margin:0 0 3px;font-size:20px}
#login p{color:var(--sb-ink);margin:0 0 20px;font-size:13px}
#loginform input{background:#1b2130;border-color:#2b3446;color:#fff;padding:11px 12px;font-size:15px}
#loginform input:focus{border-color:var(--brand);box-shadow:none}
#loginform label{letter-spacing:.4px;color:#7b8698}
.shake{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ---------- ticket ---------- */
#tikframe,.printframe{position:fixed;width:0;height:0;border:0;left:-9999px}
.imgprev{width:92px;height:92px;border-radius:12px;border:1px solid var(--line);overflow:hidden;
  background:var(--panel2);display:grid;place-items:center;flex:0 0 auto}
.imgprev img{width:100%;height:100%;object-fit:cover;display:block}
.imgprev.vacia span{font-size:10.5px;color:var(--muted)}
.pcard .foto{width:100%;height:74px;border-radius:9px;object-fit:cover;display:block;background:var(--panel2)}
.brand .logoimg{width:32px;height:32px;border-radius:9px;object-fit:cover;flex:0 0 auto}
#login .logoimg{width:60px;height:60px;border-radius:17px;object-fit:cover;margin:0 auto 14px;display:block}
.cbx{position:relative}
.cbx-in{width:100%;padding-right:28px}
.cbx-x{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:20px;height:20px;border-radius:50%;
  display:none;place-items:center;color:var(--muted);font-size:11px;line-height:1}
.cbx-x:hover{background:var(--line2);color:var(--ink)}
.cbx-pop{position:absolute;z-index:40;left:0;right:0;top:calc(100% + 4px);background:var(--panel);
  border:1px solid var(--line);border-radius:10px;box-shadow:var(--sh2);max-height:262px;overflow:auto;padding:4px}
.cbx-it{padding:7px 9px;border-radius:7px;cursor:pointer;font-size:13px;line-height:1.3}
.cbx-it:hover,.cbx-it.on{background:var(--brand-soft)}
.cbx-it mark{background:transparent;color:var(--brand);font-weight:700;padding:0}
.cbx-sub{font-size:11.5px;color:var(--muted);margin-top:1px}
.cbx-nuevo{border-top:1px solid var(--line2);margin-top:3px;padding-top:9px;color:var(--brand)}
.cbx-vacio{padding:12px 10px;font-size:12.5px;color:var(--muted);text-align:center}
.cbx-form{padding:8px}
.cbx-lb{display:block;font-size:11.5px;font-weight:650;color:var(--muted);margin-bottom:7px}
.cbx-lb input,.cbx-lb select{margin-top:3px}
.recipe-row{display:grid;grid-template-columns:1fr 92px 66px 32px;gap:7px;align-items:center;margin-bottom:7px}
.paybtn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:13px 8px;border-radius:12px;border:2px solid var(--line);background:var(--panel);font-size:12.5px;font-weight:650}
.paybtn .e{font-size:21px}
.paybtn.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.quickamt{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.quickamt button{padding:9px 4px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-size:12.5px;font-weight:650}
.quickamt button:hover{border-color:var(--brand)}

#navtoggle{display:none;width:40px;height:40px;border-radius:10px;font-size:21px;color:var(--ink2);flex:0 0 auto}
#navtoggle:active{background:var(--line2)}
#scrim{position:fixed;inset:0;background:rgba(10,14,20,.5);z-index:65;display:none;backdrop-filter:blur(2px)}
#scrim.on{display:block}
#posbar{display:none;position:fixed;left:0;right:0;bottom:0;z-index:52;padding:10px 14px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));background:var(--brand);color:#fff;
  align-items:center;gap:12px;box-shadow:0 -4px 18px rgba(0,0,0,.22);font-weight:700}
#posbar .n{background:rgba(255,255,255,.22);border-radius:20px;padding:2px 10px;font-size:13px}
#posbar .t{margin-left:auto;font-size:17px;font-variant-numeric:tabular-nums}
#cartcerrar{display:none}

@media (max-width:1080px) and (min-width:861px){
  #app{grid-template-columns:64px 1fr}
  .brand b,.brand small,.nav a span.tx,.nav .sec,.userchip .nm,.userchip .rl{display:none}

"use strict";
/* =====================================================================
   POS RESTAURANTE — arquitectura local-first
   memoria (lectura instantánea) → IndexedDB (cache durable, escritura
   por lotes) → outbox (cola) → Google Sheets en segundo plano
   ===================================================================== */

/* ------------------------------- utils ------------------------------ */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const uid = p => (p||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const now = ()=> new Date().toISOString();
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const round=(n,d)=>{const f=Math.pow(10,d||0);return Math.round((Number(n)||0)*f+Number.EPSILON)/f;};
const sum=(a,f)=>a.reduce((t,x)=>t+(f?f(x):x),0);
const todayISO=()=> new Date().toISOString().slice(0,10);
const dISO=d=> new Date(d).toISOString().slice(0,10);
function dateAdd(iso,n){const d=new Date(iso+'T12:00:00');d.setDate(d.getDate()+n);return dISO(d);}
function fdate(v,withTime){ if(!v) return '—'; const d=new Date(v);
  const s=d.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'});
  return withTime? s+' '+d.toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}) : s; }
function ftime(v){ return v? new Date(v).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'}) : '—'; }
function fcorta(v){ if(!v) return '—'; const d=new Date(v);
  return d.toLocaleDateString('es-CO',{day:'2-digit',month:'2-digit',year:'2-digit'}); }
function agoMin(v){ return Math.max(0,Math.round((Date.now()-new Date(v).getTime())/60000)); }
function debounce(fn,ms){let t;return function(){clearTimeout(t);const a=arguments;t=setTimeout(()=>fn.apply(null,a),ms||220);};}

/* dinero: depende de la configuración */
function money(n){
  const c=S.cfg, d=c.decimales==null?0:c.decimales;
  const v=round(Number(n)||0,d);
  return (c.simbolo||'$')+' '+v.toLocaleString('es-CO',{minimumFractionDigits:d,maximumFractionDigits:d});
}
function num(n,d){ return (round(Number(n)||0,d==null?2:d)).toLocaleString('es-CO',{maximumFractionDigits:d==null?2:d}); }
function toN(v){ const n=parseFloat(String(v==null?'':v).replace(/[^\d.,-]/g,'').replace(/\.(?=\d{3}\b)/g,'').replace(',','.')); return isNaN(n)?0:n; }

/* ------------------------------ IndexedDB --------------------------- */
const DBNAME='pos_restaurante', DBVER=1;
const STORES=['config','usuarios','categorias','ingredientes','productos','proveedores','clientes','mesas',
  'comandas','ventas','compras','abonos','cuentas','movimientos','turnos','movinv','capas','imagenes','otrosdocs','outbox','meta'];
let _db=null, MODE='idb';                 // idb | ls | mem
const _ls=new Map();                       // respaldo cuando IndexedDB no está disponible (archivo local)

function openDB(){
  return new Promise(res=>{
    let done=false;
    const fin=m=>{ if(done)return; done=true; MODE=m; res(m); };
    setTimeout(()=>fin(_db?'idb':'ls'),3500);            // navegadores que se quedan bloqueados
    try{
      const rq=indexedDB.open(DBNAME,DBVER);
      rq.onupgradeneeded=e=>{ const db=e.target.result;
        STORES.forEach(st=>{ if(!db.objectStoreNames.contains(st)) db.createObjectStore(st,{keyPath:'id'}); }); };
      rq.onsuccess=e=>{ _db=e.target.result; fin('idb'); };
      rq.onerror=()=>fin('ls');
      rq.onblocked=()=>fin('ls');
    }catch(e){ fin('ls'); }
  });
}
function lsKey(st){ return 'pos_'+st; }
function lsLoad(st){
  if(_ls.has(st)) return _ls.get(st);
  let arr=[]; try{ arr=JSON.parse(localStorage.getItem(lsKey(st))||'[]')||[]; }catch(e){ arr=[]; }
  const m=new Map(); arr.forEach(o=>{ if(o&&o.id) m.set(o.id,o); });
  _ls.set(st,m); return m;
}
function idbAll(store){
  if(MODE!=='idb'||!_db){ try{ return Promise.resolve(Array.from(lsLoad(store).values())); }catch(e){ return Promise.resolve([]); } }
  return new Promise(res=>{
    try{ const t=_db.transaction(store,'readonly').objectStore(store).getAll();
      t.onsuccess=()=>res(t.result||[]); t.onerror=()=>res([]);
    }catch(e){ res([]); }
  });
}
/* escrituras por lotes: se acumulan y se vacían cada 200 ms de una sola vez */
let _wq=new Map(); let _wt=null;
function idbPut(store,obj){ _q(store,{op:'put',obj:obj,id:obj.id}); }
function idbDel(store,id){  _q(store,{op:'del',id:id}); }
function _q(store,o){
  if(!_wq.has(store)) _wq.set(store,new Map());
  _wq.get(store).set(o.id,o);
  if(MODE!=='idb'){ const m=lsLoad(store); o.op==='put'? m.set(o.id,o.obj) : m.delete(o.id); }
  if(!_wt) _wt=setTimeout(flushIDB,200);
}
function flushIDB(){
  _wt=null; if(!_wq.size) return;
  const batch=_wq; _wq=new Map();
  if(MODE==='idb' && _db){
    const names=Array.from(batch.keys()).filter(n=>_db.objectStoreNames.contains(n));
    if(!names.length) return;
    try{
      const tx=_db.transaction(names,'readwrite');
      names.forEach(n=>{ const os=tx.objectStore(n);
        batch.get(n).forEach(o=>{ try{ o.op==='put'? os.put(o.obj) : os.delete(o.id); }catch(e){} }); });
    }catch(e){ MODE='ls'; }
    return;
  }
  if(MODE==='mem') return;
  try{
    Array.from(batch.keys()).forEach(st=>
      localStorage.setItem(lsKey(st), JSON.stringify(Array.from(lsLoad(st).values()))));
  }catch(e){ MODE='mem'; console.warn('Sin almacenamiento persistente',e); }
}
window.addEventListener('beforeunload',flushIDB);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) flushIDB(); });

/* ------------------------------- estado ----------------------------- */
const S={
  cfg:{}, usuarios:[], categorias:[], ingredientes:[], productos:[], proveedores:[], clientes:[],
  mesas:[], comandas:[], ventas:[], compras:[], abonos:[], cuentas:[], movimientos:[], turnos:[],

  user:null, turno:null, cart:null, view:'pos', posCat:'all', posQ:'',

const byId=(c,id)=> S[c] && S[c].find(x=>x.id===id) || null;
const nameOf=(c,id,f)=>{const o=byId(c,id);return o?(o.nombre||o[f||'nombre']):'—';};

const DEFCFG={ id:'cfg', nombre:'Mi Restaurante', nit:'', direccion:'', telefono:'',

  ticketAncho:80, ticketPie:'¡Gracias por su visita!', tema:'light',
  /* impresión */
  impComanda:true, impTicket:true, ordenImp:'comanda', pausaImp:1800,
  estacion:false, estacionAuto:true, estacionSonido:true,
  comandaAncho:80, comandaPrecios:false, modoImp:'silencioso', letra:1.15,
  impresoraComanda:'', impresoraTicket:'', waSoporte:'573204491926',
  /* nube */
  fbApiKey:'AIzaSyAxCG0jyAb3NJUNjoV0bLTxiZfkm1_bN2o',
  fbProjectId:'restaurante-8f3f9',
  fbNegocio:'', fbOn:true, autoSync:true, pullSeg:12, terminal:'A' };

/* --------------- guardar: memoria → IDB → cola (outbox) -------------- */
function put(coll,obj,opts){
  opts=opts||{};
  const arr=S[coll]; if(!arr) return obj;
  obj.upd=now();
  const i=arr.findIndex(x=>x.id===obj.id);
  if(i>=0) arr[i]=obj; else arr.push(obj);
  idbPut(coll,obj);
  if(opts.sync!==false) enqueue(coll,'upsert',obj);
  return obj;
}
function putMany(coll,objs,opts){ objs.forEach(o=>put(coll,o,opts)); }
function remove(coll,id,opts){
  const arr=S[coll]; if(!arr) return;
  const i=arr.findIndex(x=>x.id===id); if(i<0) return;
  arr.splice(i,1); idbDel(coll,id);
  if(!opts||opts.sync!==false) enqueue(coll,'delete',{id});
}
function saveCfg(){ S.cfg.id='cfg'; S.cfg.upd=now(); idbPut('config',S.cfg); enqueue('config','upsert',S.cfg); applyCfg(); }
function saveMeta(){ S.meta.id='meta'; idbPut('meta',S.meta); }

/* consecutivos */
function nextNo(key,prefix){
  S.meta.cons=S.meta.cons||{};
  const n=(S.meta.cons[key]||0)+1; S.meta.cons[key]=n; saveMeta();
  return (prefix||'')+(S.cfg.terminal||'A')+'-'+String(n).padStart(5,'0');
}

/* ===================== NUBE · Firebase (REST, sin SDK) ================
   Auth con Identity Toolkit + Firestore por REST: funciona igual desde un
   archivo local o desde un servidor, sin cargar el SDK ni depender de CDN.
   ==================================================================== */
const FB={ idToken:'', refresh:'', uid:'', email:'', exp:0, listo(){ return !!(FB.idToken && S.cfg.fbApiKey && S.cfg.fbProjectId); } };
function fbDocRoot(){ return 'projects/'+S.cfg.fbProjectId+'/databases/(default)/documents/negocios/'+(S.cfg.fbNegocio||'principal'); }
function fbUrl(sufijo){ return 'https://firestore.googleapis.com/v1/projects/'+S.cfg.fbProjectId+'/databases/(default)/documents'+(sufijo||''); }
function fbErr(e){
  const m=String((e&&e.message)||e);
  if(/Failed to fetch|NetworkError|Load failed/i.test(m)){
    if(!navigator.onLine) return 'El equipo está sin internet. Trabaja normal: los cambios se suben solos al volver.';
    if(location.protocol==='file:')
      return 'Hay internet, pero el navegador bloqueó la llamada a Firebase porque la app se abrió como archivo. '+
             'Publícala en Firebase Hosting o ábrela desde un servidor.';
    return 'Hay internet, pero no se pudo contactar a Firebase. Revisa el Project ID y la API key en Ajustes ▸ Nube.';
  }
  const t={EMAIL_NOT_FOUND:'Ese correo no está registrado',INVALID_PASSWORD:'Contraseña incorrecta',
    INVALID_LOGIN_CREDENTIALS:'Correo o contraseña incorrectos',EMAIL_EXISTS:'Ese correo ya está registrado',
    WEAK_PASSWORD:'La contraseña debe tener al menos 6 caracteres',
    OPERATION_NOT_ALLOWED:'Activa el método Correo/contraseña en Firebase ▸ Authentication',
    TOKEN_EXPIRED:'La sesión expiró, vuelve a entrar',USER_DISABLED:'Usuario deshabilitado',
    'Missing or insufficient permissions.':'Las reglas de Firestore no permiten esta operación'};
  for(const k in t) if(m.indexOf(k)>=0) return t[k];
  return m;
}
async function fbJson(url,opts){
  const r=await fetch(url,opts);
  let j={}; try{ j=await r.json(); }catch(e){}
  if(Array.isArray(j) && j[0] && j[0].error) throw new Error(j[0].error.message||'Error de Firestore');
  if(!r.ok) throw new Error((j.error&&(j.error.message||j.error.status))||('HTTP '+r.status));
  return j;
}
async function fbLogin(email,pass,crear){
  if(!S.cfg.fbApiKey) throw new Error('Falta la API key del proyecto');
  const j=await fbJson('https://identitytoolkit.googleapis.com/v1/accounts:'+(crear?'signUp':'signInWithPassword')+
      '?key='+encodeURIComponent(S.cfg.fbApiKey),
    {method:'POST',headers:{'Content-Type':'application/json'},
     body:JSON.stringify({email:email,password:pass,returnSecureToken:true})});
  FB.idToken=j.idToken; FB.refresh=j.refreshToken; FB.uid=j.localId; FB.email=j.email||email;
  FB.exp=Date.now()+(Number(j.expiresIn||3600)-120)*1000;
  guardarSesionFB(); paintSync(); return j;
}
async function fbRenovar(){
  if(!FB.refresh) throw new Error('TOKEN_EXPIRED');
  const j=await fbJson('https://securetoken.googleapis.com/v1/token?key='+encodeURIComponent(S.cfg.fbApiKey),
    {method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},
     body:'grant_type=refresh_token&refresh_token='+encodeURIComponent(FB.refresh)});
  FB.idToken=j.id_token; FB.refresh=j.refresh_token||FB.refresh; FB.uid=j.user_id||FB.uid;
  FB.exp=Date.now()+(Number(j.expires_in||3600)-120)*1000;
  guardarSesionFB();
}
async function fbAuthHdr(){
  if(!FB.idToken || Date.now()>FB.exp) await fbRenovar();
  return {'Content-Type':'application/json','Authorization':'Bearer '+FB.idToken};
}
function guardarSesionFB(){ try{ localStorage.setItem('pos_fb',JSON.stringify({r:FB.refresh,e:FB.email,u:FB.uid})); }catch(e){} }
function fbSalir(){ FB.idToken=FB.refresh=FB.uid=FB.email=''; FB.exp=0;
  try{ localStorage.removeItem('pos_fb'); }catch(e){} paintSync(); }
async function fbRestaurarSesion(){
  let s=null; try{ s=JSON.parse(localStorage.getItem('pos_fb')||'null'); }catch(e){}
  if(!s||!s.r||!S.cfg.fbApiKey) return false;
  FB.refresh=s.r; FB.email=s.e||''; FB.uid=s.u||'';
  try{ await fbRenovar(); paintSync(); return true; }catch(e){ console.warn('sesión nube',e); return false; }
}

/* --- codificación de valores de Firestore --- */
function fsVal(v){
  if(v===null||v===undefined) return {nullValue:null};
  if(typeof v==='boolean') return {booleanValue:v};
  if(typeof v==='number'){ if(!isFinite(v)) return {doubleValue:0};
    return Number.isInteger(v)? {integerValue:String(v)} : {doubleValue:v}; }
  if(typeof v==='string') return {stringValue:v};
  if(Array.isArray(v)) return {arrayValue:{values:v.map(fsVal)}};
  if(typeof v==='object') return {mapValue:{fields:fsFields(v)}};
  return {stringValue:String(v)};
}
function fsFields(o){ const f={}; Object.keys(o).forEach(k=>{ if(k.indexOf('.')<0) f[k]=fsVal(o[k]); }); return f; }
function fsParse(v){
  if(!v) return null;
  if('nullValue' in v) return null;
  if('booleanValue' in v) return !!v.booleanValue;
  if('integerValue' in v) return Number(v.integerValue);
  if('doubleValue' in v) return Number(v.doubleValue);
  if('stringValue' in v) return v.stringValue;
  if('timestampValue' in v) return v.timestampValue;
  if('arrayValue' in v) return (v.arrayValue.values||[]).map(fsParse);
  if('mapValue' in v) return fsDoc(v.mapValue.fields||{});
  return null;
}
function fsDoc(fields){ const o={}; Object.keys(fields||{}).forEach(k=>{ o[k]=fsParse(fields[k]); }); return o; }

/* la configuración del dispositivo nunca viaja a la nube */
const CFG_LOCAL=['fbApiKey','fbProjectId','fbNegocio','fbOn','autoSync','pullSeg','tema','ticketAncho','prueba',
  'estacion','estacionAuto','estacionSonido','impresoraComanda','impresoraTicket','modoImp'];
function cfgParaNube(){ const o={}; Object.keys(S.cfg).forEach(k=>{ if(CFG_LOCAL.indexOf(k)<0) o[k]=S.cfg[k]; }); o.id='cfg'; return o; }

/* ------------------------- cola de envío (outbox) ------------------- */
let syncing=false, syncErr=0, lastSync=null, lastPull=null, pulling=false;
function enqueue(entidad,op,payload){
  if(S.cfg.prueba) return;                      // en modo prueba NADA sale del equipo
  if(!S.cfg.fbOn) return;                       // en modo local la cola no crece
  if(entidad==='config') payload=cfgParaNube();
  const item={id:uid('q'),ts:now(),entidad:entidad,op:op,payload:payload,intentos:0,error:''};
  S.outbox.push(item); idbPut('outbox',item);
  paintSync();
  if(S.cfg.autoSync) scheduleSync();
}
let _st=null;
function scheduleSync(ms){ if(_st) return; _st=setTimeout(()=>{_st=null;flushOutbox();}, ms||1200); }

async function flushOutbox(manual){
  if(syncing) return;
  if(S.cfg.prueba){ if(manual) toast('Está en modo prueba: nada se sube a la nube','warn',4000); return; }
  if(!S.cfg.fbOn){ paintSync(); if(manual) toast('Activa la nube en Ajustes','warn'); return; }
  if(!FB.listo() && !(await fbRestaurarSesion())){ paintSync();
    if(manual) toast('Inicia sesión en la nube (Ajustes ▸ Nube)','warn'); return; }
  if(!navigator.onLine){ paintSync(); if(manual) toast('Sin conexión a internet','warn'); return; }
  if(!S.outbox.length){ paintSync(); if(manual) toast('No hay nada pendiente','ok'); return; }
  syncing=true; paintSync();
  const lote=S.outbox.slice(0,400);
  /* una sola escritura por documento: gana la última de la cola */
  const porDoc=new Map();
  lote.forEach(o=>{ const id=(o.payload&&o.payload.id)||''; if(id) porDoc.set(o.entidad+'/'+id,o); });
  try{
    const hdr=await fbAuthHdr();
    const writes=Array.from(porDoc.values()).map(o=>{
      const datos = o.op==='delete'
        ? {id:o.payload.id,_del:true,upd:o.ts}
        : Object.assign({},o.payload,{upd:o.payload.upd||o.ts});
      return {update:{name:fbDocRoot()+'/'+o.entidad+'/'+o.payload.id, fields:fsFields(datos)}};
    });
    for(let i=0;i<writes.length;i+=400){
      await fbJson(fbUrl(':commit'),{method:'POST',headers:hdr,
        body:JSON.stringify({writes:writes.slice(i,i+400)})});
    }
    const ids=new Set(lote.map(b=>b.id));
    S.outbox=S.outbox.filter(o=>!ids.has(o.id));
    lote.forEach(b=>idbDel('outbox',b.id));
    syncErr=0; lastSync=now();
    syncing=false; paintSync();
    if(manual) toast('Enviado a Firebase ('+writes.length+' documentos)','ok');
    if(S.outbox.length) scheduleSync(400);
  }catch(e){
    syncErr++; lote.forEach(b=>{b.intentos++;b.error=fbErr(e);idbPut('outbox',b);});
    syncing=false; paintSync();
    if(/PERMISSION|permission/i.test(String(e.message||e)))
      toast('El servidor rechazó los cambios: la suscripción de este restaurante venció o fue suspendida.','bad',7000);
    else if(manual) toast(fbErr(e),'bad',4200);
    scheduleSync(Math.min(60000, 4000*Math.pow(2,Math.min(syncErr,4))));
  }
}

/* --------- traer cambios hechos en otras terminales (pull) ---------- */
function aplicarRemoto(coll,o){
  if(!o || !o.id) return false;
  if(coll==='config'){
    if(String(S.cfg.upd||'')>=String(o.upd||'')) return false;
    const local={}; CFG_LOCAL.forEach(k=> local[k]=S.cfg[k]);
    S.cfg=Object.assign({},S.cfg,o,local); S.cfg.id='cfg';
    idbPut('config',S.cfg); applyCfg(); return true;
  }
  if(!S[coll]) return false;
  const i=S[coll].findIndex(x=>x.id===o.id);
  if(o._del){ if(i>=0){ S[coll].splice(i,1); idbDel(coll,o.id); return true; } return false; }
  if(i>=0 && String(S[coll][i].upd||'')>=String(o.upd||'')) return false;
  if(i>=0) S[coll][i]=o; else S[coll].push(o);
  idbPut(coll,o); return true;
}
async function pullCloud(manual){
  if(pulling) return 0;
  if(S.cfg.prueba){ if(manual) toast('Está en modo prueba: no se baja nada de la nube','warn',4000); return 0; }
  if(!S.cfg.fbOn){ if(manual) toast('Activa la nube en Ajustes','warn'); return 0; }
  if(!FB.listo() && !(await fbRestaurarSesion())){ if(manual) toast('Inicia sesión en la nube','warn'); return 0; }
  if(!navigator.onLine){ if(manual) toast('Sin conexión','warn'); return 0; }
  pulling=true; paintSync();
  let cambios=0;
  try{
    const hdr=await fbAuthHdr();
    S.meta.pull=S.meta.pull||{};
    for(const coll of COLL.concat(['config'])){
      let cursor=S.meta.pull[coll]||'';
      for(let pag=0; pag<25; pag++){
        const q={structuredQuery:{ from:[{collectionId:coll}],
          where:{fieldFilter:{field:{fieldPath:'upd'},op:'GREATER_THAN',value:{stringValue:cursor}}},
          orderBy:[{field:{fieldPath:'upd'},direction:'ASCENDING'}], limit:300 }};
        const res=await fbJson(fbUrl('/negocios/'+(S.cfg.fbNegocio||'principal')+':runQuery'),
          {method:'POST',headers:hdr,body:JSON.stringify(q)});
        const docs=(res||[]).filter(r=>r&&r.document);
        docs.forEach(r=>{ const o=fsDoc(r.document.fields);
          if(aplicarRemoto(coll,o)) cambios++;
          if(String(o.upd||'')>cursor) cursor=o.upd; });
        if(docs.length<300) break;
      }
      S.meta.pull[coll]=cursor;
    }
    saveMeta(); lastPull=now(); syncErr=0;
    S.turno=turnoAbierto();
    pulling=false; paintSync();
    if(cambios){ toast(cambios+' cambio(s) recibidos de otra terminal','ok'); if(S.user) render(); }
    if(esEstacion() && S.user) setTimeout(revisarCocina,300);
    else if(manual) toast('Todo al día','ok');
  }catch(e){
    pulling=false; syncErr++; paintSync();
    if(manual) toast(fbErr(e),'bad',4200);
  }
  return cambios;
}
async function traerDeLaNube(){
  COLL.forEach(k=>{ S[k].forEach(o=>idbDel(k,o.id)); S[k]=[]; });

  S.meta.pull={}; S.meta.cons={}; saveMeta();

}

/* ==================== ESTACIÓN DE COCINA =============================
   Los meseros toman el pedido en el teléfono, pero la impresora está en el
   PC. Entonces el PC queda de "estación": vigila los pedidos que van
   llegando de los teléfonos y los imprime solo. El teléfono no imprime
   nada; solo deja el pedido marcado como pendiente para la cocina.
   ==================================================================== */
function esEstacion(){ return !!S.cfg.estacion; }
function comandasPendientes(){
  return S.comandas.filter(cm=>cm.estado==='abierta' && pendientesComanda(cm).uds>0)
    .sort((a,b)=>String(a.cocinaMs||a.apertura||'').localeCompare(String(b.cocinaMs||b.apertura||'')));
}
function unidadesPendientes(){ return sum(comandasPendientes(),cm=>pendientesComanda(cm).uds); }
function docComanda(cm,d){
  const mesa=cm.mesaId? byId('mesas',cm.mesaId):null;
  const dest=mesa? mesa.nombre : 'MOSTRADOR';
  const soloBaja=!d.nuevos.length && !d.cambios.length && d.bajas.length;
  return comandaHTML({no:(soloBaja?'ANULA · ':d.yaEnviado?'AGREGADO · ':'PEDIDO · ')+dest,
    fecha:now(), tipo:cm.tipo||(mesa?'mesa':'mostrador'), mesaId:cm.mesaId||'',
    usuarioId:cm.meseroId||'', items:d.nuevos, cambios:d.cambios, bajas:d.bajas,
    adicional:d.yaEnviado, nota:cm.nota});
}
/* imprime lo que falta de esa comanda y lo deja marcado para que nadie lo repita */
function imprimirPendiente(cm){
  if(!cm) return false;
  const d=pendientesComanda(cm);
  if(!d.nuevos.length && !d.cambios.length && !d.bajas.length) return false;
  encolarImp(docComanda(cm,d),'comanda',S.cfg.impresoraComanda);
  marcarEnviado(cm);
  cm.impresoMs=Date.now();
  cm.impresoEn=S.cfg.terminal||'';
  delete cm.cocinaMs;
  put('comandas',cm);
  if(S.cart && S.cart.comandaId===cm.id){       // el carrito abierto se entera
    S.cart.items.forEach(i=>{ const o=(cm.items||[]).find(x=>x.id===i.id);
      if(o){ i.env=o.env; i.envNota=o.envNota; } });
    S.cart.bajas=[]; if(S.view==='pos') paintCart();
  }
  return true;
}
let _cocinaUltimo=0;
function revisarCocina(){
  if(!esEstacion() || S.cfg.estacionAuto===false) return 0;
  const l=comandasPendientes(); let n=0, uds=0;
  l.forEach(cm=>{ const d=pendientesComanda(cm); if(imprimirPendiente(cm)){ n++; uds+=d.uds; } });
  if(n){
    campanaCocina();
    toast('🖨️ '+n+' pedido(s) nuevo(s) · '+uds+' unidad(es) enviados a la impresora','ok',5000);
    if(S.view==='cocina'||S.view==='mesas') render(); else { buildNav(); }
  }
  pintarEstacion();
  return n;
}
function campanaCocina(){
  if(S.cfg.estacionSonido===false) return;
  try{
    const A=window.AudioContext||window.webkitAudioContext; if(!A) return;
    const ac=new A(); const t0=ac.currentTime;
    [[880,0],[1175,0.18],[1568,0.36]].forEach(n=>{
      const o=ac.createOscillator(), g=ac.createGain();
      o.type='sine'; o.frequency.value=n[0];
      g.gain.setValueAtTime(0.0001,t0+n[1]);
      g.gain.exponentialRampToValueAtTime(0.25,t0+n[1]+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+n[1]+0.22);
      o.connect(g); g.connect(ac.destination); o.start(t0+n[1]); o.stop(t0+n[1]+0.25);
    });
    setTimeout(()=>{ try{ac.close();}catch(e){} },1200);
  }catch(e){}
}
/* No hace falta quedarse en la pantalla de Cocina: mientras la app esté
   abierta en este equipo (en cualquier sección), los pedidos se imprimen. */
setInterval(()=>{ if(esEstacion()) revisarCocina(); }, 6000);

  const el=$('#estchip'); if(!el) return;

}

/* ===================== IMÁGENES EN BASE64 (sin Storage) ===============
   Se redimensionan y comprimen en el navegador antes de guardarse, para
   que cada una quepa de sobra en un documento de Firestore (límite 1 MB)
   y el menú siga cargando rápido. Viajan como texto igual que todo lo demás.
   ==================================================================== */
const IMG_PRESET={
  logo:   {max:240, calidad:0.9,  maxBytes:150000, transparente:true},
  plato:  {max:320, calidad:0.78, maxBytes:95000,  transparente:false}
};
function comprimirImagen(file,pre){
  const o=Object.assign({max:320,calidad:0.8,maxBytes:95000,transparente:false},pre||{});
  return new Promise((res,rej)=>{
    if(!file) return rej(new Error('No elegiste ningún archivo'));
    if(!/^image\//.test(file.type||'')) return rej(new Error('Ese archivo no es una imagen'));
    if(file.size>12*1024*1024) return rej(new Error('La imagen pesa más de 12 MB'));
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('No se pudo leer el archivo'));
    fr.onload=()=>{
      const im=new Image();
      im.onerror=()=>rej(new Error('No se pudo abrir la imagen (¿formato raro?)'));
      im.onload=()=>{
        try{
          let w=im.naturalWidth||im.width, h=im.naturalHeight||im.height;
          if(!w||!h) return rej(new Error('Imagen vacía'));
          const f=Math.min(1,o.max/Math.max(w,h));
          w=Math.max(1,Math.round(w*f)); h=Math.max(1,Math.round(h*f));
          const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
          const cx=cv.getContext('2d');
          cx.imageSmoothingQuality='high';
          if(!o.transparente){ cx.fillStyle='#ffffff'; cx.fillRect(0,0,w,h); }
          cx.drawImage(im,0,0,w,h);
          let q=o.calidad;
          let out=cv.toDataURL('image/webp',q);
          if(out.indexOf('data:image/webp')!==0)                 // navegador sin webp
            out=cv.toDataURL(o.transparente?'image/png':'image/jpeg',q);
          let guardia=0;
          while(out.length>o.maxBytes && q>0.35 && guardia++<8){
            q=round(q-0.1,2);
            out=cv.toDataURL(out.indexOf('data:image/png')===0?'image/png':
                             (out.indexOf('data:image/webp')===0?'image/webp':'image/jpeg'), q);
            if(out.indexOf('data:image/png')===0) break;          // png no obedece la calidad
          }
          if(out.length>o.maxBytes*2.2) return rej(new Error('La imagen quedó muy pesada, prueba con otra'));
          res({datos:out, ancho:w, alto:h, bytes:out.length});
        }catch(e){ rej(new Error('No se pudo procesar la imagen')); }
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function imgDe(id){ return S.imagenes.find(x=>x.id===id)||null; }
function guardarImagen(id,datos,tipo,ref){
  put('imagenes',{id:id,datos:datos,tipo:tipo||'',ref:ref||'',bytes:(datos||'').length});
  _imgUrl.forEach((u,k)=>{ if(k.indexOf(id+'|')===0){ try{URL.revokeObjectURL(u);}catch(e){} _imgUrl.delete(k); } });
}
function borrarImagen(id){
  remove('imagenes',id);
  _imgUrl.forEach((u,k)=>{ if(k.indexOf(id+'|')===0){ try{URL.revokeObjectURL(u);}catch(e){} _imgUrl.delete(k); } });
}
/* el DOM recibe una URL corta en vez de repetir el base64 en cada repintado */
const _imgUrl=new Map();
function urlImg(id){
  const im=imgDe(id); if(!im||!im.datos) return '';
  const k=id+'|'+(im.upd||im.bytes||'');
  if(_imgUrl.has(k)) return _imgUrl.get(k);
  let u=im.datos;
  try{
    const coma=im.datos.indexOf(','), meta=im.datos.slice(0,coma), b64=im.datos.slice(coma+1);
    const mime=(meta.match(/data:([^;]+)/)||[])[1]||'image/jpeg';
    const bin=atob(b64), arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    u=URL.createObjectURL(new Blob([arr],{type:mime}));
  }catch(e){}
  _imgUrl.set(k,u); return u;
}
/* selector reutilizable: botón + vista previa + quitar */
function cajaImagen(cont,id,pre,onCambio){
  const pintar=()=>{
    const u=urlImg(id), im=imgDe(id);
    cont.innerHTML=
      '<div class="row" style="gap:12px;align-items:flex-start">'+
        '<div class="imgprev'+(u?'':' vacia')+'">'+(u?'<img src="'+u+'">':'<span>sin imagen</span>')+'</div>'+
        '<div style="flex:1;min-width:0">'+
          '<div class="row wrap"><button class="btn sm" data-up>'+(u?'Cambiar':'Subir imagen')+'</button>'+
          (u?'<button class="btn sm danger" data-del>Quitar</button>':'')+'</div>'+
          '<div class="hintx" style="margin-top:7px">'+
            (im? 'Guardada como texto · '+Math.round((im.bytes||0)/1024)+' KB'
               : 'JPG o PNG. Se reduce sola antes de guardarse.')+'</div>'+
          '<input type="file" accept="image/*" hidden data-file>'+
        '</div></div>';
    const f=$('[data-file]',cont);
    $('[data-up]',cont).onclick=()=>f.click();
    if($('[data-del]',cont)) $('[data-del]',cont).onclick=()=>{ borrarImagen(id); pintar(); onCambio&&onCambio(null); };
    f.onchange=async e=>{
      const file=e.target.files[0]; if(!file) return;
      try{
        toast('Procesando imagen…');
        const r=await comprimirImagen(file,pre);
        guardarImagen(id,r.datos,pre===IMG_PRESET.logo?'logo':'producto',id);
        pintar(); onCambio&&onCambio(r);
        toast('Imagen lista · '+Math.round(r.bytes/1024)+' KB','ok');
      }catch(err){ toast(String(err.message||err),'bad',4500); }
      f.value='';
    };
  };
  pintar(); return pintar;
}

/* ---- impuestos ---- */
function desglose(base){                     // base = suma de precios de venta
  const t=Number(S.cfg.impuesto)||0;
  if(!t) return {neto:base, imp:0};
  if(S.cfg.impIncluido){ const neto=base/(1+t/100); return {neto:round(neto,2), imp:round(base-neto,2)}; }
  return {neto:base, imp:round(base*t/100,2)};
}

/* ---- costos ---- */
function costoProducto(p){
  if(!p) return 0;
  if(p.receta && p.receta.length)
    return round(sum(p.receta,r=>{ const g=byId('ingredientes',r.ingredienteId); return g? (Number(g.costo)||0)*(Number(r.cantidad)||0) : 0; }),2);
  return Number(p.costoManual)||0;
}
function margen(p){ const c=costoProducto(p), pr=Number(p.precio)||0; return pr? round((pr-c)/pr*100,1):0; }

/* ---- disponibilidad por receta ---- */
function maxPorReceta(p){
  if(!p.receta || !p.receta.length) return Infinity;
  let m=Infinity;
  p.receta.forEach(r=>{ const g=byId('ingredientes',r.ingredienteId);
    if(!g||!r.cantidad) return; m=Math.min(m, Math.floor((Number(g.stock)||0)/Number(r.cantidad))); });
  return m===Infinity?Infinity:Math.max(0,m);
}

/* ---------- inventario al COSTO PROMEDIO PONDERADO ------------------
   El costo de un ingrediente es el promedio real de lo que hay AHORA en
   bodega: el valor total del inventario dividido entre las unidades que
   quedan. Cada compra vuelve a promediar lo que ya había con lo nuevo.
   Las "capas" se conservan para poder deshacer una compra y para el
   historial, pero todas quedan al mismo costo: el promedio vigente.
   Cada capa guarda además 'costoBase', que es lo que costó de verdad esa
   entrada, para poder recalcular bien el promedio si se borra.
   ------------------------------------------------------------------ */
function capasDe(gid){
  return S.capas.filter(c=>c.ingredienteId===gid && (Number(c.restante)||0)>0.000001)
    .sort((a,b)=> String(a.fecha).localeCompare(String(b.fecha)) || String(a.id).localeCompare(String(b.id)));
}
/* el costo real de lo que hay en este momento */
function costoProm(gid){
  const cs=capasDe(gid);
  const q=round(sum(cs,c=>Number(c.restante)||0),4);
  if(q<=0.000001) return 0;
  return round(sum(cs,c=>(Number(c.restante)||0)*(Number(c.costoUnit)||0))/q,6);
}
const costoPeps=costoProm;                       // compatibilidad con lo ya escrito
/* deja todas las capas del ingrediente al mismo costo: el promedio vigente.
   Se llama cada vez que entra mercancía o se corrige una entrada. */
function nivelarCosto(gid,menosCant,menosValor){
  const cs=capasDe(gid);
  if(!cs.length) return 0;
  let q=round(sum(cs,c=>Number(c.restante)||0)-(Number(menosCant)||0),4);
  let v=round(sum(cs,c=>(Number(c.restante)||0)*(Number(c.costoUnit)||0))-(Number(menosValor)||0),4);
  if(q<=0.000001) return 0;
  if(v<0) v=0;
  const avg=round(v/q,6);
  cs.forEach(c=>{ if(round(Number(c.costoUnit)||0,6)!==avg){ c.costoUnit=avg; put('capas',c); } });
  return avg;
}
/* deja el costo del ingrediente igual al promedio de sus capas */
function refrescarCosto(gid){
  const g=byId('ingredientes',gid); if(!g) return 0;
  const c=costoProm(gid)||ultimoCosto(gid);
  if(round(Number(g.costo)||0,4)!==round(c,4)){ g.costo=round(c,4); put('ingredientes',g); }
  return round(c,4);
}
function ultimoCosto(gid){
  const act=capasDe(gid)[0]; if(act) return Number(act.costoUnit)||0;
  /* sin existencias: vale lo que costó la última entrada */
  const todas=S.capas.filter(c=>c.ingredienteId===gid);
  if(todas.length){ todas.sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
    return Number(todas[0].costoUnit)||0; }
  const g=byId('ingredientes',gid); return g? (Number(g.costo)||0) : 0;
}
function valorInv(gid){ return round(sum(capasDe(gid),c=>c.restante*c.costoUnit),2); }
function valorInvTotal(){ return round(sum(S.ingredientes,g=>valorInv(g.id)),2); }

function nuevaCapa(gid,cantidad,costoUnit,refTipo,refId,fecha){
  const cu=round(Number(costoUnit)||0,4);
  /* si la última capa es del mismo documento y al mismo costo, se suma ahí
     en vez de crear otra: una venta de 10 platos no deja 10 capitas */
  if(refTipo && refId){
    const ult=S.capas.filter(x=>x.ingredienteId===gid && x.refTipo===refTipo && x.refId===refId
      && round(Number(x.costoBase!=null? x.costoBase : x.costoUnit)||0,4)===cu).pop();
    if(ult){ ult.cantidad=round((Number(ult.cantidad)||0)+cantidad,4);
      ult.restante=round((Number(ult.restante)||0)+cantidad,4);
      if(ult.costoBase==null) ult.costoBase=cu;
      put('capas',ult); return ult; }
  }
  const c={id:uid('cp'),ingredienteId:gid,fecha:fecha||now(),
    cantidad:round(cantidad,4), restante:round(cantidad,4),
    costoUnit:cu, costoBase:cu, refTipo:refTipo||'', refId:refId||''};
  put('capas',c); return c;
}
function consumirPeps(gid,cantidad,refTipo,refId){
  let falta=round(Number(cantidad)||0,4), costo=0;
  const capas=capasDe(gid);
  for(let i=0;i<capas.length && falta>0.000001;i++){
    const c=capas[i];
    const toma=Math.min(Number(c.restante)||0, falta);
    c.restante=round(c.restante-toma,4); put('capas',c);
    costo+=toma*(Number(c.costoUnit)||0);
    falta=round(falta-toma,4);
  }
  if(falta>0.000001) costo+=falta*ultimoCosto(gid);   // se vendió más de lo que había
  return round(costo,2);
}

function movInv(ingredienteId,tipo,cantidad,costoUnit,refTipo,refId,nota){
  const g=byId('ingredientes',ingredienteId); if(!g) return null;
  const c=round(Number(cantidad)||0,4);
  const antes=round(Number(g.stock)||0,4);
  let delta=0, costoMov=0;
  if(tipo==='entrada'){
    const cu=(costoUnit===null||costoUnit===undefined||costoUnit==='')? ultimoCosto(ingredienteId) : Number(costoUnit)||0;
    nuevaCapa(ingredienteId,c,cu,refTipo,refId,null);
    nivelarCosto(ingredienteId);             // lo que había + lo que entró = nuevo promedio
    delta=c; costoMov=round(c*cu,2);
  } else if(tipo==='salida'){
    costoMov=consumirPeps(ingredienteId,c,refTipo,refId); delta=-c;
  } else {                                   // ajuste: c es el conteo real
    delta=round(c-antes,4);
    if(delta>0){ const cu=costoProm(ingredienteId)||ultimoCosto(ingredienteId);
      nuevaCapa(ingredienteId,delta,cu,refTipo,refId); nivelarCosto(ingredienteId);
      costoMov=round(delta*cu,2); }
    else if(delta<0){ costoMov=consumirPeps(ingredienteId,-delta,refTipo,refId); }
  }
  g.stock=round(antes+delta,4);
  g.costo=round(costoProm(ingredienteId)||ultimoCosto(ingredienteId),4);
  put('ingredientes',g);
  const m={id:uid('mi'),fecha:now(),ingredienteId:ingredienteId,tipo:tipo,
    cantidad:round(delta,4), costoTotal:round(costoMov,2),
    costoUnit: Math.abs(delta)>0.000001? round(costoMov/Math.abs(delta),4):0,
    saldo:g.stock, refTipo:refTipo||'', refId:refId||'', nota:nota||'',
    usuarioId:S.user?S.user.id:''};
  put('movinv',m);
  m.costoMov=round(costoMov,2);
  return m;
}

/* consume la receta de cada línea y devuelve el costo REAL de esa venta */
function consumirItems(items,refTipo,refId){
  const consumo=[]; let total=0;
  items.forEach(it=>{
    const p=byId('productos',it.productoId);
    let costoIt=0;
    if(p && p.receta && p.receta.length){
      p.receta.forEach(r=>{
        const q=round((Number(r.cantidad)||0)*it.cant,4); if(!q) return;
        const m=movInv(r.ingredienteId,'salida',q,null,refTypeSafe(refTipo),refId,'Consumo por venta');
        const cm=m? (m.costoMov||0):0;
        costoIt+=cm;
        consumo.push({ingredienteId:r.ingredienteId,cantidad:q,costo:round(cm,2)});
      });
    } else { costoIt=(Number(p&&p.costoManual)||0)*it.cant; }
    it.costoTotal=round(costoIt,2);
    it.costo=round(costoIt/(it.cant||1),4);
    total+=costoIt;
  });
  return {total:round(total,2), consumo:consumo};
}
function refTypeSafe(t){ return t||'venta'; }

/* devuelve al inventario lo consumido por una venta anulada, a su mismo costo */
function reponerVenta(v){
  (v.consumo||[]).forEach(x=>{
    const cu = x.cantidad? round(x.costo/x.cantidad,4) : ultimoCosto(x.ingredienteId);
    const g=byId('ingredientes',x.ingredienteId); if(!g) return;
    /* lo devuelto vuelve al frente de la fila: es lo primero que saldrá */
    const prim=capasDe(x.ingredienteId)[0];
    const fecha=new Date((prim? new Date(prim.fecha).getTime() : Date.now())-1000).toISOString();
    nuevaCapa(x.ingredienteId,x.cantidad,cu,'venta-anulada',v.id,fecha);
    nivelarCosto(x.ingredienteId);
    g.stock=round((Number(g.stock)||0)+x.cantidad,4);
    g.costo=round(costoProm(x.ingredienteId)||ultimoCosto(x.ingredienteId),4);
    put('ingredientes',g);
    put('movinv',{id:uid('mi'),fecha:now(),ingredienteId:x.ingredienteId,tipo:'entrada',
      cantidad:round(x.cantidad,4),costoTotal:round(x.costo,2),costoUnit:cu,saldo:g.stock,
      refTipo:'venta-anulada',refId:v.id,nota:'Reversión por anulación',usuarioId:S.user?S.user.id:''});
  });
}

/* Crea la capa inicial de los ingredientes que venían de antes y deja todo
   al costo promedio: es la migración desde el costeo anterior. */
function migrarAPeps(){
  S.ingredientes.forEach(g=>{
    const st=Number(g.stock)||0;
    if(st>0.000001 && !S.capas.some(c=>c.ingredienteId===g.id))
      nuevaCapa(g.id,st,Number(g.costo)||0,'inicial','','');
  });
  S.ingredientes.forEach(g=>{
    S.capas.filter(c=>c.ingredienteId===g.id && c.costoBase==null)
      .forEach(c=>{ c.costoBase=Number(c.costoUnit)||0; put('capas',c); });
    nivelarCosto(g.id);
    refrescarCosto(g.id);
  });
}

/* ---- tesorería ---- */
function movTes(cuentaId,tipo,monto,concepto,categoria,refTipo,refId,ter){

function cuentasDeMedio(medio){

function cuentaDeMedio(medio){

function opcionesCuenta(medio,sel){

/* Las categorías de gasto las va creando el negocio: parqueadero, domicilio,
   verduras, lo que sea. Así la contabilidad saca el detalle real. */
const CATS_BASE=['nómina','arriendo','servicios','impuestos','domicilios','transporte',
  'parqueadero','aseo y limpieza','mantenimiento','publicidad','gas','desechables','retiro','otros'];
const CATS_OCULTAS=['ventas','compras','proveedores','traslado','anulacion','venta','cartera',
  'caja-manual','ajuste de caja','prestamos','obligaciones'];
function categoriasGasto(){
  const set={};
  CATS_BASE.forEach(c=>set[normTxt(c)]=c);
  (S.cfg.catsGasto||[]).forEach(c=>{ if(c) set[normTxt(c)]=c; });
  S.movimientos.forEach(m=>{ const c=m.categoria;
    if(c && CATS_OCULTAS.indexOf(c)<0 && !set[normTxt(c)]) set[normTxt(c)]=c; });
  return Object.keys(set).sort((a,b)=>a.localeCompare(b)).map(k=>({id:set[k],nombre:set[k]}));
}
function crearCategoriaGasto(nombre){
  const n=String(nombre||'').trim(); if(!n) return null;
  const ya=categoriasGasto().find(c=>normTxt(c.nombre)===normTxt(n));
  if(ya) return ya.id;
  S.cfg.catsGasto=(S.cfg.catsGasto||[]).concat([n]); saveCfg();
  return n;
}
const CREAR_CATGASTO={nota:'Queda guardada para la próxima vez y sale en la contabilidad',
  fn:crearCategoriaGasto, lista:()=>categoriasGasto()};
/* Un anticipo o un préstamo no es un gasto: es plata que se debe cobrar o pagar */
function esCategoriaCartera(cat){
  const n=normTxt(cat||'');
  return n.indexOf('anticipo')>=0 || n.indexOf('prestamo')>=0;
}
const MEDIOS=[{k:'efectivo',n:'Efectivo',e:'💵'},{k:'tarjeta',n:'Tarjeta',e:'💳'},
  {k:'transferencia',n:'Transferencia',e:'📲'},{k:'credito',n:'Crédito',e:'🧾'}];

/* ---- cartera ---- */
function abonadoDe(docId){ return round(sum(S.abonos.filter(a=>a.docId===docId),a=>a.monto),2); }
/* Lo que se pagó en el mismo momento de registrar el documento. Una compra
   o una venta de contado NO deja saldo: ya salió (o entró) la plata. Solo lo
   que quedó a crédito va a cartera. */
function pagadoAlRegistrar(d){ return round(sum((d&&d.pagos)||[],p=>p.monto),2); }
function saldoVenta(v){
  if(!v || !v.credito) return 0;
  return round((v.total||0)-pagadoAlRegistrar(v)-abonadoDe(v.id),2);
}
function saldoCompra(c){
  if(!c || !c.credito) return 0;
  return round((c.total||0)-abonadoDe(c.id),2);
}
/* pagos que se registraron por error sobre un documento que ya estaba pagado */
function pagosDobles(d){
  if(!d || d.credito) return [];
  return S.abonos.filter(a=>a.docId===d.id);
}
function saldoDoc(d){ return round((d.total||0)-abonadoDe(d.id),2); }
function docCartera(id){ return byId('ventas',id)||byId('compras',id)||byId('otrosdocs',id); }
function coleccionDoc(d){ return d.esOtro? 'otrosdocs' : (d.proveedorId!==undefined? 'compras':'ventas'); }
function terceroDoc(d){
  if(!d) return '—';
  if(d.esOtro) return d.terceroNombre||'—';
  if(d.proveedorId!==undefined) return nameOf('proveedores',d.proveedorId);
  return d.clienteId? nameOf('clientes',d.clienteId):'—';
}
function otrosCartera(tipo){ return S.otrosdocs.filter(d=>d.tipo===tipo && d.estado!=='anulado' && saldoDoc(d)>0.5); }
function cxc(){ return S.ventas.filter(v=>v.estado!=='anulada'&&v.credito&&saldoVenta(v)>0.5).concat(otrosCartera('cxc')); }
function cxp(){ return S.compras.filter(c=>c.estado!=='anulada'&&c.credito&&saldoCompra(c)>0.5).concat(otrosCartera('cxp')); }
function saldoCliente(id){ return round(sum(cxc().filter(v=>v.clienteId===id),saldoDoc),2); }
function diasVencido(doc){ if(!doc.vence) return 0; const d=Math.floor((Date.now()-new Date(doc.vence+'T23:59:59').getTime())/86400000); return d>0?d:0; }

/* ---- turnos ---- */
function turnoAbierto(){
  const mios=S.turnos.filter(t=>t.estado==='abierto');
  if(!mios.length) return null;
  if(S.user){ const m=mios.find(t=>t.usuarioId===S.user.id); if(m) return m; }
  return mios[0];
}
function ventasDeTurno(id){ return S.ventas.filter(v=>v.turnoId===id && v.estado!=='anulada'); }
/* el arqueo es SOLO de efectivo; lo de bancos queda aparte para cuadrarlo después */
function detalleTurno(t){
  if(!t) return null;
  const vs=ventasDeTurno(t.id);
  const porMedio={};
  vs.forEach(v=>{
    if(v.credito) porMedio.credito=(porMedio.credito||0)+round((v.total||0)-sum(v.pagos||[],p=>p.monto),2);
    (v.pagos||[]).forEach(p=>{ porMedio[p.medio]=(porMedio[p.medio]||0)+p.monto; });
  });
  const movs=S.movimientos.filter(m=>m.turnoId===t.id);
  const enCaja=m=>{ const c=byId('cuentas',m.cuentaId);
    return c && c.tipo==='caja' && (!t.cuentaId || m.cuentaId===t.cuentaId); };
  const cm=movs.filter(enCaja);
  const ventaEfe=sum(cm.filter(m=>m.tipo==='ingreso' && m.refTipo==='venta'),m=>m.monto);
  const otrosIng=sum(cm.filter(m=>m.tipo==='ingreso' && m.refTipo!=='venta'),m=>m.monto);
  const salidas =sum(cm.filter(m=>m.tipo==='egreso'),m=>m.monto);
  const esperado=round((Number(t.base)||0)+ventaEfe+otrosIng-salidas,2);
  const bancos={};
  movs.filter(m=>{const c=byId('cuentas',m.cuentaId);return c&&c.tipo!=='caja';}).forEach(m=>{
    bancos[m.cuentaId]=bancos[m.cuentaId]||{nombre:nameOf('cuentas',m.cuentaId),ing:0,egr:0};
    if(m.tipo==='ingreso') bancos[m.cuentaId].ing+=m.monto; else bancos[m.cuentaId].egr+=m.monto;
  });
  return {vs,porMedio,ventaEfe,otrosIng,salidas,esperado,
    bancos:Object.values(bancos), totalVentas:sum(vs,v=>v.total||0)};
}
function cajasDisponibles(){ return S.cuentas.filter(c=>c.activo!==false && c.tipo==='caja'); }
function efectivoTurno(id){          // entradas y salidas de la caja de ese turno
  const t=byId('turnos',id);
  let e=0;
  S.movimientos.forEach(m=>{
    if(m.turnoId!==id) return;
    const c=byId('cuentas',m.cuentaId);
    if(!c || c.tipo!=='caja') return;
    if(t && t.cuentaId && m.cuentaId!==t.cuentaId) return;   // solo la caja del turno
    e += m.tipo==='ingreso'? m.monto : -m.monto;
  });
  return round(e,2);
}

/* ---- control de caja: cerrada no entra ni sale plata ---- */
function esCuentaCaja(id){ const c=byId('cuentas',id); return !!(c && c.tipo==='caja'); }
/* un turno viejo sin caja asignada cubre cualquier caja (compatibilidad) */
function turnoDeCaja(id){ return S.turnos.find(t=>t.estado==='abierto' && (t.cuentaId===id || !t.cuentaId))||null; }
function cajaCerrada(id){ return esCuentaCaja(id) && !turnoDeCaja(id); }
function saldoCierreAnterior(id){ return saldoCuenta(id); }
let _soporteCaja='';
/* con soporte ya dado no se vuelve a preguntar (evita repetir el aviso) */
function bloqueaCaja(id){ return !_soporteCaja && cajaCerrada(id); }
/* Corre fn solo si esa cuenta admite movimiento. Si la caja está cerrada,
   el admin puede hacerlo pero tiene que decir con qué recibo. */
function conCaja(cuentaId,fn,texto){
  if(!bloqueaCaja(cuentaId)) return fn();
  if(!puedeEditar()){
    toast('La caja está cerrada y ya quedó cuadrada. Para mover efectivo pídele al administrador que la abra.','warn',6000);
    return; }
  mSoporteCaja(cuentaId,texto,sop=>{ _soporteCaja=sop; try{ fn(); } finally { _soporteCaja=''; } });
}
function mSoporteCaja(cuentaId,texto,cb){
  modal({title:'La caja está cerrada',size:'slim',
    body:'<div class="card" style="background:var(--warn-soft);margin-bottom:12px"><div class="bd">'+
      '<b>🔒 '+esc(nameOf('cuentas',cuentaId))+'</b> ya se cerró y quedó cuadrada.<br>'+
      '<span class="tiny">Con la caja cerrada no debería entrar ni salir plata. Solo se registra si hay un '+
      '<b>recibo o soporte</b> que lo respalde; el movimiento queda marcado como <b>fuera de turno</b> '+
      'y le aparece en la próxima apertura.</span></div></div>'+
      (texto? '<div class="tline"><span>Movimiento</span><span class="v">'+esc(texto)+'</span></div>':'')+
      '<div class="f" style="margin-top:10px"><label>N° de recibo o soporte *</label>'+
        '<input id="sp" placeholder="Recibo 0012, factura 4451, consignación…" autocomplete="off"></div>'+
      '<div class="f" style="margin-top:8px"><label>Motivo</label>'+
        '<input id="mo" placeholder="Por qué se registra con la caja cerrada"></div>',
    footer:'<button class="btn" data-x>Cancelar</button>'+
      '<button class="btn danger" id="ok">Registrar con soporte</button>',
    onOpen:m=>{ $('#ok',m).onclick=()=>{
      const sp=$('#sp',m).value.trim();
      if(!sp) return toast('Escribe el número del recibo o soporte','warn');
      const mo=$('#mo',m).value.trim();
      closeModal(); cb(sp+(mo? ' · '+mo : '')); }; }});
}
function movsFueraDeTurno(cuentaId){
  const ult=S.turnos.filter(t=>t.cuentaId===cuentaId&&t.estado==='cerrado'&&t.cierre)
    .sort((a,b)=>String(b.cierre).localeCompare(String(a.cierre)))[0];
  const desde=ult? ult.cierre : '';
  return S.movimientos.filter(m=>m.cuentaId===cuentaId && m.fueraTurno && (!desde||String(m.fecha)>desde))
    .sort((a,b)=>String(a.fecha).localeCompare(String(b.fecha)));
}

/* ======================= EXPORTAR A EXCEL (.xlsx) =====================
   Escribe un xlsx de verdad (no un CSV disfrazado): arma el ZIP y las
   partes XML a mano, sin librerías ni internet. Excel lo abre limpio,
   con encabezados en negrita y los números como números.
   ==================================================================== */
const _crcTabla=(function(){
  const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n;
    for(let k=0;k<8;k++) c = (c&1)? (0xEDB88320^(c>>>1)) : (c>>>1);
    t[n]=c>>>0; }
  return t;
})();
function crc32(buf){
  let c=0xFFFFFFFF;
  for(let i=0;i<buf.length;i++) c=_crcTabla[(c^buf[i])&0xFF]^(c>>>8);
  return (c^0xFFFFFFFF)>>>0;
}
function zipCrear(archivos){                    // [{nombre, datos:Uint8Array}]
  const partes=[], central=[];
  let offset=0;
  const u16=n=>[n&0xFF,(n>>8)&0xFF];
  const u32=n=>[n&0xFF,(n>>8)&0xFF,(n>>16)&0xFF,(n>>24)&0xFF];
  const enc=new TextEncoder();
  archivos.forEach(f=>{
    const nom=enc.encode(f.nombre), dat=f.datos, crc=crc32(dat);
    const local=[].concat([0x50,0x4b,0x03,0x04],u16(20),u16(0),u16(0),u16(0),u16(0),
      u32(crc),u32(dat.length),u32(dat.length),u16(nom.length),u16(0));
    partes.push(new Uint8Array(local),nom,dat);
    central.push([].concat([0x50,0x4b,0x01,0x02],u16(20),u16(20),u16(0),u16(0),u16(0),u16(0),
      u32(crc),u32(dat.length),u32(dat.length),u16(nom.length),u16(0),u16(0),u16(0),u16(0),
      u32(0),u32(offset)), nom);
    offset += local.length + nom.length + dat.length;
  });
  const cd=[]; let cdLen=0;
  for(let i=0;i<central.length;i+=2){
    const a=new Uint8Array(central[i]), b=central[i+1];
    cd.push(a,b); cdLen += a.length + b.length;
  }
  const fin=new Uint8Array([].concat([0x50,0x4b,0x05,0x06],u16(0),u16(0),
    u16(archivos.length),u16(archivos.length),u32(cdLen),u32(offset),u16(0)));
  const todo=[].concat(partes,cd,[fin]);
  let total=0; todo.forEach(x=>total+=x.length);
  const out=new Uint8Array(total); let p=0;
  todo.forEach(x=>{ out.set(x,p); p+=x.length; });
  return out;
}
function xmlEsc(v){ return String(v==null?'':v)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
  .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,''); }
function colLetra(n){ let s=''; n++; while(n>0){ const r=(n-1)%26; s=String.fromCharCode(65+r)+s; n=(n-(r+1))/26; } return s; }

/* hojas = [{nombre, filas:[[celda,...]], anchos:[n,...]}]

    }

      x+='<row r="'+(fi+1)+'">';

        const ref=colLetra(ci)+(fi+1);
        const o=(typeof cel==='object')? cel : {v:cel};

        const est = o.t==='titulo'?3 : o.b?1 : (esNum?2:0);
        if(esNum) x+='<c r="'+ref+'" s="'+est+'"><v>'+(Number(o.v)||0)+'</v></c>';
        else x+='<c r="'+ref+'" s="'+est+'" t="inlineStr"><is><t xml:space="preserve">'+xmlEsc(o.v)+'</t></is></c>';
      });

      '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'+

      '</Types>'},
    {nombre:'_rels/.rels', datos:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      '<Relationship Id="rId1" Type="'+R+'/officeDocument" Target="xl/workbook.xml"/></Relationships>'},
    {nombre:'xl/workbook.xml', datos:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<workbook xmlns="'+T+'" xmlns:r="'+R+'"><sheets>'+
      hojas.map((h,i)=>'<sheet name="'+xmlEsc((h.nombre||('Hoja'+(i+1))).slice(0,31).replace(/[\\\/\?\*\[\]:]/g,' '))+
        '" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+'</sheets></workbook>'},
    {nombre:'xl/_rels/workbook.xml.rels', datos:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+
      hojas.map((h,i)=>'<Relationship Id="rId'+(i+1)+'" Type="'+R+'/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')+
      '<Relationship Id="rIdS" Type="'+R+'/styles" Target="styles.xml"/></Relationships>'},
    {nombre:'xl/styles.xml', datos:'<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
      '<styleSheet xmlns="'+T+'">'+
      '<numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0"/></numFmts>'+
      '<fonts count="3">'+
      '<font><sz val="11"/><color theme="1"/><name val="Calibri"/></font>'+

      '<font><b/><sz val="14"/><color theme="1"/><name val="Calibri"/></font></fonts>'+
      '<fills count="3"><fill><patternFill patternType="none"/></fill>'+

      '<fill><patternFill patternType="solid"><fgColor rgb="FFEFEFEF"/><bgColor indexed="64"/></patternFill></fill></fills>'+
      '<borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders>'+
