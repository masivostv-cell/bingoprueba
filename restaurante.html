/* un solo botón: prueba la cuenta local y, si no, la de la nube */
async function ingresar(){
  const em=norm($('#lg_mail').value), pw=$('#lg_pass').value;
  if(!em||!pw) return lgError('Escribe tu correo y tu clave');
  lgError(''); const b=$('#lg_in'); b.disabled=true; b.textContent='Entrando…';
  const terminar=()=>{ b.disabled=false; b.textContent='Entrar'; };
  try{
    const local=usuarioPorCorreo(em);

    /* la cuenta del restaurante entra al instante y sirve sin internet;
       la nube se revisa detrás, sin hacer esperar a nadie */
    if(local && await claveOk(local,pw)){
      login(local); terminar();
      if(S.cfg.fbOn && navigator.onLine) verificarEnSegundoPlano();
      return;
    }
    /* cuenta de la nube: superadmin o administrador del restaurante */
    if(S.cfg.fbOn && S.cfg.fbApiKey){
      try{
        await fbLogin(em,pw,false);
        const pf=await resolverPerfil();
        if(pf.rol==='superadmin'){ paintLogin(); loginSuper(); terminar(); return; }
        /* la mensualidad manda: se revisa antes de dejar entrar */
        let ficha=null;
        try{ ficha=await fbGet('negocios/'+pf.negocioId); }catch(e){}
        S.suscripcion=ficha||null;
        if(ficha && !vigente(ficha)){ paintLogin(); mBloqueo(ficha); return terminar(); }
        const cambio = pf.negocioId && S.cfg.fbNegocio!==pf.negocioId;
        if(cambio || !S.meta.pull || !Object.keys(S.meta.pull).length) await entrarANegocio(pf.negocioId,null);
        else await pullCloud();
        /* deja su acceso guardado en el local para que después entre sin internet */
        let u=usuarioPorCorreo(em);
        if(!u){ u={id:uid('u'),nombre:pf.nombre||em,email:em,rol:'admin',activo:true}; }
        u.rol='admin'; u.activo=true;
        await fijarClave(u,pw); put('usuarios',u);
        paintLogin(); login(u); terminar(); return;
      }catch(e){
        const m=String(e.message||e);
        if(m==='SIN_PERFIL'){ fbSalir(); lgError('Esta cuenta no tiene restaurante asignado. Pídeselo al superadministrador.'); return terminar(); }
        if(m==='CUENTA_INACTIVA'){ fbSalir(); lgError('Esta cuenta está desactivada.'); return terminar(); }
        fbSalir();
        /* sin internet o credencial de nube equivocada: intenta la cuenta local */
        if(local && await claveOk(local,pw)){ login(local); terminar(); return; }
        if(/EMAIL_NOT_FOUND|INVALID_PASSWORD|INVALID_LOGIN/.test(m)){ lgSacudir(); lgError('Correo o clave incorrectos'); return terminar(); }
        lgError(fbErr(e)); return terminar();
      }
    }
    /* equipo sin nube: solo cuentas locales */
    if(local && await claveOk(local,pw)){ login(local); terminar(); return; }
    lgSacudir(); lgError(S.usuarios.length? 'Correo o clave incorrectos' : 'Este equipo todavía no está configurado');
  }catch(e){ lgError(fbErr(e)); }
  terminar();
}

      (S.ventas.length? '<button class="btn blk" id="bl_bk">⬇️ Descargar un respaldo de mis datos</button>':'')+

async function verificarEnSegundoPlano(){

    if(S.cfg.fbNegocio){

  else toast(S.outbox.length? S.outbox.length+' cambios en cola':(S.cfg.fbOn?'Todo sincronizado':'Modo local')); };
$('#btntheme').onclick=()=>{ S.cfg.tema = S.cfg.tema==='dark'?'light':'dark'; saveCfg(); };

function applyCfg(){
  document.documentElement.setAttribute('data-theme', S.cfg.tema==='dark'?'dark':'light');
  $('#btntheme').textContent = S.cfg.tema==='dark'?'☀️':'🌙';
  $('#bizname').textContent = S.cfg.nombre||'Mi Restaurante';
  document.title = (S.cfg.nombre||'POS')+' · Punto de venta';
  const u=urlImg('logo');
  const cont=$('.brand'), viejo=$('.brand .logo, .brand .logoimg');
  if(viejo){ const nuevo=u? '<img class="logoimg" src="'+u+'" alt="">' : '<div class="logo">🍽️</div>';
    viejo.outerHTML=nuevo; }
  const lg=$('#login .logo, #login .logoimg');
  if(lg) lg.outerHTML = u? '<img class="logoimg" src="'+u+'" alt="">' : '<div class="logo">🍽️</div>';
}

/* ================================ BOOT ================================ */
async function boot(){
  await openDB();
  const cfgRows=await idbAll('config');
  S.cfg=Object.assign({},DEFCFG,cfgRows[0]||{});
  const metaRows=await idbAll('meta'); S.meta=metaRows[0]||{id:'meta',cons:{}};
  await Promise.all(COLL.concat(['outbox']).map(async k=>{ S[k]=await idbAll(k); }));
  S.turno=turnoAbierto();
  cargarPerfilLocal();
  migrarAPeps();
  applyCfg(); paintSync(); pintarPrueba(); paintLogin();
  if(S.cfg.prueba) toast('🧪 Este equipo sigue en modo prueba con «'+
    (S.cfg.prueba.origen||'un respaldo')+'». Nada se guarda en la nube.','warn',8000);

  let last=null; try{ last=localStorage.getItem('pos_user'); }catch(e){}
  const u=last? byId('usuarios',last):null;
  if(u && u.activo) login(u);
  else if(hayLegado()) setTimeout(mRecuperarAcceso,500);

  if(S.cfg.fbOn && leerSesionFB()){
    fbRestaurarSesion().then(async ok=>{
      paintSync();
      if(!ok){ paintLogin(); return; }
      try{ await resolverPerfil(); }catch(e){
        const m=String(e.message||e);
        if(m==='SIN_PERFIL'||m==='CUENTA_INACTIVA'){ salirDeLaNube();
          toast('Tu cuenta ya no tiene acceso a un restaurante','bad',6000); return; }
      }
      paintLogin();
      if(!S.user && esSuper() && !S.usuarios.length) loginSuper();
      pullCloud();
      if(S.cfg.autoSync && S.outbox.length) scheduleSync(2000);
    });
  }
  if(MODE==='mem') toast('El navegador bloqueó el almacenamiento: los datos se perderán al cerrar','warn',6000);
}
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT') return;
  if(!S.user) return;
  if(e.key==='F2'){ e.preventDefault(); go('pos'); }
  if(e.key==='F3'){ e.preventDefault(); go('mesas'); }
  if(e.key==='F4' && S.view==='pos'){ e.preventDefault(); mCobrar(); }
});
boot();
</script>

<script type="text/plain" id="fsrules">
rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {

    function conCuenta() {
      return request.auth != null && request.auth.token.email != null;
    }
    function esSuper() {
      return conCuenta() && request.auth.token.email.lower() == 'jorgemanuelp92@hotmail.com';
    }
    function perfil() {
      return get(/databases/$(database)/documents/usuariosNube/$(request.auth.uid));
    }
    function ficha(negocioId) {
      return get(/databases/$(database)/documents/negocios/$(negocioId));
    }
    // pertenece al restaurante y su cuenta esta habilitada
    function miembroDe(negocioId) {
      return conCuenta()
             && perfil() != null
             && perfil().data.activo == true
             && perfil().data.negocioId == negocioId;
    }
    // ademas, la mensualidad esta al dia
    function alDia(negocioId) {
      return ficha(negocioId) != null
             && ficha(negocioId).data.activo == true
             && ficha(negocioId).data.venceMs > request.time.toMillis();
    }

    // administrador de su propio restaurante
    function soyAdminDe(negocioId) {
      return conCuenta()
             && perfil() != null
             && perfil().data.activo == true
             && perfil().data.negocioId == negocioId
             && perfil().data.rol == 'admin';
    }

    // Directorio de cuentas. Cada quien lee la suya. El superadmin manda, y el
    // administrador de un restaurante puede dar de alta a SU personal (nunca a
    // otro restaurante y nunca como superadmin).
    match /usuariosNube/{uid} {
      allow get:    if conCuenta() && (request.auth.uid == uid || esSuper()
                       || soyAdminDe(resource.data.negocioId));
      allow list:   if esSuper();
      allow create: if esSuper()
                       || (soyAdminDe(request.resource.data.negocioId)
                           && request.resource.data.rol in ['admin','cajero','mesero']);
      allow update: if esSuper()
                       || (soyAdminDe(resource.data.negocioId)
                           && request.resource.data.negocioId == resource.data.negocioId
                           && request.resource.data.rol in ['admin','cajero','mesero']);
      allow delete: if esSuper();
    }

    // Ficha y suscripcion del restaurante: solo el superadmin la modifica.
    match /negocios/{negocioId} {
      allow get:   if esSuper() || miembroDe(negocioId);
      allow list:  if esSuper();
      allow write: if esSuper();
    }

    // Operacion del restaurante. Vencido o suspendido: puede consultar y
    // sacar su respaldo, pero no registrar nada nuevo.
    match /negocios/{negocioId}/{coleccion}/{documento} {
      allow read:  if esSuper() || miembroDe(negocioId);
      allow write: if esSuper() || (miembroDe(negocioId) && alDia(negocioId));
    }

    // Todo lo demas, cerrado.
    match /{document=**} {
      allow read, write: if false;
    }
  }
}
</script>
