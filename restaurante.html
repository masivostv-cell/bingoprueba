          {nombre:'Saldos pendientes',filas:pend,anchos:[12,13,11,24,24,11,13,13,13,13]}]);
      };
      return;
    }
    const esC=tab==='cxc';
    const docs=(esC?cxc():cxp()).slice().sort((a,b)=>(a.vence||'').localeCompare(b.vence||''));
    const nota='<div class="hintx" style="margin-bottom:12px">'+
      (esC? 'Lo que <b>te deben</b> y todavía no ha entrado. Cuando cobras, la plata aparece en Tesorería como ingreso.'
          : 'Lo que <b>debes</b> y todavía no ha salido. Cuando pagas, la plata sale de Tesorería como egreso.')+'</div>';
    const saldoF=saldoDoc;
    const total=sum(docs,saldoF);
    const venc=docs.filter(d=>diasVencido(d)>0);
    const buckets=[[0,0,'Al día'],[1,30,'1-30 días'],[31,60,'31-60'],[61,9999,'+60']];
    const bs=buckets.map(b=>{ const l=docs.filter(d=>{const v=diasVencido(d);return b[0]===0? v===0 : (v>=b[0]&&v<=b[1]);});
      return {n:b[2],v:sum(l,saldoF),c:l.length}; });
    $('#cbody').innerHTML= nota+
      '<div class="kpis" style="margin-bottom:14px">'+
        kpi(esC?'Total por cobrar':'Total por pagar',money(total),docs.length+' documentos',esC?'brand':'bad')+
        kpi('Vencido',money(sum(venc,saldoF)),venc.length+' documentos',venc.length?'bad':'ok')+
        bs.slice(1).map(b=>kpi(b.n,money(b.v),b.c+' doc.','')).join('')+
      '</div>'+
      '<div class="card"><div class="bd p0">'+tbl([
        {t:'Documento',f:d=>'<b>'+esc(d.no)+'</b>'+(d.esOtro?' <span class="pill info">otro</span>':'')},
        {t:'Fecha',f:d=>fdate(d.fecha)},
        {t:esC?'Cliente / tercero':'Proveedor / tercero',
          f:d=>'<b>'+esc(terceroDoc(d))+'</b>'+(d.esOtro? '<div class="tiny muted">'+esc(d.concepto||'')+'</div>':'')},
        {t:'Vence',f:d=>{const v=diasVencido(d);
          return esc(d.vence||'—')+(v>0?' <span class="pill bad">'+v+'d</span>':'');}},
        {t:'Total',num:1,f:d=>money(d.total)},
        {t:'Abonado',num:1,f:d=>money(abonadoDe(d.id))},
        {t:'Saldo',num:1,f:d=>'<b>'+money(saldoF(d))+'</b>'},
        {t:'',f:d=>'<div class="row" style="gap:3px"><button class="btn ok sm" data-p="'+d.id+'">'+(esC?'Cobrar':'Pagar')+'</button>'+
          (d.esOtro? '<button class="btn ghost sm" data-rd="'+d.id+'" title="Reimprimir">🖨️</button>':'')+'</div>'}
      ],docs,{empty:esC?'No hay cuentas por cobrar':'No hay cuentas por pagar',icon:'✅'})+'</div></div>';
    $$('[data-p]',$('#view')).forEach(b=>b.onclick=()=>mAbono(esC?'cxc':'cxp', docCartera(b.dataset.p)));
    $$('[data-rd]',$('#view')).forEach(b=>b.onclick=()=>{ comprobanteOtro(byId('otrosdocs',b.dataset.rd),true);
      toast('Enviado a impresión','ok'); });
  }
  paint();
}
/* préstamos a empleados, anticipos y cualquier deuda que no nace de una
   venta o una compra; entran a cartera como un documento más */
function edOtroDoc(tipo){
  const esC=tipo==='cxc';
  modal({title: esC? 'Nuevo documento por cobrar' : 'Nueva cuenta por pagar', size:'wide',
    body:'<p class="hintx" style="margin-top:0">'+(esC
        ? 'Para préstamos a empleados, anticipos o cualquier plata que te deban y no venga de una venta.'
        : 'Para préstamos que te hicieron u obligaciones que no vienen de una compra.')+'</p>'+
      '<div class="f" style="margin-bottom:10px"><label>'+(esC?'¿Quién te debe?':'¿A quién le debes?')+
        '</label><div id="dt"></div></div>'+
      '<div class="f" style="margin-bottom:10px"><label>Concepto</label>'+
        '<input id="dc" placeholder="'+(esC?'Préstamo quincena de octubre':'Préstamo del socio')+'"></div>'+
      '<div class="grid" style="grid-template-columns:1fr 1fr 1fr;margin-bottom:10px">'+
        '<div class="f"><label>Valor</label><input id="dv" type="number" step="any"></div>'+
        '<div class="f"><label>Fecha</label><input id="df" type="date" value="'+todayISO()+'"></div>'+
        '<div class="f"><label>Plazo (días)</label><input id="dp" type="number" value="30"></div></div>'+
      '<label class="row tiny" style="gap:7px;margin-bottom:10px"><input type="checkbox" id="dm" checked> '+
        (esC? 'El dinero sale ahora de una cuenta (le entregué la plata)'
            : 'El dinero entra ahora a una cuenta (recibí la plata)')+'</label>'+
      '<div class="grid" id="dcta" style="grid-template-columns:1fr 1.4fr;margin-bottom:10px">'+
        '<div class="f"><label>Medio</label><select id="dme">'+
          MEDIOS.filter(x=>x.k!=='credito').map(x=>'<option value="'+x.k+'">'+x.e+' '+x.n+'</option>').join('')+'</select></div>'+
        '<div class="f"><label>'+(esC?'Sale de':'Entra a')+'</label><select id="dq"></select></div></div>'+
      '<div class="f"><label>Notas</label><input id="dn" placeholder="Opcional"></div>',
    footer:'<button class="btn" data-x>Cancelar</button><button class="btn pri" id="ok">Registrar</button>',
    onOpen:m=>{
      const cbT=combo($('#dt',m),{lista:listaTerceros(), placeholder:'Buscar empleado, cliente o proveedor…',
        sub:x=>x.tipo, crear:CREAR_TERCERO});
      const pintaC=()=>{ $('#dq',m).innerHTML=opcionesCuenta($('#dme',m).value); };
      $('#dme',m).onchange=pintaC; pintaC();
      $('#dm',m).onchange=e=>$('#dcta',m).classList.toggle('hide',!e.target.checked);
      $('#ok',m).onclick=()=>{
        const tid=cbT.valor();
        if(!tid) return toast('Busca o crea el tercero','warn');
        const val=toN($('#dv',m).value);
        if(val<=0) return toast('El valor debe ser mayor que cero','warn');
        const conc=$('#dc',m).value.trim();
        if(!conc) return toast('Escribe el concepto','warn');
        const fecha=$('#df',m).value||todayISO();
        const nom=(listaTerceros().find(x=>x.id===tid)||{}).nombre||'';
        const d={id:uid('od'), no:nextNo(esC?'cxc':'cxp', esC?'PC-':'PP-'), tipo:tipo, esOtro:true,
          fecha:fecha, terceroId:tid, terceroNombre:nom, concepto:conc, total:round(val,2),
          vence:dateAdd(fecha,Math.max(0,toN($('#dp',m).value))), estado:'pendiente',
          nota:$('#dn',m).value.trim(), usuarioId:S.user?S.user.id:''};
        if($('#dm',m).checked){ d.cuentaId=$('#dq',m).value; d.medioPago=$('#dme',m).value; }
        if(d.cuentaId && bloqueaCaja(d.cuentaId))
          return conCaja(d.cuentaId,()=>$('#ok',m).click(),'Desembolso de '+money(d.total));
        put('otrosdocs',d);
        if(d.cuentaId)
          movTes(d.cuentaId, esC?'egreso':'ingreso', d.total,
            (esC?'Préstamo ':'Obligación ')+d.no+' · '+conc,
            esC?'prestamos':'obligaciones', tipo, d.id, {id:tid,nombre:nom});
        closeModal(); render();
        toast((esC?'Documento por cobrar ':'Cuenta por pagar ')+d.no+' registrado','ok');
        if(S.cfg.impTicket!==false) comprobanteOtro(d);
      };
    }});
}
function comprobanteOtro(d,copia){
  if(!d) return;
  const esC=d.tipo==='cxc';
  const h=docTicket(esC?'DOCUMENTO POR COBRAR':'CUENTA POR PAGAR',[
    ['N°', esc(d.no)],
    ['Fecha', fdate(d.fecha)],
    [esC?'Deudor':'Acreedor', esc(d.terceroNombre||'—')],
    {texto:'Concepto: '+(d.concepto||'')},
    d.nota? {texto:'Nota: '+d.nota} : null,
    {hr:1},
    {k:'VALOR', v:money(d.total), big:true},
    ['Vence', esc(d.vence||'—')],
    d.cuentaId? [esC?'Entregado desde':'Recibido en', esc(nameOf('cuentas',d.cuentaId))] : null,
    ['Abonado', money(abonadoDe(d.id))],
    {k:'SALDO', v:money(saldoDoc(d)), b:true},
    {hr:1},
    ['Registró', esc(nameOf('usuarios',d.usuarioId))],
    {firma: esC?'Firma de quien recibe el dinero':'Firma'}
  ],{copia:copia});
  abrirImpresion(h,'comprobante',S.cfg.impresoraTicket);
}
function mAbono(tipo,doc){
  if(!doc) return;
  const esC=tipo==='cxc';
  const saldo=saldoDoc(doc);
  const tercero=doc.esOtro? '' : (esC? doc.clienteId : doc.proveedorId);
  modal({title:(esC?'Cobro de ':'Pago de ')+doc.no,
    body:'<div class="card" style="background:var(--panel2);margin-bottom:14px"><div class="bd">'+
      '<div class="tline"><span>'+(esC?'Cliente':'Proveedor')+'</span><span class="v">'+esc(terceroDoc(doc))+'</span></div>'+
      (doc.concepto? '<div class="tline"><span>Concepto</span><span class="v">'+esc(doc.concepto)+'</span></div>':'')+
      '<div class="tline"><span>Total documento</span><span class="v">'+money(doc.total)+'</span></div>'+
      '<div class="tline"><span>Abonado</span><span class="v">'+money(abonadoDe(doc.id))+'</span></div>'+
      '<div class="tline big"><span>Saldo</span><span class="v">'+money(saldo)+'</span></div></div></div>'+
      '<div class="grid" style="grid-template-columns:1fr 1fr">'+
      '<div class="f"><label>Monto</label><input id="mt" type="number" step="any" value="'+saldo+'"></div>'+
      '<div class="f"><label>Medio</label><select id="me">'+MEDIOS.filter(m=>m.k!=='credito').map(m=>
        '<option value="'+m.k+'">'+m.e+' '+m.n+'</option>').join('')+'</select></div></div>'+
      '<div class="f" style="margin-top:10px"><label>Cuenta de tesorería</label><select id="ct">'+
        selOpts(S.cuentas.filter(c=>c.activo),cuentaDeMedio('efectivo'),c=>c.nombre+' · '+money(saldoCuenta(c.id)))+'</select></div>'+
      '<div class="f" style="margin-top:10px"><label>Nota</label><input id="nt" placeholder="Opcional"></div>',
    footer:'<button class="btn" data-x>Cancelar</button><button class="btn ok" id="ok">Registrar</button>',
    onOpen:m=>{
      $('#me',m).onchange=e=>{ const c=cuentaDeMedio(e.target.value); if(c) $('#ct',m).value=c; };
      $('#ok',m).onclick=()=>{
        const v=toN($('#mt',m).value);
        if(v<=0) return toast('Monto inválido','warn');
        if(v>saldo+0.5) return toast('El monto supera el saldo','warn');
        if(bloqueaCaja($('#ct',m).value))
          return conCaja($('#ct',m).value,()=>$('#ok',m).click(),(esC?'Cobro':'Pago')+' de '+money(v));
        const a={id:uid('ab'),fecha:now(),tipo:tipo,docId:doc.id,terceroId:tercero,
          terceroNombre:doc.esOtro?(doc.terceroNombre||''):'', monto:v,
          medio:$('#me',m).value,cuentaId:$('#ct',m).value,nota:$('#nt',m).value,
          usuarioId:S.user?S.user.id:'',turnoId:S.turno?S.turno.id:''};
        put('abonos',a);
        movTes(a.cuentaId, esC?'ingreso':'egreso', v,
          (esC?'Cobro ':'Pago ')+doc.no+(doc.concepto? ' · '+doc.concepto:''),
          esC?'cartera':'proveedores', tipo, doc.id,
          doc.esOtro? {id:doc.terceroId||'',nombre:doc.terceroNombre||''}
                    : terceroDe(esC?'cliente':'proveedor', tercero));
        if(saldoDoc(doc)<=0.5){ doc.estado=doc.esOtro?'pagado':'pagada'; put(coleccionDoc(doc),doc); }
        closeModal(); render(); toast('Registrado '+money(v),'ok');
        if(S.cfg.impTicket!==false) comprobanteAbono(a);
      };
    }});
}

/* ============================= TESORERÍA ============================== */
function viewTesoreria(vw){
  let tab='resumen';
  let f={desde:todayISO().slice(0,8)+'01',hasta:todayISO(),q:'',tipo:'',cuenta:'',categoria:'',tercero:''};
  topact('<button class="btn sm" id="nc">+ Cuenta</button><button class="btn pri sm" id="nm">+ Movimiento</button>');
  vw.innerHTML='<div id="ttabs"></div><div id="tbody"></div>';
  $('#ttabs').appendChild(tabsBar([['resumen','Cuentas'],['ing','Ingresos'],['egr','Egresos'],['todo','Todos los movimientos']],
    tab,t=>{ tab=t; f.tipo = t==='ing'?'ingreso' : t==='egr'?'egreso' : ''; paint(); }));
  $('#nc').onclick=()=>edCuenta(null);
  $('#nm').onclick=mMovimiento;

  function datos(){
    let ms=S.movimientos.filter(m=> dISO(m.fecha)>=f.desde && dISO(m.fecha)<=f.hasta);
    if(f.tipo) ms=ms.filter(m=>m.tipo===f.tipo);
    if(f.cuenta) ms=ms.filter(m=>m.cuentaId===f.cuenta);
    if(f.categoria) ms=ms.filter(m=>(m.categoria||'otros')===f.categoria);
    if(f.tercero) ms=ms.filter(m=>m.terceroId===f.tercero);
    if(f.q) ms=filtra(ms,f.q,[m=>m.concepto||'', m=>nombreTercero(m), m=>m.categoria||'',
      m=>nameOf('cuentas',m.cuentaId), m=>nameOf('usuarios',m.usuarioId), m=>String(m.monto)]);
    return ms.sort((a,b)=>b.fecha.localeCompare(a.fecha));
  }
  function exportar(){
    const ms=datos();
    const titulo = tab==='ing'?'Ingresos' : tab==='egr'?'Egresos' : 'Movimientos';
    const filas=[[{v:titulo+' '+f.desde+' a '+f.hasta,t:'titulo'}],[],
      ['Fecha','Hora','Tipo','Cuenta','Concepto','Tercero','Tipo tercero','Categoría','Origen','Usuario','Ingreso','Egreso'].map(x=>({v:x,b:1}))];
    ms.slice().reverse().forEach(m=>filas.push([dISO(m.fecha),ftime(m.fecha),m.tipo,nameOf('cuentas',m.cuentaId),
      m.concepto||'',nombreTercero(m),tipoTercero(m),m.categoria||'',m.refTipo||'manual',nameOf('usuarios',m.usuarioId),
      m.tipo==='ingreso'?m.monto:'', m.tipo==='egreso'?m.monto:'']));
    const i=sum(ms.filter(m=>m.tipo==='ingreso'),m=>m.monto), e=sum(ms.filter(m=>m.tipo==='egreso'),m=>m.monto);
    filas.push([]); filas.push([{v:'TOTALES',b:1},'','','','','','','','','',{v:i},{v:e}]);
    filas.push([{v:'SALDO',b:1},'','','','','','','','','',{v:round(i-e,2)}]);
    const agr={};
    ms.forEach(m=>{ const k=nombreTercero(m)||'(sin tercero)';
      agr[k]=agr[k]||{nombre:k,tipo:tipoTercero(m),n:0,ing:0,egr:0};
      agr[k].n++; if(m.tipo==='ingreso') agr[k].ing+=m.monto; else agr[k].egr+=m.monto; });
    const porT=[['Tercero','Tipo','Movimientos','Recibido','Pagado','Neto'].map(x=>({v:x,b:1}))];
    Object.values(agr).sort((a,b)=>(b.ing+b.egr)-(a.ing+a.egr)).forEach(t=>
      porT.push([t.nombre,t.tipo||'',t.n,t.ing,t.egr,round(t.ing-t.egr,2)]));
    const cta=[['Cuenta','Tipo','Saldo inicial','Ingresos','Egresos','Saldo actual'].map(x=>({v:x,b:1}))];
    S.cuentas.filter(c=>c.activo).forEach(c=>{
      const mm=ms.filter(m=>m.cuentaId===c.id);
      cta.push([c.nombre,c.tipo,c.saldoInicial||0,
        sum(mm.filter(m=>m.tipo==='ingreso'),m=>m.monto),
        sum(mm.filter(m=>m.tipo==='egreso'),m=>m.monto), saldoCuenta(c.id)]); });
    exportarExcel(titulo.toLowerCase()+'_'+f.desde+'_'+f.hasta,[
      {nombre:titulo,filas:filas,anchos:[11,8,10,20,28,22,12,14,12,16,13,13]},
      {nombre:'Por tercero',filas:porT,anchos:[26,12,13,14,14,14]},
      {nombre:'Cuentas',filas:cta,anchos:[22,10,14,14,14,14]}]);
  }
  function paint(){
    $$('#ttabs .tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
    if(tab==='resumen'){
      const cts=S.cuentas.filter(c=>c.activo);
      const hoy=todayISO(), mh=S.movimientos.filter(m=>dISO(m.fecha)===hoy);

        '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(230px,1fr))">'+

      return;
    }
    const ms=datos();
    const i=sum(ms.filter(m=>m.tipo==='ingreso'),m=>m.monto);

    const cats=Array.from(new Set(S.movimientos.map(m=>m.categoria||'otros'))).sort();
    const vistos={}; S.movimientos.forEach(m=>{ if(m.terceroId&&!vistos[m.terceroId])

        '<div class="f"><label>Categoría</label><select id="cg"><option value="">Todas</option>'+

        '<div class="f"><label>Tercero</label><select id="tr"><option value="">Todos</option>'+

          '</select></div>'+
        '<div class="f"><label>&nbsp;</label><div class="row wrap"><button class="btn sm" id="hoy">Hoy</button>'+
          '<button class="btn sm" id="mes">Mes</button><button class="btn sm" id="ano">Año</button></div></div>'+

        if(v<=0) return toast('Monto inválido','warn');

            movTes(c2,'ingreso',v,'Traslado desde '+nameOf('cuentas',c1),'traslado','','');
            closeModal(); render(); toast('Traslado registrado','ok'); return;
          }
          const ter=tid? {id:tid, nombre:(listaTerceros().find(x=>x.id===tid)||{}).nombre||''} : null;
          if(cartera){
            /* anticipo o préstamo: no es gasto ni ingreso del negocio, es cartera */
            const esCxc = t==='egreso';
            const tipo = esCxc? 'cxc':'cxp';
            const fecha=todayISO();
            const d={id:uid('od'), no:nextNo(tipo, esCxc?'PC-':'PP-'), tipo:tipo, esOtro:true,
              fecha:fecha, terceroId:tid, terceroNombre:ter.nombre,
              concepto: co || (esCxc? 'Anticipo · '+cat : 'Préstamo recibido · '+cat),
              total:round(v,2), vence:dateAdd(fecha,Math.max(0,toN($('#plz',m).value)||30)),
              estado:'pendiente', categoria:cat, cuentaId:c1,
              medioPago:(byId('cuentas',c1)||{}).medio||'', nota:'', usuarioId:S.user?S.user.id:''};
            put('otrosdocs',d);
            movTes(c1,t,v,(esCxc?'Anticipo ':'Préstamo ')+d.no+' · '+ter.nombre+(co?' · '+co:''),
              cat,tipo,d.id,ter);
            closeModal(); render();
            toast((esCxc? 'Cuenta por cobrar ':'Cuenta por pagar ')+d.no+' creada a '+ter.nombre+
                  ' · '+money(v),'ok',4500);
            if(S.cfg.impTicket!==false) comprobanteOtro(d);
            return;
          }
          movTes(c1,t,v,co||('Movimiento · '+cat),cat,'','',ter);
          closeModal(); render(); toast('Movimiento registrado','ok');
        };
        const bloquea = bloqueaCaja(c1)? c1 : (bloqueaCaja(c2)? c2 : '');
        if(bloquea) conCaja(bloquea,guardar,(t==='traslado'?'Traslado':(t==='ingreso'?'Ingreso':'Egreso'))+' de '+money(v));
        else guardar();
      };
      avisar();
    }});
}

/* ================================ CAJA ================================
   El recorrido del dinero en un solo lugar: una pestaña por cuenta con
   TODO el movimiento desde el primer día y el saldo corrido, los cierres
   del día marcados en la misma línea de tiempo, y el control de que con
   la caja cerrada no entra ni sale plata sin un recibo que lo respalde.
   ==================================================================== */
let _cajaTab='resumen';
let _cajaF={desde:'',hasta:'',q:''};

/* movimientos + cierres de una cuenta, en orden, con saldo acumulado */
function recorrido(cuentaId,desde,hasta){
  const c=byId('cuentas',cuentaId);
  if(!c) return {filas:[],antes:0,saldo:0,cuenta:null};
  const ev=S.movimientos.filter(m=>m.cuentaId===cuentaId).map(m=>({m:m,fecha:m.fecha}));
  S.turnos.filter(t=>t.cuentaId===cuentaId && t.estado==='cerrado' && t.cierre)
    .forEach(t=>ev.push({c:t,fecha:t.cierre}));
  ev.sort((a,b)=>{ const r=String(a.fecha).localeCompare(String(b.fecha));
    return r!==0? r : (a.c?1:-1); });        // el cierre va después de sus movimientos
  let saldo=round(Number(c.saldoInicial)||0,2), antes=saldo;
  const filas=[];
  ev.forEach(x=>{
    if(x.m) saldo=round(saldo+(x.m.tipo==='ingreso'? x.m.monto : -x.m.monto),2);
    const d=dISO(x.fecha);
    if(desde && d<desde){ antes=saldo; return; }
    if(hasta && d>hasta) return;
    filas.push({m:x.m,c:x.c,fecha:x.fecha,saldo:saldo});
  });
  return {filas:filas,antes:antes,saldo:saldo,cuenta:c};
}
function origenMov(m){
  const o={venta:'venta',compra:'compra',cxc:'cartera',cxp:'cartera',cierre:'cierre',apertura:'apertura'}[m.refTipo];
  return o||(m.categoria==='traslado'?'traslado':'manual');
}

  function tablaRecorrido(R,filas,c){
    if(!filas.length) return '<div class="empty"><span class="ico">💵</span>'+
      (_cajaF.desde||_cajaF.hasta? 'Sin movimientos en este periodo':'Todavía no hay movimientos en esta cuenta')+
      '<div class="tiny muted" style="margin-top:6px">Saldo: <b>'+money(R.antes)+'</b></div></div>';
    let h='<div class="tblwrap"><table class="tbl"><thead><tr>'+
      '<th>Fecha</th><th>Concepto</th><th>Tercero</th><th>Origen</th>'+
      '<th class="num">Entrada</th><th class="num">Salida</th><th class="num">Saldo</th><th></th>'+
      '</tr></thead><tbody>';
    h+='<tr><td colspan="6" style="font-weight:650">'+
       (_cajaF.desde? 'Saldo al '+fdate(_cajaF.desde) : 'Saldo inicial de la cuenta')+
       '</td><td class="num sal">'+money(R.antes)+'</td><td></td></tr>';
    filas.forEach(f=>{
      if(f.c){
        const t=f.c, dif=Number(t.diferencia)||0;
        h+='<tr class="rcierre"><td style="white-space:nowrap">'+fcorta(t.cierre)+' '+ftime(t.cierre)+'</td>'+
          '<td colspan="3">🔒 CIERRE DE CAJA · '+esc(nameOf('usuarios',t.usuarioId))+
          ' · contado '+money(t.contado)+
          (Math.abs(dif)>=0.5? ' · <span style="color:var(--bad)">'+(dif>0?'sobrante ':'faltante ')+money(Math.abs(dif))+'</span>'
                             : ' · <span style="color:var(--ok)">cuadró</span>')+
          (t.nota? ' · '+esc(t.nota):'')+'</td>'+
          '<td class="num">—</td><td class="num">—</td>'+
          '<td class="num sal">'+money(f.saldo)+'</td>'+
          '<td><button class="btn ghost sm" data-rc="'+t.id+'" title="Reimprimir el cierre">🖨️</button></td></tr>';
        return;
      }
      const m=f.m;
      h+='<tr'+(m.fueraTurno?' class="rfuera"':'')+'>'+
        '<td style="white-space:nowrap"><div>'+fcorta(m.fecha)+'</div><div class="tiny muted">'+ftime(m.fecha)+'</div></td>'+
        '<td>'+esc(m.concepto||'—')+
          (m.fueraTurno? '<div class="tiny" style="color:var(--bad)">⚠ fuera de turno'+
            (m.soporte? ' · '+esc(m.soporte):'')+'</div>':'')+
          '<div class="tiny muted">'+esc(m.categoria||'otros')+'</div></td>'+
        '<td>'+esc(nombreTercero(m)||'—')+'</td>'+
        '<td><span class="pill">'+esc(origenMov(m))+'</span></td>'+
        '<td class="num">'+(m.tipo==='ingreso'? '<b style="color:var(--ok)">'+money(m.monto)+'</b>':'<span class="muted">—</span>')+'</td>'+
        '<td class="num">'+(m.tipo==='egreso'? '<b style="color:var(--bad)">'+money(m.monto)+'</b>':'<span class="muted">—</span>')+'</td>'+
        '<td class="num sal">'+money(f.saldo)+'</td>'+
        '<td><div class="row" style="gap:3px">'+
          '<button class="btn ghost sm" data-rm="'+m.id+'" title="Reimprimir comprobante">🖨️</button>'+
          (puedeEditar()? '<button class="btn ghost sm" data-em="'+m.id+'" title="Editar">✎</button>':'')+
        '</div></td></tr>';
    });
    h+='<tr class="rcierre"><td colspan="6" style="font-weight:750">SALDO FINAL</td>'+
       '<td class="num sal" style="font-size:15px">'+money(filas.length? filas[filas.length-1].saldo : R.antes)+'</td><td></td></tr>';
    return h+'</tbody></table></div>';
  }

  function excelRecorrido(c,R,filas){
    const f=[[{v:'Recorrido de '+c.nombre,t:'titulo'}],
      [(_cajaF.desde||_cajaF.hasta)? ('Del '+(_cajaF.desde||'inicio')+' al '+(_cajaF.hasta||todayISO())):'Desde el primer día'],[],
      ['Fecha','Hora','Concepto','Tercero','Categoría','Origen','Soporte','Usuario','Entrada','Salida','Saldo'].map(x=>({v:x,b:1}))];
    f.push([(_cajaF.desde?'Saldo al '+_cajaF.desde:'Saldo inicial'),'','','','','','','','','',{v:R.antes}]);
    filas.forEach(x=>{
      if(x.c){ const t=x.c;
        f.push([dISO(t.cierre),ftime(t.cierre),'CIERRE DE CAJA · contado '+t.contado+' · diferencia '+(t.diferencia||0),
          nameOf('usuarios',t.usuarioId),'cierre','cierre','','','','',{v:x.saldo}]); return; }
      const m=x.m;
      f.push([dISO(m.fecha),ftime(m.fecha),m.concepto||'',nombreTercero(m),m.categoria||'',origenMov(m),
        m.soporte||'',nameOf('usuarios',m.usuarioId),
        m.tipo==='ingreso'?m.monto:'', m.tipo==='egreso'?m.monto:'', {v:x.saldo}]);
    });
    const ent=sum(filas.filter(x=>x.m&&x.m.tipo==='ingreso'),x=>x.m.monto);
    const sal=sum(filas.filter(x=>x.m&&x.m.tipo==='egreso'),x=>x.m.monto);
    f.push([]); f.push([{v:'TOTALES',b:1},'','','','','','','',{v:ent},{v:sal},
      {v:filas.length? filas[filas.length-1].saldo : R.antes}]);
    exportarExcel('recorrido_'+normTxt(c.nombre).replace(/[^a-z0-9]+/g,'_'),
      [{nombre:'Recorrido',filas:f,anchos:[11,8,34,20,14,11,18,16,13,13,14]}]);
  }

  /* -------------------- cierres -------------------- */
  function pintaCierres(){
    const hist=S.turnos.slice().sort((a,b)=>String(b.apertura).localeCompare(String(a.apertura)));
    const cerr=hist.filter(x=>x.estado==='cerrado');

    $('#cbody').innerHTML=
      '<div class="kpis" style="margin-bottom:14px">'+
        kpi('Cierres hechos',cerr.length,'','')+
        kpi('Descuadre acumulado',money(dif),'suma de las diferencias',dif<1?'ok':'bad')+
        kpi('Cajas abiertas ahora',S.turnos.filter(x=>x.estado==='abierto').length,'','')+
      '</div>'+
      '<div class="card"><div class="hd"><h3>Historial de cierres</h3>'+
        '<div class="spacer"></div><button class="btn sm" id="cixls">📊 Excel</button></div><div class="bd p0">'+tbl([
        {t:'Apertura',f:x=>fdate(x.apertura,true)},
        {t:'Cierre',f:x=>x.cierre?fdate(x.cierre,true):'<span class="pill ok">abierta</span>'},
        {t:'Cajero',f:x=>esc(nameOf('usuarios',x.usuarioId))},
        {t:'Caja',f:x=>x.cuentaId? esc(nameOf('cuentas',x.cuentaId)):'<span class="muted">—</span>'},
        {t:'Abrió con',num:1,f:x=>money(x.base)},
        {t:'Ventas',num:1,f:x=>money(x.estado==='abierto'? sum(ventasDeTurno(x.id),v=>v.total) : (x.ventas||0))},
        {t:'Debía haber',num:1,f:x=>money(x.estado==='abierto'? (x.base+efectivoTurno(x.id)) : x.esperado)},
        {t:'Contado',num:1,f:x=>x.estado==='abierto'?'—':money(x.contado)},
        {t:'Diferencia',num:1,f:x=>{ if(x.estado==='abierto') return '—';
          const d=x.diferencia||0; return '<b style="color:'+(Math.abs(d)<1?'var(--ok)':'var(--bad)')+'">'+money(d)+'</b>';}},
        {t:'',f:x=>'<div class="row" style="gap:3px"><button class="btn ghost sm" data-rt="'+x.id+'" title="Reimprimir el cierre">🖨️</button>'+
          '<button class="btn ghost sm" data-vt="'+x.id+'" title="Ver detalle">👁️</button></div>'}
      ],hist,{empty:'Todavía no se ha cerrado ninguna caja',icon:'🔒'})+'</div></div>';
    $$('[data-rt]',$('#view')).forEach(b=>b.onclick=()=>{ imprimirCierre(byId('turnos',b.dataset.rt),null,null,true);
      toast('Cierre enviado a impresión','ok'); });
    $$('[data-vt]',$('#view')).forEach(b=>b.onclick=()=>verTurno(byId('turnos',b.dataset.vt)));
    $('#cixls').onclick=()=>{
      const f=[[{v:'Cierres de caja',t:'titulo'}],[],
        ['Apertura','Cierre','Cajero','Caja','Abrió con','Ventas','Debía haber','Contado','Diferencia','Observaciones'].map(x=>({v:x,b:1}))];
      hist.forEach(x=>f.push([fdate(x.apertura,true),x.cierre?fdate(x.cierre,true):'abierta',
        nameOf('usuarios',x.usuarioId),nameOf('cuentas',x.cuentaId),x.base||0,
        x.estado==='abierto'? sum(ventasDeTurno(x.id),v=>v.total):(x.ventas||0),
        x.estado==='abierto'? (x.base+efectivoTurno(x.id)):(x.esperado||0),
        x.estado==='abierto'?'':(x.contado||0), x.estado==='abierto'?'':(x.diferencia||0), x.nota||'']));
      exportarExcel('cierres_de_caja',[{nombre:'Cierres',filas:f,anchos:[17,17,18,18,13,13,13,13,12,30]}]);
    };
  }
}

function mAbrirCaja(){
  const cajas=cajasDisponibles();
  if(!cajas.length) return toast('Primero crea una caja en Tesorería ▸ + Cuenta','warn',5000);
  let cta=cajas[0].id;
  modal({title:'Abrir caja',size:'slim',
    body:'<div id="abox"></div>',
    footer:'<button class="btn" data-x>Cancelar</button><button class="btn pri" id="ok">Confirmar apertura</button>',
    onOpen:m=>{
      const pinta=()=>{
        const saldo=saldoCuenta(cta);
        const ult=S.turnos.filter(t=>t.cuentaId===cta&&t.estado==='cerrado'&&t.cierre)
          .sort((a,b)=>String(b.cierre).localeCompare(String(a.cierre)))[0];
        const fuera=movsFueraDeTurno(cta);
        $('#abox',m).innerHTML=
          (cajas.length>1? '<div class="f" style="margin-bottom:12px"><label>¿Cuál caja?</label><select id="cj">'+
            cajas.map(c=>'<option value="'+c.id+'"'+(c.id===cta?' selected':'')+'>'+esc(c.nombre)+'</option>').join('')+
            '</select></div>':'')+
          '<div class="card" style="background:var(--panel2)"><div class="bd" style="text-align:center;padding:18px 14px">'+
            '<div class="tiny muted" style="text-transform:uppercase;letter-spacing:.7px">Abres con</div>'+
            '<div class="mono" style="font-size:34px;font-weight:800;margin:4px 0;color:var(--ok)">'+money(saldo)+'</div>'+
            '<div class="tiny muted">'+(ult? 'Es lo que quedó contado en el cierre del '+fdate(ult.cierre,true)
                                            : 'Saldo que trae la caja')+'</div>'+
          '</div></div>'+
          (fuera.length? '<div class="card" style="background:var(--bad-soft);margin-top:10px"><div class="bd">'+
            '<b>⚠ '+fuera.length+' movimiento'+(fuera.length>1?'s':'')+' con la caja cerrada</b>'+
            '<div class="tiny" style="margin-top:5px">'+fuera.slice(0,4).map(x=>
              (x.tipo==='ingreso'?'+ ':'− ')+money(x.monto)+' · '+esc(x.concepto||'')+
              (x.soporte? ' <span class="muted">('+esc(x.soporte)+')</span>':'')).join('<br>')+
            (fuera.length>4? '<br>y '+(fuera.length-4)+' más':'')+
            '</div><div class="tiny muted" style="margin-top:6px">Ya están sumados o restados en el saldo de arriba.</div>'+
            '</div></div>':'')+
          '<label class="row tiny" style="margin-top:12px;gap:7px"><input type="checkbox" id="aj">'+
            ' Al contar hay diferencia (ajustar el saldo)</label>'+
          '<div class="f hide" id="ajb" style="margin-top:8px"><label>Efectivo realmente contado</label>'+
            '<input id="rc" type="number" step="any" value="'+saldo+'">'+
            '<div class="hintx" style="margin-top:5px">Se registra la diferencia como sobrante o faltante '+
            'para que el libro quede igual a la plata que hay.</div></div>';
        if($('#cj',m)) $('#cj',m).onchange=e=>{ cta=e.target.value; pinta(); };
        $('#aj',m).onchange=e=>$('#ajb',m).classList.toggle('hide',!e.target.checked);
      };
      pinta();
      $('#ok',m).onclick=()=>{
        if(S.turnos.some(t=>t.estado==='abierto'&&t.cuentaId===cta))
          return toast('Esa caja ya tiene un turno abierto','warn');
        let saldo=saldoCuenta(cta);
        if($('#aj',m) && $('#aj',m).checked){
          const real=toN($('#rc',m).value), dif=round(real-saldo,2);
          if(Math.abs(dif)>=0.5){
            movTes(cta, dif>0?'ingreso':'egreso', Math.abs(dif),
              (dif>0?'Sobrante':'Faltante')+' al abrir la caja','ajuste de caja','apertura','');
            saldo=real;
          }
        }
        const t={id:uid('t'),apertura:now(),cierre:'',usuarioId:S.user?S.user.id:'',cuentaId:cta,
          base:round(saldo,2), saldoApertura:round(saldo,2), estado:'abierto',
          esperado:0,contado:0,diferencia:0,nota:''};
        put('turnos',t); S.turno=t; closeModal(); render();
        toast('Caja abierta con '+money(saldo)+' · '+nameOf('cuentas',cta),'ok',4000);
      };
    }});
}

              money(bk.ing-bk.egr)+'</span></div>').join(''):'')+
          '<div class="hintx" style="margin-top:9px">Estos valores quedan guardados en el turno. El saldo de cada '+
          'banco lo sigues viendo en Tesorería para cuadrarlo contra el extracto.</div>'+
        '</div></div>'+
      '</div></div>',
    footer:'<button class="btn" data-x>Cancelar</button>'+
      '<button class="btn" id="impc">🖨️ Imprimir cierre</button>'+
      '<button class="btn danger" id="ok">Cerrar turno</button>',
    onOpen:m=>{
      const upd=()=>{ const d=round(toN($('#c',m).value)-esperado,2);
        $('#dif',m).innerHTML='<span>Diferencia</span><span class="v" style="color:'+
          (Math.abs(d)<1?'var(--ok)':'var(--bad)')+'">'+money(d)+'</span>'; };
      $('#c',m).oninput=upd; upd();
      const recontar=()=>{ let tot=0;
        $$('[data-den]',m).forEach(i=>{ const d=Number(i.dataset.den), n=toN(i.value);
          const sub=d*n; tot+=sub;
          $('[data-sub="'+d+'"]',m).textContent = n? money(sub):'—'; });
        $('#conteo',m).textContent=money(tot); return tot; };
      $$('[data-den]',m).forEach(i=>i.oninput=recontar);
      $('#usar',m).onclick=()=>{ $('#c',m).value=recontar(); upd(); };
      $('#impc',m).onclick=()=>imprimirCierre(t,D,toN($('#c',m).value));
      $('#ok',m).onclick=()=>{
        t.contado=toN($('#c',m).value); t.esperado=esperado; t.diferencia=round(t.contado-esperado,2);
        /* la plata contada manda: la diferencia queda registrada para que el
           recorrido de la caja siga igual a lo que hay en el cajón.
           Se registra ANTES de marcar el turno como cerrado, para que no salga
           como movimiento fuera de turno. */
        if(Math.abs(t.diferencia)>=0.5 && t.cuentaId)
          movTes(t.cuentaId, t.diferencia>0?'ingreso':'egreso', Math.abs(t.diferencia),
            (t.diferencia>0?'Sobrante':'Faltante')+' en el cierre de caja','ajuste de caja','cierre',t.id);
        t.cierre=now(); t.estado='cerrado'; t.nota=$('#n',m).value;
        t.ventas=D.totalVentas; t.ventaEfectivo=D.ventaEfe; t.salidas=D.salidas;
        t.otrosMedios=D.porMedio; t.bancos=D.bancos; t.saldoCierre=t.contado;
        put('turnos',t); S.turno=null; closeModal(); render();
        if(S.cfg.impTicket!==false) imprimirCierre(t,D,t.contado);
        toast('Turno cerrado · diferencia '+money(t.diferencia), Math.abs(t.diferencia)<1?'ok':'warn');
      };
    }});
}
function datosCierre(t){
  const D=detalleTurno(t);
  if(t.estado==='cerrado'){            // un turno cerrado imprime lo que quedó firmado ese día
    if(t.ventaEfectivo!=null) D.ventaEfe=t.ventaEfectivo;
    if(t.salidas!=null) D.salidas=t.salidas;
    if(t.otrosMedios) D.porMedio=t.otrosMedios;
    if(t.bancos) D.bancos=t.bancos;
    if(t.ventas!=null) D.totalVentas=t.ventas;
    if(t.esperado!=null) D.esperado=t.esperado;
  }
  return D;
}
function imprimirCierre(t,D,contado,copia){
  if(!t) return;
  D=D||datosCierre(t);
  contado = contado!=null? contado : (t.contado||0);
  const dif=round((Number(contado)||0)-D.esperado,2);
  const h=docTicket('CIERRE DE CAJA',[
    t.cuentaId? ['Caja', esc(nameOf('cuentas',t.cuentaId))] : null,
    ['Cajero', esc(nameOf('usuarios',t.usuarioId))],
    ['Apertura', fdate(t.apertura,true)],
    ['Cierre', t.cierre? fdate(t.cierre,true) : fdate(now(),true)],
    'EFECTIVO',
    ['Abrio con', money(t.base)],
    ['Ventas en efectivo', money(D.ventaEfe)],
    D.otrosIng? ['Otras entradas', money(D.otrosIng)] : null,
    D.salidas? ['Salidas', '-'+money(D.salidas)] : null,
    {k:'ESPERADO', v:money(D.esperado), big:true},
    {k:'CONTADO', v:money(contado), big:true},
    {k:'DIFERENCIA', v:money(dif), big:true},
    'NO SE CUENTA'
  ].concat(MEDIOS.filter(x=>x.k!=='efectivo').map(md=>[md.n, money((D.porMedio||{})[md.k]||0)]))
   .concat((D.bancos&&D.bancos.length? [{hr:1}].concat(D.bancos.map(bk=>[bk.nombre, money(bk.ing-bk.egr)])) : []))
   .concat([
    'VENTAS',
    ['Facturas', (D.vs||[]).length],
    {k:'TOTAL VENDIDO', v:money(D.totalVentas), b:true},
    t.nota? {texto:'Obs: '+t.nota} : null,
    {firma:'Firma del cajero'},
    {firma:'Recibido por'}
  ]),{copia:copia});
  abrirImpresion(h,'cierre',S.cfg.impresoraTicket);
}

  const hojas=[{nombre:'Instrucciones', anchos:[70], filas:[

    [{v:'1. Cada hoja es un tipo de dato. Llena solo las que necesites.',b:0}],

    ['8. No importa si escribes con tildes o mayúsculas: el sistema compara sin distinguir.'],[],

function normCab(t){ return normTxt(t).replace(/[^a-z0-9]/g,''); }
function mapaCab(fila,campos){
  const m={};
  (fila||[]).forEach((c,i)=>{ const n=normCab(c);
    campos.forEach(campo=>{ if(normCab(campo)===n && m[campo]===undefined) m[campo]=i; }); });
  return m;
}
function buscaPorNombre(coll,nombre){
  const n=normTxt(nombre).trim();
  return S[coll].find(x=>normTxt(x.nombre).trim()===n)||null;
}
function analizarImport(hojas){
  const plan={categorias:[],ingredientes:[],productos:[],recetas:[],clientes:[],proveedores:[],mesas:[],cuentas:[]};
  const avisos=[];
  const hoja=(nom)=>{ const k=Object.keys(hojas).find(h=>normCab(h)===normCab(nom)); return k? hojas[k]:null; };
  const filas=(def)=>{
    const h=hoja(def.hoja); if(!h||h.length<2) return [];
    const m=mapaCab(h[0],def.campos);
    const faltan=def.campos.filter(c=>m[c]===undefined && c==='nombre');
    if(faltan.length){ avisos.push('La hoja '+def.hoja+' no tiene la columna "nombre"'); return []; }
    const out=[];
    for(let i=1;i<h.length;i++){
      const r=h[i]||[]; const o={};
      def.campos.forEach(c=>{ o[c]= m[c]!==undefined? String(r[m[c]]==null?'':r[m[c]]).trim() : ''; });
      if(Object.values(o).every(v=>!v)) continue;
      out.push(o);
    }
    return out;
  };
  PLANTILLA.forEach(def=>{
    const rs=filas(def);
    rs.forEach(o=>{
      if(def.hoja==='Categorias'){ if(!o.nombre) return;
        plan.categorias.push({nombre:o.nombre, emoji:o.icono||'🍽️', orden:toN(o.orden)||0}); }
      else if(def.hoja==='Ingredientes'){ if(!o.nombre) return;
        plan.ingredientes.push({nombre:o.nombre, unidad:o.unidad||'und', costo:toN(o.costo),
          stock:toN(o.stock_inicial), stockMin:toN(o.stock_minimo)}); }
      else if(def.hoja==='Productos'){ if(!o.nombre) return;
        plan.productos.push({nombre:o.nombre, categoria:o.categoria||'', precio:toN(o.precio),
          emoji:o.icono||'🍽️', costoManual:toN(o.costo_sin_receta)}); }
      else if(def.hoja==='Recetas'){ if(!o.producto||!o.ingrediente) return;
        plan.recetas.push({producto:o.producto, ingrediente:o.ingrediente, cantidad:toN(o.cantidad)}); }
      else if(def.hoja==='Clientes'){ if(!o.nombre) return;
        plan.clientes.push({nombre:o.nombre, doc:o.documento||'', telefono:o.telefono||'', limite:toN(o.cupo)}); }
      else if(def.hoja==='Proveedores'){ if(!o.nombre) return;
        plan.proveedores.push({nombre:o.nombre, nit:o.nit||'', contacto:o.contacto||'', telefono:o.telefono||''}); }
      else if(def.hoja==='Mesas'){ if(!o.nombre) return;
        plan.mesas.push({nombre:o.nombre, zona:o.zona||'Salón', capacidad:toN(o.puestos)||4}); }
      else if(def.hoja==='Cuentas'){ if(!o.nombre) return;
        plan.cuentas.push({nombre:o.nombre, tipo:(normTxt(o.tipo)==='banco'?'banco':'caja'),
          medio:(['efectivo','tarjeta','transferencia'].indexOf(normTxt(o.medio))>=0? normTxt(o.medio):'efectivo'),
          saldoInicial:toN(o.saldo_inicial)}); }
    });
  });
  /* validaciones cruzadas */
  plan.productos.forEach(p=>{ if(p.categoria && !buscaPorNombre('categorias',p.categoria) &&
      !plan.categorias.some(c=>normTxt(c.nombre)===normTxt(p.categoria)))
    avisos.push('El producto "'+p.nombre+'" apunta a la categoría "'+p.categoria+'", que no existe ni viene en el archivo'); });
  plan.recetas.forEach(r=>{
    const hayP=buscaPorNombre('productos',r.producto)||plan.productos.some(p=>normTxt(p.nombre)===normTxt(r.producto));
    const hayI=buscaPorNombre('ingredientes',r.ingrediente)||plan.ingredientes.some(g=>normTxt(g.nombre)===normTxt(r.ingrediente));
    if(!hayP) avisos.push('La receta menciona el producto "'+r.producto+'", que no existe');
    if(!hayI) avisos.push('La receta menciona el ingrediente "'+r.ingrediente+'", que no existe');
  });
  return {plan:plan, avisos:Array.from(new Set(avisos)).slice(0,20)};
}
function aplicarImport(plan){
  const res={creados:0, actualizados:0, detalle:{}};
  const cuenta=(k,nuevo)=>{ res.detalle[k]=res.detalle[k]||{c:0,a:0};
    if(nuevo){res.detalle[k].c++; res.creados++;} else {res.detalle[k].a++; res.actualizados++;} };

  plan.categorias.forEach(o=>{ const ex=buscaPorNombre('categorias',o.nombre);
    const d=ex||{id:uid('c'),activo:true};
    d.nombre=o.nombre; d.emoji=o.emoji; d.orden=o.orden||d.orden||0; d.activo=true;
    put('categorias',d); cuenta('Categorías',!ex); });

  plan.ingredientes.forEach(o=>{ const ex=buscaPorNombre('ingredientes',o.nombre);
    const d=ex||{id:uid('g'),activo:true,stock:0,costo:0};
    d.nombre=o.nombre; d.unidad=o.unidad; d.stockMin=o.stockMin; d.activo=true;
    if(!ex) d.costo=o.costo;
    put('ingredientes',d);
    if(!ex && o.stock>0) movInv(d.id,'entrada',o.stock,o.costo,'importacion','','Carga inicial desde Excel');
    cuenta('Ingredientes',!ex); });

  plan.productos.forEach(o=>{ const ex=buscaPorNombre('productos',o.nombre);
    const cat=o.categoria? buscaPorNombre('categorias',o.categoria):null;
    const d=ex||{id:uid('p'),activo:true,receta:[],orden:0};
    d.nombre=o.nombre; d.precio=o.precio; d.emoji=o.emoji;
    d.costoManual=o.costoManual||0; d.activo=true;
    if(cat) d.categoriaId=cat.id;
    put('productos',d); cuenta('Productos',!ex); });

  /* las recetas se rearman completas por producto */
  const porProd={};
  plan.recetas.forEach(r=>{ const p=buscaPorNombre('productos',r.producto), g=buscaPorNombre('ingredientes',r.ingrediente);
    if(!p||!g||!r.cantidad) return;
    (porProd[p.id]=porProd[p.id]||[]).push({ingredienteId:g.id,cantidad:r.cantidad}); });
  Object.keys(porProd).forEach(pid=>{ const p=byId('productos',pid); if(!p) return;
    p.receta=porProd[pid]; put('productos',p);
    res.detalle['Recetas']=res.detalle['Recetas']||{c:0,a:0}; res.detalle['Recetas'].a++; });

  plan.clientes.forEach(o=>{ const ex=buscaPorNombre('clientes',o.nombre);
    const d=ex||{id:uid('cl'),activo:true};
    Object.assign(d,{nombre:o.nombre,doc:o.doc,telefono:o.telefono,limite:o.limite,activo:true});
    put('clientes',d); cuenta('Clientes',!ex); });

  plan.proveedores.forEach(o=>{ const ex=buscaPorNombre('proveedores',o.nombre);
    const d=ex||{id:uid('pr'),activo:true};
    Object.assign(d,{nombre:o.nombre,nit:o.nit,contacto:o.contacto,telefono:o.telefono,activo:true});
    put('proveedores',d); cuenta('Proveedores',!ex); });

  plan.mesas.forEach(o=>{ const ex=buscaPorNombre('mesas',o.nombre);
    const d=ex||{id:uid('m'),activo:true};
    Object.assign(d,{nombre:o.nombre,zona:o.zona,capacidad:o.capacidad,activo:true});
    put('mesas',d); cuenta('Mesas',!ex); });

  plan.cuentas.forEach(o=>{ const ex=buscaPorNombre('cuentas',o.nombre);
    const d=ex||{id:uid('ct'),activo:true};
    Object.assign(d,{nombre:o.nombre,tipo:o.tipo,medio:o.medio,activo:true});
    if(!ex) d.saldoInicial=o.saldoInicial;
    put('cuentas',d); cuenta('Cuentas',!ex); });

  migrarAPeps();
  return res;
}

/* ===================== COMPROBANTES REIMPRIMIBLES =====================
   Todo lo que queda guardado se puede volver a imprimir: cierres de caja,
   movimientos de tesorería, cobros y pagos de cartera, y compras.
   ==================================================================== */
function docTicket(titulo, bloques, opts){
  opts=opts||{};
  const c=S.cfg, w=Number(c.ticketAncho)||80;
  const cuerpo=bloques.map(b=>{
    if(b===null||b===undefined) return '';
    if(typeof b==='string') return '<h2>'+esc(b)+'</h2>';
    if(b.texto!==undefined) return '<div class="tx">'+esc(b.texto)+'</div>';
    if(b.hr) return '<hr>';
    if(b.firma) return '<div class="fir">'+esc(b.firma)+'</div>';
    const cls=(b.big?' big':'')+(b.b?' b':'');
    return '<div class="l'+cls+'"><span>'+esc(b[0]!==undefined?b[0]:b.k)+'</span>'+

/* --- comprobante de un movimiento de caja o banco --- */
function comprobanteMov(m,copia){
  if(!m) return;
  const esIng=m.tipo==='ingreso';
  const h=docTicket(esIng?'COMPROBANTE DE INGRESO':'COMPROBANTE DE EGRESO',[
    ['N°', esc(String(m.id).slice(-8).toUpperCase())],
    ['Fecha', fdate(m.fecha,true)],
    ['Cuenta', esc(nameOf('cuentas',m.cuentaId))],
    {hr:1},
    nombreTercero(m)? ['Tercero', esc(nombreTercero(m))] : null,
    ['Categoría', esc(m.categoria||'otros')],
    {texto:'Concepto: '+(m.concepto||'—')},
    m.refTipo? ['Origen', esc(m.refTipo)] : null,
    {hr:1},
    {k:(esIng?'RECIBIDO':'PAGADO'), v:money(m.monto), big:true},
    {hr:1},
    ['Registró', esc(nameOf('usuarios',m.usuarioId))],
    {firma: esIng?'Firma de quien entrega':'Firma de quien recibe'},
    {firma:'Firma autorizada'}
  ],{copia:copia});
  abrirImpresion(h,'comprobante',S.cfg.impresoraTicket);
}

/* --- recibo de caja de un cobro o pago de cartera --- */
function comprobanteAbono(a,copia){
  if(!a) return;
  const esC=a.tipo==='cxc';
  const doc=docCartera(a.docId);
  const ter=a.terceroNombre || (doc? terceroDoc(doc) :
    (esC? nameOf('clientes',a.terceroId) : nameOf('proveedores',a.terceroId)));
  const saldo=doc? saldoDoc(doc) : 0;
  const md=MEDIOS.find(x=>x.k===a.medio)||{};
  const h=docTicket(esC?'RECIBO DE CAJA':'COMPROBANTE DE PAGO',[
    ['N°', esc(String(a.id).slice(-8).toUpperCase())],
    ['Fecha', fdate(a.fecha,true)],
    {hr:1},
    [esC?'Cliente':'Proveedor', esc(ter)],
    ['Documento', esc(doc?doc.no:'—')],
    doc? ['Valor del documento', money(doc.total)] : null,
    ['Medio', esc(md.n||a.medio)],
    ['Cuenta', esc(nameOf('cuentas',a.cuentaId))],
    a.nota? {texto:'Nota: '+a.nota} : null,
    {hr:1},
    {k:(esC?'RECIBIDO':'PAGADO'), v:money(a.monto), big:true},
    ['Saldo pendiente', money(saldo)],
    {hr:1},
    ['Atendió', esc(nameOf('usuarios',a.usuarioId))],
    {firma: esC?'Firma del cliente':'Firma de quien recibe'}
  ],{copia:copia});
  abrirImpresion(h,'comprobante',S.cfg.impresoraTicket);

/* --- comprobante de una compra --- */
function comprobanteCompra(c,copia){
  if(!c) return;
  const items=(c.items||[]).map(i=>{ const g=byId('ingredientes',i.ingredienteId)||{};
    return {k:num(i.cantidad,2)+' '+(g.unidad||'')+' '+(g.nombre||''), v:money(i.cantidad*i.costoUnit)}; });
  const h=docTicket('COMPROBANTE DE COMPRA',[
    ['N°', esc(c.no)],
    ['Fecha', fdate(c.fecha)],
    ['Proveedor', esc(nameOf('proveedores',c.proveedorId))],
    c.factura? ['Factura', esc(c.factura)] : null,
    {hr:1}
  ].concat(items).concat([
    {hr:1},
    ['Subtotal', money(c.subtotal)],
    c.impuesto? ['Impuestos', money(c.impuesto)] : null,
    {k:'TOTAL', v:money(c.total), big:true},
    ['Condición', c.credito?'Crédito':'Contado'],
    c.credito? ['Vence', esc(c.vence||'—')] : ['Pagado con', esc((c.medioPago||'')+' · '+nameOf('cuentas',c.cuentaId))],
    saldoCompra(c)>0.5? ['Saldo pendiente', money(saldoCompra(c))] : null,
    {hr:1},
    ['Registró', esc(nameOf('usuarios',c.usuarioId))],
    {firma:'Recibí conforme'}
  ]),{copia:copia});
  abrirImpresion(h,'comprobante',S.cfg.impresoraTicket);
}

/* ===================== RESUMEN DE VENTAS DEL DÍA ======================
   Lo que el dueño y el socio quieren ver en el grupo: cuánto entró, por
   qué medio, cuánto salió y con cuánto quedó la caja.
   ==================================================================== */
function resumenVentas(d1,d2){
  const vs=S.ventas.filter(v=>v.estado!=='anulada' && dISO(v.fecha)>=d1 && dISO(v.fecha)<=d2);
  const anul=S.ventas.filter(v=>v.estado==='anulada' && dISO(v.fecha)>=d1 && dISO(v.fecha)<=d2);
  /* Una venta anulada no existe para el resumen: se sacan tanto la entrada
     original como la devolución, que de todos modos se cancelan entre sí.
     Así no aparece ni suma ni resta. */
  const anuladas={}; S.ventas.forEach(v=>{ if(v.estado==='anulada') anuladas[v.id]=1; });
  const deVentaAnulada=m=>m.refTipo==='venta' && anuladas[m.refId];
  const ms=S.movimientos.filter(m=>dISO(m.fecha)>=d1 && dISO(m.fecha)<=d2 && !deVentaAnulada(m));
  const medios={efectivo:0,tarjeta:0,transferencia:0,credito:0};
  vs.forEach(v=>{
    if(v.credito){ medios.credito+=round(v.total-round(sum((v.pagos||[]),p=>p.monto),2),2); }
    (v.pagos||[]).forEach(p=>{ medios[p.medio]=(medios[p.medio]||0)+p.monto; });
  });
  const total=sum(vs,v=>v.total||0);
  const costo=sum(vs,v=>v.costo||0);
  const ing=sum(ms.filter(m=>m.tipo==='ingreso'),m=>m.monto);
  const egr=sum(ms.filter(m=>m.tipo==='egreso'),m=>m.monto);
  const efeCaja=ms.filter(m=>{const c=byId('cuentas',m.cuentaId);return c&&c.tipo==='caja';});
  const cajaIng=sum(efeCaja.filter(m=>m.tipo==='ingreso'),m=>m.monto);
  const cajaEgr=sum(efeCaja.filter(m=>m.tipo==='egreso'),m=>m.monto);
  const gastos=ms.filter(esGasto);
  const prods={};
  vs.forEach(v=>(v.items||[]).forEach(i=>{ const k=i.nombre;
    prods[k]=prods[k]||{nombre:k,uds:0,valor:0}; prods[k].uds+=i.cant; prods[k].valor+=i.precio*i.cant; }));
  const top=Object.values(prods).sort((a,b)=>b.valor-a.valor);
  const porUsuario={};
  vs.forEach(v=>{ const k=nameOf('usuarios',v.usuarioId);
    porUsuario[k]=porUsuario[k]||{nombre:k,n:0,valor:0}; porUsuario[k].n++; porUsuario[k].valor+=v.total; });
  return {d1,d2,vs,anul,ms,medios,total,costo,
    utilidad:round(total-sum(vs,v=>v.propina||0)-sum(vs,v=>v.impuesto||0)-costo,2),
    descuentos:sum(vs,v=>v.descuento||0), propinas:sum(vs,v=>v.propina||0), impuestos:sum(vs,v=>v.impuesto||0),
    ing,egr,saldo:round(ing-egr,2), cajaIng,cajaEgr, cajaNeto:round(cajaIng-cajaEgr,2),
    gastos, totalGastos:sum(gastos,m=>m.monto),
    top, porUsuario:Object.values(porUsuario).sort((a,b)=>b.valor-a.valor),
    cuentas:S.cuentas.filter(c=>c.activo).map(c=>({nombre:c.nombre,tipo:c.tipo,saldo:saldoCuenta(c.id)}))};
}

function textoResumen(d1,d2){
  const r=resumenVentas(d1,d2);
  const mismoDia=d1===d2;
  const li=(a,b)=>a+': '+b;
  let t='*'+(S.cfg.nombre||'POS').toUpperCase()+'*\n';
  t+='Resumen de ventas · '+(mismoDia? fdate(d1) : fdate(d1)+' al '+fdate(d2))+'\n\n';
  t+='*VENTAS: '+money(r.total)+'*\n';
  t+=li('Facturas',r.vs.length)+'\n';
  t+=li('Ticket promedio',money(r.vs.length? r.total/r.vs.length:0))+'\n\n';
  t+='*Cómo pagaron*\n';
  if(r.medios.efectivo) t+=li('Efectivo',money(r.medios.efectivo))+'\n';
  if(r.medios.tarjeta) t+=li('Tarjeta',money(r.medios.tarjeta))+'\n';
  if(r.medios.transferencia) t+=li('Transferencia',money(r.medios.transferencia))+'\n';
  if(r.medios.credito) t+=li('Crédito (por cobrar)',money(r.medios.credito))+'\n';
  if(r.descuentos) t+=li('Descuentos','-'+money(r.descuentos))+'\n';
  if(r.propinas) t+=li('Propinas',money(r.propinas))+'\n';
  t+='\n*Caja y bancos*\n';
  t+=li('Ingresos',money(r.ing))+'\n';
  t+=li('Egresos','-'+money(r.egr))+'\n';
  t+=li('Saldo del período',money(r.saldo))+'\n';
  r.cuentas.forEach(c=>{ t+=li('  '+c.nombre,money(c.saldo))+'\n'; });
  if(r.totalGastos){ t+='\n*Gastos*\n';
    r.gastos.slice(0,8).forEach(m=>{ t+=li(m.concepto||m.categoria,'-'+money(m.monto))+'\n'; });
    if(r.gastos.length>8) t+='(+'+(r.gastos.length-8)+' más)\n';
    t+=li('Total gastos','-'+money(r.totalGastos))+'\n'; }
  if(verCostos()){
    t+='\n*Resultado*\n';
    t+=li('Costo de ventas',money(r.costo))+'\n';
    t+=li('Utilidad bruta',money(r.utilidad)+(r.total? ' ('+round(r.utilidad/r.total*100,1)+'%)':''))+'\n';
  }
  if(r.top.length){ t+='\n*Más vendidos*\n';
    r.top.slice(0,5).forEach(p=>{ t+='• '+p.nombre+' — '+num(p.uds,0)+' und · '+money(p.valor)+'\n'; }); }
  return t;
}

      };

        const h=todayISO(), k=b.dataset.p;
        if(k==='hoy'){ $('#rv1',m).value=h; $('#rv2',m).value=h; }
        else if(k==='ayer'){ const y=dateAdd(h,-1); $('#rv1',m).value=y; $('#rv2',m).value=y; }
        else if(k==='sem'){ $('#rv1',m).value=dateAdd(h,-6); $('#rv2',m).value=h; }
        else { $('#rv1',m).value=h.slice(0,8)+'01'; $('#rv2',m).value=h; }
        prev();
      });
      $('#rv_imp',m).onclick=()=>{ imprimirResumen($('#rv1',m).value,$('#rv2',m).value,false); toast('Resumen enviado a impresión','ok'); };
      $('#rv_det',m).onclick=()=>{ imprimirResumen($('#rv1',m).value,$('#rv2',m).value,true); toast('Detallado enviado a impresión','ok'); };
      $('#rv_txt',m).onclick=async()=>{
        const t=textoResumen($('#rv1',m).value,$('#rv2',m).value);
        let ok=false;
        try{ await navigator.clipboard.writeText(t); ok=true; }catch(e){
          try{ const ta=document.createElement('textarea'); ta.value=t;
            ta.style.cssText='position:fixed;left:-9999px'; document.body.appendChild(ta);
            ta.select(); ok=document.execCommand('copy'); ta.remove(); }catch(e2){}
        }
        if(ok) toast('Copiado · pégalo en el grupo de WhatsApp','ok',4000);
        else modal({title:'Resumen para enviar',size:'slim',
          body:'<textarea rows="16" style="font-family:ui-monospace,monospace;font-size:11.5px">'+esc(t)+'</textarea>'+
            '<div class="hintx" style="margin-top:8px">Selecciona todo y copia.</div>'});
        if(navigator.share){ try{ await navigator.share({text:t}); }catch(e){} }
      };
      prev();
    }});
}

/* =========================== CONTABILIDAD ============================
   Estado de resultados por rango de fecha, con el costo promedio real que
   quedó grabado en cada venta. Las compras NO son gasto: entran al
   inventario y se vuelven costo cuando el plato se vende.
   =================================================================== */
const GASTO_FUERA=['compra','proveedores','traslado','anulacion','venta','cartera',
  'ajuste de caja','prestamos','obligaciones'];
/* Un anticipo o un préstamo tampoco es gasto: queda como cuenta por cobrar */
function esGasto(m){ return m.tipo==='egreso' && GASTO_FUERA.indexOf(m.categoria||'')<0
  && !esCategoriaCartera(m.categoria) && m.refTipo!=='cxc' && m.refTipo!=='cxp'; }

function calcConta(d1,d2){
  const vs=S.ventas.filter(v=>v.estado!=='anulada' && dISO(v.fecha)>=d1 && dISO(v.fecha)<=d2);
  const cs=S.compras.filter(c=>c.estado!=='anulada' && c.fecha>=d1 && c.fecha<=d2);
  const ms=S.movimientos.filter(m=>dISO(m.fecha)>=d1 && dISO(m.fecha)<=d2);
  const bruto=sum(vs,v=>v.total||0);
  const propinas=sum(vs,v=>v.propina||0);
  const impuestos=sum(vs,v=>v.impuesto||0);
  const descuentos=sum(vs,v=>v.descuento||0);
  const ventasNetas=round(bruto-propinas-impuestos,2);
  const costo=sum(vs,v=>v.costo||0);
  const bruta=round(ventasNetas-costo,2);
  const gastos=ms.filter(esGasto);
  const totalGastos=sum(gastos,m=>m.monto);
  const neta=round(bruta-totalGastos,2);

  /* por producto: el costo real que se consumió, no el teórico */
  const prods={};
  vs.forEach(v=>(v.items||[]).forEach(i=>{
    const k=i.productoId||i.nombre;
    prods[k]=prods[k]||{id:i.productoId,nombre:i.nombre,uds:0,venta:0,costo:0};
    prods[k].uds+=i.cant;
    prods[k].venta+=i.precio*i.cant;
    prods[k].costo+=(i.costoTotal!=null? i.costoTotal : (i.costo||0)*i.cant);
  }));
  const porProducto=Object.values(prods).map(p=>{
    const pr=byId('productos',p.id);
    return Object.assign(p,{
      costoUnit: p.uds? round(p.costo/p.uds,2):0,
      precioProm: p.uds? round(p.venta/p.uds,2):0,
      utilidad: round(p.venta-p.costo,2),
      margen: p.venta? round((p.venta-p.costo)/p.venta*100,1):0,
      costoHoy: pr? costoProducto(pr):0,
      parte: ventasNetas? round(p.venta/bruto*100,1):0
    });
  }).sort((a,b)=>b.venta-a.venta);

  const cats={};
  vs.forEach(v=>(v.items||[]).forEach(i=>{
    const p=byId('productos',i.productoId);
    const k=p? nameOf('categorias',p.categoriaId):'Sin categoría';
    cats[k]=cats[k]||{nombre:k,uds:0,venta:0,costo:0};
    cats[k].uds+=i.cant; cats[k].venta+=i.precio*i.cant;
    cats[k].costo+=(i.costoTotal!=null? i.costoTotal:(i.costo||0)*i.cant);
  }));
  const porCategoria=Object.values(cats).map(c=>Object.assign(c,{
    utilidad:round(c.venta-c.costo,2), margen:c.venta?round((c.venta-c.costo)/c.venta*100,1):0
  })).sort((a,b)=>b.venta-a.venta);

  const gcat={};
  gastos.forEach(m=>{ const k=m.categoria||'otros';
    gcat[k]=gcat[k]||{valor:0,n:0}; gcat[k].valor+=m.monto; gcat[k].n++; });
  const porGasto=Object.keys(gcat).map(k=>({nombre:k,valor:round(gcat[k].valor,2),n:gcat[k].n,
    parte: totalGastos? round(gcat[k].valor/totalGastos*100,1):0})).sort((a,b)=>b.valor-a.valor);

  const gter={};
  gastos.forEach(m=>{ const k=nombreTercero(m)||'(sin tercero)';
    gter[k]=(gter[k]||0)+m.monto; });
  const porGastoTercero=Object.keys(gter).map(k=>({nombre:k,valor:gter[k]})).sort((a,b)=>b.valor-a.valor);
  const prov={};
  cs.forEach(c=>{ const k=nameOf('proveedores',c.proveedorId);
    prov[k]=prov[k]||{nombre:k,facturas:0,valor:0}; prov[k].facturas++; prov[k].valor+=c.total||0; });
  const porProveedor=Object.values(prov).sort((a,b)=>b.valor-a.valor);

  const medios={};
  vs.forEach(v=>{ if(v.credito) medios['credito']=(medios['credito']||0)+v.total;
    (v.pagos||[]).forEach(p=>medios[p.medio]=(medios[p.medio]||0)+p.monto); });

  const caja={ing:sum(ms.filter(m=>m.tipo==='ingreso'),m=>m.monto),
               egr:sum(ms.filter(m=>m.tipo==='egreso'),m=>m.monto)};

  return {d1,d2,vs,cs,ms,bruto,propinas,impuestos,descuentos,ventasNetas,costo,bruta,
          gastos,totalGastos,neta,porProducto,porCategoria,porGasto,porGastoTercero,porProveedor,medios,caja,
          compras:sum(cs,c=>c.total||0)};
}

function csvConta(r){
  const f=[];
  f.push(['ESTADO DE RESULTADOS',r.d1+' a '+r.d2]);
  f.push([]);
  f.push(['Ventas brutas',r.bruto]);
  f.push(['Propinas',-r.propinas]);
  f.push(['Impuestos',-r.impuestos]);
  f.push(['Ventas netas',r.ventasNetas]);
  f.push(['Costo de ventas',-r.costo]);
  f.push(['Utilidad bruta',r.bruta]);
  r.porGasto.forEach(g=>f.push(['Gasto: '+g.nombre,-g.valor,g.n+' mov.',g.parte+'% de los gastos']));
  f.push(['Total gastos',-r.totalGastos]);
  f.push(['UTILIDAD NETA',r.neta]);
  f.push([]); f.push(['Compras del periodo (van a inventario)',r.compras]);
  f.push([]); f.push(['PRODUCTO','Unidades','Precio promedio','Costo unitario','Costo hoy','Venta','Utilidad','Margen %','% ventas']);
  r.porProducto.forEach(p=>f.push([p.nombre,p.uds,p.precioProm,p.costoUnit,p.costoHoy,p.venta,p.utilidad,p.margen,p.parte]));
  f.push([]); f.push(['CATEGORIA','Unidades','Venta','Costo','Utilidad','Margen %']);
  r.porCategoria.forEach(c=>f.push([c.nombre,c.uds,c.venta,c.costo,c.utilidad,c.margen]));
  f.push([]); f.push(['GASTOS','Fecha','Concepto','Tercero','Categoria','Cuenta','Valor']);
  r.gastos.forEach(m=>f.push(['',fdate(m.fecha),m.concepto,nombreTercero(m),m.categoria,nameOf('cuentas',m.cuentaId),m.monto]));
  f.push([]); f.push(['A QUIEN SE LE PAGO','Valor']);
  r.porGastoTercero.forEach(t=>f.push([t.nombre,t.valor]));
  download('contabilidad_'+r.d1+'_'+r.d2+'.csv', f.map(x=>x.map(csvEsc).join(';')).join('\n'));
  toast('CSV descargado','ok');
}

function bars(data,fmt){
  const max=Math.max.apply(null,data.map(d=>d.v).concat([1]));
  return '<div style="display:flex;flex-direction:column;gap:7px">'+data.map(d=>
    '<div class="row" style="gap:9px"><div style="width:130px;flex:0 0 auto;font-size:12.5px" class="b">'+esc(d.n)+'</div>'+
    '<div style="flex:1;background:var(--line2);border-radius:6px;height:19px;overflow:hidden">'+
      '<div style="height:100%;width:'+(d.v/max*100)+'%;background:'+(d.c||'var(--brand)')+';border-radius:6px"></div></div>'+
    '<div style="width:110px;text-align:right;font-size:12.5px" class="b mono">'+(fmt?fmt(d.v):money(d.v))+'</div></div>').join('')+'</div>';
}
function viewReportes(vw){
  let d1=dateAdd(todayISO(),-29), d2=todayISO();
  vw.innerHTML='<div class="card" style="margin-bottom:14px"><div class="bd"><div class="row wrap">'+
    '<div class="f"><label>Desde</label><input type="date" id="r1" value="'+d1+'"></div>'+
    '<div class="f"><label>Hasta</label><input type="date" id="r2" value="'+d2+'"></div>'+
    '<div class="f"><label>&nbsp;</label><div class="row"><button class="btn sm" id="p7">7 días</button>'+
      '<button class="btn sm" id="p30">30 días</button><button class="btn sm" id="pm">Este mes</button>'+
      '<button class="btn sm" id="csv">⬇️ CSV</button></div></div>'+
    '</div></div></div><div id="rbody"></div>';
  function set(a,b){ d1=a;d2=b;$('#r1').value=a;$('#r2').value=b;paint(); }
  $('#r1').onchange=e=>{d1=e.target.value;paint();};
  $('#r2').onchange=e=>{d2=e.target.value;paint();};
  $('#p7').onclick=()=>set(dateAdd(todayISO(),-6),todayISO());
  $('#p30').onclick=()=>set(dateAdd(todayISO(),-29),todayISO());
  $('#pm').onclick=()=>set(todayISO().slice(0,8)+'01',todayISO());
  $('#csv').onclick=()=>exportCSV(d1,d2);
  function paint(){
    const vs=S.ventas.filter(v=>v.estado!=='anulada'&&dISO(v.fecha)>=d1&&dISO(v.fecha)<=d2);
    const cs=S.compras.filter(c=>c.estado!=='anulada'&&c.fecha>=d1&&c.fecha<=d2);
    const tot=sum(vs,v=>v.total), cst=sum(vs,v=>v.costo||0), prop=sum(vs,v=>v.propina||0);
    /* por día */
    const days={}; vs.forEach(v=>{ const d=dISO(v.fecha); days[d]=(days[d]||0)+v.total; });
    const dayArr=Object.keys(days).sort().map(k=>({n:k.slice(5),v:days[k]}));
    /* top productos */
    const prods={};
    vs.forEach(v=>v.items.forEach(i=>{ const k=i.productoId;
      prods[k]=prods[k]||{n:i.nombre,q:0,v:0,c:0}; prods[k].q+=i.cant; prods[k].v+=i.precio*i.cant; prods[k].c+=(i.costo||0)*i.cant; }));
    const top=Object.values(prods).sort((a,b)=>b.v-a.v);
    /* categorías */
    const cats={};
    vs.forEach(v=>v.items.forEach(i=>{ const p=byId('productos',i.productoId); const c=p?nameOf('categorias',p.categoriaId):'Otros';
      cats[c]=(cats[c]||0)+i.precio*i.cant; }));
    /* medios */
    const med={}; vs.forEach(v=>{ if(v.credito) med['credito']=(med['credito']||0)+v.total;
      (v.pagos||[]).forEach(p=>med[p.medio]=(med[p.medio]||0)+p.monto); });
    /* horas */
    const hrs={}; vs.forEach(v=>{ const h=new Date(v.fecha).getHours(); hrs[h]=(hrs[h]||0)+v.total; });
    const hArr=Object.keys(hrs).sort((a,b)=>a-b).map(h=>({n:String(h).padStart(2,'0')+':00',v:hrs[h]}));
    /* consumo ingredientes */
    const cons={};
    S.movinv.filter(m=>m.tipo==='salida'&&dISO(m.fecha)>=d1&&dISO(m.fecha)<=d2)
      .forEach(m=>{cons[m.ingredienteId]=(cons[m.ingredienteId]||0)+
        (m.costoTotal!=null? Math.abs(m.costoTotal) : Math.abs(m.cantidad)*(m.costoUnit||0));});
    const consArr=Object.keys(cons).map(k=>({n:nameOf('ingredientes',k),v:cons[k]})).sort((a,b)=>b.v-a.v).slice(0,10);

    $('#rbody').innerHTML=
      '<div class="kpis" style="margin-bottom:14px">'+
        kpi('Ventas netas',money(tot),vs.length+' facturas','brand')+
        (verCostos()? kpi('Costo de ventas',money(cst),'',''):'')+
        (verCostos()? kpi('Utilidad bruta',money(tot-cst),tot?round((tot-cst)/tot*100,1)+'% margen':'','ok'):'')+
        kpi('Compras',money(sum(cs,c=>c.total)),cs.length+' facturas','bad')+
        kpi('Propinas',money(prop),'','')+
        kpi('Ticket promedio',money(vs.length?tot/vs.length:0),'','')+
      '</div>'+
      '<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(340px,1fr))">'+
        '<div class="card"><div class="hd"><h3>Ventas por día</h3></div><div class="bd">'+
          (dayArr.length?bars(dayArr):'<div class="empty">Sin datos</div>')+'</div></div>'+
        '<div class="card"><div class="hd"><h3>Por categoría</h3></div><div class="bd">'+
          (Object.keys(cats).length?bars(Object.keys(cats).map(k=>({n:k,v:cats[k]})).sort((a,b)=>b.v-a.v)):'<div class="empty">Sin datos</div>')+'</div></div>'+
        '<div class="card"><div class="hd"><h3>Medios de pago</h3></div><div class="bd">'+
          (Object.keys(med).length?bars(Object.keys(med).map(k=>{const x=MEDIOS.find(y=>y.k===k)||{};
            return {n:(x.e||'')+' '+(x.n||k),v:med[k],c:k==='credito'?'var(--warn)':'var(--info)'};}).sort((a,b)=>b.v-a.v)):'<div class="empty">Sin datos</div>')+'</div></div>'+
        '<div class="card"><div class="hd"><h3>Ventas por hora</h3></div><div class="bd">'+
          (hArr.length?bars(hArr):'<div class="empty">Sin datos</div>')+'</div></div>'+
        (verCostos()? '<div class="card"><div class="hd"><h3>Consumo de ingredientes (costo)</h3></div><div class="bd">'+
          (consArr.length?bars(consArr):'<div class="empty">Sin datos</div>')+'</div></div>':'')+
        '<div class="card"><div class="hd"><h3>Productos más vendidos</h3></div><div class="bd p0">'+tbl([
          {t:'Producto',f:p=>'<b>'+esc(p.n)+'</b>'},
          {t:'Cant.',num:1,f:p=>num(p.q,0)},
          {t:'Venta',num:1,f:p=>money(p.v)}
        ].concat(verCostos()? [
          {t:'Utilidad',num:1,f:p=>money(p.v-p.c)},
          {t:'Margen',num:1,f:p=>{const m=p.v?round((p.v-p.c)/p.v*100,1):0;
            return '<span class="pill '+(m>=50?'ok':m>=25?'warn':'bad')+'">'+m+'%</span>';}}]:[])
        ,top.slice(0,15),{empty:'Sin ventas'})+'</div></div>'+
      '</div>';
  }
  paint();
}
function csvEsc(v){ v=String(v==null?'':v); return /[",;\n]/.test(v)? '"'+v.replace(/"/g,'""')+'"' : v; }
function download(name,content,mime){
  const esCsv=!mime||/csv/i.test(mime);
  const b=new Blob([(esCsv?'﻿':'')+content],{type:(mime||'text/csv')+';charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},400);
}
function exportCSV(d1,d2){
  const rows=[['Fecha','Factura','Tipo','Mesa','Cliente','Cajero','Producto','Cantidad','Precio','Total linea','Costo linea','Medio','Estado']];
  S.ventas.filter(v=>dISO(v.fecha)>=d1&&dISO(v.fecha)<=d2).forEach(v=>{
    const medio=v.credito?'credito':(v.pagos||[]).map(p=>p.medio).join('+');
    v.items.forEach(i=> rows.push([fdate(v.fecha,true),v.no,v.tipo,nameOf('mesas',v.mesaId),
      v.clienteId?nameOf('clientes',v.clienteId):'',nameOf('usuarios',v.usuarioId),i.nombre,i.cant,i.precio,
      round(i.precio*i.cant,2),round((i.costo||0)*i.cant,2),medio,v.estado]));
  });
  download('ventas_'+d1+'_'+d2+'.csv', rows.map(r=>r.map(csvEsc).join(';')).join('\n'));
  toast('CSV descargado','ok');
}

async function diagnosticoNube(){
  const lineas=[];
  const paso=async(nombre,fn)=>{ try{ const r=await fn(); lineas.push(['ok',nombre,r||'correcto']); }
    catch(e){ lineas.push(['bad',nombre,fbErr(e)]); throw e; } };
  const pintar=()=>{ const el=$('#diagout'); if(!el) return;
    el.innerHTML=lineas.map(l=>'<div class="row" style="gap:8px;padding:5px 0;border-bottom:1px solid var(--line2)">'+
      '<span class="pill '+(l[0]==='ok'?'ok':'bad')+'">'+(l[0]==='ok'?'✓':'✕')+'</span>'+
      '<b style="flex:0 0 150px">'+esc(l[1])+'</b><span class="tiny muted">'+esc(l[2])+'</span></div>').join(''); };
  modal({title:'Diagnóstico de la nube',
    body:'<div id="diagout"><div class="hintx">Probando…</div></div>',
    footer:'<button class="btn danger" id="dg_res">Problemas con este equipo</button>'+
      '<div class="spacer"></div><button class="btn" data-x>Cerrar</button>'});
  $('#dg_res').onclick=()=>{ closeModal(); mRecuperarAcceso(); };
  try{
    await paso('Cómo se abrió',async()=>{
      if(location.protocol==='file:') return 'como archivo local (file://) · puede bloquear Firebase';
      return 'desde un servidor ('+location.protocol+'//'+location.host+') · correcto';
    });
    pintar();
    await paso('Internet',async()=>{ if(!navigator.onLine) throw new Error('El navegador se reporta sin conexión'); return 'en línea'; });
    pintar();
    await paso('Configuración',async()=>{ if(!S.cfg.fbApiKey) throw new Error('Falta la API key');
      if(!S.cfg.fbProjectId) throw new Error('Falta el Project ID'); return S.cfg.fbProjectId; });
    pintar();
    await paso('Alcance de Firebase',async()=>{
      const r=await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signInWithPassword?key='+
        encodeURIComponent(S.cfg.fbApiKey),{method:'POST',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({email:'diagnostico@pos.local',password:'x',returnSecureToken:true})});
      await r.json().catch(()=>({}));
      return 'el navegador alcanza los servidores';
    });
    pintar();
    await paso('Sesión',async()=>{ if(!FB.listo() && !(await fbRestaurarSesion())) throw new Error('Sin sesión iniciada');
      return FB.email; });
    pintar();
    await paso('Lectura de Firestore',async()=>{
      const hdr=await fbAuthHdr();
      const q={structuredQuery:{from:[{collectionId:'ventas'}],limit:1}};
      const res=await fbJson(fbUrl('/negocios/'+(S.cfg.fbNegocio||'principal')+':runQuery'),
        {method:'POST',headers:hdr,body:JSON.stringify(q)});
      return 'reglas OK · '+((res||[]).filter(r=>r&&r.document).length)+' documento(s) de muestra';
    });
    pintar();
    await paso('Escritura de Firestore',async()=>{
      const hdr=await fbAuthHdr();
      await fbJson(fbUrl(':commit'),{method:'POST',headers:hdr,body:JSON.stringify({writes:[{update:{
        name:fbDocRoot()+'/_diagnostico/ping', fields:fsFields({id:'ping',upd:now(),equipo:navigator.userAgent.slice(0,60)})}}]})});
      return 'escritura permitida';
    });
    pintar();
    lineas.push(['ok','Resultado','Todo listo para sincronizar']);
    pintar();
  }catch(e){
    const m=String(e.message||e);
    let quehacer='';
    if(/Failed to fetch|NetworkError|Load failed/i.test(m)){
      quehacer = location.protocol==='file:'
        ? 'El navegador bloquea Firebase cuando la app se abre como archivo. Publícala en Firebase Hosting (o ábrela desde un servidor) y vuelve a probar.'
        : (navigator.onLine? 'Hay internet pero Firebase no respondió. Revisa el Project ID y la API key.'
                           : 'No hay internet. El POS sigue funcionando y sube todo cuando vuelva.');
    }
    else if(m==='SIN_PERFIL') quehacer='La cuenta existe pero no tiene restaurante asignado. Asígnalo desde el panel del superadministrador.';
    else if(/Sin sesión/.test(m)) quehacer='Falta entrar con tu correo y clave. Lo demás está bien hasta aquí.';
    else if(/permission|PERMISSION/i.test(m)) quehacer='Las reglas de Firestore están rechazando la operación. Vuelve a publicarlas.';
    if(quehacer) lineas.push(['bad','Qué hacer',quehacer]);
    pintar();
  }
}


/* ================= MULTI-RESTAURANTE · perfiles de nube ================
   usuariosNube/{uid}   -> { email, nombre, rol:'superadmin'|'admin', negocioId, activo }
   negocios/{negocioId} -> ficha del restaurante
   negocios/{negocioId}/{coleccion}/{doc} -> toda la operación de ese local
   ====================================================================== */
async function fbGet(ruta){
  const hdr=await fbAuthHdr();
  const r=await fetch(fbUrl('/'+ruta),{headers:hdr});
  if(r.status===404) return null;
  let j={}; try{ j=await r.json(); }catch(e){}
  if(!r.ok) throw new Error((j.error&&(j.error.message||j.error.status))||('HTTP '+r.status));
  return fsDoc(j.fields||{});
}
async function fbSet(ruta,obj){
  const hdr=await fbAuthHdr();
  await fbJson(fbUrl(':commit'),{method:'POST',headers:hdr,body:JSON.stringify({writes:[{update:{
    name:'projects/'+S.cfg.fbProjectId+'/databases/(default)/documents/'+ruta,
    fields:fsFields(Object.assign({},obj,{upd:now()}))}}]})});
  return obj;
}
async function fbLista(coleccion,limite){
  const hdr=await fbAuthHdr();
  const res=await fbJson(fbUrl(':runQuery'),{method:'POST',headers:hdr,
    body:JSON.stringify({structuredQuery:{from:[{collectionId:coleccion}],limit:limite||300}})});
  return (res||[]).filter(r=>r&&r.document).map(r=>fsDoc(r.document.fields));
}

   desde CUALQUIER equipo sin que el administrador tenga que abrirlo primero. */
async function darAccesoNube(u,clave){
  if(!S.cfg.fbOn) throw new Error('SIN_NUBE');
  const neg=negocioActual();
  if(!neg) throw new Error('SIN_NEGOCIO');

  const cta=await fbCrearCuenta(u.email,clave);
  await fbSet('usuariosNube/'+cta.uid,{id:cta.uid,uid:cta.uid,email:u.email,
    nombre:u.nombre||u.email, rol:u.rol||'cajero', negocioId:neg, activo:u.activo!==false});
  u.uidNube=cta.uid; put('usuarios',u);

async function resolverPerfil(){

  let p=null;
  try{ p=await fbGet('usuariosNube/'+FB.uid); }catch(e){ if(!soySuper) throw e; }
  if(soySuper){
    p=Object.assign({id:FB.uid,uid:FB.uid,email:FB.email,nombre:'Superadministrador',negocioId:''},p||{},
                    {rol:'superadmin',activo:true});
    try{ await fbSet('usuariosNube/'+FB.uid,p); }catch(e){ console.warn('perfil super',e); }
  }
  if(!p) throw new Error('SIN_PERFIL');
  if(p.activo===false) throw new Error('CUENTA_INACTIVA');
  S.perfil=p; guardarPerfil();
  return p;
}

/* ------------------- suscripción de cada restaurante ------------------ */
function venceMsDe(iso){ return iso? Date.parse(iso+'T23:59:59') : 0; }
function diasRestantes(n){
  if(!n||!n.vence) return null;
  return Math.ceil((venceMsDe(n.vence)-Date.now())/86400000);
}
function estadoNegocio(n){
  if(!n) return {k:'?',t:'—',pill:''};
  if(n.activo===false) return {k:'suspendido',t:'Suspendido',pill:'bad'};
  const d=diasRestantes(n);
  if(d===null) return {k:'sinplan',t:'Sin fecha',pill:'warn'};
  if(d<0) return {k:'vencido',t:'Vencido hace '+Math.abs(d)+'d',pill:'bad'};
  if(d<=7) return {k:'porvencer',t:'Vence en '+d+'d',pill:'warn'};
  return {k:'activo',t:'Activo · '+d+'d',pill:'ok'};
}
function vigente(n){ const e=estadoNegocio(n); return e.k==='activo'||e.k==='porvencer'; }
function mesesMas(iso,meses){
  const base=new Date(Math.max(Date.now(), venceMsDe(iso)||Date.now()));
  const d=new Date(base.getFullYear(), base.getMonth()+Number(meses||1), base.getDate(), 12);
  return dISO(d);
}

/* ================================ INGRESO =============================
   Un solo formulario: correo y clave. Sirve para la cuenta de la nube
   (superadmin y administradores) y para el personal del restaurante,
   que queda guardado en el propio local y puede entrar sin internet.
   ==================================================================== */
let _offline=false;

async function hashClave(clave,sal){
  const txt=(sal||'')+'|'+String(clave||'');
  try{
    const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(txt));
    return Array.from(new Uint8Array(buf)).map(x=>x.toString(16).padStart(2,'0')).join('');
  }catch(e){                                   // navegador sin WebCrypto
    let h1=0x811c9dc5,h2=0x1000193;
    for(let i=0;i<txt.length;i++){ h1=(h1^txt.charCodeAt(i))>>>0; h1=(h1*0x01000193)>>>0;
      h2=(h2+txt.charCodeAt(i)*(i+7))>>>0; }
    return ('0000000'+h1.toString(16)).slice(-8)+('0000000'+h2.toString(16)).slice(-8);
  }
}
async function fijarClave(u,clave){
  u.sal=u.sal||uid('s');
  u.clave=await hashClave(clave,u.sal);
  return u;
}
async function claveOk(u,clave){
  if(!u||!u.clave) return false;
  return (await hashClave(clave,u.sal||''))===u.clave;
}
const norm=e=>String(e||'').trim().toLowerCase();
function usuarioPorCorreo(em){ return S.usuarios.find(u=>u.activo&&norm(u.email)===norm(em))||null; }

/* Ventas viejas donde se guardó como pago el billete completo que entregó
   el cliente en vez de lo que valía la venta: la caja quedó inflada con el
   vuelto. Se detectan y se corrigen, incluido el movimiento de tesorería. */
function ventasConVuelto(){
  return S.ventas.filter(v=>v.estado!=='anulada' &&
    round(sum(v.pagos||[],p=>p.monto),2) > round((v.total||0)+0.5,2));
}
function repararVueltos(){
  if(!puedeEditar()) return pedirAlAdmin('corregir cobros');
  const vs=ventasConVuelto();
  if(!vs.length) return toast('No hay cobros con el vuelto mal registrado','ok',3500);
  const sobra=round(sum(vs,v=>sum(v.pagos||[],p=>p.monto)-(v.total||0)),2);
  confirmar('Encontré '+vs.length+' venta(s) donde quedó guardado el billete completo en vez del valor de la venta. '+
    'En total la caja tiene '+money(sobra)+' de más. ¿Lo corrijo? Se ajustan las ventas y los movimientos de caja.',()=>{
    const usados={};
    vs.forEach(v=>{
      let resta=round(v.total||0,2);
      (v.pagos||[]).forEach(p=>{
        const antes=round(p.monto,2);
        const aplica=round(Math.min(antes,Math.max(0,resta)),2);
        if(p.recibido==null) p.recibido=antes;
        p.monto=aplica; resta=round(resta-aplica,2);
        if(Math.abs(aplica-antes)<0.005) return;
        const mv=S.movimientos.find(x=>x.refTipo==='venta' && x.refId===v.id && !usados[x.id]
          && Math.abs(x.monto-antes)<0.5);
        if(mv){ usados[mv.id]=1;
          if(aplica<=0.5) remove('movimientos',mv.id);
          else { mv.monto=aplica; put('movimientos',mv); } }
      });
      put('ventas',v);
    });
    render(); toast('Listo: quité '+money(sobra)+' que eran vueltos, no ventas','ok',6000);
  },true);
}

/* Quita los pagos que se registraron sobre un documento que ya estaba
   pagado de contado, y devuelve esa plata a la cuenta de donde salió. */
function quitarPagosDobles(d){
  if(!d) return;
  if(!puedeEditar()) return pedirAlAdmin('corregir pagos');
  const dobles=pagosDobles(d);
  if(!dobles.length) return toast('Este documento no tiene pagos repetidos','warn');
  const tot=round(sum(dobles,a=>a.monto),2);
  confirmar('¿Quitar '+dobles.length+' pago(s) por '+money(tot)+' que se registraron de más en '+
    (d.no||'este documento')+'? La plata vuelve a la cuenta.',()=>{
    dobles.forEach(a=>{
      const m=S.movimientos.find(x=>x.refId===d.id && (x.refTipo==='cxp'||x.refTipo==='cxc')
        && Math.abs(x.monto-a.monto)<0.5);
      if(m) remove('movimientos',m.id);
      remove('abonos',a.id);
    });
    d.estado='pagada'; put(coleccionDoc(d),d);
    render(); toast('Listo: quité '+money(tot)+' que estaban de más','ok',5000);
  },true);
}

/* ===================== MODO PRUEBA (banco de pruebas) =================
   Carga un respaldo — el de otro restaurante, uno viejo, el que sea — y
   deja jugar con él SIN tocar la nube y SIN perder lo que había. Todo lo
   real se guarda antes en el equipo y vuelve intacto al salir.
   ==================================================================== */
function datosActuales(){
  const d={version:1,fecha:now(),cfg:S.cfg,meta:S.meta,outbox:S.outbox.slice()};
  COLL.forEach(k=>d[k]=S[k]);
  return d;
}
function cargarDatos(d,opts){
  opts=opts||{};
  const cfgViejo=S.cfg;
  const nuevo=Object.assign({},DEFCFG,d.cfg||{});
  delete nuevo.prueba;                      // la marca de prueba nunca viaja en un archivo
  (opts.conservar||[]).forEach(k=>{ nuevo[k]=cfgViejo[k]; });
  S.cfg=nuevo; S.cfg.id='cfg'; idbPut('config',S.cfg); applyCfg();
  S.meta=d.meta||{id:'meta',cons:{}}; saveMeta();
  COLL.forEach(k=>{
    (S[k]||[]).forEach(o=>idbDel(k,o.id));           // fuera lo que había
    S[k]=(d[k]||[]).slice();
    S[k].forEach(o=>idbPut(k,o));
  });
  S.outbox.forEach(o=>idbDel('outbox',o.id));
  S.outbox=(opts.outbox||[]).slice();
  S.outbox.forEach(o=>idbPut('outbox',o));
  flushIDB();
  S.cart=null; S.turno=turnoAbierto();
  /* si el usuario con el que estaba adentro no existe en estos datos,
     que vuelva a entrar con los de aquí */
  if(S.user && !S.user._super && !byId('usuarios',S.user.id)) logout();
}
function guardarSnap(nombre,datos){
  return new Promise(res=>{
    let ok=true;
    try{ idbPut('meta',{id:nombre, json:JSON.stringify(datos), fecha:now()}); flushIDB(); }
    catch(e){ ok=false; }
    setTimeout(()=>res(ok),120);
  });
}
async function leerSnap(nombre){
  try{
    const todo=await idbAll('meta');
    const r=(todo||[]).find(x=>x&&x.id===nombre);
    return r && r.json? JSON.parse(r.json) : null;
  }catch(e){ return null; }
}
function borrarSnap(nombre){ try{ idbDel('meta',nombre); }catch(e){} }
