      '<xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'+
      '<xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/>'+
      '<xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/>'+
      '<xf numFmtId="0" fontId="2" fillId="0" borderId="0" xfId="0" applyFont="1"/>'+
      '</cellXfs>'+
      '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>'+
      '</styleSheet>'}
  ];
  hojas.forEach((h,i)=> partes.push({nombre:'xl/worksheets/sheet'+(i+1)+'.xml', datos:sheetXml(h)}));
  const zip=zipCrear(partes.map(p=>({nombre:p.nombre, datos:enc.encode(p.datos)})));
  const blob=new Blob([zip],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=archivo.replace(/\.xlsx$/i,'')+'.xlsx';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},600);
  toast('Excel descargado','ok');
}


/* ======================= LEER ARCHIVOS .XLSX ==========================
   Descomprime el ZIP con DecompressionStream (va en el navegador, sin
   librerías) y arma las filas de cada hoja. También acepta CSV.
   ==================================================================== */
async function inflarRaw(buf){
  const ds=new DecompressionStream('deflate-raw');
  const stream=new Blob([buf]).stream().pipeThrough(ds);
  return new Uint8Array(await new Response(stream).arrayBuffer());
}
async function zipLeer(ab){
  const d=new DataView(ab), u8=new Uint8Array(ab);
  /* buscar el fin del directorio central */
  let eo=-1;
  for(let i=u8.length-22;i>=0 && i>u8.length-66000;i--){
    if(d.getUint32(i,true)===0x06054b50){ eo=i; break; }
  }
  if(eo<0) throw new Error('El archivo no parece un Excel válido');
  const n=d.getUint16(eo+10,true);
  let p=d.getUint32(eo+16,true);
  const out=new Map(), dec=new TextDecoder();
  for(let k=0;k<n;k++){
    if(d.getUint32(p,true)!==0x02014b50) break;
    const metodo=d.getUint16(p+10,true);
    const tamComp=d.getUint32(p+20,true);
    const ln=d.getUint16(p+28,true), le=d.getUint16(p+30,true), lc=d.getUint16(p+32,true);
    const off=d.getUint32(p+42,true);
    const nombre=dec.decode(u8.subarray(p+46,p+46+ln));
    /* cabecera local para saber dónde empiezan los datos */
    const lln=d.getUint16(off+26,true), lle=d.getUint16(off+28,true);
    const ini=off+30+lln+lle;
    out.set(nombre,{metodo:metodo, datos:u8.subarray(ini,ini+tamComp)});
    p+=46+ln+le+lc;
  }
  return out;
}
async function zipTexto(zip,nombre){
  const e=zip.get(nombre); if(!e) return null;
  const bytes = e.metodo===0? e.datos : await inflarRaw(e.datos);
  return new TextDecoder('utf-8').decode(bytes);
}
function colNum(ref){                       // "BC12" -> 54 (índice 0)
  const m=String(ref||'').match(/^([A-Z]+)/); if(!m) return 0;
  let n=0; for(const ch of m[1]) n=n*26+(ch.charCodeAt(0)-64);
  return n-1;
}
async function leerXlsx(file){
  const ab=await file.arrayBuffer();
  const zip=await zipLeer(ab);
  const par=new DOMParser();
  /* cadenas compartidas */
  const shTxt=await zipTexto(zip,'xl/sharedStrings.xml');
  const shared=[];
  if(shTxt){
    const doc=par.parseFromString(shTxt,'application/xml');
    Array.from(doc.getElementsByTagName('si')).forEach(si=>{
      shared.push(Array.from(si.getElementsByTagName('t')).map(t=>t.textContent).join(''));
    });
  }
  /* nombre de hoja -> archivo */
  const wbTxt=await zipTexto(zip,'xl/workbook.xml');
  const relTxt=await zipTexto(zip,'xl/_rels/workbook.xml.rels');
  if(!wbTxt) throw new Error('El archivo no tiene hojas');
  const wb=par.parseFromString(wbTxt,'application/xml');
  const rels={};
  if(relTxt){ const rd=par.parseFromString(relTxt,'application/xml');
    Array.from(rd.getElementsByTagName('Relationship')).forEach(r=>{
      rels[r.getAttribute('Id')]=r.getAttribute('Target'); }); }
  const hojas={};
  const nodos=Array.from(wb.getElementsByTagName('sheet'));
  for(let i=0;i<nodos.length;i++){
    const sh=nodos[i];
    const nom=sh.getAttribute('name');
    const rid=sh.getAttribute('r:id')||sh.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id');
    let destino=rels[rid]||('worksheets/sheet'+(i+1)+'.xml');
    destino=String(destino).replace(/^\//,'').replace(/^xl\//,'');
    const txt=await zipTexto(zip,'xl/'+destino);
    if(!txt) continue;
    const doc=par.parseFromString(txt,'application/xml');
    const filas=[];
    Array.from(doc.getElementsByTagName('row')).forEach(row=>{
      const f=[];
      Array.from(row.getElementsByTagName('c')).forEach(c=>{
        const idx=colNum(c.getAttribute('r'));
        const t=c.getAttribute('t');
        let v='';
        if(t==='inlineStr'){ v=Array.from(c.getElementsByTagName('t')).map(x=>x.textContent).join(''); }
        else { const vn=c.getElementsByTagName('v')[0]; const raw=vn? vn.textContent:'';
          if(t==='s') v=shared[Number(raw)]!==undefined? shared[Number(raw)]:'';
          else if(t==='b') v = raw==='1'?'TRUE':'FALSE';
          else v=raw; }
        f[idx]=v;
      });
      filas.push(f);
    });
    hojas[nom]=filas;
  }
  return hojas;
}
function leerCsvTexto(txt){
  const sep = (txt.split('\n')[0].match(/;/g)||[]).length >= (txt.split('\n')[0].match(/,/g)||[]).length ? ';' : ',';
  const filas=[]; let f=[], cel='', dentro=false;
  for(let i=0;i<txt.length;i++){
    const ch=txt[i];
    if(dentro){
      if(ch==='"'){ if(txt[i+1]==='"'){ cel+='"'; i++; } else dentro=false; }
      else cel+=ch;
    } else if(ch==='"') dentro=true;
    else if(ch===sep){ f.push(cel); cel=''; }
    else if(ch==='\n'){ f.push(cel); filas.push(f); f=[]; cel=''; }
    else if(ch!=='\r') cel+=ch;
  }
  if(cel.length||f.length){ f.push(cel); filas.push(f); }
  return filas;
}
async function leerTabla(file){
  if(/\.csv$/i.test(file.name)){
    const txt=await file.text();
    return {'Hoja1': leerCsvTexto(txt.replace(/^﻿/,''))};
  }
  return await leerXlsx(file);
}

/* ===================== BUSCADOR TIPO GOOGLE + ALTA RÁPIDA =============
   Campo de texto que filtra mientras escribes: sin tildes, sin importar
   mayúsculas ni el orden de las palabras ("juan per" encuentra "Pérez,
   Juan Carlos"). Si lo que escribiste no existe, ofrece crearlo ahí mismo.
   ==================================================================== */
function normTxt(t){ return String(t==null?'':t).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''); }
function buscaTokens(hay,q){
  const h=normTxt(hay), ts=normTxt(q).split(/\s+/).filter(Boolean);
  return !ts.length || ts.every(t=>h.indexOf(t)>=0);
}
function puntaje(hay,q){
  const h=normTxt(hay), n=normTxt(q).trim();
  if(!n) return 0;
  if(h===n) return 100;
  if(h.indexOf(n)===0) return 80;
  if((' '+h).indexOf(' '+n)>=0) return 60;
  if(h.indexOf(n)>=0) return 40;
  return 10;
}
function resaltar(txt,q){
  const ts=normTxt(q).split(/\s+/).filter(Boolean);
  if(!ts.length) return esc(txt);
  const plano=normTxt(txt); const marcas=new Array(txt.length).fill(false);
  ts.forEach(t=>{ let i=plano.indexOf(t);
    while(i>=0){ for(let k=i;k<i+t.length&&k<marcas.length;k++) marcas[k]=true; i=plano.indexOf(t,i+t.length); } });
  let out='',abierta=false;
  for(let i=0;i<txt.length;i++){
    if(marcas[i]&&!abierta){ out+='<mark>'; abierta=true; }
    if(!marcas[i]&&abierta){ out+='</mark>'; abierta=false; }
    out+=esc(txt[i]);
  }
  return out+(abierta?'</mark>':'');
}

function combo(cont,o){
  o=Object.assign({lista:[],valor:'',placeholder:'Escribe para buscar…',vacio:'',
                   etiqueta:x=>x.nombre, sub:null, crear:null, onPick:null, max:60},o);
  let val=o.valor||'', filtro='', idx=-1, abierto=false, creando=false;
  cont.classList.add('cbx');
  cont.innerHTML='<input class="cbx-in" placeholder="'+esc(o.placeholder)+'" autocomplete="off" spellcheck="false">'+
                 '<button class="cbx-x" type="button" title="Limpiar">✕</button>'+
                 '<div class="cbx-pop hide"></div>';
  const inp=$('.cbx-in',cont), pop=$('.cbx-pop',cont), bx=$('.cbx-x',cont);
  const item=id=>o.lista.find(x=>String(x.id)===String(id));
  const texto=()=>{ const it=item(val); return it? o.etiqueta(it):''; };

  function lista(){
    const q=filtro.trim();
    let l=o.lista.filter(x=>!q||buscaTokens(o.etiqueta(x)+' '+(o.sub?o.sub(x):''),q));
    if(q) l=l.slice().sort((a,b)=>puntaje(o.etiqueta(b),q)-puntaje(o.etiqueta(a),q));
    return l.slice(0,o.max);
  }
  function pintar(){
    const q=filtro.trim(), l=lista();
    const exacto=l.some(x=>normTxt(o.etiqueta(x))===normTxt(q));
    let h='';
    if(o.vacio && !q) h+='<div class="cbx-it" data-i="-2"><span class="muted">'+esc(o.vacio)+'</span></div>';
    l.forEach((x,i)=>{
      h+='<div class="cbx-it'+(i===idx?' on':'')+'" data-i="'+i+'">'+
         '<div>'+resaltar(o.etiqueta(x),q)+'</div>'+
         (o.sub&&o.sub(x)? '<div class="cbx-sub">'+esc(o.sub(x))+'</div>':'')+'</div>';
    });
    if(!l.length && !q) h+='<div class="cbx-vacio">Sin registros todavía</div>';
    if(!l.length && q && !o.crear) h+='<div class="cbx-vacio">Nada coincide con «'+esc(q)+'»</div>';
    if(o.crear && q && !exacto){
      h+='<div class="cbx-it cbx-nuevo'+(idx===l.length?' on':'')+'" data-i="'+l.length+'">'+
         '<div><b>➕ Crear «'+esc(q)+'»</b></div>'+
         (o.crear.nota? '<div class="cbx-sub">'+esc(o.crear.nota)+'</div>':'')+'</div>';
    }
    pop.innerHTML=h;
    $$('.cbx-it',pop).forEach(d=> d.onmousedown=e=>{ e.preventDefault(); elegir(Number(d.dataset.i)); });
  }
  function abrir(){ if(abierto) return; abierto=true; pop.classList.remove('hide'); idx=-1; pintar(); }
  function cerrar(){ abierto=false; creando=false; pop.classList.add('hide'); inp.value=texto(); filtro=''; }
  function fijar(id,avisar){
    val=id||''; inp.value=texto(); filtro='';
    bx.style.display = val? 'block':'none';
    if(avisar!==false && o.onPick) o.onPick(val, item(val));
  }
  function elegir(i){
    const l=lista();
    if(i===-2){ fijar(''); cerrar(); return; }
    if(i<l.length){ fijar(l[i].id); cerrar(); return; }
    abrirCreacion();
  }
  function abrirCreacion(){
    const q=filtro.trim(); if(!q||!o.crear) return;
    const campos=o.crear.campos||[];
    if(!campos.length){ hacerCrear(q,{}); return; }
    creando=true;
    pop.innerHTML='<div class="cbx-form"><div class="cbx-sub" style="margin-bottom:8px">Crear <b>'+esc(q)+'</b></div>'+
      campos.map(c=> '<label class="cbx-lb">'+esc(c.label)+
        (c.opciones? '<select data-k="'+esc(c.k)+'">'+c.opciones.map(op=>
            '<option value="'+esc(op)+'"'+(op===c.valor?' selected':'')+'>'+esc(op)+'</option>').join('')+'</select>'
          : '<input data-k="'+esc(c.k)+'" type="'+(c.tipo||'text')+'" value="'+esc(c.valor==null?'':c.valor)+'">')+
        '</label>').join('')+
      '<div class="row" style="margin-top:9px"><button class="btn pri sm" data-ok>Crear y usar</button>'+
      '<button class="btn sm" data-no>Cancelar</button></div></div>';
    const prim=$('input,select',pop); if(prim) setTimeout(()=>prim.focus(),20);
    $('[data-ok]',pop).onmousedown=e=>{ e.preventDefault();
      const datos={}; $$('[data-k]',pop).forEach(el=>datos[el.dataset.k]=el.value); hacerCrear(q,datos); };
    $('[data-no]',pop).onmousedown=e=>{ e.preventDefault(); creando=false; pintar(); inp.focus(); };
    $$('input,select',pop).forEach(el=> el.onkeydown=ev=>{ if(ev.key==='Enter'){ ev.preventDefault(); $('[data-ok]',pop).onmousedown(ev); } });
  }
  function hacerCrear(q,datos){
    let id=null;
    try{ id=o.crear.fn(q,datos); }catch(e){ toast(String(e.message||e),'bad'); return; }
    if(!id) return;
    o.lista=o.crear.lista? o.crear.lista() : o.lista;
    fijar(id); cerrar();
    toast('Creado: '+q,'ok');
  }

  inp.oninput=()=>{ filtro=inp.value; creando=false; abrir(); idx=filtro.trim()?0:-1; pintar(); };
  inp.onfocus=()=>{ filtro=''; inp.value=''; abrir(); };
  inp.onblur=()=>setTimeout(()=>{ if(!creando) cerrar(); },140);
  inp.onkeydown=e=>{
    if(creando) return;
    const l=lista(), tope=l.length+((o.crear&&filtro.trim())?1:0)-1;
    if(e.key==='ArrowDown'){ e.preventDefault(); abrir(); idx=Math.min(tope,idx+1); pintar(); desplazar(); }
    else if(e.key==='ArrowUp'){ e.preventDefault(); idx=Math.max(0,idx-1); pintar(); desplazar(); }
    else if(e.key==='Enter'){ if(abierto){ e.preventDefault(); elegir(idx<0?0:idx); } }
    else if(e.key==='Escape'){ cerrar(); inp.blur(); }
  };
  function desplazar(){ const el=$('.cbx-it.on',pop); if(el&&el.scrollIntoView) el.scrollIntoView({block:'nearest'}); }
  bx.onmousedown=e=>{ e.preventDefault(); fijar(''); cerrar(); };

  fijar(val,false);
  return { valor:()=>val, fijar:(id)=>fijar(id,false),
           refrescar:(nueva)=>{ if(nueva) o.lista=nueva; inp.value=texto(); } };
}

/* ================================= POS ================================ */
function newCart(o){ return Object.assign({comandaId:null,mesaId:null,tipo:'mostrador',items:[],bajas:[],cocinaMs:null,
  clienteId:'',descuento:0,propinaPct:S.cfg.propinaAuto?(Number(S.cfg.propina)||0):0,nota:''},o||{}); }
function cartTot(c){
  c=c||S.cart; if(!c) return {sub:0,desc:0,base:0,neto:0,imp:0,prop:0,total:0,uds:0,costo:0};
  const sub=round(sum(c.items,i=>i.precio*i.cant),2);
  const desc=round(Number(c.descuento)||0,2);
  const base=Math.max(0,round(sub-desc,2));
  const d=desglose(base);
  const prop=round(base*(Number(c.propinaPct)||0)/100,2);
  const costo=round(sum(c.items,i=>costoProducto(byId('productos',i.productoId))*i.cant),2);
  return {sub:sub,desc:desc,base:base,neto:d.neto,imp:d.imp,prop:prop,total:round(base+prop,2),
          uds:sum(c.items,i=>i.cant),costo:costo};
}
function cartAdd(pid){
  if(!S.cart) S.cart=newCart();
  const p=byId('productos',pid); if(!p) return;
  const disp=maxPorReceta(p);
  const enCarro=sum(S.cart.items.filter(i=>i.productoId===pid),i=>i.cant);
  if(disp!==Infinity && enCarro+1>disp){ toast('Sin ingredientes suficientes para "'+p.nombre+'"','warn'); return; }
  /* Cada vez que se toca el producto entra como línea nueva: el mismo plato
     se puede pedir de formas distintas (uno sin cebolla, otro bien asado).
     Para sumar cantidad de lo mismo está el + de la línea. */
  S.cart.items.push({id:uid('it'),productoId:pid,nombre:p.nombre,
    precio:Number(p.precio)||0,cant:1,nota:'',env:0,envNota:''});
  paintCart(); persistComanda();
  if(esMovil() && navigator.vibrate) try{ navigator.vibrate(12); }catch(e){}
}
function cartQty(itId,d){
  const it=S.cart.items.find(i=>i.id===itId); if(!it) return;
  if(d<0) bajaComanda(it, Math.min(-d, (it.env||0)-Math.max(0,it.cant+d)));
  it.cant+=d;
  if(it.cant<=0) S.cart.items=S.cart.items.filter(i=>i.id!==itId);
  paintCart(); persistComanda();
}
function cartDel(itId){
  const it=S.cart.items.find(i=>i.id===itId);
  if(it) bajaComanda(it,it.env||0);
  S.cart.items=S.cart.items.filter(i=>i.id!==itId); paintCart(); persistComanda();
}
/* Si se quita algo que la cocina ya está preparando, queda anotado para
   avisarle en la próxima comanda. */
function bajaComanda(it,cant){
  const n=Math.min(Math.max(0,cant), it.env||0);
  if(!n || !S.cart) return;
  S.cart.bajas=(S.cart.bajas||[]).concat([{nombre:it.nombre,cant:n,nota:it.nota||''}]);
  it.env=(it.env||0)-n;
}

function viewPOS(vw){
  if(!S.cart) S.cart=newCart();

  vw.innerHTML =

function paintCats(){
  const el=$('#poscats'); if(!el) return;
  const cats=S.categorias.filter(c=>c.activo).sort((a,b)=>(a.orden||0)-(b.orden||0));
  el.innerHTML='<button data-c="all" class="'+(S.posCat==='all'?'on':'')+'">Todo</button>'+
    cats.map(c=>'<button data-c="'+c.id+'" class="'+(S.posCat===c.id?'on':'')+'">'+(c.emoji||'')+' '+esc(c.nombre)+'</button>').join('');
  $$('button',el).forEach(b=> b.onclick=()=>{ S.posCat=b.dataset.c; paintCats(); paintGrid(); });
}
function paintGrid(){
  const el=$('#posgrid'); if(!el) return;
  const q=(S.posQ||'').toLowerCase().trim();
  let ps=S.productos.filter(p=>p.activo);
  if(S.posCat!=='all') ps=ps.filter(p=>p.categoriaId===S.posCat);
  if(q) ps=ps.filter(p=>p.nombre.toLowerCase().indexOf(q)>=0);
  const ord=c=>{const x=byId('categorias',c);return x?(x.orden||0):99;};
  ps.sort((a,b)=> ord(a.categoriaId)-ord(b.categoriaId) || (a.orden||0)-(b.orden||0) || a.nombre.localeCompare(b.nombre));
  if(!ps.length){ el.innerHTML='<div class="empty" style="grid-column:1/-1"><span class="ico">🔎</span>Sin productos</div>'; return; }
  el.innerHTML=ps.map(p=>{
    const d=maxPorReceta(p);
    const st = d===0? '<span class="st no">Agotado</span>' : (d!==Infinity && d<=5? '<span class="st low">'+d+'</span>':'');
    const u=urlImg(p.id);
    return '<button class="pcard '+(d===0?'out':'')+'" data-p="'+p.id+'">'+st+
      (u? '<img class="foto" src="'+u+'" alt="" loading="lazy">'
        : '<div class="em">'+(p.emoji||'🍽️')+'</div>')+
      '<div class="nm">'+esc(p.nombre)+'</div>'+
      '<div class="pr">'+money(p.precio)+'</div></button>';
  }).join('');
  $$('.pcard',el).forEach(b=> b.onclick=()=>cartAdd(b.dataset.p));
}

/* Qué le falta saber a la cocina de este pedido: lo que se agregó después
   de la última comanda, las notas que cambiaron y lo que se quitó. */
function pendientesComanda(c){
  c=c||S.cart;
  const vacio={nuevos:[],cambios:[],bajas:[],yaEnviado:false,uds:0};
  if(!c) return vacio;
  const nuevos=[], cambios=[];
  let yaEnviado=!!(c.bajas&&c.bajas.length);
  (c.items||[]).forEach(i=>{
    const env=Number(i.env)||0;
    if(env>0) yaEnviado=true;
    if(i.cant>env) nuevos.push(Object.assign({},i,{cant:i.cant-env}));
    else if(env>0 && (i.nota||'')!==(i.envNota||'')) cambios.push(Object.assign({},i));
  });
  return {nuevos:nuevos, cambios:cambios, bajas:(c.bajas||[]).slice(), yaEnviado:yaEnviado,
          uds:sum(nuevos,i=>i.cant)+sum(cambios,i=>i.cant)+sum(c.bajas||[],i=>i.cant)};
}
function marcarEnviado(c){
  c=c||S.cart; if(!c) return;
  (c.items||[]).forEach(i=>{ i.env=i.cant; i.envNota=i.nota||''; });
  c.bajas=[];
}
/* Manda a cocina SOLO lo que falta. Si ya se había comandado, sale una
   comanda de agregado, no el pedido completo otra vez. */
function enviarACocina(){
  const c=S.cart; if(!c) return;
  const d=pendientesComanda(c);
  if(!d.nuevos.length && !d.cambios.length && !d.bajas.length)
    return toast('La cocina ya tiene todo este pedido','warn',3500);
  const mesa=c.mesaId? byId('mesas',c.mesaId):null;
  const dest=mesa? mesa.nombre : 'MOSTRADOR';
  /* Si este equipo NO es el que tiene la impresora, no se imprime aquí:
     el pedido queda marcado y el PC de la cocina lo saca solo. */
  if(!esEstacion() && S.cfg.fbOn){
    c.cocinaMs=Date.now();
    if(c.mesaId){ persistComanda(true);
      guardarPedido('📨 Pedido enviado a cocina · guardado en '); }
    else { persistComanda(); paintCart();
      toast('📨 Pedido enviado a la cocina','ok',3500); }
    if(S.cfg.autoSync) scheduleSync(200);
    return;
  }
  const soloBaja=!d.nuevos.length && !d.cambios.length && d.bajas.length;
  encolarImp(comandaHTML({no:(soloBaja?'ANULA · ':d.yaEnviado?'AGREGADO · ':'PEDIDO · ')+dest, fecha:now(),
    tipo:c.tipo, mesaId:c.mesaId||'', usuarioId:S.user?S.user.id:'',
    items:d.nuevos, cambios:d.cambios, bajas:d.bajas, adicional:d.yaEnviado, nota:c.nota}),
    'comanda',S.cfg.impresoraComanda);
  marcarEnviado(c);
  if(c.mesaId) guardarPedido(d.yaEnviado? 'Agregado a cocina · guardado en ' : 'Pedido a cocina y guardado en ');
  else { persistComanda(); paintCart(); toast('Comanda enviada a cocina','ok'); }
}

/* Guarda el pedido en la mesa y deja el carrito en cero, listo para el
   siguiente. El pedido no se pierde: queda abierto en la mesa hasta que
   se cobre. */
function guardarPedido(prefijo){
  const c=S.cart;
  if(!c || !c.mesaId) return;
  if(!c.items.length) return toast('El pedido está vacío','warn');
  persistComanda(true);
  const mesa=nameOf('mesas',c.mesaId);
  const uds=sum(c.items,i=>i.cant), val=cartTot().total;
  S.cart=newCart();                    // carrito en cero para la siguiente venta
  abrirCarrito(false);
  go('mesas');
  toast((prefijo||'Pedido guardado en ')+mesa+' · '+num(uds,0)+' und · '+money(val)+
        ' — carrito listo para el siguiente','ok',4200);
}

/* --- comandas (cuentas abiertas por mesa) --- */
function persistComanda(force){
  const c=S.cart; if(!c || !c.mesaId) return;
  if(!c.items.length && c.comandaId){ remove('comandas',c.comandaId); c.comandaId=null; return; }
  if(!c.items.length) return;
  const cm={ id:c.comandaId||uid('cm'), mesaId:c.mesaId,
    items:c.items.map(i=>Object.assign({},i)), clienteId:c.clienteId,
    bajas:(c.bajas||[]).slice(), cocinaMs:c.cocinaMs||null, tipo:c.tipo||'mesa',
    descuento:c.descuento, propinaPct:c.propinaPct, nota:c.nota, estado:'abierta',
    meseroId:S.user?S.user.id:'', apertura:(c.comandaId&&byId('comandas',c.comandaId)||{}).apertura||now() };
  c.comandaId=cm.id; put('comandas',cm);
}

const ZONA_DOM='Domicilios';
function esDomicilio(m){ return !!(m && (m.domicilio || m.zona===ZONA_DOM)); }
/* Un domicilio se comporta como una mesa temporal: lleva el nombre de la
   persona, se ve en Mesas mientras cocina lo prepara y desaparece solo
   cuando se le cobra al domiciliario. */
function nuevoDomicilio(nombre,telefono){
  const n=String(nombre||'').trim() || 'Domicilio';
  const m={id:uid('dm'), nombre:n, zona:ZONA_DOM, capacidad:1, activo:true,
    domicilio:true, temporal:true, telefono:String(telefono||'').trim(), creado:now()};
  put('mesas',m); return m;
}
function limpiarDomicilio(mesaId){
  const m=byId('mesas',mesaId);
  if(!m || !m.temporal) return;
  if(S.comandas.some(c=>c.mesaId===mesaId && c.estado==='abierta')) return;
  remove('mesas',mesaId);
}
function mDestino(){
  const libres=S.mesas.filter(m=>m.activo && !esDomicilio(m));
  const doms=S.mesas.filter(m=>m.activo && esDomicilio(m));
  const actual=S.cart.mesaId? byId('mesas',S.cart.mesaId):null;
  const esDom=esDomicilio(actual) || (!actual && S.cart.tipo==='domicilio');
  modal({title:'Destino del pedido',
    body:'<div class="row wrap" style="margin-bottom:14px">'+
      [['mostrador','🧾 Mostrador'],['domicilio','🛵 Domicilio'],['mesa','🍽️ Mesa']].map(t=>
        '<button class="btn '+((t[0]==='mesa'? (actual&&!esDom) : (esDom? t[0]==='domicilio' : S.cart.tipo===t[0]&&!actual))?'pri':'')+
        '" data-t="'+t[0]+'">'+t[1]+'</button>').join('')+'</div>'+
      '<div id="zmesa" class="f hide" style="margin-bottom:12px"><label>¿Cuál mesa?</label><div id="ms"></div></div>'+
      '<div id="zdom" class="hide" style="margin-bottom:12px">'+
        '<div class="f"><label>¿A nombre de quién va el domicilio?</label>'+
          '<input id="dnom" placeholder="Ej: Señora Marta · Torre 3 apto 402" autocomplete="off" '+
          'value="'+esc(esDom&&actual? actual.nombre:'')+'"></div>'+
        '<div class="f" style="margin-top:9px"><label>Teléfono o dirección (opcional)</label>'+
          '<input id="dtel" placeholder="Para que cocina y el domiciliario lo ubiquen" autocomplete="off" '+
          'value="'+esc(esDom&&actual? (actual.telefono||''):'')+'"></div>'+
        (doms.length? '<div class="f" style="margin-top:9px"><label>O retomar un domicilio que ya está en cocina</label>'+
          '<div id="dsel"></div></div>':'')+
        '<div class="hintx" style="margin-top:8px">Aparece en <b>Mesas ▸ Domicilios</b> mientras lo preparan. '+
        'Cuando salga, lo abre desde ahí y le cobra al domiciliario.</div>'+
      '</div>'+
      '<div class="f"><label>Cliente (para crédito o factura)</label><div id="cl"></div></div>',
    footer:'<button class="btn" data-x>Cancelar</button><button class="btn pri" id="ok">Aplicar</button>',
    onOpen:m=>{
      const cbM=combo($('#ms',m),{lista:libres, valor:(actual&&!esDom)? actual.id:'', vacio:'— ninguna —',
        placeholder:'Buscar mesa…', sub:x=>x.zona});
      const cbD=doms.length? combo($('#dsel',m),{lista:doms, valor:'', vacio:'— es uno nuevo —',
        placeholder:'Buscar domicilio abierto…',
        sub:x=>{ const c=S.comandas.find(y=>y.mesaId===x.id&&y.estado==='abierta');
          return c? sum(c.items,i=>i.cant)+' items · '+agoMin(c.apertura)+' min' : 'sin pedido'; }}) : null;
      const cbC=combo($('#cl',m),{lista:S.clientes.filter(c=>c.activo), valor:S.cart.clienteId||'',
        vacio:'— ninguno —', placeholder:'Escribe el nombre del cliente…',
        sub:x=>[x.doc,x.telefono].filter(Boolean).join(' · '), crear:CREAR_CLIENTE});
      const pintar=k=>{ $('#zmesa',m).classList.toggle('hide',k!=='mesa');
        $('#zdom',m).classList.toggle('hide',k!=='domicilio');
        if(k==='domicilio') setTimeout(()=>{ const i=$('#dnom',m); if(i&&!i.value) i.focus(); },40); };
      $$('[data-t]',m).forEach(b=> b.onclick=()=>{ $$('[data-t]',m).forEach(x=>x.classList.remove('pri'));
        b.classList.add('pri'); pintar(b.dataset.t); });
      pintar(($('[data-t].pri',m)||{dataset:{t:'mostrador'}}).dataset.t);
      $('#ok',m).onclick=()=>{
        const k=($('[data-t].pri',m)||{dataset:{t:'mostrador'}}).dataset.t;
        const antes=S.cart.mesaId;
        if(k==='mesa'){
          const mesa=cbM.valor();
          if(!mesa) return toast('Escoge la mesa','warn');
          S.cart.mesaId=mesa; S.cart.tipo='mesa';
        } else if(k==='domicilio'){
          const ya=cbD? cbD.valor():'';
          if(ya){ S.cart.mesaId=ya; S.cart.tipo='domicilio'; }
          else{
            const nom=$('#dnom',m).value.trim();
            if(!nom) return toast('Escribe a nombre de quién va el domicilio','warn');
            if(actual && actual.temporal){          // solo le cambia el nombre
              actual.nombre=nom; actual.telefono=$('#dtel',m).value.trim(); put('mesas',actual);
              S.cart.mesaId=actual.id;
            } else {
              S.cart.mesaId=nuevoDomicilio(nom,$('#dtel',m).value.trim()).id;
            }
            S.cart.tipo='domicilio';
          }
        } else { S.cart.mesaId=null; S.cart.tipo='mostrador'; }
        if(antes && antes!==S.cart.mesaId) limpiarDomicilio(antes);
        S.cart.clienteId=cbC.valor(); closeModal(); paintCart(); persistComanda(); buildNav();
      };
    }});
}

/* ------------------------------- cobro -------------------------------- */
function mCobrar(){
  const c=S.cart, t=cartTot(c);
  if(!t.total) return;
  if(!S.turno){ toast('La caja está cerrada. Ábrela antes de cobrar.','warn'); go('caja'); return; }
  let pagos=[], medio='efectivo', plazo=30;
  const qa=[1000,2000,5000,10000,20000,50000,100000];

  /* 'monto' es lo que se le abona a la venta; 'recibido' es el billete que
     entregó el cliente. El vuelto es la diferencia y NO entra a la caja. */
  function pagado(){ return round(sum(pagos,p=>p.monto),2); }
  function recibido(){ return round(sum(pagos,p=>p.recibido!=null? p.recibido : p.monto),2); }
  function falta(){ return round(Math.max(0,t.total-pagado()),2); }
  function cambio(){ return round(Math.max(0,recibido()-t.total),2); }
  function agregarPago(v){
    const f=falta();

function registrarVenta(o){
  const c=S.cart, t=cartTot(c);
  const pend=pendientesComanda(c);        // lo que la cocina todavía no ha visto
  const original = c.editandoId? byId('ventas',c.editandoId) : null;
  if(original) deshacerVenta(original);              // se recalcula todo desde cero
  const vid = original? original.id : uid('v');
  /* el costo que se graba es el promedio real del inventario en este momento */
  const items=c.items.map(i=>({productoId:i.productoId,nombre:i.nombre,precio:i.precio,
    cant:i.cant,nota:i.nota,costo:0,costoTotal:0}));
  const cons=consumirItems(items,'venta',vid);
  const v={ id:vid, no: original? original.no : nextNo('venta','V-'),
    fecha: original? original.fecha : now(),
    tipo:c.tipo, mesaId:c.mesaId||'', clienteId:o.clienteId||c.clienteId||'',
    items:items, consumo:cons.consumo,
    subtotal:t.sub, descuento:t.desc, neto:t.neto, impuesto:t.imp, propina:t.prop, total:t.total,
    costo:cons.total, utilidad:round(t.base-cons.total,2),
    pagos:o.pagos||[], credito:!!o.credito, vence:o.credito? dateAdd(todayISO(),o.plazo||30):'',
    estado:o.credito?'pendiente':'pagada', turnoId:S.turno?S.turno.id:'', usuarioId:S.user?S.user.id:'',
    nota:c.nota||'' };
  if(original){ firmar(v); v.creadoPor=original.usuarioId; v.usuarioId=original.usuarioId;
    v.turnoId=original.turnoId||v.turnoId; }
  put('ventas',v);
  (v.pagos||[]).forEach(p=> movTes(p.cuentaId||cuentaDeMedio(p.medio),'ingreso',p.monto,'Venta '+v.no,'venta','venta',v.id,
    terceroDe('cliente',v.clienteId)));
  if(c.comandaId){ const cm=byId('comandas',c.comandaId); if(cm){ cm.estado='cerrada'; cm.ventaId=v.id; put('comandas',cm); } }
  if(c.mesaId) limpiarDomicilio(c.mesaId);          // el domicilio temporal se libera solo
  S.cart=newCart(); abrirCarrito(false);
  toast(original? 'Venta '+v.no+' corregida · '+money(v.total) : 'Venta '+v.no+' registrada · '+money(v.total),'ok');
  if(o.imprimir!==false) imprimirVenta(v,undefined,pend);
  if(S.view==='pos'){ paintCart(); paintGrid(); buildNav(); } else render();
}

/* Borrar la venta, no dejarla anulada estorbando: se devuelve el inventario,
   se saca la plata de la caja y el documento desaparece del listado.
   Solo el administrador. */
function borrarVenta(v){
  if(!v) return;
  if(!puedeBorrar()) return pedirAlAdmin('borrar ventas');
  if(abonadoDe(v.id)>0.5) return toast('Tiene abonos registrados: bórralos primero en Cartera','warn',5500);
  const efe=(v.pagos||[]).filter(p=>{ const c=byId('cuentas',p.cuentaId||cuentaDeMedio(p.medio));
    return c && c.tipo==='caja'; });
  const cta=efe.length? (efe[0].cuentaId||cuentaDeMedio(efe[0].medio)) : '';
  const hacer=()=>confirmar('¿Borrar la venta '+v.no+' por '+money(v.total)+'? '+
      'Los ingredientes vuelven al inventario, la plata sale de la caja y la venta desaparece del listado. '+
      'Esto no se puede deshacer.',()=>{
    if(v.estado!=='anulada'){                     // una anulada vieja ya devolvió todo
      devolverConsumo(v,'borrado');
    }
    borrarDerivados('',v.id);                     // movimientos de caja y de inventario
    if(v.comandaId){ const cm=byId('comandas',v.comandaId); if(cm) remove('comandas',cm.id); }
    if(v.mesaId) limpiarDomicilio(v.mesaId);
    remove('ventas',v.id);
    toast('Venta '+v.no+' borrada','ok'); render();
  },true);
  if(cta && bloqueaCaja(cta)) return conCaja(cta,hacer,'Borrar la venta '+v.no+' · '+money(v.total));
  hacer();
}
const anularVenta=borrarVenta;


/* ================== EDICIÓN DE DOCUMENTOS (solo admin) ================
   Editar una venta o una compra no es cambiar un texto: hay que deshacer
   lo que hizo en inventario (capas y costo promedio) y en caja, y volver a aplicarlo
   con los datos nuevos. Todo queda firmado con quién y cuándo.
   ==================================================================== */
function puedeEditar(){ return !!(S.user && (S.user.rol==='admin' || S.user._super)); }
/* el cajero no ve costos ni utilidad: no le corresponde y evita malentendidos */
function verCostos(){ return !!(S.user && (S.user.rol==='admin' || S.user._super)); }
const puedeBorrar=puedeEditar;
function pedirAlAdmin(que){
  toast('Solo el administrador puede '+(que||'hacer esto')+'. Pídeselo a él.','warn',5000);
}
function firmar(doc){
  doc.editadoPor=S.user?S.user.id:''; doc.editadoEl=now();
  doc.ediciones=(Number(doc.ediciones)||0)+1;
  return doc;
}
function borrarDerivados(refTipo,refId){
  S.movimientos.filter(m=>m.refId===refId && (!refTipo||m.refTipo===refTipo)).forEach(m=>remove('movimientos',m.id));
  S.movinv.filter(m=>m.refId===refId).forEach(m=>remove('movinv',m.id));
}
/* devuelve al inventario lo que consumió una venta, a su costo original */
function devolverConsumo(v,motivo){
  (v.consumo||[]).forEach(x=>{
    const g=byId('ingredientes',x.ingredienteId); if(!g) return;
    const cu = x.cantidad? round(x.costo/x.cantidad,4) : ultimoCosto(x.ingredienteId);
    const prim=capasDe(x.ingredienteId)[0];
    const fecha=new Date((prim? new Date(prim.fecha).getTime() : Date.now())-1000).toISOString();
    nuevaCapa(x.ingredienteId,x.cantidad,cu,motivo||'reverso',v.id,fecha);
    nivelarCosto(x.ingredienteId);
    g.stock=round((Number(g.stock)||0)+x.cantidad,4);
    g.costo=round(costoProm(x.ingredienteId)||ultimoCosto(x.ingredienteId),4);
    put('ingredientes',g);
  });
}
/* deshace por completo una venta: inventario, caja y comanda */
function deshacerVenta(v){
  devolverConsumo(v,'edicion');
  borrarDerivados('',v.id);
  if(v.comandaId){ const cm=byId('comandas',v.comandaId); if(cm){ cm.estado='abierta'; delete cm.ventaId; put('comandas',cm); } }
}
/* deshace una compra; avisa si parte de lo comprado ya se vendió */
function deshacerCompra(c){
  let parcial=false;
  S.capas.filter(x=>x.refTipo==='compra' && x.refId===c.id).forEach(cap=>{
    const g=byId('ingredientes',cap.ingredienteId);
    const quita=Math.max(0,Number(cap.restante)||0);
    if(quita < (Number(cap.cantidad)||0)-0.000001) parcial=true;
    /* el valor que se va es el que costó de verdad esa compra, no el
       promedio; así el promedio de lo que queda vuelve a ser el correcto */
    const base=Number(cap.costoBase!=null? cap.costoBase : cap.costoUnit)||0;
    remove('capas',cap.id);
    if(g){ g.stock=round((Number(g.stock)||0)-quita,4); put('ingredientes',g); }
    nivelarCosto(cap.ingredienteId, 0, round(quita*base - quita*(Number(cap.costoUnit)||0),4));
    if(g){ g.costo=round(costoProm(g.id)||ultimoCosto(g.id),4); put('ingredientes',g); }
  });
  borrarDerivados('',c.id);
  return parcial;
}

  if(abonadoDe(v.id)>0.5) return toast('Tiene abonos registrados: elimínalos primero en Cartera','warn',5000);
  if(!S.turno) return toast('Abre la caja antes de editar una venta','warn');
  confirmar('Se abrirá la venta '+v.no+' en el punto de venta para que la corrijas. '+
            'El inventario y la caja se recalculan cuando la vuelvas a cobrar.',()=>{
    S.cart=newCart({tipo:v.tipo, mesaId:v.mesaId||null, clienteId:v.clienteId||'',
      descuento:v.descuento||0, propinaPct: v.subtotal? round((v.propina||0)/Math.max(1,(v.subtotal-(v.descuento||0)))*100,2):0});
    S.cart.items=(v.items||[]).map(i=>({id:uid('it'),productoId:i.productoId,nombre:i.nombre,

/* --------------------------- anular compra -------------------------- */
/* ¿Ya se vendió algo de esta compra? Si sí, no se puede borrar: ese costo
   ya viajó a una venta y el inventario no cuadraría. */
function compraConsumida(c){
  return S.capas.filter(x=>x.refTipo==='compra' && x.refId===c.id)
    .some(cap=>(Number(cap.restante)||0) < (Number(cap.cantidad)||0)-0.000001);
}
function borrarCompra(c){
  if(!c) return;
  if(!puedeBorrar()) return pedirAlAdmin('borrar compras');
  if(abonadoDe(c.id)>0.5) return toast('Tiene pagos registrados: bórralos primero en Cartera','warn',5500);
  if(compraConsumida(c))
    return modal({title:'Esta compra ya no se puede borrar',size:'slim',
      body:'<div class="card" style="background:var(--warn-soft)"><div class="bd">'+
        '<b>⚠ Parte de lo que entró con la compra '+esc(c.no)+' ya se vendió.</b>'+
        '<div class="tiny" style="margin-top:6px">Ese costo ya quedó grabado en las ventas que lo usaron. '+
        'Si la borro, el inventario y la utilidad quedarían mal.</div></div></div>'+
        '<div class="hintx" style="margin-top:11px">Lo que sí puede hacer es <b>corregirla</b>: cambiar el valor, '+
        'las cantidades o el proveedor. Lo que todavía no se ha vendido se recalcula solo.</div>',
      footer:'<button class="btn" data-x>Entendido</button>'+
        '<button class="btn pri" id="ed">✎ Corregir la compra</button>',

/* ============================ IMPRESIÓN ==============================
   Dos documentos distintos: la COMANDA que va a cocina (sin precios,
   letra grande) y el TICKET de venta. Se imprimen en cadena.
   El navegador por sí solo no puede elegir impresora; por eso hay tres
   modos, y el de dos impresoras usa QZ Tray.
   =================================================================== */
function abrirImpresion(html,tipo,impresora){
  if(S.cfg.modoImp==='qz'){
    if(window.qz || _qzCarga) return qzImprimir(html,impresora,tipo);
    cargarQZ().then(ok=>{ if(ok) qzImprimir(html,impresora,tipo); });
    if(!window.qz) return;
    toast('QZ Tray no está abierto en este equipo; se usa el diálogo del navegador','warn',5000);
  }
  let f=document.getElementById('fr_'+tipo);
  if(!f){ f=document.createElement('iframe'); f.id='fr_'+tipo; f.className='printframe'; document.body.appendChild(f); }
  f.onload=()=>{ try{ f.contentWindow.focus(); f.contentWindow.print(); }
                 catch(e){ toast('No se pudo abrir la impresión','bad'); } };
  f.srcdoc=html;
}
async function qzImprimir(html,impresora,tipo){
  try{
    await qzConectar();
    const nombre=impresora||null;
    const cfg=nombre? qz.configs.create(nombre) : qz.configs.create(await qz.printers.getDefault());
    await qz.print(cfg,[{type:'html',format:'plain',data:html}]);
  }catch(e){ toast('QZ Tray ('+tipo+'): '+(e.message||e),'bad',6000); }
}

/* QZ Tray es el puentecito que deja mandar cada documento a una impresora
   distinta y preguntar cuáles hay instaladas. Se carga solo cuando hace falta. */
let _qzCarga=null;
function cargarQZ(){
  if(window.qz) return Promise.resolve(true);
  if(_qzCarga) return _qzCarga;
  const fuentes=['qz-tray.js',
    'https://cdnjs.cloudflare.com/ajax/libs/qz-tray/2.2.4/qz-tray.js',
    'https://cdn.jsdelivr.net/npm/qz-tray@2.2.4/qz-tray.js'];
  _qzCarga=new Promise(res=>{
    let i=0;
    const probar=()=>{
      if(i>=fuentes.length){ _qzCarga=null; return res(false); }
      const sc=document.createElement('script');
      sc.src=fuentes[i++];
      sc.onload=()=>res(!!window.qz);
      sc.onerror=()=>{ sc.remove(); probar(); };
      document.head.appendChild(sc);
    };
    probar();
  });
  return _qzCarga;
}
async function qzConectar(){
  if(!(await cargarQZ())) throw new Error('NO_QZ_JS');
  if(!qz.websocket.isActive()) await qz.websocket.connect({retries:1,delay:1});
  return true;
}
async function qzListarImpresoras(){
  await qzConectar();
  const l=await qz.printers.find();
  S.impresoras=Array.isArray(l)? l : (l? [l]:[]);
  try{ S.impresoraDef=await qz.printers.getDefault(); }catch(e){}
  return S.impresoras;
}

/* cola única: si entran varias ventas seguidas, los documentos salen
   uno detrás de otro y ninguno pisa al anterior */
const _colaImp=[]; let _impOcupado=false;
function encolarImp(html,tipo,impresora){ _colaImp.push({html:html,tipo:tipo,impresora:impresora}); bombearImp(); }
function bombearImp(){
  if(_impOcupado || !_colaImp.length) return;
  _impOcupado=true;
  const t=_colaImp.shift();
  try{ abrirImpresion(t.html,t.tipo,t.impresora); }catch(e){ console.warn(e); }
  setTimeout(()=>{ _impOcupado=false; bombearImp(); }, Math.max(600,Number(S.cfg.pausaImp)||1800));
}
/* --------- imprime lo que corresponda al confirmar una venta -------- */
function imprimirVenta(v,forzar,pend){
  const quiereCom = forzar==='comanda' || (forzar===undefined && S.cfg.impComanda!==false);
  const quiereTik = forzar==='ticket'  || (forzar===undefined && S.cfg.impTicket!==false);
  const tareas=[];
  if(quiereCom){
    let doc=v, saltar=false;
    /* si la cocina ya recibió este pedido, en el cobro solo sale lo que
       faltaba; si no faltaba nada, no se imprime comanda repetida */
    if(pend && pend.yaEnviado){
      if(!pend.nuevos.length && !pend.cambios.length && !pend.bajas.length) saltar=true;
      else doc=Object.assign({},v,{items:pend.nuevos,cambios:pend.cambios,
             bajas:pend.bajas,adicional:true});
    }
    if(!saltar) tareas.push([comandaHTML(doc,forzar==='comanda'),'comanda',S.cfg.impresoraComanda]);
  }
  if(quiereTik) tareas.push([ticketHTML(v),'ticket',S.cfg.impresoraTicket]);
  if(S.cfg.ordenImp==='ticket') tareas.reverse();
  tareas.forEach(t=>encolarImp(t[0],t[1],t[2]));
}
function reimprimir(v,que){
  if(!v) return;
  imprimirVenta(v,que);
  toast(que==='comanda'?'Comanda enviada a cocina':'Ticket enviado','ok');
}

function ticketHTML(v){
  const c=S.cfg, w=Number(c.ticketAncho)||80, ang=(w-6);
  const cli=v.clienteId? byId('clientes',v.clienteId):null;
  const mesa=v.mesaId? byId('mesas',v.mesaId):null;
  const rows=(v.items||[]).map(i=>'<tr><td class="q">'+esc(i.cant)+'</td><td>'+esc(i.nombre)+
    (i.nota?'<div class="nt">* '+esc(i.nota)+'</div>':'')+'</td><td class="r">'+money(i.precio*i.cant)+'</td></tr>').join('');
  const recib=round(sum(v.pagos||[],p=>p.recibido!=null? p.recibido : p.monto),2);
  const vuelto=round(Math.max(0,recib-(v.total||0)),2);
  const pagos=(v.pagos||[]).map(p=>{const md=MEDIOS.find(x=>x.k===p.medio)||{};
    return '<div class="l"><span>'+esc(md.n||p.medio)+'</span><span>'+money(p.monto)+'</span></div>';}).join('')+
    (vuelto>0.5? '<div class="l"><span>Recibido</span><span>'+money(recib)+'</span></div>'+
                 '<div class="l b"><span>CAMBIO</span><span>'+money(vuelto)+'</span></div>':'');
  return '<html><head><meta charset="utf-8"><style>'+
   '@page{size:'+w+'mm auto;margin:2.5mm}'+
   '*{-webkit-print-color-adjust:exact}'+
   'body{font:'+px(12.5)+'/1.42 Arial,Helvetica,sans-serif;color:#000;margin:0;width:'+ang+'mm;font-weight:500}'+
   'h1{font-size:'+px(19)+';margin:0 0 2px;text-align:center;font-weight:bold;line-height:1.15}'+
   '.c{text-align:center}.r{text-align:right}.b{font-weight:bold}'+
   '.cab{text-align:center;font-size:'+px(11)+'}'+
   'hr{border:0;border-top:1px dashed #000;margin:5px 0}'+
   'table{width:100%;border-collapse:collapse}'+
   'td{padding:2.5px 0;vertical-align:top;font-size:'+px(12.5)+'}'+
   'td.q{width:26px;font-weight:bold}td.r{width:78px;white-space:nowrap}'+
   '.nt{font-size:'+px(10.5)+';font-style:italic}'+
   '.l{display:flex;justify-content:space-between;gap:6px;font-size:'+px(12.5)+'}'+
   '.l span:last-child{white-space:nowrap}'+
   '.tot{font-size:'+px(18)+';font-weight:bold;margin:3px 0}'+
   '.logo{display:block;margin:0 auto 5px;max-width:'+Math.min(ang,62)+'mm;max-height:30mm}'+
   '.pie{text-align:center;font-size:'+px(11)+';margin-top:4px}'+
   '</style></head><body>'+
   (imgDe('logo')? '<img class="logo" src="'+imgDe('logo').datos+'">' : '')+
   '<h1>'+esc(c.nombre)+'</h1>'+
   '<div class="cab">'+(c.nit?'NIT '+esc(c.nit)+'<br>':'')+(c.direccion?esc(c.direccion)+'<br>':'')+
     (c.telefono?'Tel. '+esc(c.telefono):'')+'</div><hr>'+
   '<div class="l b"><span>'+esc(v.no)+'</span><span>'+fdate(v.fecha,true)+'</span></div>'+
   '<div class="l"><span>'+(mesa?'Mesa '+esc(mesa.nombre):v.tipo==='domicilio'?'Domicilio':'Mostrador')+'</span>'+
     '<span>'+esc(nameOf('usuarios',v.usuarioId))+'</span></div>'+
   (cli?'<div>Cliente: '+esc(cli.nombre)+'</div>':'')+'<hr>'+
   '<table>'+rows+'</table><hr>'+
   '<div class="l"><span>Subtotal</span><span>'+money(v.subtotal)+'</span></div>'+
   (v.descuento?'<div class="l"><span>Descuento</span><span>-'+money(v.descuento)+'</span></div>':'')+
   (v.impuesto?'<div class="l"><span>IVA '+c.impuesto+'%</span><span>'+money(v.impuesto)+'</span></div>':'')+
   (v.propina?'<div class="l"><span>Propina</span><span>'+money(v.propina)+'</span></div>':'')+
   '<div class="l tot"><span>TOTAL</span><span>'+money(v.total)+'</span></div><hr>'+
   pagos+ (v.credito?'<div class="l b"><span>CREDITO</span><span>vence '+esc(v.vence)+'</span></div>':'')+
   '<hr><div class="pie b">'+esc(c.ticketPie||'')+'</div>'+
   '</body></html>';
}
function imprimirTicket(v){ encolarImp(ticketHTML(v),'ticket',S.cfg.impresoraTicket); }
function verTicket(v){
  modal({title:'Ticket '+v.no,size:'slim',
    body:'<div style="background:#fff;color:#000;padding:10px;border-radius:8px;max-height:60vh;overflow:auto">'+
      '<iframe style="width:100%;height:56vh;border:0;background:#fff" srcdoc="'+esc(ticketHTML(v))+'"></iframe></div>',
    footer:'<button class="btn" data-x>Cerrar</button>'+
      '<button class="btn" id="pc">👨‍🍳 Comanda</button>'+
      '<button class="btn pri" id="pr">🖨️ Ticket</button>',
    onOpen:m=>{ $('#pr',m).onclick=()=>imprimirTicket(v);
      $('#pc',m).onclick=()=>reimprimir(v,'comanda'); }});
}

/* =============================== MESAS ================================ */
function viewMesas(vw){
  const abiertas=S.comandas.filter(c=>c.estado==='abierta');
  sub(abiertas.length+' cuenta(s) abierta(s)');
  topact('<button class="btn pri sm" id="nd">🛵 Domicilio</button><button class="btn sm" id="nm">+ Mesa</button>');
  const zonas={};
  S.mesas.filter(m=>m.activo).forEach(m=>{ (zonas[m.zona||'General']=zonas[m.zona||'General']||[]).push(m); });
  const orden=Object.keys(zonas).sort((a,b)=> a===ZONA_DOM? -1 : b===ZONA_DOM? 1 : a.localeCompare(b));
  let h='';
  orden.forEach(z=>{
    const dom = z===ZONA_DOM;
    h+='<div class="card" style="margin-bottom:14px'+(dom?';border-color:var(--info)':'')+'">'+
       '<div class="hd"><h3>'+(dom?'🛵 ':'')+esc(z)+'</h3>'+
       '<span class="pill">'+zonas[z].length+(dom?' en camino':' mesas')+'</span></div><div class="bd"><div class="mesas">';
    zonas[z].forEach(m=>{
      const cm=abiertas.find(c=>c.mesaId===m.id);
      const tot=cm? round(sum(cm.items,i=>i.precio*i.cant)-(cm.descuento||0),2):0;
      h+='<button class="mesa '+(cm?'ocupada':'libre')+'" data-m="'+m.id+'">'+
         '<div class="n">'+(dom?'🛵 ':'')+esc(m.nombre)+'</div>'+
         '<div class="z">'+(cm? (cm.items.length+' items · '+agoMin(cm.apertura)+' min')
                              : (dom? esc(m.telefono||'sin pedido') : m.capacidad+' puestos'))+'</div>'+
         '<div class="t">'+(cm? money(tot):(dom?'—':'Libre'))+'</div></button>';
    });
    h+='</div></div>'+
      (dom? '<div class="bd" style="padding-top:0"><span class="hintx">Cuando el pedido salga de cocina, '+
            'ábralo aquí y cóbrele al domiciliario. Al cobrar desaparece solo.</span></div>':'')+
      '</div>';
  });
  vw.innerHTML=h||'<div class="empty"><span class="ico">🍽️</span>Sin mesas configuradas</div>';
  $$('.mesa',vw).forEach(b=> b.onclick=()=>abrirMesa(b.dataset.m));
  $('#nm').onclick=()=>edMesa(null);
  $('#nd').onclick=()=>mNuevoDomicilio();
}
function mNuevoDomicilio(){
  modal({title:'Nuevo domicilio',size:'slim',
    body:'<div class="f"><label>¿A nombre de quién va?</label>'+
      '<input id="n" placeholder="Ej: Señora Marta · Torre 3 apto 402" autocomplete="off"></div>'+
      '<div class="f" style="margin-top:10px"><label>Teléfono o dirección (opcional)</label>'+
      '<input id="t" placeholder="Para ubicarlo" autocomplete="off"></div>'+
      '<div class="hintx" style="margin-top:9px">Queda en <b>Mesas ▸ Domicilios</b> mientras cocina lo prepara. '+
      'Cuando salga, lo abre y le cobra al domiciliario.</div>',
    footer:'<button class="btn" data-x>Cancelar</button><button class="btn pri" id="ok">Tomar el pedido</button>',
    onOpen:m=>{ $('#ok',m).onclick=()=>{
      const n=$('#n',m).value.trim();
      if(!n) return toast('Escribe a nombre de quién va el domicilio','warn');
      const d=nuevoDomicilio(n,$('#t',m).value.trim());
      closeModal(); abrirMesa(d.id); }; }});
}
function abrirMesa(mesaId){
  const cm=S.comandas.find(c=>c.estado==='abierta'&&c.mesaId===mesaId);
  const mm=byId('mesas',mesaId);
  S.cart=newCart({mesaId:mesaId,tipo: esDomicilio(mm)?'domicilio':'mesa'});
  if(cm){ S.cart.comandaId=cm.id;
    S.cart.items=(cm.items||[]).map(i=>Object.assign({},i));   // copia: no tocar la comanda guardada
    S.cart.bajas=(cm.bajas||[]).slice();
    S.cart.cocinaMs=cm.cocinaMs||null;
    S.cart.clienteId=cm.clienteId||'';
    S.cart.descuento=cm.descuento||0; S.cart.propinaPct=cm.propinaPct||0; S.cart.nota=cm.nota||''; }
  go('pos');
  if(esMovil() && cm) setTimeout(()=>abrirCarrito(true),120);
}
function edMesa(m){
  const ed=m||{id:uid('m'),nombre:'',zona:'Salón',capacidad:4,activo:true};
  modal({title:m?'Editar mesa':'Nueva mesa',size:'slim',
    body:'<div class="f" style="margin-bottom:10px"><label>Nombre</label><input id="n" value="'+esc(ed.nombre)+'"></div>'+
      '<div class="grid" style="grid-template-columns:1fr 90px">'+
      '<div class="f"><label>Zona</label><input id="z" value="'+esc(ed.zona)+'"></div>'+
      '<div class="f"><label>Puestos</label><input id="c" type="number" value="'+ed.capacidad+'"></div></div>',
    footer:(m&&puedeBorrar()?'<button class="btn danger" id="del">Eliminar</button>':'')+
      '<div class="spacer"></div><button class="btn" data-x>Cancelar</button><button class="btn pri" id="ok">Guardar</button>',
    onOpen:mo=>{
      $('#ok',mo).onclick=()=>{ ed.nombre=$('#n',mo).value.trim()||'Mesa'; ed.zona=$('#z',mo).value.trim()||'General';
        ed.capacidad=toN($('#c',mo).value)||4; put('mesas',ed); closeModal(); render(); toast('Mesa guardada','ok'); };
      if($('#del',mo)) $('#del',mo).onclick=()=>{ closeModal(); confirmar('¿Eliminar mesa?',()=>{remove('mesas',ed.id);render();},true); };
    }});
}

/* =============================== VENTAS =============================== */
function medioDe(v){ return v.credito? 'credito' : (v.pagos||[]).map(p=>p.medio).join('+'); }

function viewVentas(vw){
  let f={desde:todayISO(),hasta:todayISO(),q:'',estado:'',medio:''};
  vw.innerHTML='<div id="vfil"></div><div id="vbody"></div>';
  function datos(){
    let vs=S.ventas.filter(v=> dISO(v.fecha)>=f.desde && dISO(v.fecha)<=f.hasta);
    if(f.estado) vs=vs.filter(v=>v.estado===f.estado);
    if(f.medio) vs=vs.filter(v=> medioDe(v).indexOf(f.medio)>=0);
    if(f.q) vs=filtra(vs,f.q,[v=>v.no, v=>nameOf('clientes',v.clienteId), v=>nameOf('usuarios',v.usuarioId),
      v=>nameOf('mesas',v.mesaId), v=>medioDe(v), v=>String(v.total),
      v=>(v.items||[]).map(i=>i.nombre).join(' ')]);
    return vs.sort((a,b)=> b.fecha.localeCompare(a.fecha));
  }
  function exportar(){
    const vs=datos();
    const vc=verCostos();
    const enc=['Factura','Fecha','Hora','Tipo','Mesa','Cliente','Cajero','Medio','Subtotal','Descuento',
               'Impuesto','Propina','Total'].concat(vc?['Costo','Utilidad']:[]).concat(['Estado']);
    const filas=[[{v:'Ventas '+f.desde+' a '+f.hasta,t:'titulo'}],[],enc.map(x=>({v:x,b:1}))];
    vs.forEach(v=>filas.push([v.no,dISO(v.fecha),ftime(v.fecha),v.tipo,nameOf('mesas',v.mesaId),
      v.clienteId?nameOf('clientes',v.clienteId):'',nameOf('usuarios',v.usuarioId),medioDe(v),
      v.subtotal||0,v.descuento||0,v.impuesto||0,v.propina||0,v.total||0]
      .concat(vc?[v.costo||0, round((v.total||0)-(v.propina||0)-(v.impuesto||0)-(v.costo||0),2)]:[])
      .concat([v.estado])));
    const ok=vs.filter(v=>v.estado!=='anulada');
    filas.push([]); filas.push([{v:'TOTALES',b:1},'','','','','','','',
      {v:sum(ok,v=>v.subtotal||0)},{v:sum(ok,v=>v.descuento||0)},{v:sum(ok,v=>v.impuesto||0)},
      {v:sum(ok,v=>v.propina||0)},{v:sum(ok,v=>v.total||0)}].concat(vc?[{v:sum(ok,v=>v.costo||0)}]:[]));
    const det=[['Factura','Fecha','Producto','Cantidad','Precio unit.','Total linea']
      .concat(vc?['Costo linea']:[]).concat(['Nota']).map(x=>({v:x,b:1}))];
    vs.forEach(v=>(v.items||[]).forEach(i=>det.push([v.no,dISO(v.fecha),i.nombre,i.cant,i.precio,
      round(i.precio*i.cant,2)]
      .concat(vc?[i.costoTotal!=null?i.costoTotal:round((i.costo||0)*i.cant,2)]:[])
      .concat([i.nota||'']))));
    exportarExcel('ventas_'+f.desde+'_'+f.hasta,[
      {nombre:'Ventas',filas:filas,anchos:[13,11,8,11,10,20,16,14,12,11,11,11,13,12,12,10]},
      {nombre:'Detalle por producto',filas:det,anchos:[13,11,26,10,12,13,13,22]}]);
  }
  function paint(){
    const vs=datos();
    const ok=vs.filter(v=>v.estado!=='anulada');
    const tot=sum(ok,v=>v.total), cst=sum(ok,v=>v.costo||0);
    const med={}; ok.forEach(v=>{ if(v.credito) med.credito=(med.credito||0)+v.total;
      (v.pagos||[]).forEach(p=>med[p.medio]=(med[p.medio]||0)+p.monto); });
    $('#vbody').innerHTML=
      '<div class="kpis" style="margin-bottom:14px">'+
        kpi('Ventas',money(tot),ok.length+' facturas','brand')+
        kpi('Efectivo',money(med.efectivo||0),'','')+
        kpi('Tarjeta y transferencia',money((med.tarjeta||0)+(med.transferencia||0)),'','')+
        kpi('Crédito',money(med.credito||0),'por cobrar',med.credito?'warn':'')+
        (verCostos()? kpi('Utilidad bruta',money(tot-cst),tot?round((tot-cst)/tot*100,1)+'%':'','ok')
                    : kpi('Ticket promedio',money(ok.length? tot/ok.length:0),'',''))+
      '</div>'+
      '<div class="card"><div class="bd p0">'+
      tbl([
        {t:'N°',f:v=>'<b>'+esc(v.no)+'</b>'},
        {t:'Fecha',f:v=>fdate(v.fecha,true)},
        {t:'Tipo',f:v=> v.mesaId? '🍽️ '+esc(nameOf('mesas',v.mesaId)) : v.tipo==='domicilio'?'🛵 Domicilio':'🧾 Mostrador'},
        {t:'Cliente',f:v=> v.clienteId? esc(nameOf('clientes',v.clienteId)):'<span class="muted">—</span>'},
        {t:'Cajero',f:v=>esc(nameOf('usuarios',v.usuarioId))},
        {t:'Pago',f:v=> v.credito? '<span class="pill warn">Crédito</span>' :
          (v.pagos||[]).map(p=>{const m=MEDIOS.find(x=>x.k===p.medio)||{};return '<span class="pill">'+(m.e||'')+' '+esc(m.n||'')+'</span>';}).join(' ')},
        {t:'Total',num:1,f:v=>'<b>'+money(v.total)+'</b>'},
        {t:'Estado',f:v=> (v.estado==='anulada'?'<span class="pill bad">Anulada</span>':
          v.estado==='pendiente'?'<span class="pill warn">Pendiente</span>':'<span class="pill ok">Pagada</span>')+
          (v.ediciones?' <span class="pill" title="Editada '+v.ediciones+' vez(ces) por '+
            esc(nameOf('usuarios',v.editadoPor))+' el '+fdate(v.editadoEl,true)+'">✎'+v.ediciones+'</span>':'')},
        {t:'',f:v=>'<div class="row" style="gap:3px"><button class="btn ghost sm" data-t="'+v.id+'" title="Ticket">🧾</button>'+
          '<button class="btn ghost sm" data-rc="'+v.id+'" title="Reimprimir comanda">👨‍🍳</button>'+
          (v.estado!=='anulada'&&puedeEditar()?'<button class="btn ghost sm" data-ev="'+v.id+'" title="Editar">✎</button>':'')+
          (puedeBorrar()?'<button class="btn ghost sm" data-a="'+v.id+'" title="Borrar la venta">🗑️</button>':'')+'</div>'}
      ],vs,{empty: f.q? 'Nada coincide con «'+esc(f.q)+'»':'Sin ventas en el rango',icon:'📈'})+
      '</div></div>';
    $('#vcount').textContent = vs.length+' de '+S.ventas.length+' ventas';
    $$('[data-t]',$('#view')).forEach(b=> b.onclick=()=>verTicket(byId('ventas',b.dataset.t)));
    $$('[data-a]',$('#view')).forEach(b=> b.onclick=()=>anularVenta(byId('ventas',b.dataset.a)));
    $$('[data-ev]',$('#view')).forEach(b=> b.onclick=()=>editarVenta(byId('ventas',b.dataset.ev)));
    $$('[data-rc]',$('#view')).forEach(b=> b.onclick=()=>reimprimir(byId('ventas',b.dataset.rc),'comanda'));
  }
  $('#vfil').innerHTML='<div class="card" style="margin-bottom:14px"><div class="bd">'+
    '<div class="row wrap" style="margin-bottom:10px">'+
      '<div style="flex:1;min-width:260px"><input id="q" placeholder="🔍 Buscar por factura, cliente, cajero, mesa, producto o valor…" autocomplete="off"></div>'+
      '<button class="btn" id="xls">📊 Excel</button>'+
      '<button class="btn pri" id="res">🧾 Resumen del día</button>'+
    '</div>'+
    '<div class="row wrap">'+
    '<div class="f"><label>Desde</label><input type="date" id="d1" value="'+f.desde+'"></div>'+
    '<div class="f"><label>Hasta</label><input type="date" id="d2" value="'+f.hasta+'"></div>'+
    '<div class="f"><label>Estado</label><select id="es"><option value="">Todos</option><option value="pagada">Pagada</option>'+
      '<option value="pendiente">Pendiente</option><option value="anulada">Anulada</option></select></div>'+
    '<div class="f"><label>Medio de pago</label><select id="me"><option value="">Todos</option>'+
      MEDIOS.map(x=>'<option value="'+x.k+'">'+x.n+'</option>').join('')+'</select></div>'+
    '<div class="f"><label>&nbsp;</label><div class="row wrap"><button class="btn sm" id="hoy">Hoy</button>'+
      '<button class="btn sm" id="ayer">Ayer</button><button class="btn sm" id="sem">7 días</button>'+
      '<button class="btn sm" id="mes">Mes</button></div></div>'+
    '<div class="spacer"></div><span class="hintx" id="vcount"></span>'+
    '</div></div></div>';
  const rango=(a,b)=>{ f.desde=a; f.hasta=b; $('#d1').value=a; $('#d2').value=b; paint(); };
  $('#d1').onchange=e=>{f.desde=e.target.value;paint();};
  $('#d2').onchange=e=>{f.hasta=e.target.value;paint();};
  $('#es').onchange=e=>{f.estado=e.target.value;paint();};
  $('#me').onchange=e=>{f.medio=e.target.value;paint();};
  $('#q').oninput=debounce(e=>{f.q=e.target.value;paint();},180);
  $('#hoy').onclick=()=>rango(todayISO(),todayISO());
  $('#ayer').onclick=()=>rango(dateAdd(todayISO(),-1),dateAdd(todayISO(),-1));
  $('#sem').onclick=()=>rango(dateAdd(todayISO(),-6),todayISO());
  $('#mes').onclick=()=>rango(todayISO().slice(0,8)+'01',todayISO());
  $('#xls').onclick=exportar;
  $('#res').onclick=()=>mResumenVentas(f.desde,f.hasta);
  paint();
}

/* ============================= PRODUCTOS ============================== */
function viewProductos(vw){
  let tab='prod', q='';
  topact('<button class="btn pri sm" id="add">+ Nuevo</button>');
  vw.innerHTML='<div id="ptabs"></div><div id="pbody"></div>';
  $('#ptabs').appendChild(tabsBar([['prod','Productos'],['cat','Categorías']],tab,t=>{tab=t;paint();}));
  function paint(){
    $$('#ptabs .tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
    $('#add').onclick=()=> tab==='prod'? edProducto(null): edCategoria(null);
    if(tab==='cat'){
      $('#pbody').innerHTML='<div class="card"><div class="bd p0">'+tbl([
        {t:'',w:'44px',f:c=>'<span style="font-size:20px">'+(c.emoji||'🍽️')+'</span>'},
        {t:'Categoría',f:c=>'<b>'+esc(c.nombre)+'</b>'},
        {t:'Orden',num:1,f:c=>c.orden||0},
        {t:'Productos',num:1,f:c=>S.productos.filter(p=>p.categoriaId===c.id).length},
        {t:'',f:c=>'<button class="btn ghost sm" data-e="'+c.id+'">✎</button>'}
      ],S.categorias.slice().sort((a,b)=>(a.orden||0)-(b.orden||0)),{empty:'Sin categorías'})+'</div></div>';
      $$('[data-e]',$('#view')).forEach(b=>b.onclick=()=>edCategoria(byId('categorias',b.dataset.e)));
      return;
    }
    const todos=S.productos.slice().sort((a,b)=> (nameOf('categorias',a.categoriaId)+a.nombre).localeCompare(nameOf('categorias',b.categoriaId)+b.nombre));
    const ps=filtra(todos,q,[x=>x.nombre,x=>nameOf('categorias',x.categoriaId)]);
    $('#pbody').innerHTML=barraBusca('Buscar producto o categoría…',q)+'<div class="card"><div class="bd p0">'+tbl([
      {t:'',w:'52px',f:p=>{const u=urlImg(p.id);
        return u? '<img src="'+u+'" style="width:36px;height:36px;border-radius:8px;object-fit:cover;display:block">'
                : '<span style="font-size:20px">'+(p.emoji||'🍽️')+'</span>';}},
      {t:'Producto',f:p=>'<b>'+esc(p.nombre)+'</b>'+(p.activo?'':' <span class="pill bad">inactivo</span>')},
      {t:'Categoría',f:p=>esc(nameOf('categorias',p.categoriaId))},

      {t:'Costo promedio',num:1,f:p=>money(costoProducto(p))},

      {t:'Margen',num:1,f:p=>{const m=margen(p);return '<span class="pill '+(m>=50?'ok':m>=25?'warn':'bad')+'">'+m+'%</span>';}},
      {t:'Disp.',num:1,f:p=>{const d=maxPorReceta(p);return d===Infinity?'<span class="muted">∞</span>':
        '<span class="pill '+(d===0?'bad':d<=5?'warn':'ok')+'">'+d+'</span>';}},

      '</div>'+
      '<div>'+
        '<div class="row" style="margin-bottom:8px"><b>Receta (descuenta inventario)</b><span class="spacer"></span>'+
          '<button class="btn sm" id="addr">+ Ingrediente</button></div>'+

    footer:(p&&puedeBorrar()?'<button class="btn danger" id="del">Eliminar</button>':'')+
      '<div class="spacer"></div><button class="btn" data-x>Cancelar</button><button class="btn pri" id="ok">Guardar</button>',
    onOpen:m=>{
      function rowHTML(r,i){
        const g=byId('ingredientes',r.ingredienteId)||{};
        return '<div class="recipe-row" data-i="'+i+'">'+
          '<div data-g></div>'+
          '<input data-q type="number" step="any" value="'+(r.cantidad||0)+'">'+
          '<span class="tiny muted" data-u>'+esc(g.unidad||'')+'</span>'+
          '<button class="btn ghost sm" data-x2>✕</button></div>';
      }
      function calc(){
        const tmp={receta:ed.receta,costoManual:toN($('#cm',m).value),precio:toN($('#pr',m).value)};
        const c=costoProducto(tmp), pr=tmp.precio;
        $('#rc',m).textContent=money(c);
        $('#ru',m).textContent=money(pr-c);
        $('#rm',m).textContent=(pr? round((pr-c)/pr*100,1):0)+'%';
      }
      function paintRows(){
        $('#rows',m).innerHTML= ed.receta.length? ed.receta.map(rowHTML).join('') :
          '<div class="hintx">Sin ingredientes. Se usará el costo manual.</div>';
        $$('.recipe-row',m).forEach(row=>{ const i=+row.dataset.i;
          combo($('[data-g]',row),{lista:S.ingredientes.filter(x=>x.activo), valor:ed.receta[i].ingredienteId,
            placeholder:'Buscar ingrediente…', sub:x=>'costo '+money(costoProm(x.id)||x.costo)+' / '+x.unidad,
            crear:CREAR_INGREDIENTE,
            onPick:(id,obj)=>{ ed.receta[i].ingredienteId=id;
              $('[data-u]',row).textContent=(obj&&obj.unidad)||''; calc(); }});
          $('[data-q]',row).oninput=e=>{ed.receta[i].cantidad=toN(e.target.value);calc();};
          $('[data-x2]',row).onclick=()=>{ed.receta.splice(i,1);paintRows();calc();};
        });
      }
      const cbCt=combo($('#ct',m),{lista:S.categorias.filter(x=>x.activo), valor:ed.categoriaId,
        placeholder:'Buscar categoría…', crear:CREAR_CATEGORIA});
      $('#addr',m).onclick=()=>{ ed.receta.push({ingredienteId:'',cantidad:1}); paintRows(); calc(); };
      $('#pr',m).oninput=calc; $('#cm',m).oninput=calc;
      cajaImagen($('#imgp',m), ed.id, IMG_PRESET.plato);
      paintRows(); calc();
      $('#ok',m).onclick=()=>{
        ed.nombre=$('#nm',m).value.trim(); if(!ed.nombre) return toast('Nombre requerido','warn');
        ed.emoji=$('#em',m).value.trim()||'🍽️'; ed.categoriaId=cbCt.valor();
        ed.precio=toN($('#pr',m).value); ed.costoManual=toN($('#cm',m).value); ed.activo=$('#ac',m).checked;
        ed.receta=ed.receta.filter(r=>r.ingredienteId&&r.cantidad>0);
        put('productos',ed); closeModal(); render(); toast('Producto guardado','ok');
      };
      if($('#del',m)) $('#del',m).onclick=()=>{ closeModal();
        confirmar('¿Eliminar "'+ed.nombre+'"?',()=>{remove('productos',ed.id);
          if(imgDe(ed.id)) borrarImagen(ed.id); render(); toast('Eliminado','ok');},true); };
    }});
}

/* ============================== COMPRAS =============================== */
function viewCompras(vw){
  let f={desde:todayISO().slice(0,8)+'01',hasta:todayISO(),q:'',estado:''};
  topact('<button class="btn pri sm" id="add">+ Nueva compra</button>');
  vw.innerHTML='<div id="cfil2"></div><div id="cbody2"></div>';
  function datos(){
    let cs=S.compras.filter(c=> c.fecha>=f.desde && c.fecha<=f.hasta);
    if(f.estado==='pendiente') cs=cs.filter(c=>c.estado!=='anulada'&&saldoCompra(c)>0.5);
    else if(f.estado==='pagada') cs=cs.filter(c=>c.estado!=='anulada'&&saldoCompra(c)<=0.5);
    else if(f.estado==='anulada') cs=cs.filter(c=>c.estado==='anulada');
    if(f.q) cs=filtra(cs,f.q,[c=>c.no, c=>nameOf('proveedores',c.proveedorId), c=>c.factura||'',
      c=>String(c.total), c=>(c.items||[]).map(i=>nameOf('ingredientes',i.ingredienteId)).join(' ')]);
    return cs.sort((a,b)=>b.fecha.localeCompare(a.fecha));
  }
  function exportar(){
    const cs=datos();
    const filas=[[{v:'Compras '+f.desde+' a '+f.hasta,t:'titulo'}],[],
      ['N°','Fecha','Proveedor','NIT','Factura','Ítems','Subtotal','Impuesto','Total','Abonado','Saldo','Condición','Vence','Estado'].map(x=>({v:x,b:1}))];
    cs.forEach(c=>{ const pv=byId('proveedores',c.proveedorId)||{};
      filas.push([c.no,c.fecha,pv.nombre||'',pv.nit||'',c.factura||'',(c.items||[]).length,
        c.subtotal||0,c.impuesto||0,c.total||0,abonadoDe(c.id),saldoCompra(c),
        c.credito?'crédito':'contado',c.vence||'',c.estado]); });
    const ok=cs.filter(c=>c.estado!=='anulada');
    filas.push([]); filas.push([{v:'TOTALES',b:1},'','','','','',{v:sum(ok,c=>c.subtotal||0)},
      {v:sum(ok,c=>c.impuesto||0)},{v:sum(ok,c=>c.total||0)},{v:sum(ok,c=>abonadoDe(c.id))},{v:sum(ok,saldoCompra)}]);
    const det=[['N°','Fecha','Proveedor','Ingrediente','Unidad','Cantidad','Costo unit.','Total'].map(x=>({v:x,b:1}))];
    cs.forEach(c=>(c.items||[]).forEach(i=>{ const g=byId('ingredientes',i.ingredienteId)||{};
      det.push([c.no,c.fecha,nameOf('proveedores',c.proveedorId),g.nombre||'',g.unidad||'',
        i.cantidad,i.costoUnit,round(i.cantidad*i.costoUnit,2)]); }));
    exportarExcel('compras_'+f.desde+'_'+f.hasta,[
      {nombre:'Compras',filas:filas,anchos:[12,11,24,13,13,8,12,11,13,12,12,11,11,10]},
      {nombre:'Detalle',filas:det,anchos:[12,11,22,24,9,11,12,13]}]);
  }
  function paint(){
    const cs=datos(), ok=cs.filter(c=>c.estado!=='anulada');
    $('#cbody2').innerHTML=
      '<div class="kpis" style="margin-bottom:14px">'+
        kpi('Compras del rango',money(sum(ok,c=>c.total)),ok.length+' facturas','brand')+
        kpi('Pagado',money(sum(ok,c=>abonadoDe(c.id)||(saldoCompra(c)<=0.5?c.total:0))),'','')+
        kpi('Por pagar',money(sum(cxp(),saldoDoc)),cxp().length+' pendientes',cxp().length?'bad':'ok')+
        kpi('Proveedores',S.proveedores.filter(p=>p.activo).length,'','')+
      '</div>'+
      '<div class="card"><div class="bd p0">'+tbl([
        {t:'N°',f:c=>'<b>'+esc(c.no)+'</b>'},
        {t:'Fecha',f:c=>fdate(c.fecha)},
        {t:'Proveedor',f:c=>esc(nameOf('proveedores',c.proveedorId))},
        {t:'Factura',f:c=>esc(c.factura||'—')},
        {t:'Ítems',num:1,f:c=>(c.items||[]).length},
        {t:'Total',num:1,f:c=>'<b>'+money(c.total)+'</b>'},
        {t:'Saldo',num:1,f:c=>{const x=saldoCompra(c);return x>0.5&&c.estado!=='anulada'?'<b style="color:var(--bad)">'+money(x)+'</b>':'<span class="muted">—</span>';}},
        {t:'Estado',f:c=> (c.estado==='anulada'?'<span class="pill bad">Anulada</span>':
          saldoCompra(c)>0.5?'<span class="pill warn">Pendiente</span>':'<span class="pill ok">Pagada</span>')+

  $('#d2').onchange=e=>{f.hasta=e.target.value;paint();};

}
function edCompra(orig){
  const gs=S.ingredientes.filter(g=>g.activo);
  let items=orig? (orig.items||[]).map(i=>Object.assign({},i)) : [];
  let credito=orig? !!orig.credito : false;
  modal({title: orig? 'Editar compra '+orig.no : 'Nueva compra', size:'xl',
    body:'<div class="grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:14px">'+
      '<div class="f"><label>Proveedor</label><div id="pv"></div></div>'+
      '<div class="f"><label>Fecha</label><input id="fe" type="date" value="'+esc((orig&&orig.fecha)||todayISO())+'"></div>'+
      '<div class="f"><label>N° factura</label><input id="fa" placeholder="FV-1234" value="'+esc((orig&&orig.factura)||'')+'"></div>'+
      '<div class="f"><label>Condición</label><select id="cd">'+
        '<option value="contado"'+(credito?'':' selected')+'>Contado</option>'+
        '<option value="credito"'+(credito?' selected':'')+'>Crédito</option></select></div>'+
      '</div>'+
      '<div id="credb" class="hide grid" style="grid-template-columns:1fr 1fr;margin-bottom:12px">'+
        '<div class="f"><label>Plazo (días)</label><input id="plz" type="number" value="30"></div>'+
        '<div class="f"><label>&nbsp;</label><div class="hintx" id="vinfo"></div></div></div>'+
      '<div id="pagob" class="grid" style="grid-template-columns:1fr 1.4fr;margin-bottom:12px">'+
        '<div class="f"><label>Forma de pago</label><select id="fp">'+
          MEDIOS.filter(x=>x.k!=='credito').map(x=>'<option value="'+x.k+'"'+
            ((orig&&orig.medioPago===x.k)?' selected':'')+'>'+x.e+' '+x.n+'</option>').join('')+'</select></div>'+
        '<div class="f"><label>Sale de</label><select id="ct"></select></div></div>'+
      '<div class="row" style="margin-bottom:8px"><b>Ítems</b><span class="spacer"></span>'+
        '<button class="btn sm" id="addi">+ Ingrediente</button></div>'+
      '<div id="rows"></div>'+
      '<div class="card" style="margin-top:14px;background:var(--panel2)"><div class="bd">'+
        '<div class="tline"><span>Subtotal</span><span class="v" id="tsub">—</span></div>'+
        '<div class="f" style="margin:8px 0"><label>IVA / impuestos de la factura</label>'+
          '<input id="iv" type="number" step="any" value="'+((orig&&orig.impuesto)||0)+'"></div>'+
        '<div class="tline big"><span>Total</span><span class="v" id="ttot">—</span></div></div></div>',
    footer:'<button class="btn" data-x>Cancelar</button><button class="btn pri" id="ok">'+
      (orig?'Guardar cambios':'Registrar compra')+'</button>',
    onOpen:m=>{
      function calc(){
        const s=round(sum(items,i=>i.cantidad*i.costoUnit),2);
        const iva=toN($('#iv',m).value);
        $('#tsub',m).textContent=money(s); $('#ttot',m).textContent=money(s+iva);
        return {sub:s,iva:iva,total:round(s+iva,2)};
      }
      function paintRows(){
        $('#rows',m).innerHTML= items.length? items.map((r,i)=>{
          const g=byId('ingredientes',r.ingredienteId)||{};
          return '<div class="grid" data-i="'+i+'" style="grid-template-columns:2fr 100px 46px 130px 120px 34px;gap:7px;align-items:center;margin-bottom:7px">'+
            '<div data-g></div>'+
            '<input data-q type="number" step="any" value="'+r.cantidad+'">'+
            '<span class="tiny muted" data-u>'+esc(g.unidad||'')+'</span>'+
            '<input data-c type="number" step="any" value="'+r.costoUnit+'">'+
            '<span class="num b mono" data-tt>'+money(r.cantidad*r.costoUnit)+'</span>'+
            '<button class="btn ghost sm" data-x2>✕</button></div>';
        }).join('') : '<div class="hintx">Agrega al menos un ingrediente.</div>';
        $$('[data-i]',$('#rows',m)).forEach(row=>{ const i=+row.dataset.i;
          const tot=()=>{ $('[data-tt]',row).textContent=money(items[i].cantidad*items[i].costoUnit); calc(); };
          combo($('[data-g]',row),{lista:S.ingredientes.filter(x=>x.activo), valor:items[i].ingredienteId,
            placeholder:'Buscar ingrediente…', sub:x=>'stock '+num(x.stock,2)+' '+x.unidad, crear:CREAR_INGREDIENTE,
            onPick:(id,obj)=>{ items[i].ingredienteId=id;
              $('[data-u]',row).textContent=(obj&&obj.unidad)||'';
              if(obj && !items[i].costoUnit && obj.costo){ items[i].costoUnit=obj.costo; $('[data-c]',row).value=obj.costo; }
              tot(); }});
          $('[data-q]',row).oninput=e=>{items[i].cantidad=toN(e.target.value);tot();};
          $('[data-c]',row).oninput=e=>{items[i].costoUnit=toN(e.target.value);tot();};
          $('[data-x2]',row).onclick=()=>{items.splice(i,1);paintRows();calc();};
        });
      }
      const pintaCtas=()=>{ const k=$('#fp',m).value;
        $('#ct',m).innerHTML=opcionesCuenta(k,(orig&&orig.cuentaId)||cuentaDeMedio(k)); };
      $('#fp',m).onchange=pintaCtas; pintaCtas();
      const cbPv=combo($('#pv',m),{lista:S.proveedores.filter(p=>p.activo), valor:(orig&&orig.proveedorId)||'',
        placeholder:'Buscar proveedor…',
        sub:x=>[x.nit,x.telefono].filter(Boolean).join(' · '), crear:CREAR_PROVEEDOR});
      if(credito){ $('#credb',m).classList.remove('hide'); $('#pagob',m).classList.add('hide'); }
      $('#addi',m).onclick=()=>{ items.push({ingredienteId:'',cantidad:1,costoUnit:0}); paintRows(); calc(); };
      $('#iv',m).oninput=calc;
      $('#cd',m).onchange=e=>{ credito=e.target.value==='credito';
        $('#credb',m).classList.toggle('hide',!credito); $('#pagob',m).classList.toggle('hide',credito);
        $('#vinfo',m).textContent= credito? 'Vence el '+dateAdd($('#fe',m).value,toN($('#plz',m).value)) : ''; };
      $('#plz',m).oninput=()=>{ $('#vinfo',m).textContent='Vence el '+dateAdd($('#fe',m).value,toN($('#plz',m).value)); };
      paintRows(); calc();
      $('#ok',m).onclick=()=>{
        items=items.filter(i=>i.ingredienteId && i.cantidad>0);
        if(!items.length) return toast('Agrega ítems a la compra','warn');
        if(!cbPv.valor()) return toast('Busca o crea el proveedor','warn');
        const t=calc();
        if(!credito && bloqueaCaja($('#ct',m).value))
          return conCaja($('#ct',m).value,()=>$('#ok',m).click(),'Pago de compra por '+money(t.total));
        let parcial=false;
        if(orig) parcial=deshacerCompra(orig);
        const cp={id: orig? orig.id : uid('cp'), no: orig? orig.no : nextNo('compra','C-'),
          fecha:$('#fe',m).value||todayISO(),
          proveedorId:cbPv.valor(), factura:$('#fa',m).value.trim(), items:items.slice(),
          subtotal:t.sub, impuesto:t.iva, total:t.total, credito:credito,
          vence: credito? dateAdd($('#fe',m).value||todayISO(),toN($('#plz',m).value)):'',
          estado: credito?'pendiente':'pagada',
          medioPago: credito?'':$('#fp',m).value, cuentaId: credito?'':$('#ct',m).value,
          usuarioId:S.user?S.user.id:''};
        put('compras',cp);
        items.forEach(i=> movInv(i.ingredienteId,'entrada',i.cantidad,i.costoUnit,'compra',cp.id,'Compra '+cp.no));
        if(!credito) movTes(cp.cuentaId,'egreso',cp.total,'Compra '+cp.no+' · '+nameOf('proveedores',cp.proveedorId),'compra','compra',cp.id,
          terceroDe('proveedor',cp.proveedorId));
        if(!credito && !cp.cuentaId) toast('Ojo: la compra quedó sin cuenta de salida','warn',5000);
        if(orig) firmar(cp), put('compras',cp);
        closeModal(); render();
        toast(orig? ('Compra '+cp.no+' corregida'+(parcial?' · parte ya se había vendido':''))
                  : ('Compra '+cp.no+' registrada'),'ok', parcial?7000:2500);
      };
    }});
}

    body:'<div class="grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:14px">'+

      (puedeEditar()&&c.estado!=='anulada'?'<button class="btn" id="edt">✎ Editar</button>'+
        '<button class="btn danger" id="anu">🗑️ Borrar</button>':'')+
      '<div class="spacer"></div><button class="btn" data-x>Cerrar</button>',
    onOpen:m=>{
      if($('#pg',m)) $('#pg',m).onclick=()=>{closeModal();mAbono('cxp',c);};
      if($('#imp',m)) $('#imp',m).onclick=()=>comprobanteCompra(c,true);
      if($('#edt',m)) $('#edt',m).onclick=()=>{closeModal();edCompra(c);};
      if($('#anu',m)) $('#anu',m).onclick=()=>{closeModal();anularCompra(c);};
      if($('#fixdoble',m)) $('#fixdoble',m).onclick=()=>{ closeModal(); quitarPagosDobles(c); };

}

function viewCartera(vw){

  topact('<button class="btn sm" id="ndc">+ Por cobrar</button><button class="btn sm" id="ndp">+ Por pagar</button>');
  vw.innerHTML='<div id="ctabs"></div><div id="cbody"></div>';

  $('#ctabs').appendChild(tabsBar([['cxc','Por cobrar'],['cxp','Por pagar'],['abonos','Cobros y pagos']],tab,t=>{tab=t;paint();}));
  $('#ndc').onclick=()=>edOtroDoc('cxc');
  $('#ndp').onclick=()=>edOtroDoc('cxp');
  function paint(){
    $$('#ctabs .tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));

      let as=S.abonos.filter(a=>dISO(a.fecha)>=fa.desde && dISO(a.fecha)<=fa.hasta);

          '</div></div></div>'+
        '<div class="kpis" style="margin-bottom:14px">'+

          kpi('Pagado a proveedores',money(pagado),'salió de caja o banco','bad')+

        '</div>'+
        '<div class="card"><div class="bd p0">'+tbl([

        {t:'Tipo',f:a=>a.tipo==='cxc'?'<span class="pill ok">Cobro</span>':'<span class="pill bad">Pago</span>'},
        {t:'Documento',f:a=>{const d=docCartera(a.docId);return esc(d?d.no:'—');}},

      ],as,{empty: fa.q?'Nada coincide con «'+esc(fa.q)+'»':'Sin cobros ni pagos en el rango',icon:'💳'})+'</div></div>';
      $$('[data-ab]',$('#view')).forEach(b=>b.onclick=()=>borrarAbono(byId('abonos',b.dataset.ab)));
      $$('[data-ra]',$('#view')).forEach(b=>b.onclick=()=>{ comprobanteAbono(byId('abonos',b.dataset.ra),true);

      $('#ames').onclick=()=>rg(todayISO().slice(0,8)+'01',todayISO());
      const el=$('#aq'); el.oninput=debounce(()=>{ fa.q=el.value; const p=el.selectionStart; paint();
        const n=$('#aq'); n.focus(); n.setSelectionRange(p,p); },200);
      $('#axls').onclick=()=>{
        const filas=[[{v:'Cobros y pagos '+fa.desde+' a '+fa.hasta,t:'titulo'}],[],
