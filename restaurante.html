<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>POS Restaurante</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8D%BD%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#f2f4f7; --panel:#ffffff; --panel2:#f8fafc; --ink:#111827; --ink2:#374151;
  --muted:#6b7280; --line:#e3e7ee; --line2:#eef1f6;
  --brand:#e2542c; --brand-ink:#fff; --brand-soft:#fdeee9;
  --ok:#118d57; --ok-soft:#e6f4ee; --warn:#b7791f; --warn-soft:#fdf3e3;
  --bad:#c92a2a; --bad-soft:#fdecec; --info:#1c6fd4; --info-soft:#e9f1fd;
  --sb:#161b26; --sb-ink:#c9d1de; --sb-active:#242c3d;
  --r:10px; --r2:14px;
  --sh:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.1);
  --sh2:0 10px 30px rgba(16,24,40,.14);
}
[data-theme="dark"]{
  --bg:#0e1117; --panel:#161a22; --panel2:#1c212b; --ink:#e7eaf0; --ink2:#c2c9d6;
  --muted:#8b94a5; --line:#252b36; --line2:#1e232d;
  --brand:#f2683c; --brand-soft:#33201a;
  --ok:#3fbf85; --ok-soft:#14291f; --warn:#e0a944; --warn-soft:#2b2415;
  --bad:#ef5f5f; --bad-soft:#2c1818; --info:#5b9bf0; --info-soft:#152234;
  --sb:#0a0d13; --sb-ink:#98a2b3; --sb-active:#1b2130;
  --sh:0 1px 2px rgba(0,0,0,.4); --sh2:0 10px 30px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
input,select,textarea{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
input[type=checkbox]{width:auto}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:8px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--muted);background-clip:content-box}
.hide{display:none!important}

/* ---------- shell ---------- */
#app{display:grid;grid-template-columns:214px 1fr;height:100vh}
#sidebar{background:var(--sb);color:var(--sb-ink);display:flex;flex-direction:column;overflow:hidden}
.brand{padding:16px 16px 12px;display:flex;gap:10px;align-items:center;color:#fff}
.brand .logo{width:32px;height:32px;border-radius:9px;background:var(--brand);display:grid;place-items:center;font-size:17px;flex:0 0 auto}
.brand b{font-size:14px;letter-spacing:.2px;display:block;line-height:1.2}
.brand small{color:var(--sb-ink);font-size:11px}
.nav{flex:1;overflow-y:auto;padding:6px 8px 12px}
.nav .sec{font-size:10px;letter-spacing:.9px;text-transform:uppercase;color:#5c6679;padding:14px 10px 6px;font-weight:700}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--sb-ink);text-decoration:none;font-size:13.5px;margin-bottom:1px}
.nav a:hover{background:var(--sb-active);color:#fff}
.nav a.on{background:var(--brand);color:#fff;font-weight:600}
.nav a .ic{width:18px;text-align:center;font-size:15px}
.nav a .badge{margin-left:auto;background:rgba(255,255,255,.14);border-radius:20px;font-size:10.5px;padding:1px 7px;font-weight:700}
.nav a.on .badge{background:rgba(0,0,0,.22)}
#sbfoot{border-top:1px solid rgba(255,255,255,.07);padding:10px}
.userchip{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:9px;width:100%;text-align:left}
.userchip:hover{background:var(--sb-active)}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:12px;flex:0 0 auto}
.userchip .nm{font-size:12.5px;color:#fff;font-weight:600;line-height:1.2}
.userchip .rl{font-size:10.5px;color:var(--sb-ink);text-transform:capitalize}

#main{display:flex;flex-direction:column;min-width:0;overflow:hidden}
#topbar{height:54px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 16px;flex:0 0 auto}
#topbar h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.2px}
#topbar .sub{color:var(--muted);font-size:12px}
.spacer{flex:1}
#view{flex:1;overflow-y:auto;padding:16px;min-height:0}
#view.nopad{padding:0}

/* ---------- atoms ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:9px;
  background:var(--panel);border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--ink2);white-space:nowrap;transition:.12s}
.btn:hover{background:var(--panel2);border-color:var(--muted)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--line2);border-color:transparent}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:7px}
.btn.lg{padding:13px 20px;font-size:15px;border-radius:11px}
.btn.blk{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--sh)}
.card>.hd{padding:13px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.card>.hd h3{margin:0;font-size:14px;font-weight:650}
.card>.bd{padding:16px}
.card>.bd.p0{padding:0}
.grid{display:grid;gap:14px}
.row{display:flex;gap:10px;align-items:center}
.wrap{flex-wrap:wrap}
.f{display:flex;flex-direction:column;gap:5px}
.f>label{font-size:11.5px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
.hintx{font-size:11.5px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:650;background:var(--line2);color:var(--ink2)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.info{background:var(--info-soft);color:var(--info)}
.pill.brand{background:var(--brand-soft);color:var(--brand)}
.mono{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.num{text-align:right;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.tiny{font-size:11.5px}
.b{font-weight:650}
.empty{padding:48px 20px;text-align:center;color:var(--muted)}
.empty .ico{font-size:38px;opacity:.5;display:block;margin-bottom:8px}

table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);
  padding:9px 12px;border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0;z-index:1;font-weight:700}
table.tbl td{padding:9px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.tbl tbody tr:hover{background:var(--panel2)}
table.tbl td.num,table.tbl th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.tblwrap{overflow:auto;max-height:100%}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(168px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:14px 15px;box-shadow:var(--sh)}
.kpi .lb{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700}
.kpi .vl{font-size:23px;font-weight:700;margin-top:5px;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.kpi .df{font-size:11.5px;color:var(--muted);margin-top:2px}
.kpi.acc-ok .vl{color:var(--ok)} .kpi.acc-bad .vl{color:var(--bad)} .kpi.acc-brand .vl{color:var(--brand)}

.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:14px;overflow-x:auto}
.tabs button{padding:9px 13px;font-size:13px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tabs button.on{color:var(--brand);border-bottom-color:var(--brand)}

/* ---------- POS ---------- */
#pos{display:grid;grid-template-columns:1fr 372px;height:100%;min-height:0}
#posleft{display:flex;flex-direction:column;min-width:0;border-right:1px solid var(--line)}
#poscats{display:flex;gap:7px;padding:12px 14px;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto}
#poscats button{padding:7px 14px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
#poscats button.on{background:var(--brand);border-color:var(--brand);color:#fff}
#possearch{padding:10px 14px 0;flex:0 0 auto}
#posgrid{flex:1;overflow-y:auto;padding:12px 14px;display:grid;gap:11px;
  grid-template-columns:repeat(auto-fill,minmax(132px,1fr));align-content:start}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:11px;cursor:pointer;
  display:flex;flex-direction:column;gap:6px;transition:.11s;box-shadow:var(--sh);position:relative;text-align:left;min-height:118px}
.pcard:hover{border-color:var(--brand);transform:translateY(-2px);box-shadow:var(--sh2)}
.pcard:active{transform:scale(.975)}
.pcard .em{font-size:27px;line-height:1}
.pcard .nm{font-size:13px;font-weight:650;line-height:1.25;flex:1}
.pcard .pr{font-size:14.5px;font-weight:750;color:var(--brand);font-variant-numeric:tabular-nums}
.pcard .st{position:absolute;top:8px;right:8px;font-size:10px;font-weight:700;padding:1px 6px;border-radius:20px}
.pcard.out{opacity:.5}
.pcard .st.no{background:var(--bad-soft);color:var(--bad)}
.pcard .st.low{background:var(--warn-soft);color:var(--warn)}

#poscart{display:flex;flex-direction:column;background:var(--panel);min-width:0}
#carthd{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;flex:0 0 auto}
#cartitems{flex:1;overflow-y:auto;padding:8px 10px}
.citem{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:9px 8px;border-radius:9px;border:1px solid transparent}
.citem:hover{background:var(--panel2);border-color:var(--line)}
.citem+.citem{border-top:1px solid var(--line2)}
.citem .nm{font-size:13px;font-weight:600;line-height:1.25}
.citem .un{font-size:11.5px;color:var(--muted)}
.citem .tt{font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.qty{justify-self:start;display:inline-flex;align-items:center;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.qty button{width:26px;height:26px;display:grid;place-items:center;font-size:15px;font-weight:700;color:var(--ink2)}
.qty button:hover{background:var(--line2)}
.qty span{min-width:26px;text-align:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
#carttot{border-top:1px solid var(--line);padding:12px 14px;flex:0 0 auto;background:var(--panel2)}
.tline{display:flex;justify-content:space-between;font-size:13px;padding:2.5px 0;color:var(--ink2)}
.tline.big{font-size:20px;font-weight:750;color:var(--ink);padding-top:8px;margin-top:6px;border-top:1px dashed var(--line)}
.tline .v{font-variant-numeric:tabular-nums;font-weight:650}

/* ---------- mesas ---------- */
.mesas{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.mesa{background:var(--panel);border:2px solid var(--line);border-radius:var(--r2);padding:14px;text-align:left;box-shadow:var(--sh);transition:.12s;min-height:104px;display:flex;flex-direction:column;gap:3px}
.mesa:hover{transform:translateY(-2px);box-shadow:var(--sh2)}
.mesa .n{font-size:15px;font-weight:700}
.mesa .z{font-size:11.5px;color:var(--muted)}
.mesa .t{margin-top:auto;font-size:15px;font-weight:750;font-variant-numeric:tabular-nums}
.mesa.libre{border-style:dashed}
.mesa.libre .t{color:var(--muted);font-size:12px;font-weight:600}
.mesa.ocupada{border-color:var(--brand);background:var(--brand-soft)}
.mesa.ocupada .t{color:var(--brand)}
[data-theme="dark"] .mesa.ocupada{background:var(--panel)}

/* ---------- modal ---------- */
#modals{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:18px;background:rgba(15,20,30,.55);backdrop-filter:blur(3px)}
#modals.on{display:flex}
.modal{background:var(--panel);border-radius:16px;box-shadow:var(--sh2);width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden;animation:pop .16s ease-out}
.modal.wide{max-width:900px}.modal.xl{max-width:1120px}.modal.slim{max-width:400px}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.98)}}
.modal>.hd{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex:0 0 auto}
.modal>.hd h3{margin:0;font-size:16px;font-weight:650}
.modal>.bd{padding:18px;overflow-y:auto;flex:1}
.modal>.ft{padding:13px 18px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;flex:0 0 auto;background:var(--panel2)}

/* ---------- toast ---------- */
#toasts{position:fixed;bottom:18px;right:18px;z-index:130;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
.toast{background:var(--sb);color:#fff;padding:11px 15px;border-radius:10px;box-shadow:var(--sh2);font-size:13px;font-weight:550;
  display:flex;gap:9px;align-items:center;max-width:380px;animation:sl .18s ease-out}
@keyframes sl{from{opacity:0;transform:translateX(24px)}}
.toast.ok{background:var(--ok)}.toast.bad{background:var(--bad)}.toast.warn{background:var(--warn)}

/* ---------- sync chip ---------- */
#sync{display:flex;align-items:center;gap:7px;padding:5px 11px;border-radius:20px;background:var(--panel2);border:1px solid var(--line);font-size:12px;font-weight:650;color:var(--ink2)}
#sync .dot{width:7px;height:7px;border-radius:50%;background:var(--ok)}
#sync.busy .dot{background:var(--info);animation:pulse 1s infinite}
#sync.pend .dot{background:var(--warn)}
#sync.off .dot{background:var(--muted)}
#sync.err .dot{background:var(--bad)}
@keyframes pulse{50%{opacity:.25}}

/* ---------- login ---------- */
#login{position:fixed;inset:0;z-index:80;background:var(--sb);display:flex;align-items:center;justify-content:center;padding:20px}
#login .box{width:100%;max-width:340px;text-align:center;color:#fff}
#login .logo{width:60px;height:60px;border-radius:17px;background:var(--brand);display:grid;place-items:center;font-size:30px;margin:0 auto 14px}
#login h2{margin:0 0 3px;font-size:20px}
#login p{color:var(--sb-ink);margin:0 0 20px;font-size:13px}
#loginform input{background:#1b2130;border-color:#2b3446;color:#fff;padding:11px 12px;font-size:15px}
#loginform input:focus{border-color:var(--brand);box-shadow:none}
#loginform label{letter-spacing:.4px;color:#7b8698}
.shake{animation:shk .3s}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* ---------- ticket ---------- */
#tikframe{position:fixed;width:0;height:0;border:0;left:-9999px}
.imgprev{width:92px;height:92px;border-radius:12px;border:1px solid var(--line);overflow:hidden;
  background:var(--panel2);display:grid;place-items:center;flex:0 0 auto}
.imgprev img{width:100%;height:100%;object-fit:cover;display:block}
.imgprev.vacia span{font-size:10.5px;color:var(--muted)}
.pcard .foto{width:100%;height:74px;border-radius:9px;object-fit:cover;display:block;background:var(--panel2)}
.brand .logoimg{width:32px;height:32px;border-radius:9px;object-fit:cover;flex:0 0 auto}
#login .logoimg{width:60px;height:60px;border-radius:17px;object-fit:cover;margin:0 auto 14px;display:block}
.recipe-row{display:grid;grid-template-columns:1fr 92px 66px 32px;gap:7px;align-items:center;margin-bottom:7px}
.paybtn{display:flex;flex-direction:column;align-items:center;gap:5px;padding:13px 8px;border-radius:12px;border:2px solid var(--line);background:var(--panel);font-size:12.5px;font-weight:650}
.paybtn .e{font-size:21px}
.paybtn.on{border-color:var(--brand);background:var(--brand-soft);color:var(--brand)}
.quickamt{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.quickamt button{padding:9px 4px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);font-size:12.5px;font-weight:650}
.quickamt button:hover{border-color:var(--brand)}

@media (max-width:1080px){
  #app{grid-template-columns:64px 1fr}
  .brand b,.brand small,.nav a span.tx,.nav .sec,.userchip .nm,.userchip .rl{display:none}
  .nav a{justify-content:center;padding:11px 0}
  .nav a .badge{position:absolute;margin:0;transform:translate(15px,-11px);font-size:9px;padding:0 5px}
  .nav a{position:relative}
  #pos{grid-template-columns:1fr 320px}
}
@media (max-width:820px){
  #pos{grid-template-columns:1fr;grid-template-rows:1fr auto}
  #poscart{max-height:44vh;border-top:1px solid var(--line)}
}
@media print{body *{visibility:hidden}}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <div class="logo">🍽️</div>
    <h2 id="lgname">POS Restaurante</h2>
    <p id="lgsub">Entra con tu correo y tu clave</p>

    <div id="loginform" style="text-align:left">
      <div class="f" style="margin-bottom:10px"><label>Correo</label>
        <input id="lg_mail" type="email" autocomplete="username" placeholder="tucorreo@ejemplo.com"></div>
      <div class="f" style="margin-bottom:14px"><label>Clave</label>
        <input id="lg_pass" type="password" autocomplete="current-password" placeholder="••••••••"></div>
      <button class="btn pri lg blk" id="lg_in">Entrar</button>
      <p id="lg_err" class="hide" style="color:#ef5f5f;font-size:12.5px;margin:11px 0 0"></p>
      <div class="row" style="margin-top:14px;justify-content:center;gap:6px">
        <button class="btn ghost sm" id="lg_help" style="color:#8b94a5">¿No puedes entrar?</button>
        <button class="btn ghost sm" id="lg_diag" style="color:#8b94a5">Revisar conexión</button>
      </div>
    </div>
  </div>
</div>

<div id="app">
  <aside id="sidebar">
    <div class="brand"><div class="logo">🍽️</div><div><b id="bizname">Mi Restaurante</b><small>Punto de venta</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div id="sbfoot">
      <button class="userchip" id="btnuser">
        <div class="avatar" id="uav">?</div>
        <div><div class="nm" id="unm">—</div><div class="rl" id="url">—</div></div>
      </button>
    </div>
  </aside>
  <main id="main">
    <header id="topbar">
      <div><h1 id="ttl">Punto de venta</h1><div class="sub" id="tsub"></div></div>
      <div class="spacer"></div>
      <div id="topact" class="row"></div>
      <button id="sync" title="Estado de sincronización"><span class="dot"></span><span id="synctx">Local</span></button>
      <button class="btn ghost sm" id="btntheme" title="Tema">🌙</button>
    </header>
    <section id="view"></section>
  </main>
</div>

<div id="modals"></div>
<div id="toasts"></div>
<iframe id="tikframe"></iframe>

<script>
"use strict";
/* =====================================================================
   POS RESTAURANTE — arquitectura local-first
   memoria (lectura instantánea) → IndexedDB (cache durable, escritura
   por lotes) → outbox (cola) → Google Sheets en segundo plano
   ===================================================================== */

/* ------------------------------- utils ------------------------------ */
const $  = (s,r)=> (r||document).querySelector(s);
const $$ = (s,r)=> Array.from((r||document).querySelectorAll(s));
const uid = p => (p||'id')+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const now = ()=> new Date().toISOString();
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));

/* ------------------------------ IndexedDB --------------------------- */
const DBNAME='pos_restaurante', DBVER=1;
const STORES=['config','usuarios','categorias','ingredientes','productos','proveedores','clientes','mesas',
  'comandas','ventas','compras','abonos','cuentas','movimientos','turnos','movinv','capas','imagenes','outbox','meta'];
let _db=null, MODE='idb';                 // idb | ls | mem
const _ls=new Map();                       // respaldo cuando IndexedDB no está disponible (archivo local)

function openDB(){
  return new Promise(res=>{
    let done=false;
    const fin=m=>{ if(done)return; done=true; MODE=m; res(m); };
    setTimeout(()=>fin(_db?'idb':'ls'),3500);            // navegadores que se quedan bloqueados
    try{
      const rq=indexedDB.open(DBNAME,DBVER);
      rq.onupgradeneeded=e=>{ const db=e.target.result;
        STORES.forEach(st=>{ if(!db.objectStoreNames.contains(st)) db.createObjectStore(st,{keyPath:'id'}); }); };
      rq.onsuccess=e=>{ _db=e.target.result; fin('idb'); };
      rq.onerror=()=>fin('ls');
      rq.onblocked=()=>fin('ls');
    }catch(e){ fin('ls'); }
  });
}
function lsKey(st){ return 'pos_'+st; }
function lsLoad(st){
  if(_ls.has(st)) return _ls.get(st);
  let arr=[]; try{ arr=JSON.parse(localStorage.getItem(lsKey(st))||'[]')||[]; }catch(e){ arr=[]; }
  const m=new Map(); arr.forEach(o=>{ if(o&&o.id) m.set(o.id,o); });
  _ls.set(st,m); return m;
}
function idbAll(store){
  if(MODE!=='idb'||!_db){ try{ return Promise.resolve(Array.from(lsLoad(store).values())); }catch(e){ return Promise.resolve([]); } }
  return new Promise(res=>{
    try{ const t=_db.transaction(store,'readonly').objectStore(store).getAll();
      t.onsuccess=()=>res(t.result||[]); t.onerror=()=>res([]);
    }catch(e){ res([]); }
  });
}
/* escrituras por lotes: se acumulan y se vacían cada 200 ms de una sola vez */
let _wq=new Map(); let _wt=null;
function idbPut(store,obj){ _q(store,{op:'put',obj:obj,id:obj.id}); }
function idbDel(store,id){  _q(store,{op:'del',id:id}); }
function _q(store,o){
  if(!_wq.has(store)) _wq.set(store,new Map());
  _wq.get(store).set(o.id,o);
  if(MODE!=='idb'){ const m=lsLoad(store); o.op==='put'? m.set(o.id,o.obj) : m.delete(o.id); }
  if(!_wt) _wt=setTimeout(flushIDB,200);
}
function flushIDB(){
  _wt=null; if(!_wq.size) return;
  const batch=_wq; _wq=new Map();
  if(MODE==='idb' && _db){
    const names=Array.from(batch.keys()).filter(n=>_db.objectStoreNames.contains(n));
    if(!names.length) return;
    try{
      const tx=_db.transaction(names,'readwrite');
      names.forEach(n=>{ const os=tx.objectStore(n);
        batch.get(n).forEach(o=>{ try{ o.op==='put'? os.put(o.obj) : os.delete(o.id); }catch(e){} }); });
    }catch(e){ MODE='ls'; }
    return;
  }
  if(MODE==='mem') return;
  try{
    Array.from(batch.keys()).forEach(st=>
      localStorage.setItem(lsKey(st), JSON.stringify(Array.from(lsLoad(st).values()))));
  }catch(e){ MODE='mem'; console.warn('Sin almacenamiento persistente',e); }
}
window.addEventListener('beforeunload',flushIDB);
document.addEventListener('visibilitychange',()=>{ if(document.hidden) flushIDB(); });

  opts=opts||{};

  const i=arr.findIndex(x=>x.id===obj.id);
  if(i>=0) arr[i]=obj; else arr.push(obj);
  idbPut(coll,obj);
  if(opts.sync!==false) enqueue(coll,'upsert',obj);
  return obj;
}

  arr.splice(i,1); idbDel(coll,id);
  if(!opts||opts.sync!==false) enqueue(coll,'delete',{id});

  }
  const t={EMAIL_NOT_FOUND:'Ese correo no está registrado',INVALID_PASSWORD:'Contraseña incorrecta',
    INVALID_LOGIN_CREDENTIALS:'Correo o contraseña incorrectos',EMAIL_EXISTS:'Ese correo ya está registrado',
    WEAK_PASSWORD:'La contraseña debe tener al menos 6 caracteres',

    TOKEN_EXPIRED:'La sesión expiró, vuelve a entrar',USER_DISABLED:'Usuario deshabilitado',
    'Missing or insufficient permissions.':'Las reglas de Firestore no permiten esta operación'};
  for(const k in t) if(m.indexOf(k)>=0) return t[k];

async function fbJson(url,opts){
  const r=await fetch(url,opts);
  let j={}; try{ j=await r.json(); }catch(e){}
  if(Array.isArray(j) && j[0] && j[0].error) throw new Error(j[0].error.message||'Error de Firestore');
  if(!r.ok) throw new Error((j.error&&(j.error.message||j.error.status))||('HTTP '+r.status));
  return j;
}

/* --- codificación de valores de Firestore --- */
function fsVal(v){
  if(v===null||v===undefined) return {nullValue:null};
  if(typeof v==='boolean') return {booleanValue:v};
  if(typeof v==='number'){ if(!isFinite(v)) return {doubleValue:0};
    return Number.isInteger(v)? {integerValue:String(v)} : {doubleValue:v}; }
  if(typeof v==='string') return {stringValue:v};
  if(Array.isArray(v)) return {arrayValue:{values:v.map(fsVal)}};
  if(typeof v==='object') return {mapValue:{fields:fsFields(v)}};
  return {stringValue:String(v)};
}
function fsFields(o){ const f={}; Object.keys(o).forEach(k=>{ if(k.indexOf('.')<0) f[k]=fsVal(o[k]); }); return f; }
function fsParse(v){
  if(!v) return null;
  if('nullValue' in v) return null;
  if('booleanValue' in v) return !!v.booleanValue;
  if('integerValue' in v) return Number(v.integerValue);
  if('doubleValue' in v) return Number(v.doubleValue);
  if('stringValue' in v) return v.stringValue;
  if('timestampValue' in v) return v.timestampValue;
  if('arrayValue' in v) return (v.arrayValue.values||[]).map(fsParse);
  if('mapValue' in v) return fsDoc(v.mapValue.fields||{});
  return null;
}
function fsDoc(fields){ const o={}; Object.keys(fields||{}).forEach(k=>{ o[k]=fsParse(fields[k]); }); return o; }

/* la configuración del dispositivo nunca viaja a la nube */

/* ------------------------- cola de envío (outbox) ------------------- */
let syncing=false, syncErr=0, lastSync=null, lastPull=null, pulling=false;
function enqueue(entidad,op,payload){
  if(!S.cfg.fbOn) return;                       // en modo local la cola no crece
  if(entidad==='config') payload=cfgParaNube();
  const item={id:uid('q'),ts:now(),entidad:entidad,op:op,payload:payload,intentos:0,error:''};
  S.outbox.push(item); idbPut('outbox',item);
  paintSync();
  if(S.cfg.autoSync) scheduleSync();
}
let _st=null;
function scheduleSync(ms){ if(_st) return; _st=setTimeout(()=>{_st=null;flushOutbox();}, ms||1200); }

async function flushOutbox(manual){
  if(syncing) return;
  if(!S.cfg.fbOn){ paintSync(); if(manual) toast('Activa la nube en Ajustes','warn'); return; }
  if(!FB.listo() && !(await fbRestaurarSesion())){ paintSync();
    if(manual) toast('Inicia sesión en la nube (Ajustes ▸ Nube)','warn'); return; }
  if(!navigator.onLine){ paintSync(); if(manual) toast('Sin conexión a internet','warn'); return; }
  if(!S.outbox.length){ paintSync(); if(manual) toast('No hay nada pendiente','ok'); return; }
  syncing=true; paintSync();
  const lote=S.outbox.slice(0,400);
  /* una sola escritura por documento: gana la última de la cola */
  const porDoc=new Map();
  lote.forEach(o=>{ const id=(o.payload&&o.payload.id)||''; if(id) porDoc.set(o.entidad+'/'+id,o); });
  try{
    const hdr=await fbAuthHdr();
    const writes=Array.from(porDoc.values()).map(o=>{
      const datos = o.op==='delete'
        ? {id:o.payload.id,_del:true,upd:o.ts}
        : Object.assign({},o.payload,{upd:o.payload.upd||o.ts});
      return {update:{name:fbDocRoot()+'/'+o.entidad+'/'+o.payload.id, fields:fsFields(datos)}};
    });
    for(let i=0;i<writes.length;i+=400){
      await fbJson(fbUrl(':commit'),{method:'POST',headers:hdr,
        body:JSON.stringify({writes:writes.slice(i,i+400)})});
    }
    const ids=new Set(lote.map(b=>b.id));
    S.outbox=S.outbox.filter(o=>!ids.has(o.id));
    lote.forEach(b=>idbDel('outbox',b.id));
    syncErr=0; lastSync=now();
    syncing=false; paintSync();
    if(manual) toast('Enviado a Firebase ('+writes.length+' documentos)','ok');
    if(S.outbox.length) scheduleSync(400);
  }catch(e){
    syncErr++; lote.forEach(b=>{b.intentos++;b.error=fbErr(e);idbPut('outbox',b);});
    syncing=false; paintSync();
    if(/PERMISSION|permission/i.test(String(e.message||e)))
      toast('El servidor rechazó los cambios: la suscripción de este restaurante venció o fue suspendida.','bad',7000);
    else if(manual) toast(fbErr(e),'bad',4200);
    scheduleSync(Math.min(60000, 4000*Math.pow(2,Math.min(syncErr,4))));
  }
}

/* --------- traer cambios hechos en otras terminales (pull) ---------- */
function aplicarRemoto(coll,o){
  if(!o || !o.id) return false;
  if(coll==='config'){
    if(String(S.cfg.upd||'')>=String(o.upd||'')) return false;
    const local={}; CFG_LOCAL.forEach(k=> local[k]=S.cfg[k]);
    S.cfg=Object.assign({},S.cfg,o,local); S.cfg.id='cfg';
    idbPut('config',S.cfg); applyCfg(); return true;
  }
  if(!S[coll]) return false;
  const i=S[coll].findIndex(x=>x.id===o.id);
  if(o._del){ if(i>=0){ S[coll].splice(i,1); idbDel(coll,o.id); return true; } return false; }
  if(i>=0 && String(S[coll][i].upd||'')>=String(o.upd||'')) return false;
  if(i>=0) S[coll][i]=o; else S[coll].push(o);
  idbPut(coll,o); return true;
}
async function pullCloud(manual){
  if(pulling) return 0;
  if(!S.cfg.fbOn){ if(manual) toast('Activa la nube en Ajustes','warn'); return 0; }
  if(!FB.listo() && !(await fbRestaurarSesion())){ if(manual) toast('Inicia sesión en la nube','warn'); return 0; }
  if(!navigator.onLine){ if(manual) toast('Sin conexión','warn'); return 0; }
  pulling=true; paintSync();
  let cambios=0;
  try{
    const hdr=await fbAuthHdr();
    S.meta.pull=S.meta.pull||{};
    for(const coll of COLL.concat(['config'])){
      let cursor=S.meta.pull[coll]||'';
      for(let pag=0; pag<25; pag++){
        const q={structuredQuery:{ from:[{collectionId:coll}],
          where:{fieldFilter:{field:{fieldPath:'upd'},op:'GREATER_THAN',value:{stringValue:cursor}}},
          orderBy:[{field:{fieldPath:'upd'},direction:'ASCENDING'}], limit:300 }};
        const res=await fbJson(fbUrl('/negocios/'+(S.cfg.fbNegocio||'principal')+':runQuery'),
          {method:'POST',headers:hdr,body:JSON.stringify(q)});
        const docs=(res||[]).filter(r=>r&&r.document);
        docs.forEach(r=>{ const o=fsDoc(r.document.fields);
          if(aplicarRemoto(coll,o)) cambios++;
          if(String(o.upd||'')>cursor) cursor=o.upd; });
        if(docs.length<300) break;
      }
      S.meta.pull[coll]=cursor;
    }
    saveMeta(); lastPull=now(); syncErr=0;
    S.turno=turnoAbierto();
    pulling=false; paintSync();
    if(cambios){ toast(cambios+' cambio(s) recibidos de otra terminal','ok'); if(S.user) render(); }
    else if(manual) toast('Todo al día','ok');
  }catch(e){
    pulling=false; syncErr++; paintSync();
    if(manual) toast(fbErr(e),'bad',4200);
  }
  return cambios;
}

/* ===================== IMÁGENES EN BASE64 (sin Storage) ===============
   Se redimensionan y comprimen en el navegador antes de guardarse, para
   que cada una quepa de sobra en un documento de Firestore (límite 1 MB)
   y el menú siga cargando rápido. Viajan como texto igual que todo lo demás.
   ==================================================================== */
const IMG_PRESET={
  logo:   {max:240, calidad:0.9,  maxBytes:150000, transparente:true},
  plato:  {max:320, calidad:0.78, maxBytes:95000,  transparente:false}
};
function comprimirImagen(file,pre){
  const o=Object.assign({max:320,calidad:0.8,maxBytes:95000,transparente:false},pre||{});
  return new Promise((res,rej)=>{
    if(!file) return rej(new Error('No elegiste ningún archivo'));
    if(!/^image\//.test(file.type||'')) return rej(new Error('Ese archivo no es una imagen'));
    if(file.size>12*1024*1024) return rej(new Error('La imagen pesa más de 12 MB'));
    const fr=new FileReader();
    fr.onerror=()=>rej(new Error('No se pudo leer el archivo'));
    fr.onload=()=>{
      const im=new Image();
      im.onerror=()=>rej(new Error('No se pudo abrir la imagen (¿formato raro?)'));
      im.onload=()=>{
        try{
          let w=im.naturalWidth||im.width, h=im.naturalHeight||im.height;
          if(!w||!h) return rej(new Error('Imagen vacía'));
          const f=Math.min(1,o.max/Math.max(w,h));
          w=Math.max(1,Math.round(w*f)); h=Math.max(1,Math.round(h*f));
          const cv=document.createElement('canvas'); cv.width=w; cv.height=h;
          const cx=cv.getContext('2d');
          cx.imageSmoothingQuality='high';
          if(!o.transparente){ cx.fillStyle='#ffffff'; cx.fillRect(0,0,w,h); }
          cx.drawImage(im,0,0,w,h);
          let q=o.calidad;
          let out=cv.toDataURL('image/webp',q);
          if(out.indexOf('data:image/webp')!==0)                 // navegador sin webp
            out=cv.toDataURL(o.transparente?'image/png':'image/jpeg',q);
          let guardia=0;
          while(out.length>o.maxBytes && q>0.35 && guardia++<8){
            q=round(q-0.1,2);
            out=cv.toDataURL(out.indexOf('data:image/png')===0?'image/png':
                             (out.indexOf('data:image/webp')===0?'image/webp':'image/jpeg'), q);
            if(out.indexOf('data:image/png')===0) break;          // png no obedece la calidad
          }
          if(out.length>o.maxBytes*2.2) return rej(new Error('La imagen quedó muy pesada, prueba con otra'));
          res({datos:out, ancho:w, alto:h, bytes:out.length});
        }catch(e){ rej(new Error('No se pudo procesar la imagen')); }
      };
      im.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function imgDe(id){ return S.imagenes.find(x=>x.id===id)||null; }
function guardarImagen(id,datos,tipo,ref){
  put('imagenes',{id:id,datos:datos,tipo:tipo||'',ref:ref||'',bytes:(datos||'').length});
  _imgUrl.forEach((u,k)=>{ if(k.indexOf(id+'|')===0){ try{URL.revokeObjectURL(u);}catch(e){} _imgUrl.delete(k); } });
}
function borrarImagen(id){
  remove('imagenes',id);
  _imgUrl.forEach((u,k)=>{ if(k.indexOf(id+'|')===0){ try{URL.revokeObjectURL(u);}catch(e){} _imgUrl.delete(k); } });
}
/* el DOM recibe una URL corta en vez de repetir el base64 en cada repintado */
const _imgUrl=new Map();
function urlImg(id){
  const im=imgDe(id); if(!im||!im.datos) return '';
  const k=id+'|'+(im.upd||im.bytes||'');
  if(_imgUrl.has(k)) return _imgUrl.get(k);
  let u=im.datos;
  try{
    const coma=im.datos.indexOf(','), meta=im.datos.slice(0,coma), b64=im.datos.slice(coma+1);
    const mime=(meta.match(/data:([^;]+)/)||[])[1]||'image/jpeg';
    const bin=atob(b64), arr=new Uint8Array(bin.length);
    for(let i=0;i<bin.length;i++) arr[i]=bin.charCodeAt(i);
    u=URL.createObjectURL(new Blob([arr],{type:mime}));
  }catch(e){}
  _imgUrl.set(k,u); return u;
}
/* selector reutilizable: botón + vista previa + quitar */
function cajaImagen(cont,id,pre,onCambio){
  const pintar=()=>{
    const u=urlImg(id), im=imgDe(id);
    cont.innerHTML=
      '<div class="row" style="gap:12px;align-items:flex-start">'+
        '<div class="imgprev'+(u?'':' vacia')+'">'+(u?'<img src="'+u+'">':'<span>sin imagen</span>')+'</div>'+
        '<div style="flex:1;min-width:0">'+
          '<div class="row wrap"><button class="btn sm" data-up>'+(u?'Cambiar':'Subir imagen')+'</button>'+
          (u?'<button class="btn sm danger" data-del>Quitar</button>':'')+'</div>'+
          '<div class="hintx" style="margin-top:7px">'+
            (im? 'Guardada como texto · '+Math.round((im.bytes||0)/1024)+' KB'
               : 'JPG o PNG. Se reduce sola antes de guardarse.')+'</div>'+
          '<input type="file" accept="image/*" hidden data-file>'+
        '</div></div>';
    const f=$('[data-file]',cont);
    $('[data-up]',cont).onclick=()=>f.click();
    if($('[data-del]',cont)) $('[data-del]',cont).onclick=()=>{ borrarImagen(id); pintar(); onCambio&&onCambio(null); };
    f.onchange=async e=>{
      const file=e.target.files[0]; if(!file) return;
      try{
        toast('Procesando imagen…');
        const r=await comprimirImagen(file,pre);
        guardarImagen(id,r.datos,pre===IMG_PRESET.logo?'logo':'producto',id);
        pintar(); onCambio&&onCambio(r);
        toast('Imagen lista · '+Math.round(r.bytes/1024)+' KB','ok');
      }catch(err){ toast(String(err.message||err),'bad',4500); }
      f.value='';
    };
  };
  pintar(); return pintar;
}

/* ---- impuestos ---- */
function desglose(base){                     // base = suma de precios de venta
  const t=Number(S.cfg.impuesto)||0;
  if(!t) return {neto:base, imp:0};
  if(S.cfg.impIncluido){ const neto=base/(1+t/100); return {neto:round(neto,2), imp:round(base-neto,2)}; }
  return {neto:base, imp:round(base*t/100,2)};
}

/* ---- costos ---- */
function costoProducto(p){
  if(!p) return 0;
  if(p.receta && p.receta.length)
    return round(sum(p.receta,r=>{ const g=byId('ingredientes',r.ingredienteId); return g? (Number(g.costo)||0)*(Number(r.cantidad)||0) : 0; }),2);
  return Number(p.costoManual)||0;
}
function margen(p){ const c=costoProducto(p), pr=Number(p.precio)||0; return pr? round((pr-c)/pr*100,1):0; }

/* ---- disponibilidad por receta ---- */
function maxPorReceta(p){
  if(!p.receta || !p.receta.length) return Infinity;
  let m=Infinity;
  p.receta.forEach(r=>{ const g=byId('ingredientes',r.ingredienteId);
    if(!g||!r.cantidad) return; m=Math.min(m, Math.floor((Number(g.stock)||0)/Number(r.cantidad))); });
  return m===Infinity?Infinity:Math.max(0,m);
}

/* ------------- inventario valuado por PEPS (FIFO) -------------------
   Cada compra crea una "capa" con su propio costo. Cada venta consume
   las capas más antiguas primero, y el costo real de esas capas es el
   que queda grabado en la venta.
   ------------------------------------------------------------------ */
function capasDe(gid){
  return S.capas.filter(c=>c.ingredienteId===gid && (Number(c.restante)||0)>0.000001)
    .sort((a,b)=> String(a.fecha).localeCompare(String(b.fecha)) || String(a.id).localeCompare(String(b.id)));
}
function costoPeps(gid){ const c=capasDe(gid)[0]; return c? (Number(c.costoUnit)||0) : 0; }
function ultimoCosto(gid){
  const act=capasDe(gid)[0]; if(act) return Number(act.costoUnit)||0;
  const todas=S.capas.filter(c=>c.ingredienteId===gid);
  if(todas.length){ todas.sort((a,b)=>String(b.fecha).localeCompare(String(a.fecha)));
    return Number(todas[0].costoUnit)||0; }
  const g=byId('ingredientes',gid); return g? (Number(g.costo)||0) : 0;
}
function valorInv(gid){ return round(sum(capasDe(gid),c=>c.restante*c.costoUnit),2); }
function valorInvTotal(){ return round(sum(S.ingredientes,g=>valorInv(g.id)),2); }

function nuevaCapa(gid,cantidad,costoUnit,refTipo,refId,fecha){
  const c={id:uid('cp'),ingredienteId:gid,fecha:fecha||now(),
    cantidad:round(cantidad,4), restante:round(cantidad,4),
    costoUnit:round(Number(costoUnit)||0,4), refTipo:refTipo||'', refId:refId||''};
  put('capas',c); return c;
}
function consumirPeps(gid,cantidad,refTipo,refId){
  let falta=round(Number(cantidad)||0,4), costo=0;
  const capas=capasDe(gid);
  for(let i=0;i<capas.length && falta>0.000001;i++){
    const c=capas[i];
    const toma=Math.min(Number(c.restante)||0, falta);
    c.restante=round(c.restante-toma,4); put('capas',c);
    costo+=toma*(Number(c.costoUnit)||0);
    falta=round(falta-toma,4);
  }
  if(falta>0.000001) costo+=falta*ultimoCosto(gid);   // se vendió más de lo que había
  return round(costo,2);
}

function movInv(ingredienteId,tipo,cantidad,costoUnit,refTipo,refId,nota){
  const g=byId('ingredientes',ingredienteId); if(!g) return null;
  const c=round(Number(cantidad)||0,4);
  const antes=round(Number(g.stock)||0,4);
  let delta=0, costoMov=0;
  if(tipo==='entrada'){
    const cu=(costoUnit===null||costoUnit===undefined||costoUnit==='')? ultimoCosto(ingredienteId) : Number(costoUnit)||0;
    nuevaCapa(ingredienteId,c,cu,refTipo,refId,nota==='Reversión por anulación'?null:null);
    delta=c; costoMov=round(c*cu,2);
  } else if(tipo==='salida'){
    costoMov=consumirPeps(ingredienteId,c,refTipo,refId); delta=-c;
  } else {                                   // ajuste: c es el conteo real
    delta=round(c-antes,4);
    if(delta>0){ const cu=ultimoCosto(ingredienteId); nuevaCapa(ingredienteId,delta,cu,refTipo,refId);
      costoMov=round(delta*cu,2); }
    else if(delta<0){ costoMov=consumirPeps(ingredienteId,-delta,refTipo,refId); }
  }
  g.stock=round(antes+delta,4);
  g.costo=costoPeps(ingredienteId)||ultimoCosto(ingredienteId);
  put('ingredientes',g);
  const m={id:uid('mi'),fecha:now(),ingredienteId:ingredienteId,tipo:tipo,
    cantidad:round(delta,4), costoTotal:round(costoMov,2),
    costoUnit: Math.abs(delta)>0.000001? round(costoMov/Math.abs(delta),4):0,
    saldo:g.stock, refTipo:refTipo||'', refId:refId||'', nota:nota||'',
    usuarioId:S.user?S.user.id:''};
  put('movinv',m);
  m.costoMov=round(costoMov,2);
  return m;
}

/* consume la receta de cada línea y devuelve el costo REAL de esa venta */
function consumirItems(items,refTipo,refId){
  const consumo=[]; let total=0;
  items.forEach(it=>{
    const p=byId('productos',it.productoId);
    let costoIt=0;
    if(p && p.receta && p.receta.length){
      p.receta.forEach(r=>{
        const q=round((Number(r.cantidad)||0)*it.cant,4); if(!q) return;
        const m=movInv(r.ingredienteId,'salida',q,null,refTypeSafe(refTipo),refId,'Consumo por venta');
        const cm=m? (m.costoMov||0):0;
        costoIt+=cm;
        consumo.push({ingredienteId:r.ingredienteId,cantidad:q,costo:round(cm,2)});
      });
    } else { costoIt=(Number(p&&p.costoManual)||0)*it.cant; }
    it.costoTotal=round(costoIt,2);
    it.costo=round(costoIt/(it.cant||1),4);
    total+=costoIt;
  });
  return {total:round(total,2), consumo:consumo};
}
function refTypeSafe(t){ return t||'venta'; }

/* devuelve al inventario lo consumido por una venta anulada, a su mismo costo */
function reponerVenta(v){
  (v.consumo||[]).forEach(x=>{
    const cu = x.cantidad? round(x.costo/x.cantidad,4) : ultimoCosto(x.ingredienteId);
    const g=byId('ingredientes',x.ingredienteId); if(!g) return;
    /* lo devuelto vuelve al frente de la fila: es lo primero que saldrá */
    const prim=capasDe(x.ingredienteId)[0];
    const fecha=new Date((prim? new Date(prim.fecha).getTime() : Date.now())-1000).toISOString();
    nuevaCapa(x.ingredienteId,x.cantidad,cu,'venta-anulada',v.id,fecha);
    g.stock=round((Number(g.stock)||0)+x.cantidad,4);
    g.costo=costoPeps(x.ingredienteId)||ultimoCosto(x.ingredienteId);
    put('ingredientes',g);
    put('movinv',{id:uid('mi'),fecha:now(),ingredienteId:x.ingredienteId,tipo:'entrada',
      cantidad:round(x.cantidad,4),costoTotal:round(x.costo,2),costoUnit:cu,saldo:g.stock,
      refTipo:'venta-anulada',refId:v.id,nota:'Reversión por anulación',usuarioId:S.user?S.user.id:''});
  });
}

/* crea la capa inicial de ingredientes que vienen de antes del PEPS */
function migrarAPeps(){
  S.ingredientes.forEach(g=>{
    const st=Number(g.stock)||0;
    if(st>0.000001 && !S.capas.some(c=>c.ingredienteId===g.id))
      nuevaCapa(g.id,st,Number(g.costo)||0,'inicial','','');
  });
}

function newCart(o){ return Object.assign({comandaId:null,mesaId:null,tipo:'mostrador',items:[],
  clienteId:'',descuento:0,propinaPct:S.cfg.propinaAuto?(Number(S.cfg.propina)||0):0,nota:''},o||{}); }
function cartTot(c){
  c=c||S.cart; if(!c) return {sub:0,desc:0,base:0,neto:0,imp:0,prop:0,total:0,uds:0,costo:0};
  const sub=round(sum(c.items,i=>i.precio*i.cant),2);
  const desc=round(Number(c.descuento)||0,2);
  const base=Math.max(0,round(sub-desc,2));
  const d=desglose(base);
  const prop=round(base*(Number(c.propinaPct)||0)/100,2);
  const costo=round(sum(c.items,i=>costoProducto(byId('productos',i.productoId))*i.cant),2);
  return {sub:sub,desc:desc,base:base,neto:d.neto,imp:d.imp,prop:prop,total:round(base+prop,2),
          uds:sum(c.items,i=>i.cant),costo:costo};
}
function cartAdd(pid){
  if(!S.cart) S.cart=newCart();
  const p=byId('productos',pid); if(!p) return;
  const disp=maxPorReceta(p);
  const enCarro=sum(S.cart.items.filter(i=>i.productoId===pid),i=>i.cant);
  if(disp!==Infinity && enCarro+1>disp){ toast('Sin ingredientes suficientes para "'+p.nombre+'"','warn'); return; }
  const ex=S.cart.items.find(i=>i.productoId===pid && !i.nota);
  if(ex) ex.cant++; else S.cart.items.push({id:uid('it'),productoId:pid,nombre:p.nombre,precio:Number(p.precio)||0,cant:1,nota:''});
  paintCart(); persistComanda();
}
function cartQty(itId,d){
  const it=S.cart.items.find(i=>i.id===itId); if(!it) return;
  it.cant+=d;
  if(it.cant<=0) S.cart.items=S.cart.items.filter(i=>i.id!==itId);
  paintCart(); persistComanda();
}
function cartDel(itId){ S.cart.items=S.cart.items.filter(i=>i.id!==itId); paintCart(); persistComanda(); }

function paintGrid(){
  const el=$('#posgrid'); if(!el) return;
  const q=(S.posQ||'').toLowerCase().trim();
  let ps=S.productos.filter(p=>p.activo);
  if(S.posCat!=='all') ps=ps.filter(p=>p.categoriaId===S.posCat);
  if(q) ps=ps.filter(p=>p.nombre.toLowerCase().indexOf(q)>=0);
  const ord=c=>{const x=byId('categorias',c);return x?(x.orden||0):99;};
  ps.sort((a,b)=> ord(a.categoriaId)-ord(b.categoriaId) || (a.orden||0)-(b.orden||0) || a.nombre.localeCompare(b.nombre));
  if(!ps.length){ el.innerHTML='<div class="empty" style="grid-column:1/-1"><span class="ico">🔎</span>Sin productos</div>'; return; }
  el.innerHTML=ps.map(p=>{
    const d=maxPorReceta(p);
    const st = d===0? '<span class="st no">Agotado</span>' : (d!==Infinity && d<=5? '<span class="st low">'+d+'</span>':'');
    const u=urlImg(p.id);
    return '<button class="pcard '+(d===0?'out':'')+'" data-p="'+p.id+'">'+st+
      (u? '<img class="foto" src="'+u+'" alt="" loading="lazy">'
        : '<div class="em">'+(p.emoji||'🍽️')+'</div>')+
      '<div class="nm">'+esc(p.nombre)+'</div>'+
      '<div class="pr">'+money(p.precio)+'</div></button>';
  }).join('');
  $$('.pcard',el).forEach(b=> b.onclick=()=>cartAdd(b.dataset.p));
}

function persistComanda(force){
  const c=S.cart; if(!c || !c.mesaId) return;
  if(!c.items.length && c.comandaId){ remove('comandas',c.comandaId); c.comandaId=null; return; }
  if(!c.items.length) return;
  const cm={ id:c.comandaId||uid('cm'), mesaId:c.mesaId, items:c.items, clienteId:c.clienteId,
    descuento:c.descuento, propinaPct:c.propinaPct, nota:c.nota, estado:'abierta',
    meseroId:S.user?S.user.id:'', apertura:(c.comandaId&&byId('comandas',c.comandaId)||{}).apertura||now() };
  c.comandaId=cm.id; put('comandas',cm);
}

/* ------------------------------- cobro -------------------------------- */
function mCobrar(){
  const c=S.cart, t=cartTot(c);
  if(!t.total) return;
  if(!S.turno){ toast('Abre la caja antes de cobrar','warn'); go('turnos'); return; }
  let pagos=[], medio='efectivo', plazo=30;
  const qa=[1000,2000,5000,10000,20000,50000,100000];

  function pagado(){ return round(sum(pagos,p=>p.monto),2); }
  function falta(){ return round(Math.max(0,t.total-pagado()),2); }
  function cambio(){ return round(Math.max(0,pagado()-t.total),2); }

  const m=modal({title:'Cobrar '+money(t.total), size:'wide', focus:false,
    body:'<div class="grid" style="grid-template-columns:1fr 300px;align-items:start">'+
      '<div>'+
        '<div class="grid" style="grid-template-columns:repeat(4,1fr);margin-bottom:14px">'+
          MEDIOS.map(x=>'<button class="paybtn'+(x.k==='efectivo'?' on':'')+'" data-me="'+x.k+'">'+
            '<span class="e">'+x.e+'</span>'+esc(x.n)+'</button>').join('')+'</div>'+
        '<div id="credbox" class="hide" style="margin-bottom:12px">'+
          '<div class="grid" style="grid-template-columns:1fr 130px">'+
            '<div class="f"><label>Cliente</label><select id="cl">'+
              selOpts(S.clientes.filter(x=>x.activo),c.clienteId||'')+'</select></div>'+
            '<div class="f"><label>Plazo (días)</label><input id="plz" type="number" value="30" min="0"></div>'+
          '</div><div class="hintx" id="clinfo" style="margin-top:6px"></div></div>'+
        '<div class="f" style="margin-bottom:10px"><label>Monto recibido</label>'+
          '<input id="mto" type="number" step="any" style="font-size:22px;font-weight:700;padding:12px" value="'+t.total+'"></div>'+
        '<div class="quickamt" id="qa">'+qa.map(v=>'<button data-q="'+v+'">'+money(v)+'</button>').join('')+
          '<button data-q="exacto">Falta</button></div>'+
        '<button class="btn ok blk" id="addp" style="margin-top:12px">+ Agregar pago</button>'+
        '<div id="plist" style="margin-top:12px"></div>'+
      '</div>'+
      '<div class="card"><div class="bd">'+
        '<div class="tline"><span>Subtotal</span><span class="v">'+money(t.sub)+'</span></div>'+
        (t.desc?'<div class="tline"><span>Descuento</span><span class="v">−'+money(t.desc)+'</span></div>':'')+
        (Number(S.cfg.impuesto)?'<div class="tline"><span>IVA</span><span class="v">'+money(t.imp)+'</span></div>':'')+
        (t.prop?'<div class="tline"><span>Propina</span><span class="v">'+money(t.prop)+'</span></div>':'')+
        '<div class="tline big"><span>Total</span><span class="v">'+money(t.total)+'</span></div>'+
        '<hr style="border:0;border-top:1px dashed var(--line);margin:12px 0">'+
        '<div class="tline"><span>Pagado</span><span class="v" id="spag">'+money(0)+'</span></div>'+
        '<div class="tline" style="color:var(--bad)"><span>Falta</span><span class="v" id="sfal">'+money(t.total)+'</span></div>'+
        '<div class="tline" style="color:var(--ok);font-size:17px;font-weight:700"><span>Cambio</span><span class="v" id="scam">'+money(0)+'</span></div>'+
        '<label class="row tiny" style="margin-top:14px;gap:7px"><input type="checkbox" id="pt" checked> Imprimir ticket</label>'+
      '</div></div></div>',
    footer:'<button class="btn" data-x>Cancelar</button><button class="btn pri lg" id="ok">Confirmar venta</button>'});

  function refresh(){
    $('#spag',m).textContent=money(pagado());
    $('#sfal',m).textContent=money(falta());
    $('#scam',m).textContent=money(cambio());
    $('#plist',m).innerHTML = pagos.length? pagos.map((p,i)=>{
      const md=MEDIOS.find(x=>x.k===p.medio)||{};
      return '<div class="row" style="padding:7px 10px;border:1px solid var(--line);border-radius:9px;margin-bottom:6px">'+
        '<span>'+(md.e||'')+' '+esc(md.n||p.medio)+'</span><span class="spacer"></span>'+
        '<b class="mono">'+money(p.monto)+'</b><button class="btn ghost sm" data-r="'+i+'">✕</button></div>';
    }).join(''):'';
    $$('[data-r]',m).forEach(b=> b.onclick=()=>{ pagos.splice(+b.dataset.r,1); refresh(); });
    $('#mto',m).value = falta()||'';
  }
  function setMedio(k){
    medio=k;
    $$('[data-me]',m).forEach(b=> b.classList.toggle('on',b.dataset.me===k));
    $('#credbox',m).classList.toggle('hide',k!=='credito');
    $('#qa',m).classList.toggle('hide',k!=='efectivo');
    if(k==='credito'){ const cl=byId('clientes',$('#cl',m).value);
      $('#clinfo',m).innerHTML = cl? 'Saldo actual: <b>'+money(saldoCliente(cl.id))+'</b> · Cupo: '+money(cl.limite||0):''; }
    refresh();
  }
  $$('[data-me]',m).forEach(b=> b.onclick=()=>setMedio(b.dataset.me));
  $$('[data-q]',m).forEach(b=> b.onclick=()=>{
    const v=b.dataset.q; const inp=$('#mto',m);
    inp.value = v==='exacto'? falta() : round(toN(inp.value)+Number(v),2);
  });
  $('#cl',m).onchange=()=>setMedio('credito');
  $('#addp',m).onclick=()=>{
    const v=toN($('#mto',m).value); if(v<=0) return toast('Monto inválido','warn');
    if(medio==='credito') return toast('El crédito no requiere pago; confirma la venta','warn');
    pagos.push({medio:medio,monto:v}); refresh();
  };
  function autoPago(){                       // si no agregó el pago, tomar el monto escrito
    if(medio==='credito') return;
    const v=toN($('#mto',m).value);
    if(falta()>0.5 && v>0){ pagos.push({medio:medio,monto:v}); refresh(); }
  }
  $('#mto',m).onkeydown=e=>{ if(e.key==='Enter'){ e.preventDefault(); $('#addp',m).click(); } };
  $('#ok',m).onclick=()=>{
    autoPago();
    const esCredito = medio==='credito' && falta()>0.5;
    let clienteId=c.clienteId||'';
    if(esCredito){
      clienteId=$('#cl',m).value;
      if(!clienteId) return toast('Selecciona el cliente para la venta a crédito','warn');
      plazo=Math.max(0,toN($('#plz',m).value));
    } else if(falta()>0.5) return toast('Falta '+money(falta()),'warn');
    const imprimir=$('#pt',m).checked;
    closeModal();
    registrarVenta({pagos:pagos,credito:esCredito,clienteId:clienteId,plazo:plazo,imprimir:imprimir});
  };
  setMedio('efectivo');
}

function registrarVenta(o){
  const c=S.cart, t=cartTot(c);
  const vid=uid('v');
  /* el costo sale del consumo real de capas PEPS, no de un promedio */
  const items=c.items.map(i=>({productoId:i.productoId,nombre:i.nombre,precio:i.precio,
    cant:i.cant,nota:i.nota,costo:0,costoTotal:0}));
  const cons=consumirItems(items,'venta',vid);
  const v={ id:vid, no:nextNo('venta','V-'), fecha:now(),
    tipo:c.tipo, mesaId:c.mesaId||'', clienteId:o.clienteId||c.clienteId||'',
    items:items, consumo:cons.consumo,
    subtotal:t.sub, descuento:t.desc, neto:t.neto, impuesto:t.imp, propina:t.prop, total:t.total,
    costo:cons.total, utilidad:round(t.base-cons.total,2),
    pagos:o.pagos||[], credito:!!o.credito, vence:o.credito? dateAdd(todayISO(),o.plazo||30):'',
    estado:o.credito?'pendiente':'pagada', turnoId:S.turno?S.turno.id:'', usuarioId:S.user?S.user.id:'',
    nota:c.nota||'' };
  put('ventas',v);
  (v.pagos||[]).forEach(p=> movTes(cuentaDeMedio(p.medio),'ingreso',p.monto,'Venta '+v.no,'venta','venta',v.id));
  if(c.comandaId){ const cm=byId('comandas',c.comandaId); if(cm){ cm.estado='cerrada'; cm.ventaId=v.id; put('comandas',cm); } }
  S.cart=newCart();
  toast('Venta '+v.no+' registrada · '+money(v.total),'ok');
  if(o.imprimir) imprimirTicket(v);
  if(S.view==='pos'){ paintCart(); paintGrid(); buildNav(); } else render();
}

function anularVenta(v){
  confirmar('¿Anular la venta '+v.no+'? Se devolverán los ingredientes al inventario.',()=>{
    v.estado='anulada'; put('ventas',v);
    reponerVenta(v);
    (v.pagos||[]).forEach(p=> movTes(cuentaDeMedio(p.medio),'egreso',p.monto,'Anulación venta '+v.no,'anulacion','venta',v.id));
    toast('Venta anulada','ok'); render();
  },true);
}

   'table{width:100%;border-collapse:collapse}td{padding:1px 0;vertical-align:top}'+
   'td:first-child{width:22px}td:last-child{width:66px}'+
   '.l{display:flex;justify-content:space-between}'+
   '.tot{font-size:14px;font-weight:bold}'+
   '.logo{display:block;margin:0 auto 4px;max-width:44mm;max-height:20mm}'+
   '</style></head><body>'+
   (imgDe('logo')? '<img class="logo" src="'+imgDe('logo').datos+'">' : '')+
   '<h1>'+esc(c.nombre)+'</h1>'+
   '<div class="c">'+(c.nit?'NIT '+esc(c.nit)+'<br>':'')+(c.direccion?esc(c.direccion)+'<br>':'')+(c.telefono?'Tel. '+esc(c.telefono):'')+'</div><hr>'+
   '<div class="l"><span>'+esc(v.no)+'</span><span>'+fdate(v.fecha,true)+'</span></div>'+
   '<div class="l"><span>'+(mesa?'Mesa '+esc(mesa.nombre):v.tipo==='domicilio'?'Domicilio':'Mostrador')+'</span>'+
     '<span>'+esc(nameOf('usuarios',v.usuarioId))+'</span></div>'+
   (cli?'<div>Cliente: '+esc(cli.nombre)+'</div>':'')+'<hr>'+
   '<table>'+rows+'</table><hr>'+
   '<div class="l"><span>Subtotal</span><span>'+money(v.subtotal)+'</span></div>'+
   (v.descuento?'<div class="l"><span>Descuento</span><span>-'+money(v.descuento)+'</span></div>':'')+
   (v.impuesto?'<div class="l"><span>IVA '+c.impuesto+'%</span><span>'+money(v.impuesto)+'</span></div>':'')+
   (v.propina?'<div class="l"><span>Propina</span><span>'+money(v.propina)+'</span></div>':'')+
   '<div class="l tot"><span>TOTAL</span><span>'+money(v.total)+'</span></div><hr>'+
   pagos+ (v.credito?'<div class="l b"><span>CREDITO</span><span>vence '+esc(v.vence)+'</span></div>':'')+
   '<hr><div class="c">'+esc(c.ticketPie||'')+'</div>'+
   '<div class="c" style="font-size:9px;margin-top:4px">Software POS local</div>'+
   '</body></html>';
}
function imprimirTicket(v){
  const f=$('#tikframe');
  f.srcdoc=ticketHTML(v);
  f.onload=()=>{ try{ f.contentWindow.focus(); f.contentWindow.print(); }catch(e){ toast('No se pudo imprimir','bad'); } };
}
function verTicket(v){
  modal({title:'Ticket '+v.no,size:'slim',
    body:'<div style="background:#fff;color:#000;padding:10px;border-radius:8px;max-height:60vh;overflow:auto">'+
      '<iframe style="width:100%;height:56vh;border:0;background:#fff" srcdoc="'+esc(ticketHTML(v))+'"></iframe></div>',
    footer:'<button class="btn" data-x>Cerrar</button><button class="btn pri" id="pr">🖨️ Imprimir</button>',
    onOpen:m=>{ $('#pr',m).onclick=()=>imprimirTicket(v); }});
}

/* =============================== MESAS ================================ */
function viewMesas(vw){
  const abiertas=S.comandas.filter(c=>c.estado==='abierta');
  sub(abiertas.length+' cuenta(s) abierta(s)');
  topact('<button class="btn sm" id="nm">+ Mesa</button>');
  const zonas={};
  S.mesas.filter(m=>m.activo).forEach(m=>{ (zonas[m.zona||'General']=zonas[m.zona||'General']||[]).push(m); });
  let h='';
  Object.keys(zonas).forEach(z=>{
    h+='<div class="card" style="margin-bottom:14px"><div class="hd"><h3>'+esc(z)+'</h3>'+
       '<span class="pill">'+zonas[z].length+' mesas</span></div><div class="bd"><div class="mesas">';
    zonas[z].forEach(m=>{
      const cm=abiertas.find(c=>c.mesaId===m.id);
      const tot=cm? round(sum(cm.items,i=>i.precio*i.cant)-(cm.descuento||0),2):0;
      h+='<button class="mesa '+(cm?'ocupada':'libre')+'" data-m="'+m.id+'">'+
         '<div class="n">'+esc(m.nombre)+'</div>'+
         '<div class="z">'+(cm? (cm.items.length+' items · '+agoMin(cm.apertura)+' min') : m.capacidad+' puestos')+'</div>'+
         '<div class="t">'+(cm? money(tot):'Libre')+'</div></button>';
    });
    h+='</div></div></div>';
  });
  vw.innerHTML=h||'<div class="empty"><span class="ico">🍽️</span>Sin mesas configuradas</div>';
  $$('.mesa',vw).forEach(b=> b.onclick=()=>abrirMesa(b.dataset.m));
  $('#nm').onclick=()=>edMesa(null);
}
function abrirMesa(mesaId){
  const cm=S.comandas.find(c=>c.estado==='abierta'&&c.mesaId===mesaId);
  S.cart=newCart({mesaId:mesaId,tipo:'mesa'});
  if(cm){ S.cart.comandaId=cm.id; S.cart.items=cm.items; S.cart.clienteId=cm.clienteId||'';
    S.cart.descuento=cm.descuento||0; S.cart.propinaPct=cm.propinaPct||0; }
  go('pos');
}
function edMesa(m){
  const ed=m||{id:uid('m'),nombre:'',zona:'Salón',capacidad:4,activo:true};
  modal({title:m?'Editar mesa':'Nueva mesa',size:'slim',
    body:'<div class="f" style="margin-bottom:10px"><label>Nombre</label><input id="n" value="'+esc(ed.nombre)+'"></div>'+
      '<div class="grid" style="grid-template-columns:1fr 90px">'+
      '<div class="f"><label>Zona</label><input id="z" value="'+esc(ed.zona)+'"></div>'+
      '<div class="f"><label>Puestos</label><input id="c" type="number" value="'+ed.capacidad+'"></div></div>',
    footer:(m?'<button class="btn danger" id="del">Eliminar</button>':'')+
      '<div class="spacer"></div><button class="btn" data-x>Cancelar</button><button class="btn pri" id="ok">Guardar</button>',
    onOpen:mo=>{
      $('#ok',mo).onclick=()=>{ ed.nombre=$('#n',mo).value.trim()||'Mesa'; ed.zona=$('#z',mo).value.trim()||'General';
        ed.capacidad=toN($('#c',mo).value)||4; put('mesas',ed); closeModal(); render(); toast('Mesa guardada','ok'); };
      if($('#del',mo)) $('#del',mo).onclick=()=>{ closeModal(); confirmar('¿Eliminar mesa?',()=>{remove('mesas',ed.id);render();},true); };
    }});
}

/* =============================== VENTAS =============================== */
function viewVentas(vw){
  let f={desde:todayISO(),hasta:todayISO(),q:'',estado:''};
  vw.innerHTML='<div id="vfil"></div><div id="vbody"></div>';
  function paint(){
    let vs=S.ventas.filter(v=> dISO(v.fecha)>=f.desde && dISO(v.fecha)<=f.hasta);
    if(f.estado) vs=vs.filter(v=>v.estado===f.estado);
    if(f.q){ const q=f.q.toLowerCase();
      vs=vs.filter(v=> v.no.toLowerCase().indexOf(q)>=0 || nameOf('clientes',v.clienteId).toLowerCase().indexOf(q)>=0); }
    vs.sort((a,b)=> b.fecha.localeCompare(a.fecha));
    const ok=vs.filter(v=>v.estado!=='anulada');
    const tot=sum(ok,v=>v.total), cst=sum(ok,v=>v.costo||0);
    $('#vbody').innerHTML=
      '<div class="kpis" style="margin-bottom:14px">'+
        kpi('Ventas',money(tot),ok.length+' facturas','brand')+
        kpi('Costo',money(cst),'','')+
        kpi('Utilidad bruta',money(tot-cst),tot?round((tot-cst)/tot*100,1)+'% margen':'','ok')+
        kpi('Ticket promedio',money(ok.length?tot/ok.length:0),'','')+
      '</div>'+
      '<div class="card"><div class="bd p0">'+
      tbl([
        {t:'N°',f:v=>'<b>'+esc(v.no)+'</b>'},
        {t:'Fecha',f:v=>fdate(v.fecha,true)},
        {t:'Tipo',f:v=> v.mesaId? '🍽️ '+esc(nameOf('mesas',v.mesaId)) : v.tipo==='domicilio'?'🛵 Domicilio':'🧾 Mostrador'},
        {t:'Cliente',f:v=> v.clienteId? esc(nameOf('clientes',v.clienteId)):'<span class="muted">—</span>'},
        {t:'Cajero',f:v=>esc(nameOf('usuarios',v.usuarioId))},
        {t:'Pago',f:v=> v.credito? '<span class="pill warn">Crédito</span>' :
          (v.pagos||[]).map(p=>{const m=MEDIOS.find(x=>x.k===p.medio)||{};return '<span class="pill">'+(m.e||'')+' '+esc(m.n||'')+'</span>';}).join(' ')},
        {t:'Total',num:1,f:v=>'<b>'+money(v.total)+'</b>'},
        {t:'Estado',f:v=> v.estado==='anulada'?'<span class="pill bad">Anulada</span>':
          v.estado==='pendiente'?'<span class="pill warn">Pendiente</span>':'<span class="pill ok">Pagada</span>'},
        {t:'',f:v=>'<div class="row" style="gap:3px"><button class="btn ghost sm" data-t="'+v.id+'">🧾</button>'+
          (v.estado!=='anulada'&&can('ventas')?'<button class="btn ghost sm" data-a="'+v.id+'">✕</button>':'')+'</div>'}
      ],vs,{empty:'Sin ventas en el rango',icon:'📈'})+
      '</div></div>';
    $$('[data-t]').forEach(b=> b.onclick=()=>verTicket(byId('ventas',b.dataset.t)));
    $$('[data-a]').forEach(b=> b.onclick=()=>anularVenta(byId('ventas',b.dataset.a)));
  }
  const fil=$('#vfil');
  fil.innerHTML='<div class="card" style="margin-bottom:14px"><div class="bd"><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(140px,1fr))">'+
    '<div class="f"><label>Desde</label><input type="date" id="d1" value="'+f.desde+'"></div>'+
    '<div class="f"><label>Hasta</label><input type="date" id="d2" value="'+f.hasta+'"></div>'+
    '<div class="f"><label>Estado</label><select id="es"><option value="">Todos</option><option value="pagada">Pagada</option>'+
      '<option value="pendiente">Pendiente</option><option value="anulada">Anulada</option></select></div>'+
    '<div class="f"><label>Buscar</label><input id="q" placeholder="N° o cliente"></div>'+
    '<div class="f"><label>&nbsp;</label><div class="row"><button class="btn sm" id="hoy">Hoy</button>'+
      '<button class="btn sm" id="mes">Mes</button></div></div>'+
    '</div></div></div>';
  $('#d1').onchange=e=>{f.desde=e.target.value;paint();};
  $('#d2').onchange=e=>{f.hasta=e.target.value;paint();};
  $('#es').onchange=e=>{f.estado=e.target.value;paint();};
  $('#q').oninput=debounce(e=>{f.q=e.target.value;paint();});
  $('#hoy').onclick=()=>{f.desde=f.hasta=todayISO();$('#d1').value=f.desde;$('#d2').value=f.hasta;paint();};

        '<div class="grid" style="grid-template-columns:70px 1fr;margin-bottom:10px">'+

          '<div class="f"><label>Nombre</label><input id="nm" value="'+esc(ed.nombre)+'"></div></div>'+
        '<div class="f" style="margin-bottom:10px"><label>Categoría</label><select id="ct">'+selOpts(S.categorias,ed.categoriaId)+'</select></div>'+
        '<div class="grid" style="grid-template-columns:1fr 1fr;margin-bottom:10px">'+
          '<div class="f"><label>Precio de venta</label><input id="pr" type="number" step="any" value="'+(ed.precio||0)+'"></div>'+
          '<div class="f"><label>Costo sin receta</label><input id="cm" type="number" step="any" value="'+(ed.costoManual||0)+'"></div></div>'+
        '<div class="card" style="background:var(--panel2)"><div class="bd">'+
          '<div class="tline"><span>Costo receta (PEPS actual)</span><span class="v" id="rc">—</span></div>'+
          '<div class="tline"><span>Utilidad</span><span class="v" id="ru">—</span></div>'+
          '<div class="tline b"><span>Margen</span><span class="v" id="rm">—</span></div></div></div>'+
        '<div class="f" style="margin-top:12px"><label>Foto del plato</label><div id="imgp"></div></div>'+
        '<label class="row tiny" style="margin-top:10px;gap:7px"><input type="checkbox" id="ac" '+(ed.activo?'checked':'')+'> Activo (visible en el POS)</label>'+
      '</div>'+
      '<div>'+
        '<div class="row" style="margin-bottom:8px"><b>Receta (descuenta inventario)</b><span class="spacer"></span>'+
          '<button class="btn sm" id="addr">+ Ingrediente</button></div>'+
        '<div id="rows"></div>'+
        '<div class="hintx" style="margin-top:8px">Cada venta descuenta automáticamente estas cantidades del inventario.</div>'+
      '</div></div>',
    footer:(p?'<button class="btn danger" id="del">Eliminar</button>':'')+
      '<div class="spacer"></div><button class="btn" data-x>Cancelar</button><button class="btn pri" id="ok">Guardar</button>',
    onOpen:m=>{
      function rowHTML(r,i){
        const g=byId('ingredientes',r.ingredienteId)||{};
        return '<div class="recipe-row" data-i="'+i+'">'+
          '<select data-g>'+gs.map(x=>'<option value="'+x.id+'"'+(x.id===r.ingredienteId?' selected':'')+'>'+esc(x.nombre)+'</option>').join('')+'</select>'+
          '<input data-q type="number" step="any" value="'+(r.cantidad||0)+'">'+
          '<span class="tiny muted">'+esc(g.unidad||'')+'</span>'+
          '<button class="btn ghost sm" data-x2>✕</button></div>';
      }
      function calc(){
        const tmp={receta:ed.receta,costoManual:toN($('#cm',m).value),precio:toN($('#pr',m).value)};
        const c=costoProducto(tmp), pr=tmp.precio;
        $('#rc',m).textContent=money(c);
        $('#ru',m).textContent=money(pr-c);
        $('#rm',m).textContent=(pr? round((pr-c)/pr*100,1):0)+'%';
      }
      function paintRows(){
        $('#rows',m).innerHTML= ed.receta.length? ed.receta.map(rowHTML).join('') :
          '<div class="hintx">Sin ingredientes. Se usará el costo manual.</div>';
        $$('.recipe-row',m).forEach(row=>{ const i=+row.dataset.i;
          $('[data-g]',row).onchange=e=>{ed.receta[i].ingredienteId=e.target.value;paintRows();calc();};
          $('[data-q]',row).oninput=e=>{ed.receta[i].cantidad=toN(e.target.value);calc();};
          $('[data-x2]',row).onclick=()=>{ed.receta.splice(i,1);paintRows();calc();};
        });
      }
      $('#addr',m).onclick=()=>{ if(!gs.length) return toast('Crea ingredientes primero','warn');
        ed.receta.push({ingredienteId:gs[0].id,cantidad:1}); paintRows(); calc(); };
      $('#pr',m).oninput=calc; $('#cm',m).oninput=calc;
      cajaImagen($('#imgp',m), ed.id, IMG_PRESET.plato);
      paintRows(); calc();
      $('#ok',m).onclick=()=>{
        ed.nombre=$('#nm',m).value.trim(); if(!ed.nombre) return toast('Nombre requerido','warn');
        ed.emoji=$('#em',m).value.trim()||'🍽️'; ed.categoriaId=$('#ct',m).value;
        ed.precio=toN($('#pr',m).value); ed.costoManual=toN($('#cm',m).value); ed.activo=$('#ac',m).checked;
        ed.receta=ed.receta.filter(r=>r.ingredienteId&&r.cantidad>0);
        put('productos',ed); closeModal(); render(); toast('Producto guardado','ok');
      };
      if($('#del',m)) $('#del',m).onclick=()=>{ closeModal();
        confirmar('¿Eliminar "'+ed.nombre+'"?',()=>{remove('productos',ed.id);
          if(imgDe(ed.id)) borrarImagen(ed.id); render(); toast('Eliminado','ok');},true); };
    }});
}

        '<button class="btn sm" id="addi">+ Ingrediente</button></div>'+
      '<div id="rows"></div>'+
      '<div class="card" style="margin-top:14px;background:var(--panel2)"><div class="bd">'+
        '<div class="tline"><span>Subtotal</span><span class="v" id="tsub">—</span></div>'+
        '<div class="f" style="margin:8px 0"><label>IVA / impuestos de la factura</label><input id="iv" type="number" step="any" value="0"></div>'+
        '<div class="tline big"><span>Total</span><span class="v" id="ttot">—</span></div></div></div>',
    footer:'<button class="btn" data-x>Cancelar</button><button class="btn pri" id="ok">Registrar compra</button>',
    onOpen:m=>{
      function calc(){
        const s=round(sum(items,i=>i.cantidad*i.costoUnit),2);
        const iva=toN($('#iv',m).value);
        $('#tsub',m).textContent=money(s); $('#ttot',m).textContent=money(s+iva);
        return {sub:s,iva:iva,total:round(s+iva,2)};
      }
      function paintRows(){
        $('#rows',m).innerHTML= items.length? items.map((r,i)=>{
          const g=byId('ingredientes',r.ingredienteId)||{};
          return '<div class="grid" data-i="'+i+'" style="grid-template-columns:2fr 100px 46px 130px 120px 34px;gap:7px;align-items:center;margin-bottom:7px">'+
            '<select data-g>'+gs.map(x=>'<option value="'+x.id+'"'+(x.id===r.ingredienteId?' selected':'')+'>'+esc(x.nombre)+'</option>').join('')+'</select>'+
            '<input data-q type="number" step="any" value="'+r.cantidad+'">'+
            '<span class="tiny muted">'+esc(g.unidad||'')+'</span>'+
            '<input data-c type="number" step="any" value="'+r.costoUnit+'">'+
            '<span class="num b mono">'+money(r.cantidad*r.costoUnit)+'</span>'+
            '<button class="btn ghost sm" data-x2>✕</button></div>';
        }).join('') : '<div class="hintx">Agrega al menos un ingrediente.</div>';
        $$('[data-i]',$('#rows',m)).forEach(row=>{ const i=+row.dataset.i;
          $('[data-g]',row).onchange=e=>{items[i].ingredienteId=e.target.value;paintRows();calc();};
          $('[data-q]',row).oninput=e=>{items[i].cantidad=toN(e.target.value);calc();
            row.children[4].textContent=money(items[i].cantidad*items[i].costoUnit);};
          $('[data-c]',row).oninput=e=>{items[i].costoUnit=toN(e.target.value);calc();
            row.children[4].textContent=money(items[i].cantidad*items[i].costoUnit);};
          $('[data-x2]',row).onclick=()=>{items.splice(i,1);paintRows();calc();};
        });
      }
      $('#addi',m).onclick=()=>{ const g=gs[0]; items.push({ingredienteId:g.id,cantidad:1,costoUnit:g.costo||0}); paintRows(); calc(); };
      $('#iv',m).oninput=calc;
      $('#cd',m).onchange=e=>{ credito=e.target.value==='credito';
        $('#credb',m).classList.toggle('hide',!credito); $('#pagob',m).classList.toggle('hide',credito);
        $('#vinfo',m).textContent= credito? 'Vence el '+dateAdd($('#fe',m).value,toN($('#plz',m).value)) : ''; };
      $('#plz',m).oninput=()=>{ $('#vinfo',m).textContent='Vence el '+dateAdd($('#fe',m).value,toN($('#plz',m).value)); };
      paintRows(); calc();
      $('#ok',m).onclick=()=>{
        items=items.filter(i=>i.cantidad>0);
        if(!items.length) return toast('Agrega ítems a la compra','warn');
        const t=calc();
        const cp={id:uid('cp'),no:nextNo('compra','C-'),fecha:$('#fe',m).value||todayISO(),
          proveedorId:$('#pv',m).value, factura:$('#fa',m).value.trim(), items:items.slice(),
          subtotal:t.sub, impuesto:t.iva, total:t.total, credito:credito,
          vence: credito? dateAdd($('#fe',m).value||todayISO(),toN($('#plz',m).value)):'',
          estado: credito?'pendiente':'pagada', cuentaId: credito?'':$('#ct',m).value,
          usuarioId:S.user?S.user.id:''};
        put('compras',cp);
        items.forEach(i=> movInv(i.ingredienteId,'entrada',i.cantidad,i.costoUnit,'compra',cp.id,'Compra '+cp.no));
        if(!credito) movTes(cp.cuentaId,'egreso',cp.total,'Compra '+cp.no+' · '+nameOf('proveedores',cp.proveedorId),'compra','compra',cp.id);
        closeModal(); render(); toast('Compra '+cp.no+' registrada','ok');
      };
    }});
}

/* ============================== CARTERA =============================== */
function viewCartera(vw){
  let tab='cxc';
  vw.innerHTML='<div id="ctabs"></div><div id="cbody"></div>';
  $('#ctabs').appendChild(tabsBar([['cxc','Por cobrar'],['cxp','Por pagar'],['abonos','Abonos']],tab,t=>{tab=t;paint();}));
  function paint(){
    $$('#ctabs .tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
    if(tab==='abonos'){
      const as=S.abonos.slice().sort((a,b)=>b.fecha.localeCompare(a.fecha));
      $('#cbody').innerHTML='<div class="card"><div class="bd p0">'+tbl([
        {t:'Fecha',f:a=>fdate(a.fecha,true)},
        {t:'Tipo',f:a=>a.tipo==='cxc'?'<span class="pill ok">Cobro</span>':'<span class="pill bad">Pago</span>'},
        {t:'Documento',f:a=>{const d=a.tipo==='cxc'?byId('ventas',a.docId):byId('compras',a.docId);return esc(d?d.no:'—');}},
        {t:'Tercero',f:a=>esc(a.tipo==='cxc'?nameOf('clientes',a.terceroId):nameOf('proveedores',a.terceroId))},
        {t:'Medio',f:a=>{const m=MEDIOS.find(x=>x.k===a.medio)||{};return '<span class="pill">'+(m.e||'')+' '+esc(m.n||a.medio)+'</span>';}},
        {t:'Monto',num:1,f:a=>'<b>'+money(a.monto)+'</b>'},
        {t:'Usuario',f:a=>esc(nameOf('usuarios',a.usuarioId))}
      ],as,{empty:'Sin abonos registrados',icon:'💳'})+'</div></div>';
      return;
    }
    const esC=tab==='cxc';
    const docs=(esC?cxc():cxp()).slice().sort((a,b)=>(a.vence||'').localeCompare(b.vence||''));
    const saldoF=esC?saldoVenta:saldoCompra;
    const total=sum(docs,saldoF);
    const venc=docs.filter(d=>diasVencido(d)>0);
    const buckets=[[0,0,'Al día'],[1,30,'1-30 días'],[31,60,'31-60'],[61,9999,'+60']];
    const bs=buckets.map(b=>{ const l=docs.filter(d=>{const v=diasVencido(d);return b[0]===0? v===0 : (v>=b[0]&&v<=b[1]);});
      return {n:b[2],v:sum(l,saldoF),c:l.length}; });
    $('#cbody').innerHTML=
      '<div class="kpis" style="margin-bottom:14px">'+
        kpi(esC?'Total por cobrar':'Total por pagar',money(total),docs.length+' documentos',esC?'brand':'bad')+
        kpi('Vencido',money(sum(venc,saldoF)),venc.length+' documentos',venc.length?'bad':'ok')+
        bs.slice(1).map(b=>kpi(b.n,money(b.v),b.c+' doc.','')).join('')+
      '</div>'+
      '<div class="card"><div class="bd p0">'+tbl([
        {t:'Documento',f:d=>'<b>'+esc(d.no)+'</b>'},
        {t:'Fecha',f:d=>fdate(d.fecha)},
        {t:esC?'Cliente':'Proveedor',f:d=>esc(esC?nameOf('clientes',d.clienteId):nameOf('proveedores',d.proveedorId))},
        {t:'Vence',f:d=>{const v=diasVencido(d);
          return esc(d.vence||'—')+(v>0?' <span class="pill bad">'+v+'d</span>':'');}},
        {t:'Total',num:1,f:d=>money(d.total)},
        {t:'Abonado',num:1,f:d=>money(abonadoDe(d.id))},
        {t:'Saldo',num:1,f:d=>'<b>'+money(saldoF(d))+'</b>'},
        {t:'',f:d=>'<button class="btn ok sm" data-p="'+d.id+'">'+(esC?'Cobrar':'Pagar')+'</button>'}
      ],docs,{empty:esC?'No hay cuentas por cobrar':'No hay cuentas por pagar',icon:'✅'})+'</div></div>';
    $$('[data-p]').forEach(b=>b.onclick=()=>mAbono(esC?'cxc':'cxp', esC?byId('ventas',b.dataset.p):byId('compras',b.dataset.p)));
  }
  paint();
}
function mAbono(tipo,doc){
  if(!doc) return;
  const esC=tipo==='cxc';
  const saldo=esC?saldoVenta(doc):saldoCompra(doc);
  const tercero=esC? doc.clienteId : doc.proveedorId;
  modal({title:(esC?'Cobro de ':'Pago de ')+doc.no,
    body:'<div class="card" style="background:var(--panel2);margin-bottom:14px"><div class="bd">'+
      '<div class="tline"><span>'+(esC?'Cliente':'Proveedor')+'</span><span class="v">'+
        esc(esC?nameOf('clientes',tercero):nameOf('proveedores',tercero))+'</span></div>'+
      '<div class="tline"><span>Total documento</span><span class="v">'+money(doc.total)+'</span></div>'+
      '<div class="tline"><span>Abonado</span><span class="v">'+money(abonadoDe(doc.id))+'</span></div>'+
      '<div class="tline big"><span>Saldo</span><span class="v">'+money(saldo)+'</span></div></div></div>'+
      '<div class="grid" style="grid-template-columns:1fr 1fr">'+
      '<div class="f"><label>Monto</label><input id="mt" type="number" step="any" value="'+saldo+'"></div>'+
      '<div class="f"><label>Medio</label><select id="me">'+MEDIOS.filter(m=>m.k!=='credito').map(m=>
        '<option value="'+m.k+'">'+m.e+' '+m.n+'</option>').join('')+'</select></div></div>'+
      '<div class="f" style="margin-top:10px"><label>Cuenta de tesorería</label><select id="ct">'+
        selOpts(S.cuentas.filter(c=>c.activo),cuentaDeMedio('efectivo'),c=>c.nombre+' · '+money(saldoCuenta(c.id)))+'</select></div>'+
      '<div class="f" style="margin-top:10px"><label>Nota</label><input id="nt" placeholder="Opcional"></div>',
    footer:'<button class="btn" data-x>Cancelar</button><button class="btn ok" id="ok">Registrar</button>',
    onOpen:m=>{
      $('#me',m).onchange=e=>{ const c=cuentaDeMedio(e.target.value); if(c) $('#ct',m).value=c; };
      $('#ok',m).onclick=()=>{
        const v=toN($('#mt',m).value);
        if(v<=0) return toast('Monto inválido','warn');
        if(v>saldo+0.5) return toast('El monto supera el saldo','warn');
        const a={id:uid('ab'),fecha:now(),tipo:tipo,docId:doc.id,terceroId:tercero,monto:v,
          medio:$('#me',m).value,cuentaId:$('#ct',m).value,nota:$('#nt',m).value,
          usuarioId:S.user?S.user.id:'',turnoId:S.turno?S.turno.id:''};
        put('abonos',a);
        movTes(a.cuentaId, esC?'ingreso':'egreso', v,
          (esC?'Cobro ':'Pago ')+doc.no, esC?'cartera':'proveedores', tipo, doc.id);
        const nuevoSaldo = esC? saldoVenta(doc): saldoCompra(doc);
        if(nuevoSaldo<=0.5){ doc.estado='pagada'; put(esC?'ventas':'compras',doc); }
        closeModal(); render(); toast('Registrado '+money(v),'ok');
      };
    }});
}

function mAbrirCaja(){

function mCerrarCaja(){
  const t=S.turno; if(!t) return;
  const efe=efectivoTurno(t.id), esperado=round((Number(t.base)||0)+efe,2);
  const vs=ventasDeTurno(t.id);
  modal({title:'Cerrar caja',
    body:'<div class="card" style="background:var(--panel2);margin-bottom:14px"><div class="bd">'+
      '<div class="tline"><span>Base inicial</span><span class="v">'+money(t.base)+'</span></div>'+
      '<div class="tline"><span>Ventas en efectivo</span><span class="v">'+money(efe)+'</span></div>'+
      '<div class="tline big"><span>Efectivo esperado</span><span class="v">'+money(esperado)+'</span></div></div></div>'+
      '<div class="f"><label>Efectivo contado</label><input id="c" type="number" step="any" style="font-size:20px;font-weight:700;padding:11px" value="'+esperado+'"></div>'+
      '<div class="tline big" id="dif" style="margin:10px 0"><span>Diferencia</span><span class="v">'+money(0)+'</span></div>'+
      '<div class="f"><label>Observaciones</label><textarea id="n" rows="2"></textarea></div>',
    footer:'<button class="btn" data-x>Cancelar</button><button class="btn danger" id="ok">Cerrar turno</button>',
    onOpen:m=>{
      const upd=()=>{ const d=round(toN($('#c',m).value)-esperado,2);
        $('#dif',m).innerHTML='<span>Diferencia</span><span class="v" style="color:'+(Math.abs(d)<1?'var(--ok)':'var(--bad)')+'">'+money(d)+'</span>'; };
      $('#c',m).oninput=upd; upd();
      $('#ok',m).onclick=()=>{
        t.contado=toN($('#c',m).value); t.esperado=esperado; t.diferencia=round(t.contado-esperado,2);
        t.cierre=now(); t.estado='cerrado'; t.nota=$('#n',m).value; t.ventas=sum(vs,v=>v.total);
        put('turnos',t); S.turno=null; closeModal(); render();
        toast('Turno cerrado · diferencia '+money(t.diferencia), Math.abs(t.diferencia)<1?'ok':'warn');
      };
    }});
}
