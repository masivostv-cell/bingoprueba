<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Gastos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        /* Ocultar flechas en inputs numéricos */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; margin: 0; 
        }
        .autocomplete-items {
            position: absolute;
            border: 1px solid #e2e8f0;
            border-bottom: none;
            border-top: none;
            z-index: 99;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 200px;
            overflow-y: auto;
            background-color: white;
            border-radius: 0.375rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .autocomplete-items div {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #e2e8f0;
        }
        .autocomplete-items div:hover {
            background-color: #f1f5f9;
        }
    </style>
</head>
<body class="text-slate-800 p-4 md:p-8">

    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg border border-slate-100 overflow-hidden">
        <div class="bg-blue-600 px-6 py-4 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-white">Registro de Gastos</h1>
                <p class="text-blue-100 text-sm mt-1">Ingresa los datos del comprobante para guardarlos en Google Sheets</p>
            </div>
            
            <!-- NUEVO: Indicador de estado de red -->
            <div id="networkBadge" class="hidden md:flex items-center gap-2 px-3 py-1 rounded-full bg-green-500/20 text-green-50 border border-green-400/30 text-sm font-medium transition-colors">
                <span id="networkDot" class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
                <span id="networkText">En línea</span>
            </div>
        </div>

        <form id="gastosForm" class="p-6 md:p-8 space-y-6">
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- Fecha -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">FECHA</label>
                    <input type="date" id="fecha" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>

                <!-- Tipo -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">TIPO</label>
                    <select id="tipo" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                        <option value="">Seleccione...</option>
                        <option value="Gasto">Gasto</option>
                        <option value="Costo">Costo</option>
                        <option value="Inversión">Inversión</option>
                    </select>
                </div>

                <!-- Nombre (Autocompletado) -->
                <div class="relative">
                    <label class="block text-sm font-medium text-slate-700 mb-1">NOMBRE (Busca el Tercero)</label>
                    <input type="text" id="nombre" autocomplete="off" placeholder="Escribe para buscar..." required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    <div id="nombre-autocomplete-list" class="autocomplete-items hidden"></div>
                </div>

                <!-- Documento -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">DOCUMENTO</label>
                    <input type="text" id="documento" readonly class="w-full px-4 py-2 bg-slate-50 border border-slate-300 rounded-lg text-slate-500 outline-none">
                </div>

                <!-- Concepto -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-slate-700 mb-1">CONCEPTO</label>
                    <input type="text" id="concepto" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>

                <!-- Vehículo -->
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-slate-700 mb-1">VEHICULO</label>
                    <input type="text" id="vehiculo" placeholder="Placa o referencia (Opcional)" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>
            </div>

            <div class="mt-8 border-t border-slate-200 pt-6">
                <h3 class="text-lg font-semibold text-slate-800 mb-4">Valores y Retenciones</h3>
                
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <!-- Valor -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">VALOR ($)</label>
                        <input type="number" id="valor" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition font-semibold text-slate-800">
                    </div>

                    <!-- % Retención -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">% RETENCIÓN</label>
                        <input type="number" step="0.01" id="porcentaje_retencion" placeholder="Ej: 4.00" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    </div>

                    <!-- Valor Rete -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">VALOR RETE ($)</label>
                        <input type="number" id="valor_rete" readonly class="w-full px-4 py-2 bg-slate-50 border border-slate-300 rounded-lg text-red-600 font-semibold outline-none">
                    </div>

                    <!-- % ICA -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">% ICA</label>
                        <input type="number" step="0.001" id="porcentaje_ica" placeholder="Ej: 0.966" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    </div>

                    <!-- Valor ICA -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">VL ICA ($)</label>
                        <input type="number" id="vl_ica" readonly class="w-full px-4 py-2 bg-slate-50 border border-slate-300 rounded-lg text-red-600 font-semibold outline-none">
                    </div>

                    <!-- Valor Neto -->
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">VALOR NETO ($)</label>
                        <input type="number" id="valor_neto" readonly class="w-full px-4 py-2 bg-green-50 border border-green-300 rounded-lg text-green-700 font-bold outline-none text-lg">
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4">
                <!-- Forma de Pago -->
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">FORMA DE PAGO</label>
                    <select id="forma_pago" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                        <option value="">Seleccione...</option>
                        <option value="Efectivo">Efectivo</option>
                        <option value="Transferencia">Transferencia</option>
                        <option value="Tarjeta de Crédito">Tarjeta de Crédito</option>
                        <option value="Tarjeta de Débito">Tarjeta de Débito</option>
                        <option value="Cheque">Cheque</option>
                    </select>
                </div>
            </div>

            <!-- Botones -->
            <div class="pt-6 flex justify-end gap-3">
                <button type="button" onclick="document.getElementById('gastosForm').reset(); calcularTotales();" class="px-6 py-2 border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 transition font-medium">Limpiar</button>
                <button type="submit" id="btnSubmit" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium flex items-center justify-center">
                    <span id="btnText">Guardar Registro</span>
                    <svg id="btnLoader" class="animate-spin -ml-1 mr-3 h-5 w-5 text-white hidden ml-2" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                    </svg>
                </button>
            </div>
        </form>
    </div>

    <!-- Modal de Mensaje Personalizado (Evita usar alert) -->
    <div id="msgModal" class="fixed inset-0 bg-slate-900 bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-xl p-6 max-w-sm w-full mx-4 transform transition-all">
            <h3 id="msgTitle" class="text-lg font-bold text-slate-800 mb-2">Mensaje</h3>
            <p id="msgBody" class="text-slate-600 mb-6">Operación realizada con éxito.</p>
            <button onclick="cerrarModal()" class="w-full bg-blue-600 text-white py-2 rounded-lg font-medium hover:bg-blue-700 transition">Entendido</button>
        </div>
    </div>

    <script>
        // URL INDEXADA (Actualizada con tu link)
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyCPTM-NLbRWJuOs8q3hmzpWIoELxQKD3SQh-E_h58N0nrKW3en0zYXthhOtsuPASM-/exec"; 

        // Lista de TERCEROS que se llenará desde Google Sheets o Caché
        let listaTerceros = [];

        // UI de Red
        const networkBadge = document.getElementById('networkBadge');
        const networkDot = document.getElementById('networkDot');
        const networkText = document.getElementById('networkText');

        // Función para actualizar indicador visual de conexión
        function actualizarEstadoRed() {
            let pendientes = JSON.parse(localStorage.getItem('gastos_pendientes') || '[]');
            
            if (navigator.onLine) {
                if (pendientes.length > 0) {
                    networkBadge.className = "hidden md:flex items-center gap-2 px-3 py-1 rounded-full bg-yellow-500/20 text-yellow-800 border border-yellow-400 text-sm font-medium transition-colors";
                    networkDot.className = "w-2 h-2 rounded-full bg-yellow-500 animate-pulse";
                    networkText.innerText = `Sincronizando ${pendientes.length}...`;
                    sincronizarPendientes();
                } else {
                    networkBadge.className = "hidden md:flex items-center gap-2 px-3 py-1 rounded-full bg-green-500/20 text-green-50 border border-green-400/30 text-sm font-medium transition-colors";
                    networkDot.className = "w-2 h-2 rounded-full bg-green-400 animate-pulse";
                    networkText.innerText = "En línea";
                }
            } else {
                networkBadge.className = "hidden md:flex items-center gap-2 px-3 py-1 rounded-full bg-red-500/10 text-red-100 border border-red-500 text-sm font-medium transition-colors";
                networkDot.className = "w-2 h-2 rounded-full bg-red-500";
                let texto = "Sin conexión";
                if(pendientes.length > 0) texto += ` (${pendientes.length} ptes)`;
                networkText.innerText = texto;
            }
        }

        // Escuchar eventos de red del navegador
        window.addEventListener('online', actualizarEstadoRed);
        window.addEventListener('offline', actualizarEstadoRed);

        // Función para sincronizar datos guardados sin conexión
        async function sincronizarPendientes() {
            let pendientes = JSON.parse(localStorage.getItem('gastos_pendientes') || '[]');
            if (pendientes.length === 0) return;

            let restantes = [];
            let subidos = 0;

            for (let i = 0; i < pendientes.length; i++) {
                try {
                    const response = await fetch(GOOGLE_SCRIPT_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify(pendientes[i])
                    });
                    const data = await response.json();
                    
                    if (data.status === "success") {
                        subidos++;
                    } else {
                        restantes.push(pendientes[i]); // Mantener si hay error de base de datos
                    }
                } catch (error) {
                    restantes.push(pendientes[i]); // Mantener si hay error de red
                }
            }

            localStorage.setItem('gastos_pendientes', JSON.stringify(restantes));
            actualizarEstadoRed();

            if (subidos > 0) {
                mostrarModal("Sincronización Exitosa", `Se han subido ${subidos} registros que estaban guardados en el dispositivo.`);
            }
        }

        // Función para descargar Terceros con soporte offline
        async function cargarTerceros() {
            const nombreInput = document.getElementById('nombre');
            nombreInput.disabled = true;

            // Revisar si hay caché guardado de veces anteriores
            const cache = localStorage.getItem('terceros_cache');

            if (!navigator.onLine) {
                if (cache) {
                    listaTerceros = JSON.parse(cache);
                    nombreInput.placeholder = "Modo sin conexión (Terceros en caché)";
                    autocompletar(nombreInput, listaTerceros);
                } else {
                    nombreInput.placeholder = "Sin conexión y sin datos guardados.";
                }
                nombreInput.disabled = false;
                return;
            }

            nombreInput.placeholder = "Cargando base de datos...";

            try {
                // Se agrega redirect 'follow' para manejar correctamente las respuestas de Google
                const response = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'GET',
                    redirect: 'follow'
                });
                const result = await response.json();

                if (result.status === "success") {
                    listaTerceros = result.data;
                    // Guardar en caché para cuando no haya internet
                    localStorage.setItem('terceros_cache', JSON.stringify(listaTerceros));
                    nombreInput.placeholder = "Escribe para buscar...";
                } else {
                    // AQUÍ MOSTRAMOS EL ERROR EXACTO QUE MANDA GOOGLE
                    nombreInput.placeholder = "Error: " + result.message;
                    console.error("Error desde Apps Script:", result.message);
                }
            } catch (error) {
                // Si hay error de red o de permisos (CORS), usamos el caché o advertimos al usuario
                if (cache) {
                    listaTerceros = JSON.parse(cache);
                    nombreInput.placeholder = "Modo offline (Terceros en caché)";
                } else {
                    nombreInput.placeholder = "⚠️ Sin acceso a Google Sheets (Revisa permisos)";
                    console.warn("No se pudo conectar con Apps Script. Asegúrate de que 'Quién tiene acceso' sea 'Cualquier persona'.");
                }
            } finally {
                nombreInput.disabled = false;
                autocompletar(nombreInput, listaTerceros);
            }
        }

        // Ejecutar inicializaciones
        actualizarEstadoRed();
        cargarTerceros();

        // Establecer la fecha actual por defecto
        document.getElementById('fecha').valueAsDate = new Date();

        // Referencias a los campos de cálculo
        const inputValor = document.getElementById('valor');
        const inputRetencion = document.getElementById('porcentaje_retencion');
        const inputValorRete = document.getElementById('valor_rete');
        const inputIca = document.getElementById('porcentaje_ica');
        const inputVlIca = document.getElementById('vl_ica');
        const inputNeto = document.getElementById('valor_neto');

        function calcularTotales() {
            const valor = parseFloat(inputValor.value) || 0;
            const pRetencion = parseFloat(inputRetencion.value) || 0;
            const pIca = parseFloat(inputIca.value) || 0;

            // Calcular Valores (Porcentajes)
            const valorRete = (valor * pRetencion) / 100;
            const vlIca = (valor * pIca) / 100;
            const neto = valor - valorRete - vlIca;

            // Actualizar inputs (redondeados sin decimales para mostrar, o con 2 si prefieres)
            inputValorRete.value = Math.round(valorRete);
            inputVlIca.value = Math.round(vlIca);
            inputNeto.value = Math.round(neto);
        }

        // Eventos para recalcular en tiempo real
        inputValor.addEventListener('input', calcularTotales);
        inputRetencion.addEventListener('input', calcularTotales);
        inputIca.addEventListener('input', calcularTotales);

        function autocompletar(inp, arr) {
            let currentFocus;
            
            inp.addEventListener("input", function(e) {
                let a, b, i, val = this.value;
                cerrarListas();
                if (!val) { 
                    document.getElementById('documento').value = '';
                    return false; 
                }
                currentFocus = -1;
                
                a = document.getElementById("nombre-autocomplete-list");
                a.classList.remove('hidden');

                let count = 0;
                for (i = 0; i < arr.length; i++) {
                    if (arr[i].nombre.toUpperCase().includes(val.toUpperCase()) || arr[i].documento.includes(val)) {
                        b = document.createElement("DIV");
                        let indexMatch = arr[i].nombre.toUpperCase().indexOf(val.toUpperCase());
                        if(indexMatch !== -1) {
                            b.innerHTML = arr[i].nombre.substring(0, indexMatch);
                            b.innerHTML += "<strong>" + arr[i].nombre.substring(indexMatch, indexMatch + val.length) + "</strong>";
                            b.innerHTML += arr[i].nombre.substring(indexMatch + val.length);
                        } else {
                            b.innerHTML = arr[i].nombre;
                        }
                        
                        b.innerHTML += ` <span class="text-sm text-slate-400">(${arr[i].documento})</span>`;
                        b.innerHTML += "<input type='hidden' value='" + arr[i].nombre + "'>";
                        b.innerHTML += "<input type='hidden' data-doc='" + arr[i].documento + "'>";
                        
                        b.addEventListener("click", function(e) {
                            inp.value = this.getElementsByTagName("input")[0].value;
                            document.getElementById('documento').value = this.getElementsByTagName("input")[1].getAttribute("data-doc");
                            cerrarListas();
                        });
                        a.appendChild(b);
                        count++;
                        if(count > 10) break;
                    }
                }
                if(count === 0) {
                    b = document.createElement("DIV");
                    b.innerHTML = "<span class='text-slate-400 italic'>No se encontraron coincidencias...</span>";
                    a.appendChild(b);
                    document.getElementById('documento').value = '';
                }
            });

            document.addEventListener("click", function (e) {
                if (e.target !== inp) {
                    cerrarListas();
                }
            });
        }

        function cerrarListas() {
            let a = document.getElementById("nombre-autocomplete-list");
            a.innerHTML = "";
            a.classList.add('hidden');
        }

        // Nueva función para guardar de forma local (Offline)
        function guardarLocalmente(formData) {
            let pendientes = JSON.parse(localStorage.getItem('gastos_pendientes') || '[]');
            pendientes.push(formData);
            localStorage.setItem('gastos_pendientes', JSON.stringify(pendientes));
            
            mostrarModal("¡Guardado Offline!", "No hay internet. El registro se guardó en tu dispositivo y se enviará automáticamente cuando vuelvas a tener conexión.");
            
            document.getElementById('gastosForm').reset();
            calcularTotales();
            actualizarEstadoRed();
        }

        document.getElementById('gastosForm').addEventListener('submit', function(e) {
            e.preventDefault();

            // Preparar los datos
            const formData = {
                fecha: document.getElementById('fecha').value,
                nombre: document.getElementById('nombre').value,
                documento: document.getElementById('documento').value,
                concepto: document.getElementById('concepto').value,
                vehiculo: document.getElementById('vehiculo').value,
                valor: document.getElementById('valor').value,
                porcentaje_retencion: document.getElementById('porcentaje_retencion').value,
                valor_rete: document.getElementById('valor_rete').value,
                porcentaje_ica: document.getElementById('porcentaje_ica').value,
                vl_ica: document.getElementById('vl_ica').value,
                valor_neto: document.getElementById('valor_neto').value,
                forma_pago: document.getElementById('forma_pago').value,
                tipo: document.getElementById('tipo').value
            };

            const btn = document.getElementById('btnSubmit');
            const btnText = document.getElementById('btnText');
            const btnLoader = document.getElementById('btnLoader');

            // UI estado de carga
            btn.disabled = true;
            btnText.innerText = "Guardando...";
            btnLoader.classList.remove('hidden');

            // Si NO hay internet, guardamos local inmediatamente
            if (!navigator.onLine) {
                guardarLocalmente(formData);
                resetButton(btn, btnText, btnLoader);
                return;
            }

            // Si HAY internet, intentamos enviar a Google
            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(formData)
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === "success") {
                    mostrarModal("¡Guardado!", "El gasto se ha registrado correctamente en tu hoja de cálculo.");
                    document.getElementById('gastosForm').reset();
                    calcularTotales();
                } else {
                    mostrarModal("Error", "Error desde el servidor: " + data.message);
                }
                resetButton(btn, btnText, btnLoader);
            })
            .catch(error => {
                // Si falla la petición (por ejemplo, el internet se cayó en ese instante), guardamos local
                console.warn("Fallo el envío por red, guardando localmente...", error);
                guardarLocalmente(formData);
                resetButton(btn, btnText, btnLoader);
            });
            
        });

        function resetButton(btn, text, loader) {
            btn.disabled = false;
            text.innerText = "Guardar Registro";
            loader.classList.add('hidden');
        }

        // Lógica del Modal Personalizado
        function mostrarModal(titulo, mensaje) {
            document.getElementById('msgTitle').innerText = titulo;
            document.getElementById('msgBody').innerText = mensaje;
            document.getElementById('msgModal').classList.remove('hidden');
        }

        function cerrarModal() {
            document.getElementById('msgModal').classList.add('hidden');
        }
    </script>
</body>
</html>
