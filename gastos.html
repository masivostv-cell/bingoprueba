<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Gastos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        /* Ocultar flechas en inputs numéricos */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { 
            -webkit-appearance: none; margin: 0; 
        }
        .autocomplete-items {
            position: absolute;
            border: 1px solid #e2e8f0;
            border-bottom: none;
            border-top: none;
            z-index: 99;
            top: 100%;
            left: 0;
            right: 0;
            max-height: 200px;
            overflow-y: auto;
            background-color: white;
            border-radius: 0.375rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        .autocomplete-items div {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #e2e8f0;
        }
        .autocomplete-items div:hover {
            background-color: #f1f5f9;
        }
    </style>
</head>
<body class="text-slate-800 p-4 md:p-8">

    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg border border-slate-100 overflow-hidden">
        <div class="bg-blue-600 px-6 py-4 flex flex-wrap gap-3 justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-white">Registro de Gastos</h1>
                <p class="text-blue-100 text-sm mt-1">Se guarda al instante en este dispositivo y se sube solo a Google Sheets</p>
            </div>

            <!-- Indicador de sincronización -->
            <div id="networkBadge" class="flex items-center gap-2 px-3 py-1 rounded-full bg-white/15 text-white border border-white/30 text-sm font-medium">
                <span id="networkDot" class="w-2 h-2 rounded-full bg-green-400"></span>
                <span id="networkText">Cargando...</span>
            </div>
        </div>

        <form id="gastosForm" class="p-6 md:p-8 space-y-6" autocomplete="off">

            <!-- Próximo número de recibo -->
            <div class="bg-amber-50 border-2 border-amber-300 rounded-xl px-5 py-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                <div>
                    <p class="text-xs font-bold tracking-wider text-amber-700 uppercase">Próximo recibo</p>
                    <p class="text-sm text-slate-600 mt-1">Anota este número en la factura que estás registrando.</p>
                    <p id="reciboNota" class="text-xs font-semibold text-amber-700 mt-1"></p>
                </div>
                <div class="flex items-center gap-3">
                    <span id="proximoRecibo" class="text-4xl font-extrabold text-slate-900 tabular-nums">—</span>
                    <button type="button" onclick="botonActualizar()" class="px-3 py-2 text-sm border border-amber-300 bg-white text-amber-800 rounded-lg hover:bg-amber-100 transition" title="Actualizar número">Actualizar</button>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">FECHA</label>
                    <input type="date" id="fecha" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">TIPO</label>
                    <select id="tipo" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                        <option value="">Seleccione...</option>
                        <option value="Gasto">Gasto</option>
                        <option value="Costo">Costo</option>
                        <option value="Inversión">Inversión</option>
                    </select>
                </div>

                <div class="relative">
                    <label class="block text-sm font-medium text-slate-700 mb-1">NOMBRE (Busca el Tercero)</label>
                    <input type="text" id="nombre" autocomplete="off" placeholder="Escribe para buscar..." required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    <div id="nombre-autocomplete-list" class="autocomplete-items hidden"></div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">DOCUMENTO</label>
                    <input type="text" id="documento" readonly class="w-full px-4 py-2 bg-slate-50 border border-slate-300 rounded-lg text-slate-500 outline-none">
                </div>

                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-slate-700 mb-1">CONCEPTO</label>
                    <input type="text" id="concepto" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>

                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-slate-700 mb-1">VEHICULO</label>
                    <input type="text" id="vehiculo" placeholder="Placa o referencia (Opcional)" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                </div>
            </div>

            <div class="mt-8 border-t border-slate-200 pt-6">
                <h3 class="text-lg font-semibold text-slate-800 mb-4">Valores y Retenciones</h3>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">VALOR ($)</label>
                        <input type="number" id="valor" required inputmode="decimal" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition font-semibold text-slate-800">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">% RETENCIÓN</label>
                        <input type="number" step="0.01" id="porcentaje_retencion" inputmode="decimal" placeholder="Ej: 4.00" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">VALOR RETE ($)</label>
                        <input type="number" id="valor_rete" readonly tabindex="-1" class="w-full px-4 py-2 bg-slate-50 border border-slate-300 rounded-lg text-red-600 font-semibold outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">% ICA</label>
                        <input type="number" step="0.001" id="porcentaje_ica" inputmode="decimal" placeholder="Ej: 0.966" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">VL ICA ($)</label>
                        <input type="number" id="vl_ica" readonly tabindex="-1" class="w-full px-4 py-2 bg-slate-50 border border-slate-300 rounded-lg text-red-600 font-semibold outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">VALOR NETO ($)</label>
                        <input type="number" id="valor_neto" readonly tabindex="-1" class="w-full px-4 py-2 bg-green-50 border border-green-300 rounded-lg text-green-700 font-bold outline-none text-lg">
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-4">
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">FORMA DE PAGO</label>
                    <select id="forma_pago" required class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition">
                        <option value="">Seleccione...</option>
                        <option value="Efectivo">Efectivo</option>
                        <option value="Transferencia">Transferencia</option>
                        <option value="Tarjeta de Crédito">Tarjeta de Crédito</option>
                        <option value="Tarjeta de Débito">Tarjeta de Débito</option>
                        <option value="Cheque">Cheque</option>
                    </select>
                </div>
            </div>

            <div class="pt-6 flex justify-end gap-3">
                <button type="button" onclick="limpiarFormulario(false)" class="px-6 py-2 border border-slate-300 text-slate-700 rounded-lg hover:bg-slate-50 transition font-medium">Limpiar</button>
                <button type="submit" id="btnSubmit" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 active:scale-95 transition font-medium">Guardar Registro</button>
            </div>
        </form>

        <!-- Últimos registros -->
        <div class="border-t border-slate-200 px-6 md:px-8 py-6 bg-slate-50/60">
            <div class="flex items-center justify-between mb-3">
                <h3 class="text-sm font-bold tracking-wider text-slate-500 uppercase">Últimos registros</h3>
                <span id="historialResumen" class="text-xs text-slate-500"></span>
            </div>
            <div id="historial" class="space-y-2"></div>
        </div>
    </div>

    <!-- Modal para Crear Nuevo Tercero -->
    <div id="modalNuevoTercero" class="fixed inset-0 bg-slate-900 bg-opacity-50 hidden flex items-center justify-center z-50">
        <div class="bg-white rounded-xl shadow-xl p-6 max-w-sm w-full mx-4">
            <h3 class="text-lg font-bold text-slate-800 mb-2">Crear Nuevo Tercero</h3>
            <p class="text-sm text-slate-600 mb-4">Se agregará a <strong id="nuevoTerceroNombre" class="text-slate-800"></strong> a la base de datos.</p>
            <label class="block text-sm font-medium text-slate-700 mb-1">NÚMERO DE DOCUMENTO / NIT</label>
            <input type="text" id="nuevoTerceroDoc" placeholder="Ej: 900123456" class="w-full px-4 py-2 border border-slate-300 rounded-lg mb-6 focus:ring-2 focus:ring-blue-500 outline-none">
            <div class="flex justify-end gap-3">
                <button type="button" onclick="cerrarModalNuevoTercero()" class="px-4 py-2 text-slate-600 border border-slate-300 rounded-lg hover:bg-slate-50 transition">Cancelar</button>
                <button type="button" onclick="guardarNuevoTercero()" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition">Guardar Tercero</button>
            </div>
        </div>
    </div>

    <!-- Avisos rápidos (no bloquean) -->
    <div id="toasts" class="fixed bottom-4 left-1/2 -translate-x-1/2 z-50 flex flex-col items-center gap-2 w-full max-w-md px-4 pointer-events-none"></div>

    <script>
        // ================== CONFIGURACIÓN ==================
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz4jl-2NI4NTjipn-7omG5kUY8owtm0nkwFviLCvvuiZI7ob_uWqE1KNIzoxlApa6Yc/exec";
        const INTERVALO_SYNC_MS = 15000;   // reintenta cada 15 s si hay pendientes
        const TIMEOUT_MS = 25000;          // corta peticiones colgadas

        const LS = {
            COLA: 'cola_sync_v2',
            HIST: 'historial_gastos_v2',
            TERC: 'terceros_cache',
            BASE: 'proximo_recibo_base',
            BORR: 'borrador_gasto'
        };

        // ================== UTILIDADES ==================
        const $ = id => document.getElementById(id);
        function leer(k, def) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : def; } catch (e) { return def; } }
        function escribir(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { console.error('No se pudo guardar en el navegador', e); } }
        function nuevoId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
        const fmt = new Intl.NumberFormat('es-CO');
        function hoyISO() { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); }

        function toast(texto, tipo = 'ok', ms = 2500) {
            const colores = { ok: 'bg-slate-900 text-white', aviso: 'bg-amber-500 text-white', error: 'bg-red-600 text-white' };
            const t = document.createElement('div');
            t.className = `pointer-events-auto px-4 py-3 rounded-lg shadow-lg text-sm font-medium transition-opacity duration-300 ${colores[tipo] || colores.ok}`;
            t.textContent = texto;
            $('toasts').appendChild(t);
            setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, ms);
        }

        // ================== MIGRAR PENDIENTES DE LA VERSIÓN ANTERIOR ==================
        (function migrar() {
            const viejosT = leer('terceros_pendientes', []);
            const viejosG = leer('gastos_pendientes', []);
            if (!viejosT.length && !viejosG.length) return;
            const cola = leer(LS.COLA, []);
            const hist = leer(LS.HIST, []);
            viejosT.forEach(p => cola.push({ id: nuevoId(), tipo: 'tercero', payload: p, intentos: 0, proximoIntento: 0 }));
            viejosG.forEach(p => {
                const id = nuevoId();
                p.idLocal = id;
                cola.push({ id, tipo: 'gasto', payload: p, intentos: 0, proximoIntento: 0 });
                hist.unshift({ id, fecha: p.fecha, nombre: p.nombre, concepto: p.concepto, neto: p.valor_neto, provisional: null, real: null, estado: 'pendiente' });
            });
            escribir(LS.COLA, cola);
            escribir(LS.HIST, hist.slice(0, 100));
            localStorage.removeItem('terceros_pendientes');
            localStorage.removeItem('gastos_pendientes');
        })();

        // ================== COLA Y RECIBO ==================
        let sincronizando = false;
        const cola = () => leer(LS.COLA, []);
        const gastosEnCola = () => cola().filter(i => i.tipo === 'gasto').length;
        function baseRecibo() { const b = leer(LS.BASE, null); return (b === null || isNaN(Number(b))) ? null : Number(b); }
        function proximoPrevisto() { const b = baseRecibo(); return b === null ? null : b + gastosEnCola(); }

        function encolar(item) { const c = cola(); c.push(item); escribir(LS.COLA, c); }
        function quitarDeCola(id) { escribir(LS.COLA, cola().filter(i => i.id !== id)); }
        function marcarFallo(id, motivo) {
            const c = cola();
            const it = c.find(i => i.id === id);
            if (!it) return;
            it.intentos = (it.intentos || 0) + 1;
            it.ultimoError = motivo;
            it.proximoIntento = Date.now() + Math.min(5000 * 2 ** it.intentos, 5 * 60000);
            escribir(LS.COLA, c);
            if (it.tipo === 'gasto' && motivo !== 'red') actualizarHistorial(id, { estado: 'error', error: motivo });
        }

        function pintarRecibo() {
            const el = $('proximoRecibo'), nota = $('reciboNota');
            const n = proximoPrevisto();
            el.textContent = n === null ? '—' : n;
            const p = gastosEnCola();
            nota.textContent = n === null ? 'Esperando conexión para conocer el número'
                : p > 0 ? `Provisional · ${p} registro(s) aún subiendo` : '';
        }

        function pintarEstado() {
            const c = cola();
            const n = c.length;
            const conError = c.some(i => i.ultimoError && i.ultimoError !== 'red');
            let dot = 'bg-green-400', txt = 'Todo en Sheets ✓';
            if (!navigator.onLine) { dot = 'bg-red-500'; txt = n ? `Sin conexión · ${n} en el dispositivo` : 'Sin conexión'; }
            else if (sincronizando) { dot = 'bg-yellow-300 animate-pulse'; txt = `Subiendo ${n}...`; }
            else if (n > 0) { dot = conError ? 'bg-orange-400' : 'bg-yellow-300'; txt = conError ? `${n} pendiente(s) · reintentando` : `${n} en cola`; }
            $('networkDot').className = `w-2 h-2 rounded-full ${dot}`;
            $('networkText').textContent = txt;
        }

        // ================== ENVÍO A GOOGLE SHEETS ==================
        async function enviar(payload) {
            const ctrl = new AbortController();
            const t = setTimeout(() => ctrl.abort(), TIMEOUT_MS);
            try {
                const r = await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(payload),
                    redirect: 'follow',
                    signal: ctrl.signal
                });
                return await r.json();
            } finally { clearTimeout(t); }
        }

        async function sincronizar() {
            if (sincronizando || !navigator.onLine || cola().length === 0) { pintarEstado(); return; }
            sincronizando = true;
            pintarEstado();
            try {
                while (true) {
                    const ahora = Date.now();
                    const item = cola().find(i => (i.proximoIntento || 0) <= ahora);
                    if (!item) break;

                    let data;
                    try { data = await enviar(item.payload); }
                    catch (err) { marcarFallo(item.id, 'red'); break; } // sin red: esperar al próximo ciclo

                    if (data && data.status === 'success') {
                        quitarDeCola(item.id);
                        if (item.tipo === 'gasto') confirmarGasto(item, data);
                    } else {
                        marcarFallo(item.id, (data && data.message) || 'Error del servidor');
                    }
                    pintarEstado(); pintarRecibo(); pintarHistorial();
                }
            } finally {
                sincronizando = false;
                pintarEstado(); pintarRecibo(); pintarHistorial();
            }
            if (cola().length === 0) refrescarProximoRecibo();
        }

        function confirmarGasto(item, data) {
            if (data.proximoRecibo !== undefined) escribir(LS.BASE, Number(data.proximoRecibo));
            else if (data.numeroRecibo !== undefined) escribir(LS.BASE, Number(data.numeroRecibo) + 1);

            const h = leer(LS.HIST, []).find(x => x.id === item.id);
            const real = data.numeroRecibo !== undefined ? Number(data.numeroRecibo) : null;
            actualizarHistorial(item.id, { estado: 'subido', real, error: null });
            if (h && real !== null && h.provisional !== null && h.provisional !== real) {
                toast(`⚠️ ${h.nombre}: el recibo ${h.provisional} quedó como N.º ${real} en Sheets. Corrige la factura.`, 'aviso', 9000);
            }
        }

        async function refrescarProximoRecibo() {
            // Solo se consulta cuando no hay nada en cola, para no desfasar el número provisional
            if (!navigator.onLine || sincronizando || cola().length > 0) return;
            try {
                const sep = GOOGLE_SCRIPT_URL.includes('?') ? '&' : '?';
                const r = await fetch(`${GOOGLE_SCRIPT_URL}${sep}action=proximoRecibo&t=${Date.now()}`, { redirect: 'follow', cache: 'no-store' });
                const res = await r.json();
                if (res.status === 'success' && res.proximoRecibo !== undefined && cola().length === 0) {
                    escribir(LS.BASE, Number(res.proximoRecibo));
                    pintarRecibo();
                }
            } catch (e) { console.warn('No se pudo consultar el próximo recibo', e); }
        }

        function botonActualizar() {
            if (cola().length) { reiniciarEsperas(); sincronizar(); toast('Subiendo pendientes...'); }
            else { refrescarProximoRecibo(); refrescarTerceros(); toast('Actualizando...'); }
        }

        function reiniciarEsperas() {
            const c = cola(); c.forEach(i => i.proximoIntento = 0); escribir(LS.COLA, c);
        }

        // ================== HISTORIAL ==================
        function agregarHistorial(e) { const h = leer(LS.HIST, []); h.unshift(e); escribir(LS.HIST, h.slice(0, 100)); }
        function actualizarHistorial(id, cambios) {
            const h = leer(LS.HIST, []);
            const e = h.find(x => x.id === id);
            if (e) { Object.assign(e, cambios); escribir(LS.HIST, h); }
        }

        function pintarHistorial() {
            const h = leer(LS.HIST, []);
            const cont = $('historial');
            cont.innerHTML = '';
            if (!h.length) { cont.innerHTML = '<p class="text-sm text-slate-400">Aún no hay registros en este dispositivo.</p>'; $('historialResumen').textContent = ''; return; }

            const frag = document.createDocumentFragment();
            h.slice(0, 15).forEach(e => {
                const fila = document.createElement('div');
                fila.className = 'flex items-center gap-3 bg-white border border-slate-200 rounded-lg px-3 py-2 text-sm';

                const num = document.createElement('span');
                num.className = 'font-bold tabular-nums w-16 shrink-0';
                num.textContent = e.real !== null && e.real !== undefined ? `#${e.real}` : (e.provisional !== null && e.provisional !== undefined ? `#${e.provisional}*` : '#—');

                const info = document.createElement('div');
                info.className = 'flex-1 min-w-0';
                const n1 = document.createElement('div'); n1.className = 'font-medium truncate'; n1.textContent = e.nombre || '';
                const n2 = document.createElement('div'); n2.className = 'text-xs text-slate-500 truncate'; n2.textContent = `${e.fecha || ''} · ${e.concepto || ''}`;
                info.append(n1, n2);

                const val = document.createElement('span');
                val.className = 'tabular-nums text-slate-700 shrink-0';
                val.textContent = '$' + fmt.format(Number(e.neto) || 0);

                const chip = document.createElement('span');
                const cambio = e.estado === 'subido' && e.real !== null && e.provisional !== null && e.real !== e.provisional;
                const est = e.estado === 'subido' ? (cambio ? ['Cambió #', 'bg-orange-100 text-orange-700'] : ['En Sheets', 'bg-green-100 text-green-700'])
                          : e.estado === 'error' ? ['Error', 'bg-red-100 text-red-700']
                          : ['Pendiente', 'bg-yellow-100 text-yellow-800'];
                chip.className = `text-xs font-semibold px-2 py-1 rounded-full shrink-0 ${est[1]}`;
                chip.textContent = est[0];
                if (e.error) chip.title = e.error;

                fila.append(num, info, val, chip);
                frag.appendChild(fila);
            });
            cont.appendChild(frag);
            const pend = h.filter(x => x.estado !== 'subido').length;
            $('historialResumen').textContent = pend ? `${pend} sin subir · * = número provisional` : 'Todo sincronizado';
        }

        // ================== TERCEROS Y AUTOCOMPLETADO ==================
        let listaTerceros = [];
        let indice = [];
        function setTerceros(arr) {
            listaTerceros = arr;
            indice = arr.map(t => ({ nombre: String(t.nombre || ''), documento: String(t.documento || ''), N: String(t.nombre || '').toUpperCase() }));
        }
        setTerceros(leer(LS.TERC, []));   // disponible al instante desde la memoria del navegador

        async function refrescarTerceros() {
            if (!navigator.onLine) return;
            try {
                const r = await fetch(GOOGLE_SCRIPT_URL, { method: 'GET', redirect: 'follow' });
                const res = await r.json();
                if (res.status === 'success' && Array.isArray(res.data)) {
                    // Conservar terceros creados localmente que aún no han subido
                    const locales = cola().filter(i => i.tipo === 'tercero').map(i => ({ nombre: i.payload.nombre, documento: i.payload.documento }));
                    const docs = new Set(res.data.map(t => String(t.documento)));
                    const combinado = res.data.concat(locales.filter(t => !docs.has(String(t.documento))));
                    setTerceros(combinado);
                    escribir(LS.TERC, combinado);
                }
            } catch (e) { console.warn('No se pudo actualizar terceros, usando la copia local', e); }
        }

        const inpNombre = $('nombre');
        const inpDoc = $('documento');
        const lista = $('nombre-autocomplete-list');
        let tAuto = null, activo = -1;

        inpNombre.addEventListener('input', () => {
            inpDoc.value = '';
            clearTimeout(tAuto);
            tAuto = setTimeout(mostrarSugerencias, 60);
        });

        inpNombre.addEventListener('keydown', e => {
            const items = lista.querySelectorAll('[data-item]');
            if (lista.classList.contains('hidden') || !items.length) return;
            if (e.key === 'ArrowDown') { e.preventDefault(); activo = (activo + 1) % items.length; marcarActivo(items); }
            else if (e.key === 'ArrowUp') { e.preventDefault(); activo = (activo - 1 + items.length) % items.length; marcarActivo(items); }
            else if (e.key === 'Enter') { e.preventDefault(); (items[activo >= 0 ? activo : 0]).dispatchEvent(new Event('mousedown')); }
            else if (e.key === 'Escape') { cerrarListas(); }
        });

        function marcarActivo(items) {
            items.forEach((el, i) => el.classList.toggle('bg-slate-100', i === activo));
            if (items[activo]) items[activo].scrollIntoView({ block: 'nearest' });
        }

        function mostrarSugerencias() {
            const val = inpNombre.value.trim();
            cerrarListas();
            if (!val) return;
            const V = val.toUpperCase();
            const frag = document.createDocumentFragment();
            let count = 0, exacto = false;

            for (const t of indice) {
                const pos = t.N.indexOf(V);
                if (pos === -1 && !t.documento.includes(val)) continue;
                if (t.N === V) exacto = true;

                const d = document.createElement('div');
                d.dataset.item = '1';
                if (pos !== -1) {
                    const b = document.createElement('strong');
                    b.textContent = t.nombre.substring(pos, pos + V.length);
                    d.append(t.nombre.substring(0, pos), b, t.nombre.substring(pos + V.length));
                } else d.append(t.nombre);
                const s = document.createElement('span');
                s.className = 'text-sm text-slate-400';
                s.textContent = ` (${t.documento})`;
                d.append(s);
                d.addEventListener('mousedown', ev => {
                    ev.preventDefault();
                    inpNombre.value = t.nombre;
                    inpDoc.value = t.documento;
                    cerrarListas();
                    guardarBorrador();
                    $('concepto').focus();
                });
                frag.appendChild(d);
                if (++count >= 10) break;
            }

            if (!exacto) {
                const d = document.createElement('div');
                d.dataset.item = '1';
                d.className = 'text-blue-600 font-semibold';
                d.textContent = `+ Crear nuevo tercero: "${V}"`;
                d.addEventListener('mousedown', ev => { ev.preventDefault(); cerrarListas(); abrirModalNuevoTercero(V); });
                frag.appendChild(d);
            }
            lista.appendChild(frag);
            lista.classList.remove('hidden');
        }

        function cerrarListas() { lista.innerHTML = ''; lista.classList.add('hidden'); activo = -1; }
        document.addEventListener('click', e => { if (e.target !== inpNombre) cerrarListas(); });

        let nombreTerceroPendiente = '';
        function abrirModalNuevoTercero(nombre) {
            nombreTerceroPendiente = nombre;
            $('nuevoTerceroNombre').textContent = nombre;
            $('nuevoTerceroDoc').value = '';
            $('modalNuevoTercero').classList.remove('hidden');
            setTimeout(() => $('nuevoTerceroDoc').focus(), 0);
        }
        function cerrarModalNuevoTercero() { $('modalNuevoTercero').classList.add('hidden'); }
        $('nuevoTerceroDoc').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); guardarNuevoTercero(); } });

        function guardarNuevoTercero() {
            const doc = $('nuevoTerceroDoc').value.trim();
            if (!doc) { toast('Ingresa un número de documento válido', 'error'); return; }
            const payload = { action: 'guardarTercero', nombre: nombreTerceroPendiente, documento: doc };

            encolar({ id: nuevoId(), tipo: 'tercero', payload, intentos: 0, proximoIntento: 0 });
            const nueva = listaTerceros.concat([{ nombre: nombreTerceroPendiente, documento: doc }]);
            setTerceros(nueva);
            escribir(LS.TERC, nueva);

            inpNombre.value = nombreTerceroPendiente;
            inpDoc.value = doc;
            cerrarModalNuevoTercero();
            guardarBorrador();
            toast(`Tercero ${nombreTerceroPendiente} creado`);
            $('concepto').focus();
            sincronizar();
        }

        // ================== CÁLCULOS ==================
        const inputValor = $('valor'), inputRetencion = $('porcentaje_retencion'), inputIca = $('porcentaje_ica');
        function calcularTotales() {
            const valor = parseFloat(inputValor.value) || 0;
            const valorRete = valor * (parseFloat(inputRetencion.value) || 0) / 100;
            const vlIca = valor * (parseFloat(inputIca.value) || 0) / 100;
            $('valor_rete').value = Math.round(valorRete);
            $('vl_ica').value = Math.round(vlIca);
            $('valor_neto').value = Math.round(valor - valorRete - vlIca);
        }
        [inputValor, inputRetencion, inputIca].forEach(i => i.addEventListener('input', calcularTotales));

        // ================== BORRADOR AUTOMÁTICO ==================
        const CAMPOS = ['fecha', 'tipo', 'nombre', 'documento', 'concepto', 'vehiculo', 'valor', 'porcentaje_retencion', 'porcentaje_ica', 'forma_pago'];
        let tBorr = null;
        function guardarBorrador() {
            const b = {};
            CAMPOS.forEach(c => b[c] = $(c).value);
            escribir(LS.BORR, b);
        }
        $('gastosForm').addEventListener('input', () => { clearTimeout(tBorr); tBorr = setTimeout(guardarBorrador, 300); });
        $('gastosForm').addEventListener('change', guardarBorrador);

        function restaurarBorrador() {
            const b = leer(LS.BORR, null);
            if (b) CAMPOS.forEach(c => { if (b[c] !== undefined) $(c).value = b[c]; });
            if (!$('fecha').value) $('fecha').value = hoyISO();
            calcularTotales();
        }

        function limpiarFormulario(mantenerFecha) {
            const fecha = $('fecha').value;
            $('gastosForm').reset();
            inpDoc.value = '';
            $('fecha').value = (mantenerFecha && fecha) ? fecha : hoyISO();
            calcularTotales();
            localStorage.removeItem(LS.BORR);
            cerrarListas();
        }

        // ================== GUARDAR (INSTANTÁNEO) ==================
        $('gastosForm').addEventListener('submit', e => {
            e.preventDefault();
            const id = nuevoId();
            const provisional = proximoPrevisto();

            const formData = {
                action: 'guardarGasto',
                idLocal: id,
                fecha: $('fecha').value,
                nombre: inpNombre.value.toUpperCase(),
                documento: inpDoc.value,
                concepto: $('concepto').value.toUpperCase(),
                vehiculo: $('vehiculo').value.toUpperCase(),
                valor: $('valor').value,
                porcentaje_retencion: inputRetencion.value || 0,
                valor_rete: $('valor_rete').value || 0,
                porcentaje_ica: inputIca.value || 0,
                vl_ica: $('vl_ica').value || 0,
                valor_neto: $('valor_neto').value || 0,
                forma_pago: $('forma_pago').value,
                tipo: $('tipo').value
            };

            encolar({ id, tipo: 'gasto', payload: formData, intentos: 0, proximoIntento: 0 });
            agregarHistorial({ id, fecha: formData.fecha, nombre: formData.nombre, concepto: formData.concepto, neto: formData.valor_neto, provisional, real: null, estado: 'pendiente' });

            toast(provisional !== null ? `✓ Guardado · Recibo N.º ${provisional}` : '✓ Guardado en el dispositivo');
            limpiarFormulario(true);
            pintarRecibo(); pintarEstado(); pintarHistorial();
            inpNombre.focus();
            sincronizar();
        });

        // ================== ARRANQUE ==================
        window.addEventListener('online', () => { reiniciarEsperas(); sincronizar(); refrescarTerceros(); });
        window.addEventListener('offline', pintarEstado);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) sincronizar(); });
        setInterval(sincronizar, INTERVALO_SYNC_MS);

        restaurarBorrador();
        pintarRecibo();
        pintarEstado();
        pintarHistorial();
        sincronizar();
        refrescarProximoRecibo();
        refrescarTerceros();
    </script>
</body>
</html>
