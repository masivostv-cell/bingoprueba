<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Donatón | Pantalla</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,700;0,800;1,500&family=Alegreya+Sans:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<style>
  :root{
    --noche:#140E0D; --noche2:#4A1A1C; --crema:#F3E6D0; --oro:#DDB86E; --ladrillo:#8E2A2A; --durazno:#E3B892; --cielo:#B5B9B4;
    --tenue:#CDB898; --plano:rgba(243,230,208,.3);
    color-scheme:dark;
  }
  *{box-sizing:border-box;margin:0}
  html,body{height:100%}
  body{
    background:radial-gradient(ellipse at 30% 115%, var(--noche2) 0%, var(--noche) 62%);
    background-color:var(--noche);color:var(--crema);
    font-family:"Alegreya Sans","Trebuchet MS",sans-serif;overflow:hidden;
  }
  .stage{
    height:100vh;display:grid;
    grid-template-columns:minmax(0,.72fr) minmax(0,1.5fr) minmax(0,.8fr);
    grid-template-rows:auto minmax(0,1fr) auto auto;
    gap:2vh 4vw;padding:4vh 4vw 2.5vh;
  }
  .top{grid-column:1/-1;display:flex;align-items:center;gap:1.6vw}
  .insignia{max-width:100%;max-height:30vh;width:auto;height:auto;align-self:center;margin-bottom:3vh;filter:drop-shadow(0 0 2vh rgba(221,184,110,.4))}
  .titulos{display:flex;align-items:baseline;gap:.4vh 1.6vw;flex-wrap:wrap}
  h1{font-family:"Alegreya",Georgia,serif;font-weight:800;font-size:clamp(2rem,4.4vw,5.4rem);line-height:1}
  .sub{font-family:"Alegreya",Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(1rem,2vw,2.3rem);color:var(--tenue)}

  /* Iglesia */
  .obra{display:flex;flex-direction:column;align-items:center;min-height:0;min-width:0}
  .lienzo{position:relative;flex:1;min-height:0;width:100%}
  .lienzo svg,.lienzo canvas{position:absolute;inset:0;width:100%;height:100%}
  .halo{position:absolute;inset:0;background:radial-gradient(closest-side at 50% 40%, rgba(221,184,110,.38), transparent);
    opacity:0;transform:scale(.6);transition:opacity 1.2s, transform 1.8s cubic-bezier(.2,.8,.2,1)}
  .halo.on{opacity:1;transform:scale(1.1)}
  .brick{opacity:0;transform:translateY(-26px) rotate(-6deg);transform-box:fill-box;transform-origin:center;
    transition:opacity .3s ease, transform .6s cubic-bezier(.2,.9,.3,1.35)}
  .brick.on{opacity:1;transform:none}
  .sin-trans .brick,.sin-trans #obreroA,.sin-trans .luz{transition:none}
  /* Obreros, andamio y ladrillos: solo mientras se construye */
  .faena{opacity:0;transition:opacity .9s ease}
  .obrando .faena{opacity:1;transition-duration:.4s}
  .luz{opacity:0;transition:opacity 1.2s}

  /* Durante el conteo solo se ve el templo con el dinero; al terminar aparece todo */
  body.enfoque .top,body.enfoque .lateral,body.enfoque .muro,body.enfoque .patrocinios,body.enfoque .pie{display:none}
  body.enfoque .obra{grid-column:1/-1;grid-row:1/-1}
  .top{view-transition-name:encabezado}
  .lienzo{view-transition-name:templo}
  .cuenta{view-transition-name:cuenta}
  ::view-transition-group(*){animation-duration:.9s;animation-timing-function:cubic-bezier(.3,.8,.3,1)}
  .luz.on{opacity:1}

  /* Obreros */
  .obrero,.caminaB,.salta,.pierna,.brazoA{transform-box:view-box}
  #obreroA{transition:transform .8s cubic-bezier(.3,.8,.3,1)}
  .brazoA{transform-origin:4px -54px;transition:transform .4s}
  .pierna{transform-origin:0 -30px}
  .caminaB{transform-origin:0 0}
  .obrando .brazoA{animation:alisar .55s ease-in-out infinite}
  @keyframes alisar{0%,100%{transform:rotate(-30deg)}50%{transform:rotate(18deg)}}
  .obrando .caminaB{animation:caminar 2.6s linear infinite}
  @keyframes caminar{
    0%{transform:translateX(0) scaleX(1)} 45%{transform:translateX(-92px) scaleX(1)}
    50%{transform:translateX(-92px) scaleX(-1)} 95%{transform:translateX(0) scaleX(-1)}
    100%{transform:translateX(0) scaleX(1)}
  }
  .obrando .ladrilloB{animation:cargar 2.6s linear infinite}
  @keyframes cargar{0%,46%{opacity:1}47%,97%{opacity:0}98%,100%{opacity:1}}
  .obrando .pb1{animation:paso .32s ease-in-out infinite alternate}
  .obrando .pb2{animation:paso .32s ease-in-out infinite alternate-reverse}
  @keyframes paso{from{transform:rotate(-22deg)}to{transform:rotate(22deg)}}
  .celebran .salta{animation:saltar .45s ease-in-out 5}
  @keyframes saltar{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
  .celebran .brazoA{transform:rotate(-75deg)}
  .plano{fill:rgba(243,230,208,.035);stroke:var(--plano);stroke-width:1.5;stroke-dasharray:6 6}
  .suelo{stroke:var(--plano);stroke-width:2}
  .puerta,.ventana{fill:var(--noche);stroke:var(--plano);stroke-width:1.5;stroke-dasharray:6 6;transition:fill 1s}
  .puerta.on{fill:#5A3420;stroke:#3A2214;stroke-dasharray:none}
  .ventana.on{fill:var(--oro);stroke:none;filter:url(#brillo)}
  .cruz{fill:none;stroke:var(--plano);stroke-width:1.5;stroke-dasharray:4 4;transition:fill 1s}
  .cruz.on{fill:var(--oro);stroke:none;filter:url(#brillo)}

  /* Conteo debajo de la iglesia y columna lateral */
  .lateral{display:flex;flex-direction:column;justify-content:center;min-width:0;min-height:0}
  .lateral > *{flex:none}
  .cuenta{position:relative;display:flex;flex-direction:column;align-items:center;width:100%;padding-top:1vh}
  .cuenta .etq{font-size:clamp(1rem,1.9vw,2.4rem)}
  .chip{position:absolute;left:50%;top:0;pointer-events:none;white-space:nowrap;
    background:var(--ladrillo);color:var(--crema);font-weight:800;border-radius:999px;padding:.2em .75em;
    font-size:clamp(1rem,1.9vw,2.3rem);box-shadow:0 0 0 .2vh var(--oro);animation:chip 1s ease-out forwards}
  @keyframes chip{
    0%{opacity:0;transform:translate(-50%,10px) scale(.7)}
    15%{opacity:1;transform:translate(-50%,-12px) scale(1.06)}
    70%{opacity:1}
    100%{opacity:0;transform:translate(-50%,-80px) scale(1)}
  }
  .odo.golpe{animation:golpe .35s ease-out}
  /* Presentación: «Así debe quedar nuestra iglesia» */
  .previa-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
    font-family:"Alegreya",Georgia,serif;font-style:italic;font-weight:800;color:var(--oro);
    font-size:clamp(1.6rem,4.2vw,5.2rem);line-height:1.1;text-shadow:0 0 .4em rgba(221,184,110,.35);
    opacity:0;transform:translateY(12px);transition:opacity .9s ease, transform .9s ease;pointer-events:none}
  .previa-txt.on{opacity:1;transform:none}
  .cuenta .etq,.cuenta .odo{transition:opacity .6s ease}
  body.previa .cuenta .etq,body.previa .cuenta .odo{opacity:0}
  @keyframes golpe{0%{transform:scale(1)}40%{transform:scale(1.08)}100%{transform:scale(1)}}
  .etq{font-family:"Alegreya",Georgia,serif;font-style:italic;font-weight:500;color:var(--tenue);font-size:clamp(1.2rem,2.4vw,3rem)}
  .odo{display:flex;align-items:flex-start;font-weight:900;color:var(--oro);line-height:1;
    font-variant-numeric:tabular-nums;margin:.6vh 0 0;white-space:nowrap;transform-origin:center}
  .odo .simbolo{margin-right:.12em}
  .odo .col{display:inline-block;height:1em;overflow:hidden;transition:opacity .4s}
  .odo .tira{display:flex;flex-direction:column;will-change:transform}
  .odo .tira span{height:1em;display:block;text-align:center}
  .odo .sep{transition:opacity .4s}
  .odo .apagada{opacity:.13}
  .odo.final{animation:latido 1.4s cubic-bezier(.2,.9,.3,1.2)}
  @keyframes latido{
    0%{transform:scale(1);text-shadow:none}
    30%{transform:scale(1.09);text-shadow:0 0 .35em rgba(221,184,110,.7)}
    100%{transform:scale(1);text-shadow:0 0 .15em rgba(221,184,110,.35)}
  }
  .odo.final.quieto{text-shadow:0 0 .15em rgba(221,184,110,.35)}
  .meta{font-size:clamp(1.1rem,2vw,2.4rem)}
  .barra{position:relative;height:clamp(14px,2.2vh,28px);border-radius:999px;background:rgba(243,230,208,.1);margin-top:3vh;overflow:hidden}
  .barra-fill{position:absolute;inset:0 auto 0 0;width:0;border-radius:inherit;
    background:linear-gradient(90deg,var(--ladrillo),#B5654A 50%,var(--oro))}
  .barra-fill::after{content:"";position:absolute;inset:0;
    background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.45) 50%,transparent 70%);
    background-size:200% 100%;animation:brillo 1.6s linear infinite}
  @keyframes brillo{from{background-position:150% 0}to{background-position:-50% 0}}
  .pct{margin-top:1.4vh;font-family:"Alegreya",Georgia,serif;font-weight:800;font-size:clamp(1.4rem,3vw,3.8rem);font-variant-numeric:tabular-nums}
  .gracias{margin-top:3vh;font-family:"Alegreya",Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(1.2rem,2.4vw,3rem);
    opacity:0;transform:translateY(1.5vh);transition:opacity .9s .3s, transform .9s .3s}
  .gracias.on{opacity:1;transform:none}

  /* Muro de donantes */
  .muro{display:flex;flex-direction:column;min-height:0;gap:1.5vh}
  .muro-ventana{position:relative;flex:1;min-height:0;overflow:hidden;
    -webkit-mask-image:linear-gradient(transparent, #000 10%, #000 88%, transparent);
    mask-image:linear-gradient(transparent, #000 10%, #000 88%, transparent)}
  .muro-pista{display:flex;flex-direction:column;gap:1.4vh;will-change:transform}
  .muro-pista.anda{animation:subir var(--dur,60s) linear infinite}
  @keyframes subir{from{transform:translateY(0)}to{transform:translateY(calc(-50% - .7vh))}}
  .don{display:flex;align-items:center;gap:1vw;padding:1.4vh 1.1vw;
    background:rgba(243,230,208,.07);border:1px solid rgba(243,230,208,.14);
    border-radius:1.1vw 1.1vw 1.1vw .25vw}
  .avatar{flex:none;width:clamp(34px,3.2vw,64px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;
    font-weight:800;font-size:clamp(.9rem,1.25vw,1.6rem);color:var(--noche)}
  .don .n{font-weight:700;font-size:clamp(1rem,1.55vw,2rem);line-height:1.15;overflow-wrap:anywhere}
  .don .t{color:var(--tenue);font-size:clamp(.8rem,1.05vw,1.3rem)}
  .muro-vacio{color:var(--tenue);font-style:italic;font-size:clamp(1rem,1.3vw,1.6rem)}

  /* Patrocinadores */
  .patrocinios{grid-column:1/-1;display:flex;align-items:center;gap:2vw;min-width:0}
  .pat-titulo{flex:none;font-family:"Alegreya",Georgia,serif;font-style:italic;font-weight:500;color:var(--tenue);font-size:clamp(1rem,1.6vw,1.9rem)}
  .pat-ventana{flex:1;min-width:0;overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);
    mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
  .pat-pista{display:flex;gap:1.6vw;width:max-content;will-change:transform}
  .pat-pista.anda{animation:lado var(--dur,40s) linear infinite}
  @keyframes lado{to{transform:translateX(calc(-50% - .8vw))}}
  /* Cajita cuadrada: el logo cabe completo sin deformarse, sea cuadrado u horizontal */
  .logo{flex:none;box-sizing:border-box;width:12vh;height:12vh;padding:1.2vh;background:#FFFFFF;border-radius:1.2vh;
    box-shadow:0 0 0 .25vh rgba(221,184,110,.6)}
  .logo img{display:block;width:100%;height:100%;object-fit:contain}

  .pie{grid-column:1/-1;display:flex;gap:2.5vw;align-items:center;font-size:clamp(.75rem,.95vw,1.05rem);color:var(--tenue)}
  .pie button{font:inherit;color:inherit;background:none;border:1px solid var(--plano);border-radius:999px;padding:.4em 1em;cursor:pointer}
  .pie button:focus-visible{outline:2px solid var(--oro);outline-offset:2px}
  #estado{margin-left:auto}
  #estado.error{color:#FF9C8A}

  /* Intro de suspenso */
  .intro{position:fixed;inset:0;z-index:40;display:grid;place-items:center;background:var(--noche);
    transition:opacity .6s;font-family:"Alegreya",Georgia,serif;font-style:italic;font-size:clamp(2rem,5vw,6rem)}
  .intro.off{opacity:0;pointer-events:none}
  .intro-caja{display:flex;flex-direction:column;align-items:center;gap:3vh;text-align:center}
  .insignia-intro{height:52vh;width:auto;animation:respira 2.4s ease-in-out infinite}
  @keyframes respira{
    0%,100%{transform:scale(1);filter:drop-shadow(0 0 2vh rgba(221,184,110,.3))}
    50%{transform:scale(1.03);filter:drop-shadow(0 0 5vh rgba(221,184,110,.65))}
  }
  .puntos i{display:inline-block;font-style:normal;animation:salto 1s infinite}
  .puntos i:nth-child(2){animation-delay:.15s}
  .puntos i:nth-child(3){animation-delay:.3s}
  @keyframes salto{0%,60%,100%{transform:none}30%{transform:translateY(-.3em)}}

  /* Avisos de metas */
  .hito{position:fixed;left:50%;top:13vh;z-index:30;pointer-events:none;
    background:var(--oro);color:var(--noche);font-weight:900;font-size:clamp(1.3rem,3vw,3.6rem);
    padding:.35em 1em;border-radius:999px;transform:translateX(-50%) scale(0);opacity:0;white-space:nowrap}
  .hito.on{animation:pop 1.9s cubic-bezier(.2,.9,.3,1.4) forwards}
  @keyframes pop{
    0%{transform:translateX(-50%) scale(0) rotate(-8deg);opacity:0}
    18%{transform:translateX(-50%) scale(1.12) rotate(2deg);opacity:1}
    28%{transform:translateX(-50%) scale(1) rotate(0)}
    80%{transform:translateX(-50%) scale(1);opacity:1}
    100%{transform:translateX(-50%) scale(.9) translateY(-2vh);opacity:0}
  }

  /* Botón «Dona aquí» (solo en celular) */
  .dona{display:none}
  @media (max-width:820px){
    body{overflow:auto}
    .stage{height:auto;grid-template-columns:1fr;padding-bottom:calc(14vh + env(safe-area-inset-bottom,0px))}
    .top{order:0}.obra{order:1}.lateral{order:2}.muro{order:3}.patrocinios{order:4}.pie{order:5}
    .lienzo{height:52vh;flex:none}
    .insignia{max-width:60%;max-height:34vh}
    .muro-ventana{height:50vh;flex:none}
    .patrocinios{flex-direction:column;align-items:stretch;gap:1.2vh}
    .pie button,.pie .tecla{display:none}           /* las teclas no aplican en el celular */
    .dona{
      display:flex;align-items:center;gap:10px;
      position:fixed;z-index:60;
      right:calc(16px + env(safe-area-inset-right,0px));
      bottom:calc(16px + env(safe-area-inset-bottom,0px));
      padding:12px 18px 12px 14px;border-radius:999px;
      background:var(--oro);color:var(--noche);text-decoration:none;
      font-weight:800;font-size:1.05rem;line-height:1.1;
      box-shadow:0 6px 22px rgba(0,0,0,.45),0 0 0 3px rgba(142,42,42,.9);
      animation:llamar 2.6s ease-in-out infinite;
    }
    .dona svg{width:28px;height:28px;flex:none}
    .dona small{display:block;font-weight:500;font-size:.78rem}
    .dona:focus-visible{outline:3px solid var(--crema);outline-offset:3px}
    @keyframes llamar{0%,70%,100%{transform:scale(1)}80%{transform:scale(1.07)}90%{transform:scale(.98)}}
  }
  @media (prefers-reduced-motion:reduce){
    .brick,.halo,.gracias{transition:none}
    .chip,.odo.golpe,.obrando *,.celebran *,.dona,.insignia-intro,.muro-pista.anda,.pat-pista.anda,.odo.final,.hito.on,.barra-fill::after,.puntos i{animation:none}
    .hito.on{opacity:1;transform:translateX(-50%)}
  }
</style>
</head>
<body>
<main class="stage">
  <header class="top">
    <div class="titulos">
      <h1 id="titulo">Donatón</h1>
      <p id="subtitulo" class="sub">Construyendo juntos la casa de Dios</p>
    </div>
  </header>

  <section class="lateral">
    <img id="insignia" class="insignia" alt="Imagen de la parroquia" hidden>
    <p class="meta">Nuestra meta: <span id="meta">$ 0</span></p>
    <div class="barra"><div id="barra" class="barra-fill"></div></div>
    <p class="pct"><span id="pct">0</span>% de la obra</p>
    <p id="gracias" class="gracias">¡Gracias por sembrar en la casa de Dios!</p>
  </section>

  <section class="obra">
    <div class="lienzo" aria-hidden="true">
      <div id="halo" class="halo"></div>
      <canvas id="obra-canvas"></canvas>
      <svg id="iglesia" viewBox="0 0 760 600"></svg>
    </div>
    <div class="cuenta">
      <p id="previa-txt" class="previa-txt" aria-live="polite">Así debe quedar nuestra iglesia</p>
      <p class="etq">Llevamos recaudado</p>
      <p id="odo" class="odo" role="img" aria-label="Recaudado"></p>
    </div>
  </section>

  <section class="muro" aria-label="Donantes">
    <p class="etq">Gracias a quienes siembran</p>
    <div class="muro-ventana"><div id="muro-pista" class="muro-pista"></div></div>
  </section>

  <section id="patrocinios" class="patrocinios" hidden aria-label="Patrocinadores">
    <p class="pat-titulo">Con el apoyo de</p>
    <div class="pat-ventana"><div id="pat-pista" class="pat-pista"></div></div>
  </section>

  <footer class="pie">
    <button id="actualizar" type="button">Barra espaciadora: actualizar el conteo</button>
    <span class="tecla">F: pantalla completa</span>
    <span id="estado"></span>
  </footer>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDy9nmz3x8h20vSX5OMVEDAV1B5JCg73Hg",
  authDomain: "donaton-701fc.firebaseapp.com",
  projectId: "donaton-701fc",
  storageBucket: "donaton-701fc.firebasestorage.app",
  messagingSenderId: "445516813987",
  appId: "1:445516813987:web:fbbd11132a9a726b031116"
};
const db = getFirestore(initializeApp(firebaseConfig));

const $ = s => document.querySelector(s);
const formato = new Intl.NumberFormat("es-CO", { style: "currency", currency: "COP", maximumFractionDigits: 0 });
const cop = n => formato.format(Math.round(n));
const reducir = matchMedia("(prefers-reduced-motion: reduce)").matches;
const esperar = ms => new Promise(r => setTimeout(r, ms));
const COLORES = ["#DDB86E", "#F3E6D0", "#8E2A2A", "#E3B892", "#B5B9B4"];
let meta = 50000000;

/* ================= El nuevo templo, construido bloque por bloque ================= */
const NS = "http://www.w3.org/2000/svg";
const svg = $("#iglesia");
const el = (tag, attrs) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); return e; };

// Dibujo del templo según el render: aletas blancas, cruz al centro, madera, vitrales triangulares y escalinata.
// "plano" = solo las líneas punteadas (lo que falta por construir).
const ESPEJO = pts => pts.map(([x, y]) => [760 - x, y]);
function templo(plano) {
  const C = plano

/* ================= Odómetro de números ================= */
let cols = [], seps = [];
function construirOdometro(maximo) {
  const dig = Math.max(1, String(Math.floor(maximo)).length);
  const odo = $("#odo");
  odo.replaceChildren(); cols = []; seps = [];
  odo.classList.remove("final", "quieto");
  const simbolo = document.createElement("span"); simbolo.className = "simbolo"; simbolo.textContent = "$";
  odo.append(simbolo);
  for (let p = dig - 1; p >= 0; p--) {
    const col = document.createElement("span"); col.className = "col";
    const tira = document.createElement("span"); tira.className = "tira";
    for (let d = 0; d <= 10; d++) { const c = document.createElement("span"); c.textContent = d % 10; tira.append(c); }
    col.append(tira); odo.append(col);
    cols.push({ p, col, tira, prev: 0 });
    if (p > 0 && p % 3 === 0) {
      const s = document.createElement("span"); s.className = "sep"; s.textContent = ".";
      odo.append(s); seps.push({ p, s });
    }
  }
  ajustarTamano(dig);
  odo.setAttribute("aria-label", "Recaudado " + cop(maximo));
}
function ajustarTamano(dig = cols.length) {
  const ancho = $(".obra").getBoundingClientRect().width;
  const chars = dig + Math.floor((dig - 1) / 3) * 0.45 + 1;
  const tope = innerWidth < 820 ? innerWidth * 0.13 : Math.min(innerWidth * 0.075, innerHeight * 0.12);
  const px = Math.min(tope, (ancho * 0.92) / (chars * 0.6));
  $("#odo").style.fontSize = px + "px";
}
addEventListener("resize", () => ajustarTamano());

function ponerValor(v, exacto) {
  for (const c of cols) {
    const base = 10 ** c.p;
    let pos;
    if (exacto) pos = Math.floor(Math.round(v) / base) % 10;
    else {
      const frac = (v % base) / base;
      pos = Math.floor(v / base) % 10 + (frac > 0.85 ? (frac - 0.85) / 0.15 : 0);
    }
    let d = Math.abs(pos - c.prev); if (d > 5) d = 10 - d;
    c.prev = pos;
    c.tira.style.transform = `translateY(${-pos}em)`;
    c.col.style.filter = !reducir && d > 0.15 && !exacto ? `blur(${Math.min(3.5, d * 5)}px)` : "none";
    c.col.classList.toggle("apagada", c.p > 0 && v < base);
  }
  for (const s of seps) s.s.classList.toggle("apagada", v < 10 ** s.p);
}

  o.type = tipo; o.frequency.value = f;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + dur + .02);

/* ================= El conteo: va sumando de a pasos (500 mil, 1 millón, 1,5 millones…) ================= */
function pasoPara(total) {
  for (const p of [10000, 20000, 50000, 100000, 200000, 500000, 1e6, 2e6, 5e6, 1e7, 2e7, 5e7]) if (total / p <= 16) return p;
  return Math.ceil(total / 16);
}
let hitoIdx = 0;
function avance(v) {
  const prog = meta > 0 ? v / meta : 0;
  setObra(prog);
  $("#barra").style.width = Math.min(100, prog * 100) + "%";
  $("#pct").textContent = Math.floor(prog * 100);
}
function animarValor(desde, hasta, dur) {
  return new Promise(res => {
    const t0 = performance.now();
    const f = t => {
      const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
      const v = desde + (hasta - desde) * e;
      ponerValor(v, k >= 1); avance(v);
      if (k < 1) requestAnimationFrame(f); else res();
    };
    requestAnimationFrame(f);
  });
}
function chip(valor) {

async function mostrarPrevia() {
  document.body.classList.add("previa");

  [puerta, ventana, cruz].forEach(e => e.classList.add("on"));
  $("#halo").classList.add("on");

  [puerta, ventana, cruz].forEach(e => e.classList.remove("on"));
  $("#halo").classList.remove("on");
  if (!reducir) {
    await new Promise(fin => {
      const t0 = performance.now(), dur = 1800;
      const f = t => {
        const k = Math.min(1, (t - t0) / dur);
        previa = 1 - (k * k * (3 - 2 * k));    // se funde suave
        dibujar();
        if (k < 1) requestAnimationFrame(f); else fin();
      };
      requestAnimationFrame(f);
    });
  }
  previa = 0; dibujar();
  $("#previa-txt").classList.remove("on");
  document.body.classList.remove("previa");
  await esperar(500);
}

async function contar(objetivo) {
  hitoIdx = 0;
  if (objetivo <= 0 || reducir) { ponerValor(objetivo, true); avance(objetivo); return; }
  svg.classList.add("obrando");
  const paso = pasoPara(objetivo), marcas = [];
  for (let v = paso; v < objetivo; v += paso) marcas.push(v);
  marcas.push(objetivo);
  const base = Math.min(560, Math.max(220, 5600 / marcas.length));
  let previo = 0;
  for (let i = 0; i < marcas.length; i++) {
    const dur = base * (i >= marcas.length - 2 ? 1.6 : 1);     // los dos últimos pasos, un poco de suspenso
    tic(i / marcas.length);
    await animarValor(previo, marcas[i], dur * 0.6);
    golpe();
    previo = marcas[i];
    await esperar(dur * 0.4);
  }
  ponerValor(objetivo, true);
  svg.classList.remove("obrando");
}

function celebrarFinal(total) {

  setTimeout(() => odo.classList.add("quieto"), 1400);
  $("#halo").classList.add("on");
  $("#gracias").classList.add("on");
  tada();
  if (reducir || !window.confetti) return;
  confetti({ particleCount: 220, spread: 110, startVelocity: 50, origin: { x: .5, y: .45 }, colors: COLORES });
  const fin = Date.now() + 3000;
  (function cañones() {
    confetti({ particleCount: 6, angle: 60, spread: 60, origin: { x: 0, y: .8 }, colors: COLORES });
    confetti({ particleCount: 6, angle: 120, spread: 60, origin: { x: 1, y: .8 }, colors: COLORES });
    if (Date.now() < fin) requestAnimationFrame(cañones);
  })();
  setTimeout(() => confetti({ particleCount: 120, spread: 360, startVelocity: 30, origin: { x: .5, y: .3 }, colors: COLORES, shapes: ["star"] }), 900);
}

function estado(txt, error = false) { const e = $("#estado"); e.textContent = txt; e.classList.toggle("error", error); }

/* ================= Lectura de datos: 1 sola lectura + caché ================= */
// Todo lo de la pantalla vive en un único documento: publico/pantalla (1 lectura por actualización).
// La imagen y los logos solo se descargan cuando el banco los cambia (se comparan versiones)
// y se guardan en la memoria del navegador para no volver a leerlos.
const cache = {
  leer(k) { try { return JSON.parse(localStorage.getItem("donaton:" + k)); } catch { return null; } },
  guardar(k, v) { try { localStorage.setItem("donaton:" + k, JSON.stringify(v)); } catch {} }
};
let lecturas = 0, sinConexion = false;

function aplicarTextos(p) {
  if (Number(p.meta) > 0) meta = Number(p.meta);
  $("#meta").textContent = cop(meta);
  if (p.titulo) { $("#titulo").textContent = p.titulo; document.title = p.titulo + " | Pantalla"; }
  if (p.subtitulo) $("#subtitulo").textContent = p.subtitulo;
}

async function leerTotal() {
  let p;
  sinConexion = false;
  try {
    const s = await getDoc(doc(db, "publico", "pantalla"));
    lecturas++;
    p = s.data() || {};
    cache.guardar("ultimo", p);
  } catch (err) {
    p = cache.leer("ultimo");
    if (!p) throw err;
    sinConexion = true;
  }
  aplicarTextos(p);
  donantes = (p.donantes || []).map(d => ({ nombre: d.n, talonario: d.t }));
  if (!sinConexion) await Promise.all([sincronizarImagen(Number(p.imagenVersion) || 0), sincronizarPatrocinadores(Number(p.patrocinadoresVersion) || 0)]);
  return Math.max(0, Number(p.total) || 0);
}

async function sincronizarImagen(v) {
  const c = cache.leer("img");
  if (c && c.v === v) { ponerImagen(c.url); return; }
  if (!v) { cache.guardar("img", { v: 0, url: "" }); ponerImagen(""); return; }
  try {
    const s = await getDoc(doc(db, "config", "imagen")); lecturas++;
    const url = s.data()?.dataUrl || "";
    cache.guardar("img", { v, url }); ponerImagen(url);
  } catch { if (c) ponerImagen(c.url); }
}

async function sincronizarPatrocinadores(v) {
  const c = cache.leer("pat");
  if (c && c.v === v) { await pintarPatrocinadores(c.lista); return; }
  if (!v) { cache.guardar("pat", { v: 0, lista: [] }); await pintarPatrocinadores([]); return; }
  try {
    const s = await getDoc(doc(db, "config", "patrocinadores")); lecturas++;
    const lista = (s.data()?.lista || []).map(x => ({ nombre: x.nombre || "", logo: x.logo }));
    cache.guardar("pat", { v, lista }); await pintarPatrocinadores(lista);
  } catch { if (c) await pintarPatrocinadores(c.lista); }
}

/* ================= Imagen de la parroquia ================= */
function ponerImagen(url) {
  for (const img of [$("#insignia"), $("#insignia-intro")]) {
    if (url) { if (img.src !== url) img.src = url; img.hidden = false; } else { img.hidden = true; img.removeAttribute("src"); }
  }
}

/* ================= Patrocinadores que pasan de lado a lado ================= */
let patrocinadores = [];
async function pintarPatrocinadores(lista) {
  patrocinadores = lista || [];
  const zona = $("#patrocinios"), pista = $("#pat-pista");
  pista.classList.remove("anda"); pista.replaceChildren();
  zona.hidden = !patrocinadores.length;
  if (!patrocinadores.length) return;
  const tarjeta = x => {
    const t = document.createElement("div"); t.className = "logo";
    const img = document.createElement("img"); img.src = x.logo; img.alt = x.nombre || "Patrocinador";
    t.append(img); return t;
  };
  patrocinadores.forEach(x => pista.append(tarjeta(x)));
  await Promise.all([...pista.querySelectorAll("img")].map(i => i.decode().catch(() => {})));
  const ancho = $(".pat-ventana").clientWidth;
  let vueltas = 1;
  while (pista.scrollWidth < ancho && vueltas < 30) { patrocinadores.forEach(x => pista.append(tarjeta(x))); vueltas++; }
  await Promise.all([...pista.querySelectorAll("img")].map(i => i.decode().catch(() => {})));
  [...pista.children].forEach(e => { const c = e.cloneNode(true); c.setAttribute("aria-hidden", "true"); pista.append(c); });
  pista.style.setProperty("--dur", Math.max(18, patrocinadores.length * vueltas * 4.5) + "s");
  if (!reducir) pista.classList.add("anda");
}

// Al abrir, muestra de una vez lo que quedó guardado (sin gastar lecturas)
(function desdeCache() {
  const u = cache.leer("ultimo"); if (u) aplicarTextos(u);
  const i = cache.leer("img"); if (i?.url) ponerImagen(i.url);
  const pt = cache.leer("pat"); if (pt?.lista?.length) pintarPatrocinadores(pt.lista);
})();

/* ================= Muro de donantes que sube sin fin ================= */
let donantes = [];
const AVATARES = ["#DDB86E", "#E3B892", "#F3E6D0", "#B5B9B4", "#C98F6B"];
function tarjetaDonante(d, i) {
  const nombre = (d.nombre || "").trim() || "Anónimo";
  const el = document.createElement("div"); el.className = "don";
  const av = document.createElement("span"); av.className = "avatar";
  av.style.background = AVATARES[i % AVATARES.length];
  av.textContent = nombre === "Anónimo" ? "♥" : nombre.split(/\s+/).slice(0, 2).map(p => p[0]).join("").toUpperCase();
  const txt = document.createElement("div");
  const n = document.createElement("p"); n.className = "n"; n.textContent = nombre;
  const t = document.createElement("p"); t.className = "t";
  t.textContent = d.talonario ? `Talonario N.º ${d.talonario}` : "Ofrenda recibida";
  txt.append(n, t); el.append(av, txt);
  return el;
}
function pintarMuro() {
  const pista = $("#muro-pista");
  pista.classList.remove("anda"); pista.replaceChildren();
  if (!donantes.length) {
    const p = document.createElement("p"); p.className = "muro-vacio";
    p.textContent = "Aquí aparecerán los nombres de quienes siembran en esta obra.";
    pista.append(p); return;
  }
  const alto = $(".muro-ventana").clientHeight;
  let vueltas = 0;
  do { donantes.forEach((d, i) => pista.append(tarjetaDonante(d, i))); vueltas++; }
  while (pista.scrollHeight < alto && vueltas < 40);
  // Se duplica todo para que al llegar a la mitad empiece de nuevo sin que se note el salto
  [...pista.children].forEach(e => { const c = e.cloneNode(true); c.setAttribute("aria-hidden", "true"); pista.append(c); });
  pista.style.setProperty("--dur", Math.max(20, donantes.length * vueltas * 3.2) + "s");
  if (!reducir) pista.classList.add("anda");
}
let tMuro;
addEventListener("resize", () => { clearTimeout(tMuro); tMuro = setTimeout(() => { if (document.body.classList.contains("enfoque")) return; pintarMuro(); pintarPatrocinadores(patrocinadores); }, 300); });

let corriendo = false;
async function actualizar() {
  if (corriendo) return;
  corriendo = true;
  $("#intro").classList.remove("off");
  $("#halo").classList.remove("on");
  $("#gracias").classList.remove("on");
  const t0 = Date.now();
  try {
    const total = await leerTotal();
    await obraLista;
    document.body.classList.add("enfoque");     // solo el templo mientras cuenta
    await esperar(Math.max(0, 1200 - (Date.now() - t0)));   // un poquito de suspenso
    reiniciarObra();
    $("#barra").style.width = "0%";
    $("#pct").textContent = "0";
    $("#meta").textContent = cop(meta);
    construirOdometro(total);
    ponerValor(0, true);
    $("#intro").classList.add("off");
    await esperar(700);
    await mostrarPrevia();
    await contar(total);
    celebrarFinal(total);
    await esperar(total > 0 ? 2400 : 1000);     // un momento para disfrutar el total
    salirEnfoque();
    const hora = new Date().toLocaleTimeString("es-CO", { hour: "2-digit", minute: "2-digit" });
    if (sinConexion) estado("Sin conexión: mostrando el último conteo guardado", true);
    else estado(`Actualizado a las ${hora}`);
    lecturas = 0;
  } catch (err) {
    $("#intro").classList.add("off");
    salirEnfoque();
    estado("No se pudo leer Firebase: " + err.message, true);
  }
  corriendo = false;
}

function salirEnfoque() {
  const mostrarTodo = () => {
    document.body.classList.remove("enfoque");
    ajustarTamano();
    pintarMuro();
    pintarPatrocinadores(patrocinadores);
  };
  if (document.startViewTransition && !reducir && document.body.classList.contains("enfoque")) document.startViewTransition(mostrarTodo);
  else mostrarTodo();
}

/* ================= Controles ================= */
let bloqueo = null;
async function mantenerEncendida() { try { bloqueo = await navigator.wakeLock?.request("screen"); } catch {} }
function alternarPantalla() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
  mantenerEncendida();
}
addEventListener("keydown", e => {
  if (e.key === "f" || e.key === "F") alternarPantalla();
  if (e.code === "Space" || e.key === "r" || e.key === "R") { e.preventDefault(); activarAudio(); mantenerEncendida(); actualizar(); }
});
$("#actualizar").addEventListener("click", () => { activarAudio(); actualizar(); });
addEventListener("dblclick", alternarPantalla);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && bloqueo) mantenerEncendida(); });

actualizar();
</script>
